up"], "answer": [1], "explanations": ["A is incorrect. Escalation involves transferring an incident to a higher-level support team. The scenario describes users resolving issues themselves, not escalating.", "B is correct. User self-help enables users to resolve incidents on their own using tools like knowledge bases, FAQs, chatbots, and automated scripts. ITIL 4 recognizes self-help as an important capability that reduces service desk workload and provides faster resolution for common, well-documented issues.", "C is incorrect. Major incident management involves procedures for high-impact incidents requiring urgent coordinated response. Self-service for common issues is not major incident management.", "D is incorrect. While the knowledge base may contain information about known errors, the scenario specifically describes users resolving incidents themselves, which is the self-help concept."], "tip": "User self-help empowers users to resolve common incidents using knowledge bases, chatbots, and automated tools, reducing service desk load and improving user satisfaction."}, {"id": "ITIL4F-E04-022", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "A service desk agent receives a call about a user who cannot access a shared drive. The agent recognizes this as a common issue, follows a pre-defined set of diagnostic and resolution steps, and resolves it within five minutes. What has the agent used?", "choices": ["A problem model", "A standard change procedure", "An incident model", "A service request catalog entry"], "answer": [2], "explanations": ["A is incorrect. A problem model is used for investigating and resolving underlying root causes, not for diagnosing and resolving individual incidents. The scenario describes resolving a specific user incident.", "B is incorrect. A standard change procedure describes steps for a pre-authorized change. The shared drive access issue is an incident (unplanned service interruption), not a change.", "C is correct. An incident model is a predefined set of steps for diagnosing and resolving a particular type of incident. For common, recurring incidents like shared drive access issues, incident models provide consistent, efficient resolution by guiding agents through proven diagnostic and recovery steps.", "D is incorrect. A service request catalog entry describes a pre-defined service request that can be fulfilled. The user's inability to access a shared drive is an incident (something is broken), not a service request."], "tip": "Incident models are predefined procedures for handling specific types of recurring incidents. They ensure consistent, efficient handling and reduce resolution times."}, {"id": "ITIL4F-E04-023", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "A problem analyst has identified the root cause of recurring database timeout errors and documented the cause along with a temporary workaround. The permanent fix requires a major code change that will take three months. Where should this information be recorded?", "choices": ["In the incident log as a resolved incident", "In the known error database (KEDB) as a known error", "In the change schedule as a pending change", "In the service level agreement as an exception"], "answer": [1], "explanations": ["A is incorrect. The incident log records individual incidents, not root causes and workarounds. The problem has been analyzed, not just an incident resolved.", "B is correct. A known error is a problem that has a documented root cause and usually a workaround. The known error database (KEDB) stores these records, enabling service desk agents to apply workarounds while the permanent fix is developed. In this scenario, the root cause is identified and a workaround exists, making it a known error.", "C is incorrect. While a change will eventually be needed for the permanent fix, the change schedule records planned changes, not root cause information and workarounds.", "D is incorrect. Service level agreements define service targets and are not the appropriate place to document root causes and workarounds."], "tip": "A known error has a documented root cause and usually a workaround. Record it in the KEDB so service desk agents can quickly apply workarounds for affected users."}, {"id": "ITIL4F-E04-024", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "A problem management team reviews incident data over the past six months and discovers that 40% of all incidents are related to memory leaks in a specific application. What problem management activity is being performed?", "choices": ["Problem identification through trend analysis", "Error control", "Reactive incident management", "Known error documentation"], "answer": [0], "explanations": ["A is correct. Trend analysis is a problem identification technique where historical incident data is reviewed to identify patterns and recurring issues. By discovering that 40% of incidents relate to memory leaks, the team is using trend analysis to proactively identify a problem that should be investigated further.", "B is incorrect. Error control involves managing known errors, assessing the effectiveness of workarounds, and identifying permanent fixes. The team is analyzing incident trends, not managing a known error.", "C is incorrect. Reactive incident management deals with restoring service for individual incidents. The team is analyzing aggregate data to identify underlying problems, which is a problem management activity.", "D is incorrect. Known error documentation happens after the root cause has been identified. In this scenario, the team has identified a trend but has not yet investigated the root cause."], "tip": "Trend analysis examines patterns in incident data to proactively identify recurring problems. It bridges incident management data with problem management investigation."}, {"id": "ITIL4F-E04-025", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "A known error for a CRM application crash has been in the known error database for six months with a workaround that requires users to restart the application. The problem manager reviews the known error and determines that the workaround is no longer effective for 30% of affected users. What should the problem manager do as part of error control?", "choices": ["Close the known error since it has been documented for six months", "Reassess the known error, update the workaround, and evaluate whether a permanent fix should be prioritized", "Delete the known error from the database and create a new incident for each affected user", "Escalate the issue to the service desk for immediate resolution"], "answer": [1], "explanations": ["A is incorrect. Closing a known error simply because time has passed is inappropriate, especially when the workaround is becoming ineffective for a significant percentage of users.", "B is correct. Error control is the ongoing management of known errors. It includes regularly reassessing known errors, evaluating the effectiveness of workarounds, and determining whether a permanent fix should be prioritized. Since the workaround is failing for 30% of users, the problem manager should update the workaround and escalate the need for a permanent resolution.", "C is incorrect. Deleting a known error removes valuable root cause information. Individual incidents are a different record type and do not replace the known error documentation.", "D is incorrect. The service desk handles incidents, not the investigation and permanent resolution of known errors. Error control is a problem management responsibility."], "tip": "Error control means continuously managing known errors: reviewing workaround effectiveness, updating documentation, and prioritizing permanent fixes when workarounds degrade."}, {"id": "ITIL4F-E04-026", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "A user requests a new software installation that is available from a pre-approved list in the service catalog. Another user reports that the same software has crashed and they cannot work. How should these two situations be classified?", "choices": ["Both are service requests because they relate to the same software", "The installation request is a standard change; the crash report is a service request", "The installation request is a service request; the crash report is an incident", "Both are incidents because the software is involved in both cases"], "answer": [2], "explanations": ["Incorrect. The crash is an unplanned interruption to service, making it an incident, not a service request. Being related to the same software does not make both situations the same type.", "Incorrect. While pre-approved installations may involve a standard change behind the scenes, from the user's perspective this is a service request. The crash report is an incident, not a service request.", "Correct. The new software installation from a pre-approved list is a service request: it is a pre-defined, standard delivery that follows a known fulfilment workflow. The software crash is an incident: it is an unplanned interruption to a service that prevents the user from working.", "Incorrect. A pre-approved software installation from a catalog is a routine, pre-defined delivery, which is a service request, not an incident. Only the crash report is an incident."], "tip": "Service requests are pre-defined, routine deliveries; incidents are unplanned interruptions. Distinguish them by whether the situation is a request for something or a report that something is broken."}, {"id": "ITIL4F-E04-027", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "Which characteristic BEST distinguishes a service request that involves pre-approved actions from a normal change?", "choices": ["Service requests with pre-approved actions have undergone risk assessment and do not require additional authorization each time they are fulfilled", "Service requests always require CAB approval while normal changes do not", "Normal changes are always lower risk than service requests with pre-approved actions", "Service requests cannot involve any modification to IT infrastructure"], "answer": [0], "explanations": ["A is correct. Service requests involving pre-approved actions have been previously assessed for risk and authorized in advance. When a user submits such a request, it can be fulfilled without requiring additional change authorization each time. Normal changes, by contrast, require individual risk assessment and authorization for each occurrence.", "B is incorrect. This is the opposite of reality. Service requests with pre-approved actions do not need CAB approval. Normal changes may require CAB or other change authority approval.", "C is incorrect. There is no blanket rule that normal changes are lower risk than service requests. Pre-approved actions in service requests are typically low-risk, which is why they are pre-approved.", "D is incorrect. Some service requests, such as provisioning a user account or installing pre-approved software, do involve modifications to IT infrastructure or systems."], "tip": "Pre-approved service request actions have already been risk-assessed and authorized. They can be fulfilled without per-occurrence change authorization, unlike normal changes."}, {"id": "ITIL4F-E04-028", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "A global organization is deciding between a centralized service desk model and a virtual service desk model. The organization has staff in 15 countries across multiple time zones. Which statement about these models is CORRECT?", "choices": ["A centralized service desk requires all agents to be in one physical location and can only operate during business hours in that location", "A virtual service desk means there is no coordinated management of service desk agents", "A centralized service desk is always more cost-effective than a virtual service desk regardless of organizational size", "A virtual service desk allows agents to be geographically dispersed while appearing as a single point of contact to users, enabled by technology"], "answer": [3], "explanations": ["A is incorrect. While a centralized service desk consolidates operations, it does not necessarily limit operations to a single location's business hours. Shift work can extend coverage. However, this option inaccurately describes the constraints.", "B is incorrect. A virtual service desk still has coordinated management. The difference is that agents are geographically dispersed while being managed and coordinated through technology and common processes.", "C is incorrect. Cost-effectiveness depends on context. A centralized model may be cheaper for smaller organizations, but a virtual model may be more practical and cost-effective for global organizations needing 24/7 coverage.", "D is correct. A virtual service desk uses technology to allow agents in different geographic locations to function as a single coordinated team. To users, it appears as a unified point of contact regardless of where agents are physically located. This model is well-suited for global organizations operating across multiple time zones."], "tip": "A virtual service desk uses technology to make dispersed agents appear as a single team. It is ideal for organizations spanning multiple time zones and geographies."}, {"id": "ITIL4F-E04-029", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "A service desk manager notices that average call handling time has increased by 30% over three months, while first-call resolution rates have dropped. Which approach to workforce optimization should be considered?", "choices": ["Immediately reduce the number of service desk agents to cut costs", "Analyze the root causes of increased handling time, provide targeted training, and adjust staffing patterns based on demand data", "Replace all service desk agents with automated chatbots", "Ignore the metrics since fluctuations are normal in service desk operations"], "answer": [1], "explanations": ["A is incorrect. Reducing agents when handling time is increasing and resolution rates are dropping would worsen the situation. Workforce optimization is about improving capability, not just reducing headcount.", "B is correct. Workforce optimization involves analyzing performance data to identify issues, providing training to improve agent skills, and adjusting staffing levels and schedules to match demand patterns. This holistic approach addresses both the increased handling time (through root cause analysis and training) and ensures proper coverage (through demand-based scheduling).", "C is incorrect. Full automation is neither practical nor appropriate for all service desk interactions. Workforce optimization balances human capability with technology, not wholesale replacement.", "D is incorrect. A 30% increase in handling time with declining resolution rates represents a significant trend that requires action, not dismissal."], "tip": "Workforce optimization uses data analysis, targeted training, and demand-based scheduling to improve service desk performance. It balances people, processes, and technology."}, {"id": "ITIL4F-E04-030", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "When defining a service level agreement (SLA), which approach does ITIL 4 recommend?", "choices": ["Define SLA targets collaboratively with customers, focusing on outcomes that matter to the business", "Base SLA targets exclusively on what the IT department can measure technically", "Set the most aggressive targets possible to drive IT performance", "Copy SLA targets from industry benchmarks without customization"], "answer": [0], "explanations": ["A is correct. ITIL 4 recommends that SLAs be defined collaboratively with customers, focusing on business-relevant outcomes. This ensures that what is measured and targeted actually reflects what matters to the business and its users, avoiding the disconnect between technical metrics and user experience.", "B is incorrect. Basing SLAs solely on technical measurements (like uptime percentages) without considering business outcomes leads to 'watermelon SLAs' that appear green on the outside but are red inside, as technical metrics may be met while users remain dissatisfied.", "C is incorrect. Unrealistically aggressive targets are counterproductive. They lead to unachievable commitments, erode trust, and may cause teams to game metrics rather than deliver genuine value.", "D is incorrect. Industry benchmarks provide useful reference points but should not be adopted without customization. SLA targets must reflect the specific needs, context, and priorities of the organization and its customers."], "tip": "Avoid 'watermelon SLAs' (green outside, red inside). Define SLAs collaboratively with customers, focusing on business outcomes, not just technical metrics."}, {"id": "ITIL4F-E04-031", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "An IT service provider has agreed to a service level agreement with the business for its email service. To deliver on this SLA, the internal network team must maintain specific performance targets for the email infrastructure. What type of agreement would be established between the IT service provider and the internal network team?", "choices": ["A service level agreement (SLA)", "An underpinning contract (UC)", "An operational level agreement (OLA)", "A memorandum of understanding (MOU)"], "answer": [2], "explanations": ["A is incorrect. An SLA is between a service provider and a customer (the business). The network team is an internal group supporting the service provider, not an external customer.", "B is incorrect. An underpinning contract is between the service provider and an external supplier. The network team is an internal group, not an external supplier.", "C is correct. An operational level agreement (OLA) is an agreement between a service provider and another internal part of the same organization. It defines the performance targets the internal network team must meet to support the SLA with the business customer.", "D is incorrect. A memorandum of understanding is a less formal agreement that may be used in some contexts, but the standard ITIL term for internal agreements supporting SLAs is an operational level agreement."], "tip": "OLAs are internal agreements supporting SLAs. SLAs are with customers, OLAs are with internal teams, and underpinning contracts are with external suppliers."}, {"id": "ITIL4F-E04-032", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "An organization's SLA for its CRM system guarantees 99.5% monthly availability. The IT service provider relies on an external cloud hosting company to deliver the underlying infrastructure. What type of agreement should exist between the IT service provider and the external cloud hosting company to support the SLA?", "choices": ["An operational level agreement (OLA)", "A service level agreement (SLA) with the cloud provider's customers", "An underpinning contract (UC)", "A continual improvement register entry"], "answer": [2], "explanations": ["A is incorrect. An OLA is between internal groups within the same organization. The cloud hosting company is an external supplier, not an internal team.", "B is incorrect. The relevant agreement is between the IT service provider and the cloud hosting company, not between the cloud provider and its other customers.", "C is correct. An underpinning contract (UC) is an agreement between a service provider and an external supplier that supports the service provider's delivery of SLA commitments. The UC with the cloud hosting company should include performance targets that enable the IT service provider to meet the 99.5% availability guarantee in its SLA.", "D is incorrect. A continual improvement register tracks improvement initiatives. It is not a type of agreement between organizations."], "tip": "Underpinning contracts (UCs) are agreements with external suppliers that support SLA commitments. Ensure UC targets enable SLA delivery with appropriate margins."}, {"id": "ITIL4F-E04-033", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "An employee's laptop is compromised by malware after they clicked a phishing link. Sensitive customer data may have been exposed. In the context of information security management, what type of event is this?", "choices": ["A service request for malware removal", "A security incident that requires immediate response according to information security policies", "A standard change to update antivirus definitions", "A problem that requires root cause analysis before any action is taken"], "answer": [1], "explanations": ["A is incorrect. A malware compromise with potential data exposure is not a routine service request. It is a security event requiring urgent, policy-driven response.", "B is correct. A security incident is an event that could potentially compromise the confidentiality, integrity, or availability of information. The malware infection with possible customer data exposure is a security incident that must be handled according to the organization's information security management policies and procedures, including containment, investigation, notification, and remediation.", "C is incorrect. While updating antivirus definitions may be part of the remediation, the compromised laptop is a security incident, not a standard change.", "D is incorrect. While root cause analysis may be performed later, a security incident requires immediate containment and response. Waiting for full root cause analysis before acting could allow further damage."], "tip": "Security incidents require immediate response per information security policies. Containment comes first; root cause analysis and permanent fixes follow."}, {"id": "ITIL4F-E04-034", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "A customer has submitted a formal complaint about repeated service outages affecting their business operations. Which practice is PRIMARILY responsible for managing this complaint and maintaining the customer relationship?", "choices": ["Incident management", "Problem management", "Relationship management", "Service level management"], "answer": [3], "explanations": ["A is incorrect. Incident management focuses on restoring service as quickly as possible. While it handles the technical outages, it does not manage customer complaints and overall relationship health.", "B is incorrect. Problem management investigates root causes of incidents. While it may help prevent future outages, it is not responsible for managing customer complaints and relationships.", "C is incorrect. Relationship management is responsible for managing and nurturing the relationships between the organization and its stakeholders. This includes handling complaints, understanding customer concerns, ensuring satisfaction, and maintaining trust. When a customer formally complains, relationship management takes the lead in addressing their concerns.", "D is correct. Service level management defines and monitors service levels. While SLA breaches may be involved, managing the customer complaint and relationship is not its primary responsibility."], "tip": "Relationship management owns customer complaints and satisfaction. It ensures the overall health of the relationship, even when other practices handle the technical resolution."}, {"id": "ITIL4F-E04-035", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "An organization uses multiple external vendors for different components of its IT services: one for network connectivity, another for cloud storage, and a third for application support. Which concept within supplier management addresses this scenario?", "choices": ["Single-source procurement", "Multi-supplier management, ensuring integration and coordination across all suppliers", "Vendor lock-in strategy to reduce complexity", "Outsourcing all IT functions to a single managed service provider"], "answer": [1], "explanations": ["A is incorrect. Single-source procurement means using one supplier, which is the opposite of the scenario described.", "B is correct. Multi-supplier management is the discipline of managing and coordinating multiple external suppliers to ensure they collectively deliver the required services effectively. Supplier management ensures integration, performance monitoring, and coordination across all suppliers to prevent gaps and conflicts.", "C is incorrect. Vendor lock-in is generally considered a risk to be managed, not a strategy to be pursued. It limits flexibility and negotiating power.", "D is incorrect. Consolidating to a single provider is one approach but does not describe the current multi-supplier scenario. Supplier management must address the reality of multiple suppliers."], "tip": "Multi-supplier management ensures coordination across vendors so that the combined services meet organizational needs. Focus on integration, performance, and clear accountability."}, {"id": "ITIL4F-E04-036", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "An organization wants to track all hardware and software throughout their lifecycle, from acquisition to disposal, to optimize costs and support decision-making. What should they maintain?", "choices": ["A configuration management database (CMDB)", "An asset register that records the financial and contractual details of all IT assets", "A service catalog listing all available services", "A change schedule showing all planned modifications"], "answer": [1], "explanations": ["A is incorrect. While a CMDB tracks configuration items and their relationships, it focuses on service configuration rather than the financial and contractual lifecycle tracking described in the scenario.", "B is correct. An asset register is a comprehensive record of all IT assets, including their financial value, contractual details, lifecycle status, ownership, and location. IT asset management uses the asset register to optimize costs, ensure license compliance, and support informed decision-making throughout the asset lifecycle.", "C is incorrect. A service catalog lists available services for users but does not track the lifecycle, financial details, or contractual information of individual hardware and software assets.", "D is incorrect. A change schedule records planned changes, not asset lifecycle information."], "tip": "The asset register tracks IT assets through their entire lifecycle (acquire, deploy, manage, retire) with financial and contractual details for cost optimization and compliance."}, {"id": "ITIL4F-E04-037", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "A monitoring tool detects that CPU utilization on a production server has exceeded 90% for 15 consecutive minutes. An alert is automatically generated and sent to the operations team. What monitoring and event management concept does the 90% threshold represent?", "choices": ["A baseline that represents normal server behavior", "A threshold that defines the boundary between normal and abnormal operating conditions, triggering an alert when exceeded", "A service level target defined in the SLA with the customer", "A capacity plan showing future resource requirements"], "answer": [1], "explanations": ["A is incorrect. A baseline represents typical or expected behavior patterns. The 90% CPU threshold is a defined limit that triggers action, not a description of normal behavior.", "B is correct. A threshold is a predefined value that represents the boundary between acceptable and unacceptable operating conditions. When monitoring detects that a metric crosses a threshold (such as CPU exceeding 90% for 15 minutes), it generates an alert to notify the operations team so they can take action before a service disruption occurs.", "C is incorrect. While SLA targets may inform threshold settings, the threshold itself is a monitoring parameter, not an SLA target. SLA targets are expressed in business terms, while thresholds are technical monitoring parameters.", "D is incorrect. A capacity plan is a forward-looking document about future resource needs. The threshold is a real-time monitoring parameter that triggers immediate action."], "tip": "Thresholds define boundaries between normal and abnormal conditions. When crossed, they trigger alerts. Set thresholds carefully to provide early warning without generating alert fatigue."}, {"id": "ITIL4F-E04-038", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "An organization plans to deploy a major application update. The release manager categorizes it alongside emergency patches and minor updates that were released during the quarter. Which statement about release types is CORRECT?", "choices": ["All releases must follow the same approval and deployment process regardless of their type", "Minor releases should always be combined with major releases to reduce deployment effort", "Emergency releases do not require any testing or authorization", "Release types can include major releases, minor releases, and emergency releases, each with different levels of testing and authorization"], "answer": [3], "explanations": ["A is incorrect. Different release types have different risk profiles and urgency levels, requiring different levels of testing, authorization, and deployment procedures.", "B is incorrect. Minor releases should be managed based on their own merit and schedule. Forcing them to wait for major releases can delay important fixes and improvements.", "C is incorrect. Emergency releases still require testing and authorization, although the processes may be expedited. Skipping all testing and authorization for any release type introduces unacceptable risk.", "D is correct. Release management recognizes different release types: major releases (significant new functionality or changes), minor releases (small improvements or fixes), and emergency releases (urgent fixes for critical issues). Each type follows appropriate levels of testing and authorization proportional to its risk and impact."], "tip": "Release types (major, minor, emergency) have different risk profiles and require proportionate levels of testing and authorization. One size does not fit all."}, {"id": "ITIL4F-E04-039", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "A service configuration management team is mapping the IT infrastructure. They document that the email service depends on a mail server, which depends on a virtual machine, which runs on a physical host. What is being documented?", "choices": ["The service catalog hierarchy", "The relationships and dependencies between configuration items (CIs)", "The asset register with financial valuations", "The change schedule for the email infrastructure"], "answer": [1], "explanations": ["A is incorrect. A service catalog hierarchy lists available services for users. The scenario describes technical dependencies between infrastructure components, not a catalog listing.", "B is correct. Service configuration management documents configuration items (CIs) and the relationships between them. The email service, mail server, virtual machine, and physical host are all CIs with dependency relationships. Understanding these relationships is critical for impact analysis, change planning, and incident diagnosis.", "C is incorrect. An asset register tracks financial and contractual information about assets. The scenario describes dependency relationships between components, not their financial values.", "D is incorrect. A change schedule records planned changes, not the relationships between infrastructure components."], "tip": "Configuration management documents CIs and their relationships (dependencies, compositions, etc.). This CI relationship mapping is essential for impact analysis and root cause investigation."}, {"id": "ITIL4F-E04-040", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "A deployment manager is preparing to deploy a new ERP module to production. As part of the deployment plan, she includes detailed steps to revert to the previous version if the deployment causes critical issues. What deployment management concept does this represent?", "choices": ["Canary deployment to test with a subset of users", "Blue-green deployment to maintain two production environments", "Rollback planning to restore the previous state if the deployment fails", "Continuous deployment to automate the release pipeline"], "answer": [2], "explanations": ["A is incorrect. Canary deployment involves gradually rolling out a change to a small subset of users before full deployment. The scenario describes reverting to a previous version, not gradual rollout.", "B is incorrect. Blue-green deployment maintains two identical production environments to enable instant switching. While related to reducing deployment risk, the scenario specifically describes reverting to a previous version, which is rollback planning.", "C is correct. Rollback planning involves defining the steps needed to restore the previous state if a deployment fails or causes critical issues. It is a fundamental part of deployment planning that ensures the organization can recover quickly from a failed deployment without prolonged service disruption.", "D is incorrect. Continuous deployment is an automated approach to deploying code changes to production. The scenario describes a specific risk mitigation plan, not an automation pipeline."], "tip": "Every deployment plan should include rollback procedures. Define clear criteria for when to rollback, the steps to execute it, and the expected recovery time."}]}, {"set": 5, "title": "Practice Exam 5", "questions": [{"id": "ITIL4F-E05-001", "domain": "Key Concepts of Service Management", "type": "single", "stem": "A managed print service provider delivers printed marketing materials to a retail chain. The print provider produces 10,000 brochures (the tangible deliverable), but the retail chain's actual goal is to increase customer footfall by 15%.\n\nWhich statement CORRECTLY distinguishes the output from the outcome in this scenario?", "choices": ["Both the brochures and the footfall increase are outcomes", "The output is the 10,000 brochures; the outcome is the 15% increase in customer footfall", "The output is increased footfall; the outcome is the brochures", "Both the brochures and the footfall increase are outputs"], "answer": [1], "explanations": ["Outcomes are results for stakeholders. While the footfall increase is an outcome, the brochures are a tangible deliverable (output) that contributes to achieving that outcome.", "Correct. An output is a tangible or intangible deliverable of an activity - the 10,000 brochures. An outcome is a result for a stakeholder enabled by one or more outputs - the 15% increase in customer footfall. The brochures (output) enable the footfall increase (outcome).", "This reverses the definitions. An output is a tangible deliverable, and an outcome is a result enabled by outputs.", "Outputs are deliverables of activities. While brochures are an output, the footfall increase is the business result enabled by that output - making it an outcome."], "tip": "Remember: outputs are what you produce (tangible deliverables). Outcomes are the results those outputs enable for stakeholders. A service provider delivers outputs; the consumer achieves outcomes."}, {"id": "ITIL4F-E05-002", "domain": "Key Concepts of Service Management", "type": "single", "stem": "A cloud storage service guarantees 99.99% availability (warranty) but only provides 50GB of storage, which is insufficient for the customer's 500GB data set (utility).\n\nWhy does this service FAIL to deliver value to the customer?", "choices": ["Because 99.99% availability is too high a warranty target", "Because utility is not relevant when warranty targets are met", "Because warranty alone is sufficient to deliver value", "Because a service needs both adequate utility (fitness for purpose) and adequate warranty (fitness for use) to deliver value"], "answer": [3], "explanations": ["The availability target is not the issue. The problem is that the storage capacity (utility) is inadequate for the customer's needs.", "Utility is always relevant. A service must be fit for purpose (utility) - it must do what the customer needs it to do, regardless of how reliably it operates.", "Warranty alone is not sufficient. A highly available service is worthless if it cannot perform the required function (insufficient storage).", "Correct. ITIL 4 states that both utility (fitness for purpose - what the service does) and warranty (fitness for use - how the service performs) are required for a service to deliver value. In this case, the warranty is excellent but the utility falls short, so the service cannot deliver value."], "tip": "Utility + Warranty = Value. Utility is 'what the service does' (fitness for purpose). Warranty is 'how the service performs' (fitness for use). Both must be adequate - one cannot compensate for the other."}, {"id": "ITIL4F-E05-003", "domain": "Key Concepts of Service Management", "type": "single", "stem": "A fitness app company provides the app platform, but users must actively engage by logging their workouts, following training plans, and tracking their nutrition to achieve health improvements.\n\nWhich ITIL 4 concept does this scenario illustrate?", "choices": ["Value is only created when the service is free of charge", "Value is co-created through active collaboration between the service provider and the service consumer", "The service consumer has no role in value creation", "Value is delivered by the service provider alone"], "answer": [1], "explanations": ["Value has nothing to do with whether a service is free or paid. It is about the perceived benefits, usefulness, and importance of something.", "Correct. Value co-creation is a fundamental concept in ITIL 4. The service provider delivers the platform, but value (health improvements) is only realised when the consumer actively participates. Both the provider (app, content, tracking) and consumer (effort, data input, adherence) contribute to creating value.", "The consumer plays an essential role. In this case, without the user logging workouts and following plans, no health improvement value would be created regardless of how good the app is.", "ITIL 4 explicitly states that value is not delivered unilaterally by a provider. Both parties contribute to value creation."], "tip": "Value co-creation means both provider and consumer must actively contribute. The provider cannot deliver value on its own - the consumer's actions, decisions, and engagement are essential to realising value."}, {"id": "ITIL4F-E05-004", "domain": "Key Concepts of Service Management", "type": "single", "stem": "Which of the following is a responsibility of a service PROVIDER?", "choices": ["Authorising the budget for service consumption", "Defining the business outcomes they want to achieve from the service", "Managing resources configured to deliver the service, and access to these resources for users", "Managing resources needed to consume the service"], "answer": [2], "explanations": ["Authorising budget for service consumption is the responsibility of the sponsor, who is part of the service consumer organisation.", "Defining desired business outcomes is the responsibility of the customer (service consumer), not the service provider.", "Correct. The service provider is responsible for managing the resources needed to deliver the service and providing access to these resources for users. This includes provisioning, configuring, maintaining, and supporting the service components.", "Managing resources needed to consume the service is the consumer's responsibility. The provider manages the resources that deliver the service."], "tip": "Service provision includes: management of provider resources, providing access to resources for users, fulfilment of agreed service actions, service performance management, and continual improvement."}, {"id": "ITIL4F-E05-005", "domain": "The Seven Guiding Principles", "type": "single", "stem": "An IT team has manually managed server provisioning for years. After streamlining and documenting the provisioning workflow, management asks them to implement automation to handle routine provisioning requests without human intervention.\n\nWhich guiding principle is PRIMARILY being applied in this final step?", "choices": ["Start where you are", "Progress iteratively with feedback", "Think and work holistically", "Optimize and automate"], "answer": [3], "explanations": ["Incorrect. 'Start where you are' was applied earlier when they assessed and documented the existing manual process. The final step of implementing automation reflects a different principle.", "Incorrect. While iterative progress may have been part of the journey, the specific step of automating a streamlined process aligns most directly with 'Optimize and automate'.", "Incorrect. Thinking holistically means considering all four dimensions and how services interact. The scenario focuses specifically on automating an already-optimized workflow.", "Correct. The 'Optimize and automate' principle recommends that organizations should optimize work before automating it. The team first streamlined and documented the process (optimization), then implemented automation. This follows the principle's guidance that technology should be used to automate tasks that have already been simplified and improved."], "tip": "Start where you are means: don't assume you need to start from scratch. Assess the current state objectively, reuse what works, and build on existing capabilities. Data and direct observation are key tools for this."}, {"id": "ITIL4F-E05-006", "domain": "The Seven Guiding Principles", "type": "single", "stem": "An organisation is implementing a new service management practice. Rather than designing the complete end-to-end process and rolling it out at once, they decide to implement core functionality first, gather user feedback, and then enhance the process in subsequent iterations.\n\nWhich guiding principle is PRIMARILY being applied?", "choices": ["Focus on value", "Think and work holistically", "Progress iteratively with feedback", "Collaborate and promote visibility"], "answer": [2], "explanations": ["Focus on value ensures activities contribute to stakeholder value. While the approach aims to deliver value, the specific method described - core first, then enhance - is iterative progress.", "Think and work holistically considers the end-to-end view. While important, the emphasis here is on incremental delivery with feedback loops.", "Correct. Progress iteratively with feedback recommends organising work into manageable sections that can be executed and completed in a timely manner. By implementing core functionality first and enhancing through iterations with feedback, the organisation can respond to changes and ensure each iteration delivers tangible value.", "Collaborate and promote visibility focuses on involving stakeholders and sharing information. While gathering feedback involves collaboration, the primary principle is iterative progress."], "tip": "Progress iteratively with feedback involves: working in timeboxed iterations, gathering feedback after each iteration, using feedback to inform the next iteration, and delivering value incrementally rather than all at once."}, {"id": "ITIL4F-E05-007", "domain": "The Seven Guiding Principles", "type": "single", "stem": "The 'focus on value' guiding principle states that everything the organisation does should link back to value. Whose perspective should be used to define value?", "choices": ["Only the perspective of senior management", "Only the IT department's technical perspective", "The perspective of all relevant stakeholders, with emphasis on the service consumer", "Only the service provider's perspective"], "answer": [2], "explanations": ["Senior management is one stakeholder group, but value must be understood from multiple perspectives, especially the service consumer who directly experiences the service.", "The IT department's technical view is just one input. Value must be understood from the business and consumer perspective, not just technical metrics.", "Correct. ITIL 4 states that value should be defined from the perspective of all stakeholders, but with primary emphasis on the service consumer. Different stakeholders (customers, users, sponsors, partners) may perceive value differently, and all perspectives should be considered.", "Value should not be defined solely from the provider's perspective. What the provider considers valuable may not align with what consumers actually need."], "tip": "Focus on value requires understanding who the consumer is, what they need, and how they perceive value. Value is subjective and depends on the stakeholder's perspective - always map activities back to consumer value."}, {"id": "ITIL4F-E05-008", "domain": "The Seven Guiding Principles", "type": "single", "stem": "A team manually processes hundreds of standard access requests each week, following the same steps every time. They want to improve efficiency.\n\nApplying the 'optimize and automate' principle, what should the team do FIRST?", "choices": ["Hire additional staff to handle the volume", "Optimise the current process to remove waste and unnecessary steps, then automate the optimised process", "Immediately purchase an automation tool and automate the current process", "Stop processing the requests until an automated solution is available"], "answer": [1], "explanations": ["Adding staff is a scaling approach, not optimisation or automation. It increases costs without improving the process itself.", "Correct. Optimize and automate specifies a deliberate order: first optimise (remove waste, simplify, standardise), then automate (use technology to perform optimised steps). Automating a bad process just creates faster waste. The team should streamline the process first, then automate it.", "Automating a process without first optimising it means you automate waste and inefficiency. The principle says optimise first, then automate.", "Stopping service is not acceptable. The team should improve the process while continuing to deliver the service."], "tip": "The order matters: optimise THEN automate. Optimisation involves simplifying, standardising, and eliminating waste. Only after the process is lean and efficient should you invest in automating it."}, {"id": "ITIL4F-E05-009", "domain": "The Four Dimensions of Service Management", "type": "single", "stem": "An organisation is struggling with service delivery because staff lack the skills needed to support cloud technologies. Training programs have not kept pace with the move to cloud-based services.\n\nWhich dimension of service management does this challenge PRIMARILY relate to?", "choices": ["Value streams and processes", "Organisations and people", "Information and technology", "Partners and suppliers"], "answer": [1], "explanations": ["Value streams and processes defines workflows and activities. The issue here is people skills, not process design.", "Correct. The organisations and people dimension covers roles, responsibilities, formal organisational structures, culture, staffing, and competencies. A skills gap in cloud technologies is fundamentally a people competency issue that falls within this dimension.", "Information and technology focuses on the information and technology needed for service management. While cloud technology is involved, the core issue is staff skills and training, not the technology itself.", "Partners and suppliers would be relevant if external providers needed to fill the gap. The scenario focuses on internal staff capability."], "tip": "The organisations and people dimension addresses: formal and informal organisational structures, roles and responsibilities, culture and communication, staffing and competencies. Skills gaps are a classic organisations and people concern."}, {"id": "ITIL4F-E05-010", "domain": "The Four Dimensions of Service Management", "type": "single", "stem": "A company stores sensitive customer data across multiple systems. They need to ensure data is accurate, accessible to authorised staff, properly protected, and compliant with data protection regulations.\n\nWhich dimension of service management is MOST relevant to these concerns?", "choices": ["Organisations and people", "Partners and suppliers", "Value streams and processes", "Information and technology"], "answer": [3], "explanations": ["Organisations and people covers roles and skills. While people handle data, the core concerns here (accuracy, accessibility, protection, compliance) relate to information management.", "Partners and suppliers would be relevant if third parties were managing the data. The scenario focuses on the data management concerns themselves.", "Value streams and processes defines activities and workflows. While processes govern data handling, the fundamental concern is about the information itself.", "Correct. The information and technology dimension covers the information created, managed, and used in service management, as well as the technologies that support it. Data accuracy, accessibility, protection, and regulatory compliance are all core information management concerns within this dimension."], "tip": "The information and technology dimension addresses: what information is managed, what technologies support services, and the relationships between components. Key concerns include data quality, availability, security, and regulatory compliance."}, {"id": "ITIL4F-E05-011", "domain": "The ITIL Service Value System", "type": "single", "stem": "In the ITIL Service Value System, what is the key output that the entire system is designed to produce?", "choices": ["Service level reports", "Approved changes", "Value", "Incident resolution"], "answer": [2], "explanations": ["Service level reports are outputs of service level management. They contribute to managing value but are not the ultimate output of the SVS.", "Approved changes are outputs of the change enablement practice. They are produced within the SVS but are not its ultimate output.", "Correct. The ITIL Service Value System takes opportunity and demand as inputs and produces value as its key output. The entire purpose of the SVS is to ensure that the organisation continually co-creates value with all stakeholders through the use and management of products and services.", "Incident resolution is an output of the incident management practice, not the output of the entire SVS."], "tip": "The SVS model is simple at its highest level: Opportunity + Demand (inputs) -> SVS -> Value (output). Everything within the SVS exists to transform opportunities and demand into value for stakeholders."}, {"id": "ITIL4F-E05-012", "domain": "The ITIL Service Value System", "type": "single", "stem": "An organization is struggling because its IT department implements changes without considering how they affect the overall service experience. Which component of the ITIL Service Value System would BEST help ensure all activities are aligned toward value creation?", "choices": ["Practices, because they are sets of organizational resources designed for performing work or accomplishing an objective", "The service value chain, because it provides an operating model for the creation, delivery, and continual improvement of services", "Governance, because it provides the means by which an organization is directed and controlled", "The guiding principles, because they provide recommendations that guide an organization in all circumstances regardless of changes in goals, strategies, or structure"], "answer": [3], "explanations": ["Incorrect. Practices provide resources for performing work, but the broader alignment issue is better addressed by the guiding principles, which apply across all practices and activities.", "Incorrect. While the service value chain provides the operating model for service creation, the issue described is about organizational alignment and mindset, which is better addressed by the guiding principles.", "Incorrect. Governance evaluates and directs organizational activities, but the guiding principles are the SVS component that specifically provides universal recommendations for all circumstances.", "Correct. The guiding principles provide recommendations that can guide an organization in all circumstances. When changes are being made without considering the broader service experience, applying principles like 'Think and work holistically' and 'Focus on value' would help align activities toward overall value creation."], "tip": "ITIL 4 defines 34 management practices in three categories: general management practices (14), service management practices (17), and technical management practices (3). The Foundation exam covers 15 of these."}, {"id": "ITIL4F-E05-013", "domain": "The ITIL Service Value System", "type": "single", "stem": "Which SVS component ensures that activities and investments in service management are properly directed and controlled at all levels of the organisation?", "choices": ["Guiding principles", "Continual improvement", "Service value chain", "Governance"], "answer": [3], "explanations": ["Guiding principles are recommendations that guide an organisation in all circumstances. They provide direction but do not govern or control activities and investments.", "Continual improvement ensures the organisation keeps aligning with changing stakeholder needs. It is supported by governance but is not itself the governing component.", "The service value chain is the set of interconnected activities that create value. It is governed by governance but does not itself perform the governance function.", "Correct. Governance in the SVS is the means by which an organisation is directed and controlled. It ensures that activities and investments are properly directed, controlled, and evaluated. Governance operates at all levels and includes evaluating, directing, and monitoring."], "tip": "The governance component of the SVS has three main activities: Evaluate (assess current state), Direct (set direction and policies), and Monitor (check performance against direction). This is sometimes called the EDM model."}, {"id": "ITIL4F-E05-014", "domain": "The Service Value Chain", "type": "single", "stem": "The six activities of the service value chain are: plan, improve, engage, design and transition, obtain/build, and deliver and support.\n\nHow do these activities relate to each other?", "choices": ["They must always be performed in a fixed sequential order", "They are interconnected and can be combined in different sequences to create value streams", "Only three of the six activities are used in any single value stream", "They operate independently with no interactions between them"], "answer": [1], "explanations": ["The service value chain activities do NOT follow a fixed order. Different value streams may use different combinations and sequences of activities.", "Correct. The six value chain activities are interconnected and can be combined in different ways to create multiple value streams. Each value stream represents a specific combination and sequence of activities tailored to a particular scenario, such as handling an incident or developing a new service.", "A value stream may use any number of the activities, potentially all six. There is no restriction on how many activities a value stream can include.", "The activities are not independent - they interact with each other extensively. Each activity receives inputs from and provides outputs to other activities."], "tip": "The service value chain is flexible by design. Different scenarios require different value streams. For example, responding to an incident uses a different sequence of activities than designing a new service, but both are valid value streams through the same value chain."}, {"id": "ITIL4F-E05-015", "domain": "The Service Value Chain", "type": "single", "stem": "A customer contacts the service desk to request a new laptop. The service desk logs the request, the procurement team orders the equipment, the desktop team configures it, and the service desk delivers it to the user.\n\nThis end-to-end sequence from demand to fulfilled request is BEST described as what?", "choices": ["A guiding principle", "A practice", "A value stream", "A process"], "answer": [2], "explanations": ["A guiding principle is a recommendation that guides behaviour. It does not describe a sequence of activities.", "A practice is a set of organisational resources for performing work. The end-to-end sequence described crosses multiple practices (service request management, procurement, etc.).", "Correct. A value stream is a series of steps an organisation undertakes to create and deliver products and services to consumers. This end-to-end sequence - from customer demand (laptop request) through multiple activities (logging, ordering, configuring, delivering) to value delivery (user has a working laptop) - is a textbook value stream.", "A process is a set of interrelated activities that transform inputs into outputs. While processes are involved, the broader end-to-end flow from customer demand to value delivery is a value stream."], "tip": "A value stream maps the complete journey from demand to value. It shows how the service value chain activities are combined to handle a specific type of work. Organisations should map their key value streams to identify bottlenecks and improvement opportunities."}, {"id": "ITIL4F-E05-016", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "Which of the following is the BEST example of an improvement opportunity that the continual improvement practice should capture?", "choices": ["A service desk agent notices that the same type of printer incident occurs every Monday morning", "A new employee needs access credentials set up", "A user requests a new monitor for their desk", "A customer calls to report a major incident affecting all users"], "answer": [2], "explanations": ["A monitor request is a standard service request handled by service request management, not an improvement opportunity.", "Setting up access for a new employee is a routine service request, not an improvement opportunity.", "A monitor request is a standard service request handled by service request management, not an improvement opportunity.", "A major incident requires immediate response through incident management. While a post-incident review might identify improvements, the incident itself is not an improvement opportunity."], "tip": "Improvement opportunities can come from anywhere - incident trends, staff observations, customer feedback, audit findings, or process bottlenecks. The key is having a culture where everyone feels empowered to suggest improvements."}, {"id": "ITIL4F-E05-017", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "When evaluating improvement initiatives, what is the MOST important factor to establish before measuring progress?", "choices": ["The budget allocated for the improvement", "A clear baseline measurement of the current state", "The number of staff involved in the improvement", "The technology platform to be used"], "answer": [1], "explanations": ["Budget is important for planning but without a baseline measurement, you cannot determine whether the improvement actually delivered value for the money spent.", "Correct. Before you can measure improvement, you must establish a baseline - a clear measurement of the current state. Without knowing where you started, you cannot demonstrate that an improvement initiative has achieved its objectives. This aligns with the 'Where are we now?' step of the continual improvement model.", "Staffing resources are a planning consideration, not a prerequisite for measuring progress. The baseline measurement is essential.", "Technology choice is an implementation decision. The most important prerequisite for measurement is knowing your starting point."], "tip": "The continual improvement model asks 'Where are we now?' before 'Where do we want to be?' This is because you need an accurate baseline to set meaningful targets and later prove that improvement occurred."}, {"id": "ITIL4F-E05-018", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "What is the relationship between a change and a release in ITIL 4?", "choices": ["A release always contains exactly one change", "A change is authorised modification; a release may bundle multiple changes for deployment together", "Changes only apply to hardware; releases only apply to software", "A change and a release are identical concepts"], "answer": [1], "explanations": ["A release can contain one or many changes. There is no one-to-one requirement between changes and releases.", "Correct. A change is the addition, modification, or removal of anything that could have a direct or indirect effect on services. A release is a version of a service or other configuration item made available for use. A single release often bundles multiple authorised changes together for coordinated deployment.", "Both changes and releases can apply to any type of service component - hardware, software, processes, documentation, or any combination.", "Changes and releases are distinct concepts. A change is an authorised modification; a release packages changes for availability."], "tip": "Think of the flow: individual changes are authorised through change enablement, then related changes may be bundled into a release by release management, and finally the release is deployed to live environments by deployment management."}, {"id": "ITIL4F-E05-019", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "What is the PRIMARY role of a change advisory board (CAB)?", "choices": ["To support the assessment and prioritisation of changes by providing diverse perspectives and expertise", "To develop the technical design of proposed changes", "To implement approved changes in the live environment", "To authorise all changes in the organisation"], "answer": [0], "explanations": ["Correct. The change advisory board is a group of people that supports the assessment and prioritisation of changes. It provides advice by bringing together diverse perspectives - technical, business, security, compliance - to help change authorities make informed decisions.", "Technical design is done by design and engineering teams. The CAB reviews and advises on proposed changes, it does not design them.", "Implementing changes is the responsibility of technical teams and deployment management, not the CAB.", "The CAB does not authorise all changes. Standard changes are pre-authorised and many normal changes may be authorised by designated change authorities without CAB involvement. The CAB is advisory, not authoritative."], "tip": "The CAB is advisory, not a decision-making body. The change authority (which may be a single person or group) makes the final decision. The CAB composition should vary based on the changes being assessed."}, {"id": "ITIL4F-E05-020", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "After a major change was deployed to the production environment, the team meets to evaluate whether the change achieved its objectives, assess any unintended side effects, and capture lessons learned.\n\nWhat activity is this?", "choices": ["Service validation", "Change assessment", "Post-implementation review", "Change authorisation"], "answer": [2], "explanations": ["Service validation tests whether a service meets its requirements. While related, the specific activity of evaluating change success, side effects, and lessons learned is a post-implementation review.", "Change assessment occurs before authorisation to evaluate the risks and impacts of a proposed change. This activity occurs after deployment.", "Correct. A post-implementation review (PIR) evaluates whether a deployed change achieved its intended objectives, identifies any unintended consequences, and captures lessons learned for future improvements. It is an essential feedback mechanism in change enablement.", "Change authorisation is the decision to approve a change for implementation. This occurs before deployment, not after."], "tip": "Post-implementation reviews should be conducted for significant changes. They help organisations learn from experience, improve future change processes, and identify any remediation needed for unintended consequences."}, {"id": "ITIL4F-E05-021", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "When logging incidents, which information is MOST important to capture to support effective categorisation and routing?", "choices": ["The incident symptoms, affected service, and impact on users", "The colour of the user's equipment", "The weather conditions at the time of the incident", "The name of the CEO"], "answer": [0], "explanations": ["Correct. Effective incident categorisation requires understanding what happened (symptoms), which service is affected, and how many users are impacted. This information enables proper routing to the right support team and helps set the correct priority.", "Equipment colour has no bearing on incident categorisation or routing.", "Weather conditions are not relevant to IT incident categorisation (unless specifically dealing with weather-dependent services, which is a special case).", "CEO name is irrelevant to incident categorisation and routing."], "tip": "Key incident logging details: description of symptoms, affected service/CI, impact (number of users, business criticality), urgency, user contact information, and timestamp. Good logging enables good categorisation, prioritisation, and routing."}, {"id": "ITIL4F-E05-022", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "During a major incident affecting the company's core trading platform, the incident manager sends regular updates to business stakeholders every 30 minutes, even when there is no change in status.\n\nWhy is this communication approach important?", "choices": ["It is required by the change enablement practice", "It generates useful documentation for legal proceedings", "It is not important - updates should only be sent when there is new information", "Regular communication during major incidents maintains stakeholder confidence and prevents them from seeking information through unofficial channels"], "answer": [3], "explanations": ["Major incident communication is part of incident management, not change enablement.", "While documentation is valuable, the primary purpose of regular updates is stakeholder management and maintaining confidence, not legal protection.", "Waiting until there is new information can leave stakeholders anxious and uninformed. 'No update' is itself an update that prevents speculation.", "Correct. Regular, structured communication during major incidents is critical. It maintains trust and confidence, keeps stakeholders informed even when progress is slow, prevents them from calling the service desk (adding load), and stops misinformation from spreading through unofficial channels."], "tip": "Major incident communication should be: regular (even if just 'still investigating'), targeted (different detail levels for different audiences), honest (don't overpromise), and structured (use predefined templates and channels)."}, {"id": "ITIL4F-E05-023", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "What is the difference between incident restoration and incident resolution?", "choices": ["Restoration returns the service to normal operation (possibly with a workaround); resolution addresses the underlying cause permanently", "Restoration is for major incidents only; resolution is for all other incidents", "There is no difference - restoration and resolution are the same thing", "Resolution comes before restoration in the incident lifecycle"], "answer": [0], "explanations": ["Correct. Restoration means returning the service to acceptable operation, which may involve a temporary workaround. Resolution means permanently fixing the underlying issue so the incident does not recur. Incident management focuses primarily on restoration (getting the service working again quickly), while problem management typically handles resolution (fixing the root cause).", "Both concepts apply to all incidents regardless of severity. Major incidents still need both restoration and eventual resolution.", "Restoration and resolution are distinct concepts in incident management. They serve different purposes.", "Restoration typically comes first - you restore service quickly for users, then work on the permanent resolution. The order stated is incorrect."], "tip": "Incident management's primary goal is service restoration - getting things working again as fast as possible, even with a workaround. Permanent resolution (fixing the root cause) is often handled by problem management."}, {"id": "ITIL4F-E05-024", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "A problem has been analysed, the root cause identified as a firmware bug, and a workaround documented. The vendor has been notified but a permanent fix will not be available for six months.\n\nWhat should this problem be classified as?", "choices": ["An incident", "A change request", "A service request", "A known error"], "answer": [3], "explanations": ["An incident is an unplanned interruption to a service. The problem has already been investigated and the cause identified - it is no longer just an incident.", "A change request might eventually be raised to implement the firmware fix, but the problem itself (with documented root cause and workaround) is classified as a known error.", "A service request is a formal request from a user for something to be provided. A problem with an identified root cause is not a service request.", "Correct. A known error is a problem that has been analysed and has not been resolved. In this case, the root cause is identified (firmware bug), a workaround exists, but a permanent fix is not yet available. This is the textbook definition of a known error."], "tip": "The lifecycle: incident (service disruption) -> problem (cause unknown) -> known error (cause identified, not yet resolved) -> resolved problem (permanent fix applied). Known errors should be documented in a known error database (KEDB)."}, {"id": "ITIL4F-E05-025", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "How does problem management support incident management?", "choices": ["Problem management only operates after all incidents have been resolved", "Problem management replaces incident management once root causes are identified", "Problem management is responsible for logging and categorising all incidents", "Problem management provides workarounds and known error information that helps resolve incidents faster"], "answer": [3], "explanations": ["Problem management can operate in parallel with incident management. Reactive problem management begins after incidents occur, and proactive problem management works to prevent future incidents.", "Problem management does not replace incident management. Both practices operate concurrently and serve different purposes.", "Logging and categorising incidents is the responsibility of incident management, not problem management.", "Correct. Problem management supports incident management by providing workarounds, known error information, and root cause data. When the service desk encounters an incident matching a known error, they can apply the documented workaround immediately, significantly reducing resolution time."], "tip": "The incident-problem relationship: incidents trigger problem investigation (reactive). Problem management provides workarounds and known errors back to incident management, creating a beneficial feedback loop that speeds up future incident resolution."}, {"id": "ITIL4F-E05-026", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "An organisation wants to standardise how common service requests are handled. They create documented step-by-step procedures for each type of request, including approval requirements and expected fulfilment timescales.\n\nWhat are these documented procedures called?", "choices": ["Change schedules", "Request models", "Service level agreements", "Problem records"], "answer": [1], "explanations": ["A change schedule shows planned and historical changes. It is not related to service request fulfilment procedures.", "Correct. Request models are predefined, repeatable procedures for handling specific types of service requests. They include the steps required for fulfilment, any approval requirements, expected timescales, and the roles responsible for each step. They standardise and streamline request handling.", "Service level agreements define the overall service levels agreed with customers. They are not the step-by-step procedures for fulfilling individual requests.", "Problem records document problems, their investigation, and resolution. They are part of problem management, not service request management."], "tip": "Request models streamline service request fulfilment by providing standardised, repeatable procedures. They should be regularly reviewed and updated. Well-designed request models are excellent candidates for automation."}, {"id": "ITIL4F-E05-027", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "Which metric is MOST appropriate for measuring the effectiveness of the service request management practice?", "choices": ["Mean time between failures (MTBF)", "User satisfaction with request fulfilment and percentage of requests fulfilled within agreed timescales", "Number of known errors documented", "Number of emergency changes implemented"], "answer": [1], "explanations": ["MTBF measures reliability of services or components. It relates to availability management, not service request fulfilment.", "Correct. Service request management effectiveness is best measured by: user satisfaction with the fulfilment experience and the percentage of requests completed within agreed timescales. These metrics directly reflect how well the practice serves its consumers.", "Known errors documented is a problem management metric, not a service request management metric.", "Emergency changes implemented is a change enablement metric. It has no direct relevance to service request management effectiveness."], "tip": "Key service request management metrics include: fulfilment time vs agreed timescale, user satisfaction scores, request backlog size, first-contact fulfilment rate, and automation rate for standard requests."}, {"id": "ITIL4F-E05-028", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "How has the role of the service desk evolved in modern IT service management according to ITIL 4?", "choices": ["The service desk role has been eliminated in favour of artificial intelligence", "The service desk now focuses exclusively on technical troubleshooting", "The service desk has evolved from a simple call-logging function to a vital strategic role in the service value chain, providing a human point of contact for empathy and understanding", "The service desk has become less important as self-service replaces human interaction"], "answer": [2], "explanations": ["AI supports service desk operations but does not replace the need for human contact. The service desk continues to play a crucial role, especially for complex and sensitive interactions.", "Technical troubleshooting is just one aspect. The modern service desk role encompasses empathetic communication, user experience management, knowledge sharing, and service improvement feedback.", "Correct. ITIL 4 recognises that the service desk has evolved significantly. It is no longer just a call-logging function but a vital, strategic part of the service provider, acting as the human face of IT. It provides empathy, understanding, and context that technology alone cannot deliver.", "While self-service handles routine requests, the service desk has become more important for complex issues requiring human judgement, empathy, and context. It has not become less important."], "tip": "The modern service desk is a strategic asset. It provides: a single point of contact, empathetic human interaction, incident and request handling, knowledge and information sharing, and valuable feedback for service improvement."}, {"id": "ITIL4F-E05-029", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "An organization maintains a list of all live IT services available to users, including descriptions, service hours, and how to request each service. New employees use this to understand what IT support is available to them.\n\nWhich ITIL practice is PRIMARILY responsible for maintaining this information?", "choices": ["Service catalogue management", "Service level management", "Service request management", "Service configuration management"], "answer": [0], "explanations": ["Correct. Service catalogue management is responsible for providing a single source of consistent information on all services and service offerings, ensuring it is available to the relevant audience. The service catalogue described here gives users visibility of available services, their descriptions, and how to access them.", "Incorrect. Service level management focuses on setting clear business-based targets for service performance and ensuring delivery is properly assessed, monitored, and managed against those targets. It uses the catalogue but does not maintain it.", "Incorrect. Service request management handles the fulfilment of pre-defined, user-initiated service requests. While users may browse the catalogue to submit requests, maintaining the catalogue itself is the responsibility of service catalogue management.", "Incorrect. Service configuration management ensures accurate information about the configuration of services and the CIs that support them. It deals with technical configuration data and CI relationships, not the user-facing service catalogue."], "tip": "Single point of contact (SPOC) means users have one place to go for all IT interactions. This prevents confusion, ensures consistent communication, and allows the service desk to coordinate across multiple support teams."}, {"id": "ITIL4F-E05-030", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "The service desk regularly shares insights about recurring user complaints with the problem management team and provides feedback on service usability to the design team.\n\nWhat does this demonstrate about the service desk's role?", "choices": ["The service desk collaborates with other practices to improve services and prevent future issues", "The service desk is overstepping its responsibilities", "The service desk should only focus on logging and closing tickets", "Problem management and design should gather their own data without service desk input"], "answer": [0], "explanations": ["Correct. The service desk has unique visibility into user experience and patterns. Sharing recurring complaint data with problem management and usability feedback with the design team demonstrates cross-practice collaboration, which is essential in ITIL 4. The service desk is a valuable source of intelligence for the entire organisation.", "Sharing insights with other practices is an expected and valuable part of the service desk's role, not overstepping.", "Modern service desks do far more than logging and closing tickets. They are active contributors to service improvement and cross-practice
