collaboration.", "While other practices can gather data independently, the service desk's front-line position gives it unique insights that other practices cannot easily obtain on their own."], "tip": "The service desk's front-line position makes it a valuable intelligence source. It can identify trends, patterns, and user experience issues that feed into problem management, continual improvement, and service design."}, {"id": "ITIL4F-E05-031", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "An organisation maps the complete user experience of requesting and receiving IT support - from initial contact, through diagnosis, to resolution and satisfaction survey - to identify pain points and improvement opportunities.\n\nWhat service level management technique is being used?", "choices": ["Customer journey mapping", "Capacity planning", "Root cause analysis", "SLA negotiation"], "answer": [0], "explanations": ["Correct. Customer journey mapping involves mapping the complete experience a customer or user has when interacting with a service. It identifies all touchpoints, pain points, and moments of truth, helping the organisation understand and improve the real user experience.", "Capacity planning ensures services have sufficient resources. It does not map user experiences.", "Root cause analysis investigates the cause of problems. The scenario describes mapping experiences, not investigating causes of incidents.", "SLA negotiation focuses on agreeing specific service level targets. The scenario describes mapping the full user experience, not negotiating targets."], "tip": "Customer journey mapping helps service level management move beyond simple metrics to understand the actual user experience. It reveals pain points that traditional SLA metrics might miss, supporting the identification of 'watermelon SLAs'."}, {"id": "ITIL4F-E05-032", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "Instead of measuring only technical metrics like uptime and response time, a service provider starts measuring user satisfaction, ease of use, and the number of user complaints.\n\nWhat type of metrics is the service provider adopting?", "choices": ["Experience-based metrics", "Compliance metrics", "Purely operational metrics", "Financial metrics"], "answer": [0], "explanations": ["Correct. Experience-based metrics measure the actual user experience rather than just technical performance. User satisfaction, ease of use, and complaint rates reflect how users perceive and experience the service, providing a more complete picture than operational metrics alone.", "Compliance metrics measure adherence to regulations and policies. The metrics described focus on user experience, not compliance.", "Operational metrics focus on technical performance (uptime, response time). The provider is moving beyond these to measure user experience.", "Financial metrics relate to costs, revenue, and ROI. User satisfaction and ease of use are experience metrics, not financial ones."], "tip": "ITIL 4 encourages measuring what matters to customers. Experience-based metrics complement operational metrics by capturing the human side of service delivery. Together, they help avoid the 'watermelon SLA' effect."}, {"id": "ITIL4F-E05-033", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "What does the information security management practice recommend as a balanced approach to security?", "choices": ["Allowing users to determine their own security settings based on personal preference", "Focusing security efforts exclusively on external threats", "Implementing the highest possible security controls regardless of cost or user impact", "Balancing the need for security with the needs of the business, including usability and cost-effectiveness"], "answer": [3], "explanations": ["Allowing users to set their own security creates inconsistency and potential vulnerabilities. Security policies should be defined centrally based on risk assessment.", "Security must address both internal and external threats. Internal threats (accidental data exposure, insider threats) can be equally or more damaging than external ones.", "Maximum security regardless of impact can cripple business operations and user productivity. Security must be proportionate to the risks.", "Correct. Information security management recommends a balanced approach that considers both security requirements and business needs. Security controls should be proportionate to risks, affordable, and should not unnecessarily impede business operations or user productivity."], "tip": "Information security must balance prevention (too restrictive kills productivity) with exposure (too lax creates vulnerabilities). The right balance depends on the organisation's risk appetite and the value of the information being protected."}, {"id": "ITIL4F-E05-034", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "Which practice ensures that accurate and reliable information about the configuration of services and the supporting CIs is available when and where it is needed?", "choices": ["IT asset management", "Service configuration management", "Change enablement", "Monitoring and event management"], "answer": [1], "explanations": ["Incorrect. IT asset management focuses on planning and managing the full lifecycle of IT assets to maximize value, control costs, and manage risks. While related, it does not specifically focus on configuration information and relationships between CIs.", "Correct. The purpose of service configuration management is to ensure that accurate and reliable information about the configuration of services, and the CIs that support them, is available when and where it is needed. This includes information about how CIs are configured and the relationships between them.", "Incorrect. Change enablement maximizes the number of successful service and product changes by ensuring risks are properly assessed and managing the schedule of changes.", "Incorrect. Monitoring and event management systematically observes services and service components, and records and reports selected changes of state identified as events."], "tip": "Relationship management works at strategic and tactical levels. It identifies stakeholder needs, manages expectations, and builds long-term partnerships. It is distinct from supplier management (which focuses on contracts and supplier performance)."}, {"id": "ITIL4F-E05-035", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "An organisation uses multiple external service providers to deliver its IT services. A dedicated team coordinates between these providers to ensure seamless service delivery.\n\nWhat concept from supplier management does this represent?", "choices": ["Shadow IT", "Single-source supply", "Service integration and management (SIAM)", "Insourcing"], "answer": [2], "explanations": ["Shadow IT refers to IT systems used without organisational approval. This scenario describes an officially managed multi-provider arrangement.", "Single-source supply means using one supplier for everything. The scenario describes multiple providers being coordinated.", "Correct. Service integration and management (SIAM) involves coordinating multiple service providers to deliver seamless, end-to-end service to the customer. The dedicated coordination team is fulfilling the SIAM role.", "Insourcing means bringing services in-house. The scenario specifically describes using external service providers."], "tip": "In multi-supplier environments, service integration and management (SIAM) ensures all providers work together effectively. The integrator role can be performed internally or by an external party."}, {"id": "ITIL4F-E05-036", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "An organisation conducts a regular audit to verify that all hardware and software in use matches what is recorded in their asset register, identifying any unauthorised or untracked items.\n\nWhich practice supports this activity?", "choices": ["IT asset management", "Incident management", "Change enablement", "Service configuration management"], "answer": [0], "explanations": ["Correct. IT asset management plans and manages the full lifecycle of all IT assets. Regular audits to verify that actual assets match recorded assets, and to identify unauthorised or untracked items, are core IT asset management activities.", "Incident management handles service disruptions. Asset auditing is a planned management activity, not an incident response.", "Change enablement manages the authorisation of changes. Asset auditing is not a change enablement activity.", "Service configuration management maintains information about configuration items and their relationships. While related, the specific activity of auditing physical/software assets against an asset register is an IT asset management function."], "tip": "IT asset management uses regular audits and reconciliation to ensure the accuracy of asset records. This helps with cost management, licence compliance, risk reduction, and informed decision-making."}, {"id": "ITIL4F-E05-037", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "An organisation sets up automated health checks that run every five minutes to detect potential infrastructure problems before they impact users.\n\nWhat type of monitoring does this represent?", "choices": ["Proactive monitoring", "Manual monitoring", "Post-incident monitoring", "Reactive monitoring"], "answer": [0], "explanations": ["Correct. Proactive monitoring involves actively checking the health and performance of systems to detect potential issues before they become incidents. Automated health checks running at regular intervals to detect problems before user impact is a classic example of proactive monitoring.", "Manual monitoring involves humans checking systems. The scenario describes automated checks running every five minutes.", "Post-incident monitoring occurs after an incident to watch for recurrence. These health checks run continuously as a preventive measure.", "Reactive monitoring responds to events after they occur. Automated health checks designed to detect issues before user impact are proactive."], "tip": "Proactive monitoring detects issues before users are affected. It includes: health checks, threshold monitoring, predictive analytics, and synthetic transactions. It is a key input to both incident prevention and problem management."}, {"id": "ITIL4F-E05-038", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "What does the release management practice primarily control?", "choices": ["The timing and coordination of making new or changed services and features available for use", "The authorisation of changes to live services", "The root cause analysis of production incidents", "The physical deployment of components to live environments"], "answer": [0], "explanations": ["Correct. Release management controls the timing and coordination of making new or changed services and features available for use. It determines when releases go live, what they contain, and how they are communicated to stakeholders.", "Authorising changes is the responsibility of change enablement. Release management handles the packaging and availability timing of approved changes.", "Root cause analysis is performed by problem management, not release management.", "Physical deployment to live environments is the responsibility of deployment management, not release management."], "tip": "Release management coordinates WHEN and WHAT becomes available. It decides release timing, content, and communication. Think of it as the gatekeeper between approved changes and their availability to users."}, {"id": "ITIL4F-E05-039", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "Why is maintaining the accuracy of the configuration management database (CMDB) important?", "choices": ["It is only important for audit compliance purposes", "The CMDB is only used by the service desk for logging incidents", "Accurate CMDB data supports impact analysis, root cause investigation, and informed decision-making across all practices", "CMDB accuracy is only important during major incidents"], "answer": [2], "explanations": ["Audit compliance is one benefit, but CMDB accuracy has far broader importance across all service management activities.", "The CMDB is used by multiple practices, not just the service desk. Change enablement, problem management, and many other practices rely on accurate configuration information.", "Correct. An accurate CMDB supports: impact analysis for change enablement (understanding what will be affected), root cause investigation for problem management (tracing relationships between CIs), incident management (identifying affected components), and informed decision-making across all practices.", "CMDB accuracy is important at all times, not just during major incidents. Decisions made with inaccurate CMDB data can lead to failed changes, missed impacts, and longer resolution times."], "tip": "The CMDB is a shared resource that underpins many ITIL practices. Its accuracy directly affects the quality of change impact analysis, incident diagnosis, problem investigation, and service planning decisions."}, {"id": "ITIL4F-E05-040", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "An organisation deploys updates to its web application multiple times per day using an automated pipeline that builds, tests, and deploys code with zero user-visible downtime.\n\nWhich deployment management concept does this BEST represent?", "choices": ["Continuous deployment with zero downtime", "Big bang deployment", "Manual deployment", "Phased deployment"], "answer": [0], "explanations": ["Correct. Continuous deployment uses automated pipelines to deploy changes frequently (potentially multiple times daily) with zero downtime. The automated build-test-deploy pipeline described is a modern continuous deployment approach.", "Big bang deployment rolls out changes to all users simultaneously at a scheduled time. The scenario describes multiple daily deployments through an automated pipeline, not a single big deployment.", "Manual deployment involves human intervention for each step. The scenario explicitly describes an automated pipeline.", "Phased deployment gradually rolls out to different user groups. The scenario describes continuous, frequent deployments with zero downtime, not a gradual rollout."], "tip": "Modern deployment approaches include: big bang (all at once), phased/rolling (gradual), blue-green (switch between environments), canary (test with a small group first), and continuous deployment (frequent automated deployments)."}]}]}};

function $(id) { return document.getElementById(id); }
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
function arrHas(a, v) { for (var i=0;i<a.length;i++) if (a[i]===v) return true; return false; }
function setEq(a,b) {
  if (a.length !== b.length) return false;
  for (var i=0;i<a.length;i++) if (!arrHas(b,a[i])) return false;
  return true;
}
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  var m = Math.floor(sec/60), s = sec % 60;
  return (m<10?'0':'')+m+':' + (s<10?'0':'')+s;
}
function getExamMeta(code) {
  for (var i=0;i<BANK.exams.length;i++) if (BANK.exams[i].code===code) return BANK.exams[i];
  return null;
}

var STATE = {
  examCode:null, examName:null, setIndex:null, questions:null,
  idx:0, answers:{}, revealed:{}, flagged:{}, startedAt:null, timerId:null,
  durationSec:60*60, finished:false, showNav:false
};

function renderHome() {
  $('viewPicker').style.display='none';
  $('viewExam').style.display='none';
  var meta=getExamMeta('ITIL4F');
  var h='';
  h+='<div class="card">';
  h+='<h2 style="margin:0 0 8px 0;">ITIL 4 Foundation Exam Simulator</h2>';

  h+='<div class="hr"></div>';
  h+='<div class="card">';
  h+='<h3 style="margin:0 0 6px 0;">ITIL 4 Foundation</h3>';
  h+='<div class="tiny">5 practice exams &bull; 40 questions each &bull; domain-weighted &bull; single-answer multiple choice</div>';
  h+='<div class="kpi">';
  h+='<div class="k"><b>Pass</b> 26/40 (65%)</div>';
  h+='<div class="k"><b>Questions</b> 40</div>';
  h+='<div class="k"><b>Time</b> 60 mins</div>';
  h+='<div class="k"><b>Format</b> Closed book</div>';
  h+='</div>';
  h+='<div class="btnrow"><button class="primary" onclick="pickExam(\'ITIL4F\')">Start practice exams</button></div>';
  h+='</div>';

  h+='<div class="hr"></div>';
  h+='<h3 style="margin:8px 0 6px 0;">Exam Domain Breakdown</h3>';
  h+='<div class="grid">';
  if (meta) {
    for (var i=0;i<meta.domains.length;i++) {
      var d=meta.domains[i];
      h+='<div class="card"><div class="tiny" style="font-weight:700;">'+esc(d.name)+'</div>';
      h+='<div class="k"><b>~'+d.weight+'</b> questions per exam</div></div>';
    }
  }
  h+='</div>';

  h+='<div class="hr"></div>';
  h+='<div class="tiny">Scoring: percentage-based (correct/total). Pass at 65% (26 out of 40). No negative marking. Single correct answer per question.\nThis simulator is for practice only. Not affiliated with PeopleCert or AXELOS.</div>';
  h+='</div>';
  $('viewHome').innerHTML=h;
  $('footerNote').innerHTML=esc(BANK.meta.note)+' &bull; Generated: '+esc(BANK.meta.generated_utc);
}

function pickExam(code) {
  var meta=getExamMeta(code);
  STATE.examCode=code;
  STATE.examName=meta?meta.name:code;
  renderPicker();
}

function renderPicker() {
  $('viewHome').innerHTML='';
  $('viewExam').style.display='none';
  $('viewPicker').style.display='';
  var sets=BANK.practice_sets[STATE.examCode]||[];
  var h='';
  h+='<div class="card">';
  h+='<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;">';
  h+='<div><h2 style="margin:0 0 6px 0;">'+esc(STATE.examName)+'</h2><div class="muted">Choose a practice exam. Each contains 40 unique questions.</div></div>';
  h+='<button class="linkbtn" onclick="goHome()">&larr; Back</button>';
  h+='</div>';
  h+='<div class="grid">';
  for (var i=0;i<sets.length;i++) {
    var s=sets[i];
    h+='<div class="card">';
    h+='<h3 style="margin:0 0 6px 0;">'+esc(s.title)+'</h3>';
    h+='<div class="kpi">';
    h+='<div class="k"><b>Questions</b> 40</div>';
    h+='<div class="k"><b>Time</b> 60 mins</div>';
    h+='<div class="k"><b>Pass</b> 65%</div>';
    h+='</div>';
    h+='<div class="btnrow"><button class="primary" onclick="startExam('+s.set+')">Start</button></div>';
    h+='</div>';
  }
  h+='</div></div>';
  $('viewPicker').innerHTML=h;
}

function goHome() {
  resetState();
  $('viewHome').innerHTML='';
  $('viewPicker').innerHTML='';
  $('viewExam').innerHTML='';
  $('viewHome').style.display='';
  renderHome();
}
function resetState() {
  if (STATE.timerId) clearInterval(STATE.timerId);
  STATE={examCode:null, examName:null, setIndex:null, questions:null, idx:0, answers:{}, revealed:{}, flagged:{}, startedAt:null, timerId:null, durationSec:60*60, finished:false, showNav:false};
}

function startExam(setIndex) {
  STATE.setIndex=setIndex;
  STATE.durationSec=60*60;
  STATE.startedAt=new Date().getTime();
  STATE.answers={}; STATE.revealed={}; STATE.flagged={}; STATE.idx=0; STATE.finished=false; STATE.showNav=false;

  var sets=BANK.practice_sets[STATE.examCode]||[];
  var picked=null;
  for (var i=0;i<sets.length;i++) if (sets[i].set===setIndex) picked=sets[i];
  STATE.questions=picked?clone(picked.questions):[];

  $('viewPicker').style.display='none';
  $('viewExam').style.display='';
  tickTimer();
  if (STATE.timerId) clearInterval(STATE.timerId);
  STATE.timerId=setInterval(tickTimer,1000);
  renderQuestion();
}

function remainingSec() {
  if (!STATE.startedAt) return STATE.durationSec;
  var elapsed=(new Date().getTime()-STATE.startedAt)/1000;
  return Math.max(0, STATE.durationSec - elapsed);
}
function tickTimer() {
  if (!STATE.startedAt || STATE.finished) return;
  var rem=remainingSec();
  var warn = rem < 300 ? ' style="color:var(--bad)"' : '';
  $('metaPill').innerHTML='<span'+warn+'>Time left: '+fmtTime(rem)+'</span> &bull; Q'+(STATE.idx+1)+'/'+STATE.questions.length;
  if (rem<=0) finishExam(true);
}

function toggleChoice(qid, idx) {
  var q=null;
  for (var i=0;i<STATE.questions.length;i++) if (STATE.questions[i].id===qid) q=STATE.questions[i];
  if (!q) return;
  if (STATE.revealed[qid]===true) return;
  STATE.answers[qid]=[idx];
  renderQuestion();
}

function toggleFlag() {
  var q=STATE.questions[STATE.idx];
  if (!q) return;
  STATE.flagged[q.id]=!STATE.flagged[q.id];
  renderQuestion();
}

function toggleNav() {
  STATE.showNav=!STATE.showNav;
  renderQuestion();
}

function jumpTo(idx) {
  STATE.idx=idx;
  renderQuestion();
}

function gradeQuestion(q) {
  var sel=(STATE.answers[q.id]||[]).slice().sort(function(a,b){return a-b;});
  var ans=(q.answer||[]).slice().sort(function(a,b){return a-b;});
  return setEq(sel, ans);
}

function gradeAll() {
  var correct=0, revealed=0, answered=0;
  var perDomain={};
  for (var i=0;i<STATE.questions.length;i++) {
    var q=STATE.questions[i];
    var sel=STATE.answers[q.id]||[];
    if (sel.length>0) answered++;
    if (STATE.revealed[q.id]===true) {
      revealed++;
      if (!perDomain[q.domain]) perDomain[q.domain]={total:0, correct:0};
      perDomain[q.domain].total++;
      if (gradeQuestion(q)) { correct++; perDomain[q.domain].correct++; }
    }
  }
  var total=STATE.questions.length;
  var denom=Math.max(1, revealed);
  var pct=Math.round((correct/denom)*100);
  return {correct:correct,revealed:revealed,answered:answered,total:total,pct:pct,perDomain:perDomain};
}

function revealAnswer() {
  var q=STATE.questions[STATE.idx];
  if (!q) return;
  STATE.revealed[q.id]=true;
  renderQuestion();
}

function prevQ() { if (STATE.idx>0) { STATE.idx--; renderQuestion(); } }
function nextQ() { if (STATE.idx<STATE.questions.length-1) { STATE.idx++; renderQuestion(); } }

function confirmExit() {
  var ok=confirm('Exit exam? Your progress in this attempt will be lost.');
  if (ok) renderPicker();
}

function renderQuestion() {
  var q=STATE.questions[STATE.idx];
  if (!q) return;
  var total=STATE.questions.length;
  var selected=STATE.answers[q.id]||[];
  var revealed=STATE.revealed[q.id]===true;
  var isFlagged=STATE.flagged[q.id]===true;

  var h='';
  h+='<div class="card">';
  h+='<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;">';
  h+='<div><div class="qnum">Question '+(STATE.idx+1)+' of '+total+'</div>';
  h+='<div class="domain">'+esc(q.domain)+' &bull; Select 1 answer</div></div>';
  h+='<div style="display:flex;gap:8px;">';
  h+='<button class="flag-btn'+(isFlagged?' flagged':'')+'" onclick="toggleFlag()" title="Flag for review">'+(isFlagged?'\u2691 Flagged':'\u2690 Flag')+'</button>';
  h+='<button class="linkbtn" onclick="confirmExit()">Exit</button>';
  h+='</div></div>';

  h+='<div class="progress"><div class="bar" style="width:'+Math.round((STATE.idx)/Math.max(1,total-1)*100)+'%"></div></div>';
  h+='<div class="stem">'+esc(q.stem)+'</div>';

  h+='<div class="choices">';
  for (var i=0;i<q.choices.length;i++) {
    var isSel=arrHas(selected,i);
    var disabled=revealed?'disabled':'';
    var checked=isSel?'checked':'';
    h+='<label class="choice">';
    h+='<input '+disabled+' '+checked+' type="radio" name="q_'+esc(q.id)+'" onclick="toggleChoice(\''+q.id+'\','+i+')" />';
    h+='<div><b>'+String.fromCharCode(65+i)+'.</b> '+esc(q.choices[i])+'</div>';
    h+='</label>';
  }
  h+='</div>';

  h+='<div class="btnrow">';
  h+='<button onclick="prevQ()" '+(STATE.idx===0?'disabled':'')+'>&#8592; Previous</button>';
  h+='<button onclick="nextQ()" '+(STATE.idx===total-1?'disabled':'')+'>Next &#8594;</button>';
  h+='<button class="primary" onclick="revealAnswer()">Reveal answer</button>';
  h+='<button onclick="toggleNav()">'+(STATE.showNav?'Hide':'Show')+' navigator</button>';
  h+='<button class="danger" onclick="finishExam(false)">Finish exam</button>';
  h+='</div>';

  if (STATE.showNav) {
    h+='<div style="margin-top:10px;"><div class="tiny" style="margin-bottom:4px;">Click a question number to jump. <span style="color:var(--itil);">\u25cf</span> = answered &nbsp; <span style="color:#b45309;">\u25cf</span> = flagged &nbsp; <span style="color:var(--good);">\u25cf</span> = revealed</div>';
    h+='<div class="nav-grid">';
    for (var n=0;n<total;n++) {
      var nq=STATE.questions[n];
      var cls='nav-cell';
      if (n===STATE.idx) cls+=' current';
      if ((STATE.answers[nq.id]||[]).length>0) cls+=' answered';
      if (STATE.flagged[nq.id]) cls+=' flagged-cell';
      if (STATE.revealed[nq.id]) cls+=' revealed-cell';
      h+='<div class="'+cls+'" onclick="jumpTo('+n+')">'+(n+1)+'</div>';
    }
    h+='</div></div>';
  }

  if (revealed) {
    var isCorrect=gradeQuestion(q);
    var sel=(STATE.answers[q.id]||[]);
    var selTxt = sel.length ? sel.map(function(x){return String.fromCharCode(65+x);}).join(', ') : '\u2014';
    var ansTxt = (q.answer||[]).map(function(x){return String.fromCharCode(65+x);}).join(', ');
    h+='<div class="reveal '+(isCorrect?'good':'bad')+'">';
    h+='<div style="font-weight:900;">'+(isCorrect?'\u2705 Correct!':'\u274c Incorrect.')+'</div>';
    h+='<div class="tiny">You chose: <b>'+esc(selTxt)+'</b> &bull; Correct answer: <b>'+esc(ansTxt)+'</b></div>';

    h+='<div class="sectionTitle">Why '+esc(ansTxt)+' is correct</div>';
    h+='<ul class="bullet">';
    for (var j=0;j<q.answer.length;j++) {
      var idx=q.answer[j];
      h+='<li><b>'+String.fromCharCode(65+idx)+'. '+esc(q.choices[idx])+'</b> &mdash; '+esc(q.explanations[idx]||'')+'</li>';
    }
    h+='</ul>';

    h+='<div class="sectionTitle">Why the others are wrong</div>';
    h+='<ul class="bullet">';
    for (var k=0;k<q.choices.length;k++) {
      if (arrHas(q.answer,k)) continue;
      h+='<li><b>'+String.fromCharCode(65+k)+'. '+esc(q.choices[k])+'</b> &mdash; '+esc(q.explanations[k]||'')+'</li>';
    }
    h+='</ul>';

    if (q.tip) h+='<div class="sectionTitle">Key concept to remember</div><div class="muted">'+esc(q.tip)+'</div>';
    h+='</div>';
  }

  h+='</div>';

  var g=gradeAll();
  h+='<div class="card">';
  h+='<div class="kpi">';
  h+='<div class="k"><b>Answered</b> '+g.answered+'/'+total+'</div>';
  h+='<div class="k"><b>Revealed</b> '+g.revealed+'/'+total+'</div>';
  h+='<div class="k"><b>Score</b> '+g.pct+'%</div>';
  h+='<div class="k"><b>Correct</b> '+g.correct+'/'+g.revealed+'</div>';
  h+='</div>';
  h+='<div class="tiny">Score is computed from revealed questions only. Use &ldquo;Finish exam&rdquo; to reveal all and get your final result.</div>';
  h+='</div>';

  $('viewExam').innerHTML=h;
}

function finishExam(auto) {
  if (STATE.finished) return;
  STATE.finished=true;
  if (STATE.timerId) clearInterval(STATE.timerId);

  // Reveal all on finish
  for (var i=0;i<STATE.questions.length;i++) STATE.revealed[STATE.questions[i].id]=true;

  var meta=getExamMeta(STATE.examCode);
  var g=gradeAll();
  var passMark=meta?meta.pass_mark:26;
  var pass=g.correct >= passMark;

  var h='';
  h+='<div class="card">';
  h+='<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;">';
  h+='<div><h2 style="margin:0 0 6px 0;">Results: '+esc(STATE.examName)+' &mdash; Practice Exam '+STATE.setIndex+'</h2>';
  h+='<div class="muted">'+(auto?'Time expired \u2014 auto-finished.':'Exam complete.')+'</div></div>';
  h+='<button class="linkbtn" onclick="renderPicker()">&larr; Back to exams</button>';
  h+='</div>';

  var pctScore=Math.round((g.correct/g.total)*100);
  h+='<div style="text-align:center;margin:20px 0;">';
  h+='<div style="font-size:48px;font-weight:900;color:'+(pass?'var(--good)':'var(--bad)')+';">'+pctScore+'%</div>';
  h+='<div style="font-size:24px;font-weight:900;" class="'+(pass?'pass':'fail')+'">'+(pass?'PASS':'FAIL')+'</div>';
  h+='<div class="tiny" style="margin-top:4px;">'+g.correct+' correct out of '+g.total+' &bull; Pass mark: '+passMark+'/'+g.total+' ('+meta.pass_percentage+'%)</div>';
  h+='</div>';

  h+='<div class="kpi" style="justify-content:center;">';
  h+='<div class="k"><b>Correct</b> '+g.correct+'</div>';
  h+='<div class="k"><b>Incorrect</b> '+(g.total-g.correct)+'</div>';
  h+='<div class="k"><b>Answered</b> '+g.answered+'/'+g.total+'</div>';
  h+='<div class="k"><b>Unanswered</b> '+(g.total-g.answered)+'</div>';
  h+='</div>';

  h+='<div class="hr"></div>';
  h+='<h3 style="margin:0 0 8px 0;">Domain breakdown</h3>';
  h+='<div class="grid">';
  for (var d in g.perDomain) {
    if (!g.perDomain.hasOwnProperty(d)) continue;
    var st=g.perDomain[d];
    var dpct=st.total?Math.round((st.correct/st.total)*100):0;
    var dpass=dpct>=65;
    h+='<div class="card"><h3 style="margin:0 0 6px 0;font-size:13px;">'+esc(d)+'</h3>';
    h+='<div class="kpi"><div class="k"><b>Correct</b> '+st.correct+'/'+st.total+'</div><div class="k"><b>Score</b> <span class="'+(dpass?'pass':'fail')+'">'+dpct+'%</span></div></div></div>';
  }
  h+='</div>';

  h+='<div class="hr"></div>';
  h+='<div class="btnrow">';
  h+='<button class="primary" onclick="reviewIncorrect()">Review incorrect answers</button>';
  h+='<button onclick="reviewFlagged()">Review flagged questions</button>';
  h+='<button onclick="restartSame()">Restart this exam</button>';
  h+='<button onclick="goHome()">Home</button>';
  h+='</div>';

  h+='<div class="hr"></div>';
  h+='<div class="tiny">Scoring: simple percentage (correct answers / total questions). Pass mark: 65% (26/40). No negative marking for unanswered or incorrect questions.\nThis simulator is for practice only and is not affiliated with PeopleCert, AXELOS, or any official certification body.</div>';
  h+='</div>';

  $('viewExam').innerHTML=h;
  $('metaPill').innerHTML='Finished &bull; '+esc(STATE.examCode)+' &bull; Practice Exam '+STATE.setIndex;
}

function reviewIncorrect() {
  for (var i=0;i<STATE.questions.length;i++) {
    var q=STATE.questions[i];
    if (STATE.revealed[q.id]===true && !gradeQuestion(q)) {
      STATE.finished=false;
      STATE.idx=i;
      renderQuestion();
      return;
    }
  }
  alert('No incorrect questions found. Well done!');
}

function reviewFlagged() {
  for (var i=0;i<STATE.questions.length;i++) {
    var q=STATE.questions[i];
    if (STATE.flagged[q.id]) {
      STATE.finished=false;
      STATE.idx=i;
      renderQuestion();
      return;
    }
  }
  alert('No flagged questions found.');
}

function restartSame() { startExam(STATE.setIndex); }

renderHome();
</script>
</body>
</html>
