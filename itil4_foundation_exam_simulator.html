<style>
  :root { --bg:#f4f1eb; --card:#ffffff; --muted:#6b7280; --text:#1e293b; --accent:#2563eb; --good:#059669; --bad:#dc2626; --itil:#7c3aed; --warm:#fdf8f0; --border:#e2ddd5; --hover:#ede9e1; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 18px; }
  .topbar { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .brand { font-weight:800; letter-spacing:0.2px; color:var(--itil); }
  .pill { display:inline-flex; gap:8px; align-items:center; padding:8px 12px; border-radius:999px; background:var(--warm); border:1px solid var(--border); color:var(--muted); font-size:12px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:12px; margin-top:14px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04); }
  .muted { color:var(--muted); white-space:pre-wrap; }
  .tiny { font-size:12px; color:var(--muted); }
  .btnrow { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  button { cursor:pointer; border:1px solid var(--border); background:var(--warm); color:var(--text); padding:10px 14px; border-radius:12px; font-weight:700; transition:all 0.15s; }
  button:hover:not(:disabled) { background:var(--hover); box-shadow:0 1px 4px rgba(0,0,0,0.08); }
  button.primary { background:var(--itil); border-color:var(--itil); color:#fff; }
  button.primary:hover:not(:disabled) { background:#6d28d9; }
  button.danger { background:#fef2f2; border-color:#fca5a5; color:var(--bad); }
  button.danger:hover:not(:disabled) { background:#fee2e2; }
  button:disabled { opacity:0.45; cursor:not-allowed; }
  .linkbtn { border:none; background:none; color:var(--itil); padding:0; font-weight:800; }
  .linkbtn:hover { color:#6d28d9; }
  .qnum { font-weight:900; color:var(--itil); }
  .domain { font-size:12px; color:var(--accent); margin-top:4px; font-weight:600; }
  .stem { margin:10px 0 12px 0; line-height:1.45; white-space:pre-wrap; }
  .choices { display:flex; flex-direction:column; gap:6px; }
  .choice { display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border:1px solid var(--border); border-radius:12px; cursor:pointer; background:var(--card); transition:all 0.15s; }
  .choice:hover { background:#f0ecfe; border-color:#c4b5fd; }
  .choice input { margin-top:3px; accent-color:var(--itil); }
  .progress { height:5px; border-radius:999px; background:var(--border); margin:10px 0; }
  .bar { height:100%; border-radius:999px; background:linear-gradient(90deg, var(--itil), #a78bfa); transition:width 0.3s; }
  .reveal { margin-top:14px; padding:12px; border-radius:12px; }
  .reveal.good { background:#ecfdf5; border:1px solid #a7f3d0; }
  .reveal.bad { background:#fef2f2; border:1px solid #fecaca; }
  .sectionTitle { font-weight:800; margin:10px 0 4px 0; font-size:13px; color:var(--itil); }
  .bullet { margin:0 0 0 18px; padding:0; line-height:1.45; }
  .bullet li { margin-bottom:6px; }
  .kpi { display:flex; gap:14px; flex-wrap:wrap; margin:8px 0; }
  .k { font-size:13px; }
  .k b { color:var(--itil); }
  .hr { border-top:1px solid var(--border); margin:12px 0; }
  .pass { color:var(--good); font-weight:900; }
  .fail { color:var(--bad); font-weight:900; }
  .footer { text-align:center; margin-top:18px; font-size:11px; color:#9ca3af; }
  .flag-btn { background:#fffbeb; border-color:#fcd34d; color:#b45309; }
  .flag-btn:hover { background:#fef3c7; }
  .flag-btn.flagged { background:#fef3c7; border-color:#f59e0b; box-shadow:0 0 0 2px rgba(245,158,11,0.2); }
  .nav-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap:4px; margin:8px 0; }
  .nav-cell { text-align:center; padding:6px 2px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:700; border:1px solid var(--border); background:var(--card); transition:all 0.15s; }
  .nav-cell:hover { background:var(--hover); }
  .nav-cell.current { border-color:var(--itil); background:#f0ecfe; color:var(--itil); }
  .nav-cell.answered { background:#f5f3ff; border-color:#c4b5fd; }
  .nav-cell.flagged-cell { border-color:#f59e0b; background:#fffbeb; }

<script>
var BANK = {"meta": {"generated_utc": "2026-02-25T00:00:00Z", "note": "Original practice questions aligned to the ITIL 4 Foundation syllabus. Not official PeopleCert/AXELOS exam questions; no copyrighted exam items included."}, "exams": [{"code": "ITIL4F", "name": "ITIL 4 Foundation", "pass_mark": 26, "total_questions": 40, "pass_percentage": 65, "time_minutes": 60, "domains": [{"name": "Key Concepts of Service Management", "weight": 4}, {"name": "The Seven Guiding Principles", "weight": 4}, {"name": "The Four Dimensions of Service Management", "weight": 2}, {"name": "The ITIL Service Value System", "weight": 3}, {"name": "The Service Value Chain", "weight": 2}, {"name": "ITIL Practices (Detailed)", "weight": 17}, {"name": "ITIL Practices (Recall)", "weight": 8}]}], "practice_sets": {"ITIL4F": [{"set": 1, "title": "Practice Exam 1", "questions": [{"id": "ITIL4F-E01-001", "domain": "Key Concepts of Service Management", "type": "single", "stem": "A company provides cloud-based accounting software to small businesses. Which of the following BEST describes the term 'service' in the context of ITIL 4?", "choices": ["A means of enabling value co-creation by facilitating outcomes that customers want to achieve, without the customer having to manage specific costs and risks", "A set of specialized organizational capabilities for enabling value for customers in the form of services", "A tangible deliverable produced by carrying out an activity", "The perceived benefits, usefulness, and importance of something"], "answer": [0], "explanations": ["Correct. ITIL 4 defines a service as a means of enabling value co-creation by facilitating outcomes that customers want to achieve, without the customer having to manage specific costs and risks. The cloud accounting software allows customers to manage their finances without worrying about hosting, security patches, or infrastructure.", "Incorrect. This describes 'service management', not 'service'. Service management is the set of organizational capabilities, whereas a service is what is delivered to facilitate value.", "Incorrect. This describes an 'output', which is a tangible or intangible deliverable of an activity. An output is not the same as a service; outputs contribute to outcomes but are not services themselves.", "Incorrect. This describes 'value'. Value is the perceived benefits, usefulness, and importance of something, which is what the service helps co-create, but it is not the definition of a service."], "tip": "Remember the key phrase in the ITIL 4 service definition: 'facilitating outcomes... without the customer having to manage specific costs and risks.' This distinguishes a service from other concepts."}, {"id": "ITIL4F-E01-002", "domain": "Key Concepts of Service Management", "type": "single", "stem": "An IT department implements a new employee onboarding portal. Employees can now complete all HR paperwork online in 30 minutes instead of spending two days on manual forms. The HR director states that the new portal has significantly improved their onboarding efficiency. Which concept BEST describes the relationship between the IT department and the HR department in this scenario?", "choices": ["The IT department and HR department are co-creating value through their service relationship", "The IT department is delivering utility to the HR department as a consumer", "The IT department is the service provider delivering outputs to the HR department", "The HR department is the sole creator of value since they define the requirements"], "answer": [0], "explanations": ["Correct. ITIL 4 emphasizes that value is co-created through an active collaboration between service providers and consumers. The IT department built the portal (provider), but the HR department defined requirements, provided feedback, and adopted the portal (consumer). Both parties contributed to the value realized.", "Incorrect. While utility is a component of value, this answer oversimplifies the relationship. ITIL 4 emphasizes that value is co-created, not simply delivered by one party to another.", "Incorrect. While the IT department is a service provider, value is not created simply by delivering outputs. Value is co-created through the active participation of both parties in the service relationship.", "Incorrect. ITIL 4 moved away from the idea that value is created by one party alone. Value is always co-created through the interaction between the service provider and the service consumer."], "tip": "ITIL 4 fundamentally shifted from the concept of 'delivering value' to 'co-creating value'. Both the provider and consumer play active roles in creating value through their service relationship."}, {"id": "ITIL4F-E01-003", "domain": "Key Concepts of Service Management", "type": "single", "stem": "A managed hosting provider guarantees 99.95% uptime and ensures all data is encrypted at rest and in transit. Which aspect of a service does this guarantee PRIMARILY represent?", "choices": ["Warranty, because it describes how the service performs in terms of availability and security", "Utility, because it describes what the service does", "An outcome, because it describes the result enabled by the service", "An output, because it describes a tangible deliverable of the service"], "answer": [0], "explanations": ["Correct. Warranty is the assurance that a product or service will meet agreed requirements, often described as 'fitness for use'. It typically addresses availability, capacity, continuity, and security. The 99.95% uptime guarantee addresses availability, and encryption addresses security — both are warranty characteristics.", "Incorrect. Utility is the functionality offered by a product or service to meet a particular need — it is about 'what the service does' or 'fitness for purpose'. Uptime guarantees and encryption relate to assurance of performance, not functionality.", "Incorrect. An outcome is a result for a stakeholder enabled by one or more outputs. The uptime and encryption guarantees are not outcomes themselves; they are assurances about service performance that help enable desired outcomes.", "Incorrect. An output is a tangible or intangible deliverable of an activity. Uptime guarantees and encryption are service level commitments, not deliverables."], "tip": "Think of utility as 'fitness for purpose' (what the service does) and warranty as 'fitness for use' (how well it does it). Warranty covers availability, capacity, continuity, and security."}, {"id": "ITIL4F-E01-004", "domain": "Key Concepts of Service Management", "type": "single", "stem": "A software development team delivers a new reporting module that generates 15 standard financial reports. The finance team uses these reports to make faster quarter-end closing decisions, reducing their closing cycle from 10 days to 4 days. In this scenario, what are the 'outputs' and 'outcomes' respectively?", "choices": ["The outputs are the 15 financial reports; the outcomes are the reduced closing cycle and faster decisions", "The outputs are the faster closing decisions; the outcomes are the 15 financial reports", "The outputs are the reduced closing cycle; the outcomes are the reports generated by the module", "The outputs and outcomes are the same — both refer to the financial reports"], "answer": [0], "explanations": ["Correct. Outputs are the tangible or intangible deliverables of an activity — in this case, the 15 financial reports. Outcomes are the results for a stakeholder enabled by one or more outputs — in this case, the reduction from 10 to 4 days and faster quarter-end decisions. The reports (outputs) enable the improved closing cycle (outcome).", "Incorrect. This reverses the definitions. Outputs are the tangible deliverables (reports), while outcomes are the results enabled for stakeholders (faster decisions, reduced cycle time).", "Incorrect. This reverses the concepts. The reduced closing cycle is the outcome (result for the stakeholder), not an output. The reports are the outputs (deliverables).", "Incorrect. ITIL 4 clearly distinguishes between outputs and outcomes. Outputs are deliverables; outcomes are the results those deliverables help achieve. They are different concepts."], "tip": "Outputs are deliverables (things produced); outcomes are results (what stakeholders achieve because of those deliverables). Always ask: 'What was produced?' (output) vs 'What was achieved?' (outcome)."}, {"id": "ITIL4F-E01-005", "domain": "The Seven Guiding Principles", "type": "single", "stem": "A hospital IT team is redesigning its patient record system. During requirements gathering, they focus exclusively on the technical capabilities requested by the IT architects, without consulting doctors, nurses, or patients. Which guiding principle are they MOST likely failing to apply?", "choices": ["Focus on value", "Keep it simple and practical", "Start where you are", "Optimize and automate"], "answer": [0], "explanations": ["Correct. The 'Focus on value' principle states that everything an organization does should map to value for the stakeholders. By ignoring doctors, nurses, and patients (the actual service consumers), the IT team is failing to understand who the consumer is and what they value. This is a direct violation of the 'Focus on value' principle.", "Incorrect. 'Keep it simple and practical' recommends using the minimum number of steps to accomplish an objective. The scenario does not describe unnecessary complexity; it describes ignoring stakeholder needs.", "Incorrect. 'Start where you are' recommends assessing the current state before making changes. While the team may also be ignoring the current state, the primary failure here is not considering who the service consumers are and what they value.", "Incorrect. 'Optimize and automate' recommends optimizing work before automating it. The scenario is about stakeholder engagement, not about optimization or automation."], "tip": "'Focus on value' requires knowing who the service consumer is and understanding their perspective on value. Always identify all stakeholders and understand what value means to each of them."}, {"id": "ITIL4F-E01-006", "domain": "The Seven Guiding Principles", "type": "single", "stem": "A company is planning to replace its legacy IT service management tool. The project manager proposes a complete greenfield implementation, discarding all existing processes, data, and configurations. An experienced consultant advises against this approach. Which guiding principle BEST supports the consultant's advice?", "choices": ["Start where you are", "Progress iteratively with feedback", "Collaborate and promote visibility", "Think and work holistically"], "answer": [0], "explanations": ["Correct. 'Start where you are' recommends assessing the current state and deciding what can be reused. Discarding all existing processes, data, and configurations ignores valuable assets that already exist. The principle states that there is usually something in the current state that can be leveraged.", "Incorrect. While iterative progress is valuable, the consultant's primary concern is about discarding existing assets. 'Progress iteratively with feedback' focuses on working in manageable increments, not on preserving current state.", "Incorrect. 'Collaborate and promote visibility' emphasizes working together and making work visible. While collaboration may be lacking, the core issue is ignoring the current state, not a lack of collaboration.", "Incorrect. 'Think and work holistically' emphasizes considering the whole system. While this is generally good advice, the specific issue is about discarding existing assets, which is directly addressed by 'Start where you are'."], "tip": "'Start where you are' does not mean the current state is perfect — it means you should assess it objectively before deciding what to keep, change, or discard. Never assume you need to start from scratch."}, {"id": "ITIL4F-E01-007", "domain": "The Seven Guiding Principles", "type": "single", "stem": "An organization is undertaking a major digital transformation programme. The CIO decides to implement changes in small increments, gathering user feedback after each release and adjusting plans accordingly. Which guiding principle is the CIO applying?", "choices": ["Focus on value", "Collaborate and promote visibility", "Keep it simple and practical", "Progress iteratively with feedback"], "answer": [3], "explanations": ["Incorrect. 'Focus on value' is about ensuring everything maps to stakeholder value. While the CIO's approach may ultimately deliver better value, the described behavior — small increments with feedback loops — is the hallmark of a different principle.", "Incorrect. 'Collaborate and promote visibility' emphasizes involving the right people and making work visible. While gathering feedback involves collaboration, the primary principle being demonstrated is working iteratively.", "Incorrect. 'Keep it simple and practical' recommends using the minimum steps to achieve an objective. The scenario describes an incremental approach with feedback, not simplification.", "Correct. 'Progress iteratively with feedback' recommends breaking work into smaller, manageable pieces that can be executed and refined through feedback. The CIO is implementing changes in small increments, gathering feedback after each release, and adjusting plans — this is a textbook application of this principle."], "tip": "The key elements of 'Progress iteratively with feedback' are: (1) break work into manageable pieces, (2) execute each piece, (3) gather feedback, and (4) use that feedback to adjust future iterations."}, {"id": "ITIL4F-E01-008", "domain": "The Seven Guiding Principles", "type": "single", "stem": "During a service improvement initiative, the project team works in isolation, making decisions without informing other departments or stakeholders. They plan to reveal the improvements only after full implementation. Which guiding principle is being NEGLECTED?", "choices": ["Collaborate and promote visibility", "Optimize and automate", "Think and work holistically", "Start where you are"], "answer": [0], "explanations": ["Correct. 'Collaborate and promote visibility' states that involving the right people in the correct roles and making work visible leads to better outcomes. Working in isolation and planning a big reveal contradicts this principle. Stakeholders need visibility into progress and opportunities to provide input throughout the initiative.", "Incorrect. 'Optimize and automate' is about optimizing processes and then automating where possible. The scenario does not describe issues related to optimization or automation.", "Incorrect. 'Think and work holistically' is about understanding the end-to-end system. While working in isolation may lead to a narrow view, the primary issue in this scenario is the lack of stakeholder involvement and transparency.", "Incorrect. 'Start where you are' is about assessing the current state before making changes. The primary issue described is the lack of collaboration and transparency, not failure to assess the current state."], "tip": "'Collaborate and promote visibility' has two parts: (1) involve the right stakeholders and collaborate with them, and (2) make work and progress visible. Hidden work creates risk and misalignment."}, {"id": "ITIL4F-E01-009", "domain": "The Four Dimensions of Service Management", "type": "single", "stem": "A financial services company is implementing a new trading platform. The project team identifies that they need traders with specialized skills, a clearly defined organizational structure for the trading desk, and a culture that supports rapid decision-making. Which dimension of service management does this PRIMARILY relate to?", "choices": ["Information and technology", "Partners and suppliers", "Value streams and processes", "Organizations and people"], "answer": [3], "explanations": ["Incorrect. 'Information and technology' covers the information and knowledge necessary for service management, as well as the technologies required. While the trading platform itself is technology, the scenario focuses on skills, organizational structure, and culture.", "Incorrect. 'Partners and suppliers' covers the relationships with other organizations involved in service delivery. The scenario does not mention external partners or suppliers.", "Incorrect. 'Value streams and processes' covers the activities and workflows used to create and deliver services. The scenario describes people-related factors, not workflows or processes.", "Correct. The 'Organizations and people' dimension covers organizational structures, roles, staffing, competencies, skills, and culture. The scenario specifically mentions specialized skills, organizational structure, and decision-making culture — all key aspects of this dimension."], "tip": "The 'Organizations and people' dimension encompasses: formal organizational structures, roles and responsibilities, staffing and competencies, management and leadership styles, communication, and organizational culture."}, {"id": "ITIL4F-E01-010", "domain": "The Four Dimensions of Service Management", "type": "single", "stem": "An organization is evaluating whether to store customer data in the cloud or on-premises. They are considering data protection regulations, the technologies available for encryption, and how data will flow between systems. Which dimension of service management is MOST relevant to this evaluation?", "choices": ["Organizations and people", "Information and technology", "Value streams and processes", "Partners and suppliers"], "answer": [1], "explanations": ["Incorrect. 'Organizations and people' focuses on roles, skills, and organizational structure. The scenario is about data storage, regulations, encryption technology, and data flows — not organizational structure or people.", "Correct. The 'Information and technology' dimension includes the information and knowledge used to deliver services, the technologies supporting service management, and factors such as data regulations, compliance requirements, and data management. The scenario directly addresses data storage decisions, encryption technology, regulatory compliance, and data flows.", "Incorrect. 'Value streams and processes' covers activities, workflows, and how value is created and delivered. While data flow touches on processes, the primary concern in this scenario is about information management and technology choices.", "Incorrect. 'Partners and suppliers' covers relationships with external organizations. While a cloud provider could be considered a partner, the evaluation described focuses on data and technology decisions, not supplier relationships."], "tip": "The 'Information and technology' dimension includes: information management, data exchange, regulatory compliance, technologies for service delivery, workflow management tools, knowledge bases, and communication systems."}, {"id": "ITIL4F-E01-011", "domain": "The ITIL Service Value System", "type": "single", "stem": "Which of the following CORRECTLY lists all the components of the ITIL Service Value System (SVS)?", "choices": ["Guiding principles, governance, service value chain, practices, and continual improvement", "Guiding principles, governance, service value chain, processes, and functions", "Service strategy, service design, service transition, service operation, and continual improvement", "Demand, value, guiding principles, governance, and service value chain"], "answer": [0], "explanations": ["Correct. The ITIL SVS consists of five components: (1) guiding principles, (2) governance, (3) the service value chain, (4) practices, and (5) continual improvement. Together, these components ensure the organization can consistently co-create value through services.", "Incorrect. The SVS does not include 'processes' and 'functions' as separate components. ITIL 4 replaced the ITIL v3 concepts of processes and functions with 'practices', which provide a more holistic view.", "Incorrect. This describes the ITIL v3 service lifecycle stages (strategy, design, transition, operation, continual improvement), not the ITIL 4 SVS components. ITIL 4 moved away from the lifecycle approach.", "Incorrect. While demand is an input to the SVS and value is the output, they are not components of the SVS itself. The five components are guiding principles, governance, service value chain, practices, and continual improvement."], "tip": "Remember the five SVS components: Guiding principles, Governance, Service Value Chain, Practices, and Continual Improvement. The SVS takes 'opportunity/demand' as input and produces 'value' as output."}, {"id": "ITIL4F-E01-012", "domain": "The ITIL Service Value System", "type": "single", "stem": "In a large enterprise, the board of directors establishes policies that guide IT decision-making, evaluates organizational performance through regular reviews, and directs management to ensure compliance with regulations. Which component of the ITIL Service Value System does this BEST describe?", "choices": ["Continual improvement", "The service value chain", "Practices", "Governance"], "answer": [3], "explanations": ["Incorrect. Continual improvement is about identifying and implementing improvements across all levels of the organization. The scenario describes oversight and control activities, not improvement activities.", "Incorrect. The service value chain is a set of interconnected activities that an organization performs to deliver a valuable product or service. The scenario describes board-level direction and oversight, not operational activities.", "Incorrect. Practices are sets of organizational resources designed for performing work. The scenario describes strategic governance activities, not the execution of specific practices.", "Correct. Governance in the SVS is the means by which an organization is directed and controlled. It involves three main activities: evaluate, direct, and monitor. The board evaluates performance, directs management, and ensures compliance — these are the classic governance activities described in ITIL 4."], "tip": "Governance involves three key activities: Evaluate (assess the current state), Direct (set policies and direction), and Monitor (ensure compliance and performance). It is typically carried out by a governing body such as a board of directors."}, {"id": "ITIL4F-E01-013", "domain": "The ITIL Service Value System", "type": "single", "stem": "An organization notices that its SVS components are operating in silos — the guiding principles are documented but not applied, improvement activities happen ad hoc, and practices are not connected to the service value chain. What is the MOST significant risk of this situation?", "choices": ["The organization may have too many guiding principles to follow", "The organization will be unable to consistently co-create value with stakeholders", "The practices will automatically stop functioning without the service value chain", "The governance component will override all other SVS components"], "answer": [1], "explanations": ["Incorrect. The number of guiding principles is fixed at seven in ITIL 4. The problem described is not about having too many principles but about them not being applied effectively.", "Correct. The purpose of the SVS is to ensure that the organization continually co-creates value with all stakeholders through the use and management of products and services. When the SVS components operate in silos rather than working together, the organization cannot consistently achieve this purpose, leading to fragmented and unreliable value creation.", "Incorrect. Practices can still function independently, but they will not be as effective or aligned when disconnected from the service value chain. They do not 'automatically stop' — they simply operate sub-optimally.", "Incorrect. Governance does not automatically override other components. The issue described is about silos and disconnection between components, not about one component dominating others."], "tip": "The SVS is designed as an interconnected system — all five components must work together. Silos and disconnection between components undermine the SVS's core purpose: consistent value co-creation."}, {"id": "ITIL4F-E01-014", "domain": "The Service Value Chain", "type": "single", "stem": "An IT organization regularly conducts portfolio reviews to understand the current and future demand for services, allocates resources across teams, and develops strategic and tactical plans for service delivery. Which service value chain activity does this BEST describe?", "choices": ["Engage", "Design and transition", "Deliver and support", "Plan"], "answer": [3], "explanations": ["Incorrect. 'Engage' focuses on understanding stakeholder needs, maintaining good relationships, and ensuring continual engagement. While understanding demand could be part of engagement, portfolio reviews and resource allocation are planning activities.", "Incorrect. 'Design and transition' ensures that products and services continually meet stakeholder expectations for quality, cost, and time-to-market. The scenario describes strategic planning, not design or transition work.", "Incorrect. 'Deliver and support' ensures that services are delivered and supported according to agreed specifications and stakeholder expectations. The scenario describes planning activities, not operational delivery.", "Correct. The 'Plan' activity ensures a shared understanding of the vision, current status, and improvement direction for all four dimensions and all products and services. Portfolio reviews, resource allocation, and developing strategic and tactical plans are all key activities within the Plan value chain activity."], "tip": "The Plan activity creates plans for the portfolio, architectures, policies, and improvements. It ensures alignment across the organization and its four dimensions."}, {"id": "ITIL4F-E01-015", "domain": "The Service Value Chain", "type": "single", "stem": "A service provider holds regular meetings with its key customers to understand their evolving business needs, manages service request intake, and communicates service updates. Which service value chain activity is PRIMARILY being performed?", "choices": ["Engage", "Improve", "Plan", "Obtain/build"], "answer": [0], "explanations": ["Correct. The 'Engage' activity provides a good understanding of stakeholder needs, transparency, and continual engagement and good relationships with all stakeholders. Meeting with customers to understand evolving needs, managing service request intake, and communicating service updates are all typical Engage activities.", "Incorrect. 'Improve' focuses on ensuring continual improvement of products, services, and practices. The scenario describes customer interaction activities, not improvement initiatives.", "Incorrect. 'Plan' focuses on strategic and tactical planning across the organization. Regular customer meetings to understand needs and managing service request intake are engagement activities, not planning activities.", "Incorrect. 'Obtain/build' ensures that service components are available when needed and meet agreed specifications. The scenario describes customer-facing engagement, not building or obtaining service components."], "tip": "The Engage activity is the primary interface with external stakeholders. Key outputs include prioritized service requests, stakeholder requirements, and service performance reports for customers."}, {"id": "ITIL4F-E01-016", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "An organization uses a structured approach to improvement where they first identify the vision, then assess the current state, define measurable targets, create an action plan, execute the plan, and evaluate whether the targets were met. Which practice does this approach MOST closely align with?", "choices": ["Continual improvement", "Problem management", "Change enablement", "Service level management"], "answer": [0], "explanations": ["Correct. The scenario describes the continual improvement model, which includes the steps: What is the vision? Where are we now? Where do we want to be? How do we get there? Take action. Did we get there? How do we keep the momentum going? This is the core approach of the continual improvement practice.", "Incorrect. Problem management focuses on reducing the likelihood and impact of incidents by identifying actual and potential causes. The scenario describes a general improvement approach, not problem investigation.", "Incorrect. Change enablement focuses on managing changes to maximize success and minimize risk. The structured improvement approach described is not about managing changes but about driving organizational improvement.", "Incorrect. Service level management focuses on setting clear business-based targets for service levels and ensuring delivery is assessed against these targets. The scenario describes a broader improvement model, not specifically service level management."], "tip": "The continual improvement model has seven steps: (1) What is the vision? (2) Where are we now? (3) Where do we want to be? (4) How do we get there? (5) Take action (6) Did we get there? (7) How do we keep the momentum going?"}, {"id": "ITIL4F-E01-017", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "A team maintains a list of improvement ideas captured from various sources including service reviews, incident analysis, and employee suggestions. The ideas are prioritized, and progress is tracked regularly. What is this list known as in ITIL 4?", "choices": ["A change schedule", "A known error database", "A service catalogue", "A continual improvement register"], "answer": [3], "explanations": ["Incorrect. A change schedule is used to plan changes and help avoid conflicts. It records planned and historical changes, not improvement ideas.", "Incorrect. A known error database contains records of known errors and their workarounds. It is part of problem management, not continual improvement.", "Incorrect. A service catalogue is a structured collection of available services. It is not used to track improvement ideas.", "Correct. The continual improvement register (CIR) is a database or structured document used to track and manage improvement ideas from identification through to final action. It captures improvement ideas from many sources, allows prioritization, and tracks the progress of each improvement initiative."], "tip": "The continual improvement register (CIR) can exist at many levels — team, department, or organization-wide. Every level of the organization should maintain a CIR to capture and manage improvement opportunities."}, {"id": "ITIL4F-E01-018", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "Who, according to ITIL 4, should be responsible for driving continual improvement across the organization?", "choices": ["Only the continual improvement team", "Only senior management", "Only the service desk, as they receive the most feedback", "Everyone in the organization, though some people may have specific CI roles"], "answer": [3], "explanations": ["Incorrect. While some organizations may have a dedicated continual improvement team, ITIL 4 states that continual improvement is everyone's responsibility. Limiting it to a single team creates silos and misses improvement opportunities.", "Incorrect. Senior management plays an important role in sponsoring and prioritizing improvements, but ITIL 4 states that improvement should be embedded at every level of the organization, not restricted to management.", "Incorrect. The service desk receives user feedback that can drive improvements, but limiting improvement responsibility to the service desk ignores the contributions of all other teams and individuals in the organization.", "Correct. ITIL 4 states that continual improvement is everyone's responsibility, although some individuals may have specific roles dedicated to improvement. This includes leadership, managers, and all employees who should be encouraged to identify and suggest improvements in their daily work."], "tip": "Continual improvement is a shared responsibility. ITIL 4 encourages embedding an improvement culture across the entire organization, supported by specific roles and a structured approach."}, {"id": "ITIL4F-E01-019", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "An organization classifies its changes into three types. A routine server patch that follows a pre-approved, documented procedure and does not require additional authorization each time is BEST described as which type of change?", "choices": ["Emergency change", "Standard change", "Normal change", "Operational change"], "answer": [1], "explanations": ["Incorrect. An emergency change must be implemented as soon as possible, typically to resolve an incident or security patch. The scenario describes a routine, pre-approved change, not an urgent one.", "Correct. A standard change is a low-risk, pre-authorized change that follows a well-understood and documented procedure. It does not require additional authorization each time because the risks and implementation steps are already assessed and approved. A routine server patch following a documented procedure is a classic example.", "Incorrect. A normal change is one that must go through the full change management process, including assessment, authorization, and scheduling. The scenario describes a pre-approved change that does not need additional authorization.", "Incorrect. 'Operational change' is not one of the three change types defined in ITIL 4. The three types are standard, normal, and emergency."], "tip": "ITIL 4 defines three types of changes: Standard (pre-authorized, low-risk, documented), Normal (requires assessment and authorization through the change process), and Emergency (must be implemented ASAP, often with expedited authorization)."}, {"id": "ITIL4F-E01-020", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "During a change advisory board (CAB) meeting, the members discuss a proposed change to the core banking system. They assess risk, evaluate the schedule, and authorize the change for implementation next weekend. What role does the CAB serve in this scenario?", "choices": ["The CAB acts as the problem management team investigating root causes", "The CAB serves as the change authority for this change", "The CAB is responsible for implementing the change", "The CAB is the service desk escalation point for this change"], "answer": [1], "explanations": ["Incorrect. Problem management investigates root causes and develops workarounds. The CAB is assessing and authorizing a change, which is a change enablement activity, not problem management.", "Correct. In ITIL 4, a change authority is a person or group who authorizes a change. The CAB is a common example of a change authority for significant changes. By assessing risk, evaluating the schedule, and authorizing the change, the CAB is fulfilling the change authority role.", "Incorrect. The CAB assesses, evaluates, and authorizes changes but does not typically implement them. Implementation is carried out by the technical teams responsible for the affected systems.", "Incorrect. The service desk is the single point of contact for users and handles incidents and service requests. The CAB is specifically part of change enablement, not service desk operations."], "tip": "The change authority varies based on the type and risk of the change. It could be a single person for low-risk changes or a CAB for higher-risk changes. The key role is to assess and authorize — not implement."}, {"id": "ITIL4F-E01-021", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "A user calls the service desk to report that their email client is not syncing new messages. The service desk agent records the user's details, the symptoms described, and the time the issue started. What incident management activity is being performed?", "choices": ["Incident categorization", "Incident diagnosis", "Incident escalation", "Incident logging"], "answer": [3], "explanations": ["Incorrect. Incident categorization involves assigning a category to the incident (e.g., email, network, hardware). While this may happen simultaneously, the specific activity described — recording user details, symptoms, and time — is incident logging.", "Incorrect. Incident diagnosis involves investigating the cause of the incident. The agent is recording initial information, not yet investigating the cause.", "Incorrect. Incident escalation involves transferring an incident to a higher-level support team when the current team cannot resolve it. The agent is still recording initial details, not escalating.", "Correct. Incident logging is the activity of recording the details of an incident when it is first reported. This includes capturing user details, symptom description, time of occurrence, and other relevant information. All incidents should be logged, regardless of how they are reported."], "tip": "All incidents must be logged, regardless of how they are detected or reported. Good incident logging captures: who reported it, what happened, when it started, what is affected, and any initial symptoms."}, {"id": "ITIL4F-E01-022", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "An incident affecting the payroll system is reported on the day before payday, potentially preventing 5,000 employees from being paid on time. The incident management team assigns this the highest priority. What factor MOST justifies the priority assigned?", "choices": ["The incident was reported by a senior executive", "The payroll system is classified as a legacy application", "The incident is technically complex and requires specialist skills", "The business impact is extremely high due to the number of affected users and the time sensitivity"], "answer": [3], "explanations": ["Incorrect. While an executive report may draw attention, incident priority should be determined by business impact and urgency, not by who reported it. Priority must be objective and based on agreed criteria.", "Incorrect. Whether a system is legacy or modern does not determine incident priority. Priority is based on the impact and urgency of the incident, not the age or classification of the technology.", "Incorrect. Technical complexity affects how the incident is resolved, not its priority. Priority is based on business impact and urgency, not on the difficulty of resolution.", "Correct. Incident priority is typically determined by assessing both impact (how many users/services are affected and how severely) and urgency (how quickly a resolution is needed). With 5,000 employees potentially missing their pay and the deadline being the next day, both impact and urgency are extremely high, justifying the highest priority."], "tip": "Incident priority = impact + urgency. Impact measures the breadth and severity of the effect on the business. Urgency measures how quickly a resolution is required. Together they determine the priority and response SLA."}, {"id": "ITIL4F-E01-023", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "A critical application failure affects all users across multiple offices. The incident manager activates a separate procedure that involves executive communication, dedicated resolution teams, and post-incident review. What type of incident is this?", "choices": ["A recurring incident", "A security incident", "A known error", "A major incident"], "answer": [3], "explanations": ["Incorrect. A recurring incident is one that happens repeatedly and may indicate a problem. While this incident may or may not be recurring, the key characteristic described is its scale and the activation of special procedures.", "Incorrect. A security incident specifically involves a breach or threat to information security. The scenario describes an application failure, not a security breach. The special procedures described are for major incidents, not specifically security incidents.", "Incorrect. A known error is a problem that has been analyzed and has a documented workaround. It is part of problem management, not incident management. The scenario describes an active incident, not a known error.", "Correct. A major incident is one with significant business impact that requires an immediate, coordinated response. ITIL 4 states that major incidents typically have separate procedures including dedicated teams, executive communication, and post-incident reviews — exactly as described in the scenario."], "tip": "Major incidents require separate procedures with faster timelines, executive communication, dedicated resolution teams, and a post-incident review. Organizations should pre-define criteria for what constitutes a major incident."}, {"id": "ITIL4F-E01-024", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "After analyzing trends in incident data, the problem management team notices that a particular database server experiences performance degradation every Monday morning. They begin investigating the underlying cause. What problem management activity is this an example of?", "choices": ["Error control", "Known error documentation", "Workaround implementation", "Problem identification"], "answer": [3], "explanations": ["Incorrect. Error control is the activity of managing known errors by identifying permanent solutions or workarounds. The team is still investigating the underlying cause, meaning they have not yet identified a known error.", "Incorrect. Known error documentation occurs after the root cause has been identified and a workaround or resolution path is documented. The team is at an earlier stage — they are still investigating.", "Incorrect. Workaround implementation occurs after a workaround has been identified for a known error. The team has not yet identified the cause, so they cannot have developed a workaround.", "Correct. Problem identification involves detecting and logging problems. One common approach is trend analysis of incident data, which is exactly what the team is doing. They noticed a recurring pattern (database performance degradation every Monday morning) and are now investigating the underlying cause — this is problem identification."], "tip": "Problem identification can come from many sources: incident trend analysis, analysis of information from other practices, automated detection, or information from suppliers and partners."}, {"id": "ITIL4F-E01-025", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "A problem has been investigated, and the root cause has been identified. The team has also documented a temporary workaround that reduces the impact on users while a permanent fix is developed. What should this problem now be recorded as?", "choices": ["An incident", "A change request", "A known error", "A service request"], "answer": [2], "explanations": ["Incorrect. An incident is an unplanned interruption or reduction in quality of a service. The scenario describes a problem that has been analyzed — it should not be reclassified as an incident.", "Incorrect. A change request may be needed to implement the permanent fix, but the problem itself is not a change request. The problem should be classified as a known error because the root cause and workaround are documented.", "Correct. A known error is a problem that has been analyzed and has not yet been resolved. When the root cause of a problem is identified, and a workaround has been documented, the problem becomes a known error. Known errors are tracked in the known error database.", "Incorrect. A service request is a request from a user for something agreed as part of normal service delivery. The scenario describes a problem with an identified root cause, not a user request."], "tip": "The progression is: Incident (symptoms observed) → Problem (underlying cause investigated) → Known Error (root cause identified, workaround documented) → Change (permanent fix implemented). A known error may have a workaround but awaits a permanent resolution."}, {"id": "ITIL4F-E01-026", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "An employee requests access to a specific software application that is listed in the organization's service catalogue. The request follows a pre-defined approval and fulfilment workflow. Which practice is responsible for handling this?", "choices": ["Incident management", "Change enablement", "Service request management", "Problem management"], "answer": [2], "explanations": ["Incorrect. Incident management handles unplanned interruptions or reductions in service quality. A request for software access is not an incident — it is a standard service request.", "Incorrect. Change enablement manages changes to products and services. While granting software access may involve a minor change, the request itself is handled through service request management since it follows a pre-defined fulfilment workflow.", "Correct. Service request management handles all pre-defined, user-initiated requests for service actions that are part of normal service delivery. Requesting software access that is listed in the service catalogue and follows an established approval and fulfilment workflow is a textbook service request.", "Incorrect. Problem management deals with identifying and managing the underlying causes of incidents. A software access request is not a problem."], "tip": "Service requests are pre-defined and pre-agreed. Common examples include: access requests, information requests, equipment provisioning, and standard changes. They follow established fulfilment workflows."}, {"id": "ITIL4F-E01-027", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "An organization wants to ensure users can easily find and request IT services available to them. They create a user-facing portal that lists all available services with descriptions, costs, and expected fulfilment times. What is this portal based on?", "choices": ["The service pipeline", "The change schedule", "The service catalogue", "The continual improvement register"], "answer": [2], "explanations": ["Incorrect. The service pipeline contains services that are under consideration or development but not yet available. The scenario describes services that are currently available to users.", "Incorrect. The change schedule records planned and historical changes. It is not a user-facing tool for browsing and requesting services.", "Correct. The service catalogue is a structured list of all services available to users, including relevant details such as descriptions, costs, and fulfilment times. A user-facing portal that allows users to browse and request available services is a presentation layer for the service catalogue.", "Incorrect. The continual improvement register tracks improvement ideas and their progress. It is not a user-facing tool for browsing and requesting services."], "tip": "The service catalogue may have different views: a user/customer-facing view (showing services they can request) and a technical/supporting view (showing the technical components and relationships behind each service)."}, {"id": "ITIL4F-E01-028", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "A service desk receives user contacts through phone, email, a self-service portal, and live chat. The organization wants to add social media as an additional contact channel. Which characteristic of a service desk does this scenario illustrate?", "choices": ["The service desk's role as a single point of contact", "The variety of channels through which a service desk can be accessed", "The service desk's role in incident resolution", "The technical expertise of service desk agents"], "answer": [1], "explanations": ["Incorrect. While the service desk does serve as a single point of contact, the scenario specifically focuses on the different communication channels, not the concept of a single point of contact.", "Correct. ITIL 4 recognizes that service desks can be accessed through multiple channels including phone, email, self-service portals, live chat, and social media. The scenario highlights this multi-channel nature of the modern service desk and the addition of new channels to improve accessibility.", "Incorrect. The scenario does not describe incident resolution activities. It focuses on the communication channels through which users contact the service desk.", "Incorrect. The scenario does not discuss the technical skills of service desk agents. It focuses on the variety of access channels."], "tip": "Modern service desks support many channels: phone, email, self-service portals, chat, social media, walk-in, and text/SMS. The choice of channels should be driven by user needs and organizational capabilities."}, {"id": "ITIL4F-E01-029", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "When a user contacts the IT department about any issue — whether it is an incident, a service request, or a general inquiry — they are always directed to the same team first. This team logs the contact, performs initial triage, and either resolves the issue or routes it appropriately. What key service desk concept is demonstrated?", "choices": ["Swarming", "Single point of contact", "Shift-left strategy", "Technical escalation"], "answer": [1], "explanations": ["Incorrect. Swarming is an approach where multiple specialists collaborate on an issue simultaneously rather than following a tiered escalation model. The scenario describes initial contact and routing, not swarming.", "Correct. The service desk acts as the single point of contact (SPOC) between the service provider and the users. Regardless of the type of contact — incident, service request, or inquiry — the service desk is the first team contacted. It logs, triages, and either resolves or routes all user contacts.", "Incorrect. A shift-left strategy involves moving resolution capabilities closer to the user (e.g., self-service, knowledge articles). The scenario describes initial contact handling, not shifting capabilities to the user.", "Incorrect. Technical escalation involves transferring an issue to a higher-level technical team. While the service desk may escalate, the key concept described is the service desk as the single point of contact."], "tip": "The service desk as a Single Point of Contact (SPOC) means users have one consistent entry point for all IT interactions. This simplifies the user experience and ensures nothing falls through the cracks."}, {"id": "ITIL4F-E01-030", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "An organization has service desk staff located in three different countries, providing 24/7 coverage by passing work from one time zone to the next as each location's business day ends. What type of service desk structure is this?", "choices": ["Local service desk", "Centralized service desk", "Follow-the-sun service desk", "Virtual service desk"], "answer": [2], "explanations": ["Incorrect. A local service desk is physically located within or near the user community it serves. Having staff in three countries specifically for time zone coverage goes beyond a local model.", "Incorrect. A centralized service desk operates from a single location serving all users. The scenario describes multiple locations across time zones, which is not a centralized model.", "Correct. A follow-the-sun service desk uses multiple locations across different time zones to provide 24/7 coverage. As one location's business day ends, the workload is handed over to the next location where the business day is beginning. This provides round-the-clock coverage without requiring night shifts.", "Incorrect. A virtual service desk uses technology to create the appearance of a single service desk, regardless of where agents are located. While the scenario involves multiple locations, the key characteristic described is the time-zone-based handoff for 24/7 coverage, which defines follow-the-sun."], "tip": "Follow-the-sun provides 24/7 support by leveraging time zones. Each location works normal business hours, and work is handed off to the next location as the day progresses around the globe."}, {"id": "ITIL4F-E01-031", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "A service provider and its customer agree on a document that specifies the expected response time for critical incidents as 15 minutes, resolution time as 4 hours, and monthly availability of 99.9%. What is this document called?", "choices": ["An operational level agreement (OLA)", "A service level agreement (SLA)", "A service catalogue entry", "An underpinning contract (UC)"], "answer": [1], "explanations": ["Incorrect. An operational level agreement (OLA) is an internal agreement between different parts of the service provider organization. The scenario describes an agreement between the service provider and its customer, not an internal agreement.", "Correct. A service level agreement (SLA) is a documented agreement between a service provider and a customer that identifies both services required and the expected level of service. The specific targets for response time, resolution time, and availability described in the scenario are typical SLA metrics.", "Incorrect. A service catalogue entry describes what services are available, but does not specify the agreed performance levels for a specific customer. SLAs define the agreed service levels.", "Incorrect. An underpinning contract is an agreement between the service provider and an external supplier, not between the provider and the customer. The scenario describes a customer-facing agreement."], "tip": "SLAs should be based on business outcomes, not just technical metrics. Good SLAs are simple, measurable, and focused on what matters to the customer. Avoid 'watermelon SLAs' that look green on the outside but are red inside."}, {"id": "ITIL4F-E01-032", "domain": "ITIL Practices (Detailed)", "type": "single", "stem": "A service level manager discovers that although the SLA targets are consistently being met, customers are still dissatisfied with the IT services. The manager decides to review the SLA metrics to ensure they reflect what customers actually value. What concept from ITIL 4 service level management is MOST relevant here?", "choices": ["The need to automate SLA reporting", "The concept of a 'watermelon SLA' — green on the outside but red inside", "The need for more frequent SLA reviews", "The requirement for underpinning contracts with all suppliers"], "answer": [1], "explanations": ["Incorrect. Automating SLA reporting may improve efficiency but does not address the root cause — the SLA metrics themselves may not reflect what customers value.", "Correct. ITIL 4 warns about 'watermelon SLAs', where metrics show all green (targets met) but the customer experience is actually poor (red inside). This happens when SLA metrics are not aligned with what customers actually value. The scenario perfectly illustrates this — targets are met but customers are dissatisfied, indicating the metrics do not capture true customer experience.", "Incorrect. More frequent reviews might help, but the core issue is that the existing metrics do not reflect customer value. Reviewing the wrong metrics more often will not solve the problem.", "Incorrect. Underpinning contracts with suppliers support service delivery but are not directly related to the disconnect between SLA targets and customer satisfaction described in the scenario."], "tip": "A 'watermelon SLA' is green outside (all metrics met) but red inside (customer is unhappy). To avoid this, ensure SLA metrics are defined in collaboration with customers and reflect real business outcomes, not just technical measurements."}, {"id": "ITIL4F-E01-033", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "Which practice is PRIMARILY responsible for protecting the information needed by the organization to conduct its business?", "choices": ["Service configuration management", "IT asset management", "Information security management", "Monitoring and event management"], "answer": [2], "explanations": ["Incorrect. Service configuration management focuses on ensuring that accurate and reliable information about the configuration of services and the CIs that support them is available. It does not primarily focus on protecting organizational information.", "Incorrect. IT asset management focuses on planning and managing the full lifecycle of IT assets. While asset management considers asset security, protecting organizational information is the primary responsibility of a different practice.", "Correct. The purpose of the information security management practice is to protect the information needed by the organization to conduct its business. This includes managing risks related to confidentiality, integrity, and availability of information, as well as authentication and non-repudiation.", "Incorrect. Monitoring and event management focuses on systematically observing services and service components and recording and reporting changes of state. It does not primarily focus on information protection."], "tip": "Information security management balances prevention (controls, policies) with detection and response. It addresses confidentiality, integrity, availability (CIA), as well as authentication and non-repudiation."}, {"id": "ITIL4F-E01-034", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "Which practice focuses on nurturing the links between an organization and its stakeholders at strategic and tactical levels?", "choices": ["Supplier management", "Service level management", "Relationship management", "Service desk"], "answer": [2], "explanations": ["Incorrect. Supplier management focuses on managing the organization's suppliers and their performance. It is specifically about third-party relationships, not the broader set of stakeholder relationships.", "Incorrect. Service level management focuses on setting clear targets for service levels and ensuring they are met. While SLM involves customer interaction, its primary focus is on service levels, not on broad stakeholder relationships.", "Correct. The purpose of the relationship management practice is to establish and nurture the links between the organization and its stakeholders at strategic and tactical levels. This includes identifying, analyzing, monitoring, and continually improving relationships with and between stakeholders.", "Incorrect. The service desk is the point of communication between the service provider and its users. It operates primarily at the operational level, whereas relationship management operates at strategic and tactical levels."], "tip": "Relationship management focuses on the strategic and tactical levels, nurturing overall stakeholder relationships. Do not confuse this with service level management (focused on service performance targets) or the service desk (operational user contact)."}, {"id": "ITIL4F-E01-035", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "An organization negotiates contracts, evaluates performance, and manages relationships with third-party vendors who provide components used in service delivery. Which ITIL practice is MOST applicable?", "choices": ["Relationship management", "Supplier management", "Change enablement", "Service level management"], "answer": [1], "explanations": ["Incorrect. Relationship management focuses on strategic and tactical relationships with all stakeholders, not specifically on managing third-party vendor contracts and performance.", "Correct. The purpose of the supplier management practice is to ensure that the organization's suppliers and their performance are managed appropriately to support the provision of seamless, quality products and services. This includes negotiating contracts, evaluating vendor performance, and managing supplier relationships.", "Incorrect. Change enablement manages changes to services and products. While vendor changes may trigger the change enablement process, the management of vendor contracts and performance is handled by supplier management.", "Incorrect. Service level management focuses on service performance targets with customers. While supplier performance may affect service levels, the direct management of third-party vendors is the responsibility of supplier management."], "tip": "Supplier management deals specifically with third-party/external organizations that provide goods or services. Key activities include: evaluating suppliers, negotiating contracts, managing performance, and maintaining the supplier register."}, {"id": "ITIL4F-E01-036", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "Which practice is responsible for planning and managing the full lifecycle of all IT assets, helping the organization maximize value, control costs, and manage risks?", "choices": ["Service configuration management", "IT asset management", "Service financial management", "Release management"], "answer": [1], "explanations": ["Incorrect. Service configuration management focuses on accurate information about configuration items and their relationships. While related, it does not manage the financial lifecycle (purchase, depreciation, retirement) of IT assets.", "Correct. The purpose of the IT asset management practice is to plan and manage the full lifecycle of all IT assets, to help the organization maximize value, control costs, manage risks, support decision-making about purchase and reuse of assets, and meet regulatory and contractual requirements.", "Incorrect. Service financial management is not one of the 34 ITIL 4 practices. Financial aspects of assets are covered within IT asset management.", "Incorrect. Release management focuses on making new and changed services and features available for use. It does not manage the full lifecycle of IT assets."], "tip": "IT asset management covers the entire asset lifecycle: request, procurement, deployment, operation, and retirement/disposal. It overlaps with service configuration management but adds financial and contractual tracking."}, {"id": "ITIL4F-E01-037", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "An organization uses automated tools to detect changes in the state of its infrastructure components and categorize them as informational, warning, or exception events. Which practice is responsible for this?", "choices": ["Incident management", "Problem management", "Monitoring and event management", "Service configuration management"], "answer": [2], "explanations": ["Incorrect. Incident management handles unplanned interruptions to services. While some events (exceptions) may lead to incidents, the systematic observation and categorization of events is a separate practice.", "Incorrect. Problem management focuses on identifying and managing the root causes of incidents. The scenario describes real-time detection and categorization of events, not root cause analysis.", "Correct. The purpose of the monitoring and event management practice is to systematically observe services and service components, and record and report selected changes of state identified as events. Events are categorized as informational (no action needed), warning (approaching a threshold), or exception (requires action, often triggering an incident).", "Incorrect. Service configuration management maintains information about CIs and their relationships. It does not perform real-time monitoring or event detection."], "tip": "Events are categorized into three types: Informational (normal operation, logged for reference), Warning (approaching a threshold, may need attention), and Exception (abnormal operation, requires action — often triggers an incident)."}, {"id": "ITIL4F-E01-038", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "Which practice is focused on making new and changed services and features available for use?", "choices": ["Change enablement", "Deployment management", "Release management", "Service validation and testing"], "answer": [2], "explanations": ["Incorrect. Change enablement focuses on maximizing the number of successful changes by ensuring risks are properly assessed and managed. It authorizes changes but does not make services available for use.", "Incorrect. Deployment management focuses on moving components to live environments. While deployment is a related step, making services available for use (which may include communication, training, and activation) is the responsibility of release management.", "Correct. The purpose of the release management practice is to make new and changed services and features available for use. A release may consist of one or more components that are deployed together. Release management ensures that users and stakeholders can begin using the new or changed functionality.", "Incorrect. Service validation and testing is an ITIL v3 process, not one of the 34 ITIL 4 practices. Testing activities in ITIL 4 are part of the obtain/build and design and transition value chain activities."], "tip": "Release management makes services available for USE. Deployment management moves components to LIVE environments. They are related but distinct — deployment puts code in production, while release makes it available to users."}, {"id": "ITIL4F-E01-039", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "An organization maintains a configuration management database (CMDB) that contains information about all configuration items and their relationships. Which practice is responsible for managing this?", "choices": ["IT asset management", "Monitoring and event management", "Service configuration management", "Knowledge management"], "answer": [2], "explanations": ["Incorrect. IT asset management manages the lifecycle and financial aspects of IT assets. While there is overlap with configuration management, the CMDB and CI relationships are specifically managed by service configuration management.", "Incorrect. Monitoring and event management observes services and detects events. It does not manage the CMDB or CI relationship data.", "Correct. The purpose of the service configuration management practice is to ensure that accurate and reliable information about the configuration of services, and the configuration items (CIs) that support them, is available when and where it is needed. The CMDB is a key tool used to store and manage this information, including CI attributes and relationships.", "Incorrect. Knowledge management focuses on maintaining and improving the effective use of information and knowledge across the organization. While the CMDB contains knowledge, its management falls under service configuration management."], "tip": "Service configuration management maintains accurate information about CIs and their relationships in the CMDB. This enables other practices (incident, change, problem) to understand how services are built and connected."}, {"id": "ITIL4F-E01-040", "domain": "ITIL Practices (Recall)", "type": "single", "stem": "An organization moves newly built software components from the test environment to the production environment. Which practice is MOST responsible for this activity?", "choices": ["Release management", "Change enablement", "Deployment management", "Continual improvement"], "answer": [2], "explanations": ["Incorrect. Release management makes new and changed services and features available for use. While related to deployment, the physical movement of components between environments is specifically handled by deployment management.", "Incorrect. Change enablement ensures that changes are properly assessed, authorized, and managed. The authorization of the deployment is a change enablement concern, but the actual movement of components to production is performed by deployment management.", "Correct. The purpose of the deployment management practice is to move new or changed hardware, software, documentation, processes, or any other component to live environments. Moving software from test to production is a core deployment management activity.", "Incorrect. Continual improvement focuses on identifying and implementing improvements. Moving software to production is a deployment activity, not an improvement activity."], "tip": "Deployment management moves components to live environments (the physical/technical move). It can use various approaches: phased, big bang, continuous delivery, pull deployment, etc. It works closely with release management and change enablement."}]}, {"set": 2, "title": "Practice Exam 2", "questions": [{"id": "ITIL4F-E02-001", "domain": "Key Concepts of Service Management", "type": "single", "stem": "A large retail company uses an IT department to deliver email, inventory management, and point-of-sale services. The head of marketing frequently requests changes to the e-commerce platform, the warehouse staff use the inventory system daily, and the CFO approves the IT budget.\n\nWhich term BEST describes the CFO in this context?", "choices": ["Service provider", "Customer", "Sponsor", "User"], "answer": [2], "explanations": ["The service provider is the organisation or part of the organisation that manages and delivers services. The IT department is the service provider, not the CFO.", "A customer is a person who defines the requirements for a service and takes responsibility for the outcomes of service consumption. The head of marketing acts more like a customer. The CFO's primary role here is financial.", "Correct. A sponsor is the person who authorises the budget for service consumption. The CFO approving the IT budget is a textbook example of a sponsor in ITIL 4.", "A user is the person who uses services. The warehouse staff scanning inventory are users. The CFO is not primarily a user of these services."], "tip": "ITIL 4 distinguishes three key stakeholder roles: sponsors authorise budgets, customers define requirements, and users consume services. One person can hold multiple roles."}, {"id": "ITIL4F-E02-002", "domain": "Key Concepts of Service Management", "type": "single", "stem": "An organisation provides its employees with a service that includes access to a cloud-based project management tool, onboarding training, and ongoing technical support.\n\nWhat does this scenario BEST describe?", "choices": ["A value stream", "A service relationship", "A service level agreement", "A service offering"], "answer": [3], "explanations": ["A value stream is a series of steps an organisation undertakes to create and deliver products and services to consumers. This describes what is offered, not the process of delivering it.", "A service relationship is a cooperation between a service provider and service consumer. While this scenario occurs within a service relationship, the specific combination of tool access, training, and support is a service offering.", "A service level agreement (SLA) is a documented agreement between a service provider and a customer that identifies both services required and the expected level of service. This scenario describes what is being provided, not the agreed service levels.", "Correct. A service offering is a formal description of one or more services, designed to address the needs of a target consumer group. It may include goods (the tool access), resources (training), and service actions (ongoing support)."], "tip": "A service offering consists of three components: goods (transferred to the consumer), access to resources (granted under agreed terms), and service actions (performed for the consumer)."}, {"id": "ITIL4F-E02-003", "domain": "Key Concepts of Service Management", "type": "single", "stem": "A hospital is considering moving its patient records system to a cloud provider. The IT director is concerned about potential data breaches but also recognises that the cloud provider offers better disaster recovery capabilities.\n\nWhich concept is the IT director evaluating?", "choices": ["Outcomes and outputs", "Service consumption", "Risk", "Utility and warranty"], "answer": [2], "explanations": ["An outcome is a result for a stakeholder, and an output is a tangible deliverable. The IT director is not comparing results versus deliverables here.", "Service consumption refers to the activities performed by the consumer, such as managing resources needed to use the service. The IT director is assessing risk, not consumption activities.", "Correct. Risk is defined as a possible event that could cause harm or loss, or make it more difficult to achieve objectives. It can also be used to mean uncertainty of outcome. The IT director is evaluating both negative risk (data breaches) and positive capability (disaster recovery), which is classic risk assessment in service management.", "Utility is the functionality offered by a product or service, and warranty is the assurance that it will meet agreed requirements. While related, the IT director is specifically weighing potential negative events against positive capabilities."], "tip": "In ITIL 4, risk can be both positive (opportunities) and negative (threats). When an organisation consumes a service, some risks are removed by the provider while new risks may be introduced."}, {"id": "ITIL4F-E02-004", "domain": "Key Concepts of Service Management", "type": "single", "stem": "Which statement BEST describes the 'service relationship model' in ITIL 4?", "choices": ["It describes the cooperation between organisations to co-create value through service provision and consumption", "It specifies the contractual obligations between a supplier and a service provider", "It defines how a service provider monitors the technical performance of services", "
