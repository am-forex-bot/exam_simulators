e compliance from Adatum. This meets all four requirements.", "Incorrect. External collaboration settings control general B2B invitation policies. Cross-tenant access settings provide the granular per-partner control needed for MFA trust, device compliance trust, and user-specific access.", "Incorrect. Outbound settings control what Northwind users can access in partner tenants. The scenario requires configuring what Adatum users can access in Northwind.", "Incorrect. Default settings apply to ALL partner tenants. The requirement is to configure specific trust for Adatum only. Trusting all partners' MFA and compliance may be too broad."], "tip": "Cross-tenant access: Inbound = what partners can access in YOUR tenant. Outbound = what YOUR users can access in partner tenants. Trust settings = accept partner's MFA/device compliance. Configure per-partner for granular control."}, {"id": "MS102-R4-043", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Intune for A.Datum Corporation. The company has Apple DEP (Device Enrollment Program, now ADE) configured for iOS devices. The VPP token used for app deployment is expiring in 7 days. If the token expires, app assignments will stop working.\n\nQuestion:\nHow do you renew the VPP token?", "choices": ["Delete the expired token in Intune and create a new one from scratch", "Contact Apple Support to extend the token expiration date", "In Apple Business Manager, download a new VPP token file using the same Apple ID, then upload it in Intune under Tenant administration > Connectors and tokens > Apple VPP tokens > select token > Renew", "The token auto-renews if the Apple Business Manager account is active"], "answer": [2], "explanations": ["Incorrect. Deleting and recreating the token breaks all existing app assignments tied to that token. Always renew rather than delete.", "Incorrect. Apple Support cannot extend token expiration. Renewal is done through the Apple Business Manager portal.", "Correct. VPP token renewal: (1) Sign in to Apple Business Manager (business.apple.com). (2) Download a new server token file (.vpptoken) using the same Apple ID that originally created the token. (3) In Intune, navigate to Tenant admin > Connectors and tokens > Apple VPP tokens > select the expiring token > Renew/Upload > upload the new token file. Existing assignments are preserved.", "Incorrect. VPP tokens do not auto-renew. They expire annually and must be manually renewed by downloading a new token from Apple Business Manager."], "tip": "VPP token renewal cycle: Download new token from ABM annually → upload to Intune (renew, don't delete). Same Apple ID required. Set calendar reminder for expiration. Token expiry = all VPP app assignments stop."}, {"id": "MS102-R4-044", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Wingtip Toys. The company uses organizational messages in Intune to display branded messages on Windows 11 devices. The IT team wants to show a message in the Windows Get Started app welcoming new employees and providing links to corporate resources.\n\nQuestion:\nWhere do you configure this organizational message?", "choices": ["Intune admin center > Devices > Configuration profiles > Create a custom OMA-URI profile with message content", "Microsoft 365 admin center > Organizational messages > Create a welcome message", "Windows Configuration Designer > create a provisioning package with custom OOBE messages", "Intune admin center > Tenant administration > Organizational messages > Create a message with the 'Get Started' delivery channel"], "answer": [3], "explanations": ["Incorrect. Custom OMA-URI profiles configure CSP settings, not organizational messages. Organizational messages have their own dedicated feature in Intune.", "Incorrect. Organizational messages for Windows devices are configured in the Intune admin center, not the Microsoft 365 admin center.", "Incorrect. Windows Configuration Designer creates provisioning packages for initial device setup, not ongoing organizational messaging.", "Correct. Organizational messages in Intune allow you to create branded messages delivered through Windows 11 surfaces including: Get Started app, Taskbar notification, and Notification area. Navigate to Tenant administration > Organizational messages, create a message, select the delivery channel (Get Started), configure the content with corporate branding and links, and assign to user groups."], "tip": "Organizational messages: Intune feature for Windows 11. Delivery channels: Get Started app (onboarding), Taskbar (persistent), Notification area (alerts). Supports corporate branding, custom links, and group targeting."}, {"id": "MS102-R4-045", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Contoso. A compliance audit reveals that some users have been forwarding corporate emails to personal Gmail accounts using Outlook rules. The compliance team wants to:\n1. Identify all existing forwarding rules to external addresses\n2. Block future external forwarding rules\n3. Alert the compliance team when someone attempts to create an external forwarding rule\n\nQuestion:\nWhich PowerShell cmdlet helps identify existing forwarding rules across all mailboxes?", "choices": ["Get-Mailbox -ResultSize Unlimited | ForEach-Object { Get-InboxRule -Mailbox $_.Identity | Where-Object {$_.ForwardTo -or $_.ForwardAsAttachmentTo -or $_.RedirectTo} }", "Search-UnifiedAuditLog -Operations New-InboxRule", "Get-InboxRule -Mailbox * | Where-Object {$_.ForwardTo -like '*@gmail.com*' -or $_.RedirectTo -like '*@gmail.com*'}", "Get-TransportRule -Filter {RedirectMessageTo -ne $null}"], "answer": [0], "explanations": ["Correct. This command iterates through all mailboxes and retrieves inbox rules that have forwarding or redirect actions configured. It catches ForwardTo, ForwardAsAttachmentTo, and RedirectTo rules. This identifies all existing forwarding rules across the organization.", "Incorrect. Search-UnifiedAuditLog finds when rules were created (historical activity) but doesn't show the current state of existing rules. It also doesn't show rules created before auditing was enabled.", "Incorrect. Get-InboxRule -Mailbox * is not valid syntax. You cannot use wildcard for the Mailbox parameter. You need to iterate through mailboxes.", "Incorrect. Get-TransportRule retrieves organization-level mail flow rules (transport rules), not user-created inbox forwarding rules."], "tip": "Finding forwarding rules: Get-Mailbox | Get-InboxRule (current rules). Search-UnifiedAuditLog (historical creation events). Blocking: Set-RemoteDomain -AutoForwardEnabled $false (transport-level block). Alerting: Alert policies in Purview."}, {"id": "MS102-R4-046", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Fabrikam. The company wants to deploy Apple Managed Apple IDs to all corporate iOS devices. These Managed Apple IDs should be federated with the company's Azure AD so that employees use their corporate credentials.\n\nQuestion:\nWhat must you configure for Managed Apple ID federation with Azure AD?", "choices": ["Configure federated authentication in Apple Business Manager by connecting to Microsoft Entra ID as the identity provider, then enable Managed Apple ID creation", "Configure Apple School Manager instead of Apple Business Manager for managed IDs", "Install the Apple SSO extension on all iOS devices via Intune", "Configure SAML SSO between Azure AD and Apple Business Manager"], "answer": [0], "explanations": ["Correct. In Apple Business Manager > Settings > Federated Authentication, connect to Microsoft Entra ID (Azure AD) as the identity provider. Once federation is configured, Managed Apple IDs are automatically created based on Azure AD user accounts (using the format user@appleid.domain). Users sign in to their Apple devices using their corporate credentials.", "Incorrect. Apple School Manager is for educational institutions. Apple Business Manager is the correct platform for enterprise Managed Apple ID federation.", "Incorrect. The Apple SSO extension provides single sign-on for apps on Apple devices, not Managed Apple ID federation. Federation is configured at the ABM/Azure AD level.", "Incorrect. While federation involves identity provider configuration, it's set up in Apple Business Manager's settings, not as a standalone SAML SSO configuration."], "tip": "Managed Apple ID federation: ABM > Federated Authentication > connect to Azure AD. Users get Managed Apple IDs mapped from Azure AD. Sign in with corporate creds. No separate Apple ID needed."}, {"id": "MS102-R4-047", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Datum Corporation. The security team configures Microsoft Defender for Endpoint and notices that the 'Endpoint analytics' score in the Microsoft Intune admin center shows a low score of 35/100. The primary contributing factor is 'Software recommended' with many devices running outdated software.\n\nQuestion:\nWhich Endpoint analytics component provides this software recommendation insight?", "choices": ["Application reliability — identifies crashing applications", "Work from anywhere — assesses device readiness including software currency", "Resource performance — identifies hardware bottlenecks", "Startup performance — identifies slow startup processes"], "answer": [1], "explanations": ["Incorrect. Application reliability tracks app crashes and hangs. It reports on application health, not whether the software is up to date.", "Correct. The 'Work from anywhere' report in Endpoint analytics includes a 'Software recommended' metric that assesses whether devices are running current, supported versions of Windows and Microsoft 365 Apps. Outdated software versions lower this score. The report recommends updating to current versions.", "Incorrect. Resource performance tracks CPU, memory, and disk utilization. It identifies hardware performance issues, not software version currency.", "Incorrect. Startup performance measures boot time and startup process duration. It doesn't assess software currency."], "tip": "Endpoint analytics scores: Startup performance (boot speed). Application reliability (app health). Work from anywhere (device readiness: OS version, cloud management, software currency). Each contributes to the overall score."}, {"id": "MS102-R4-048", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Intune for Litware Inc. The company needs to deploy a macOS application packaged as a .dmg file. The .dmg contains a standard macOS .app bundle that users would normally drag to the Applications folder.\n\nQuestion:\nHow should you deploy this in Intune?", "choices": ["Convert the .dmg to a .pkg installer first, then upload as a macOS LOB app", "Deploy using a shell script that mounts the DMG and copies the app bundle", "Upload directly as a macOS DMG app type in Intune under Apps > macOS > Add > macOS app (DMG)", "Upload the .dmg as a macOS LOB app in Intune — Intune handles .dmg extraction and .app installation automatically"], "answer": [2], "explanations": ["Incorrect. While converting to .pkg works, it's unnecessary. Intune natively supports .dmg uploads.", "Incorrect. Shell script deployment works but bypasses Intune's app management capabilities (tracking, detection, assignment, reporting). Use the native DMG app type instead.", "Correct. Intune supports direct .dmg file upload as the 'macOS app (DMG)' type. Navigate to Apps > macOS > Add > select 'macOS app (DMG)'. Upload the .dmg file, configure detection rules, and assign. Intune handles the .dmg mounting and .app installation to /Applications automatically.", "Incorrect. The 'LOB app' type for macOS expects .pkg or .intunemac format, not .dmg. Uploading a .dmg as LOB would fail."], "tip": "macOS app deployment in Intune: .dmg → 'macOS app (DMG)' type. .pkg → 'macOS LOB' type. M365 Apps → 'Microsoft 365 for macOS'. Shell scripts → for one-off configurations, not app deployment."}, {"id": "MS102-R4-049", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Pratum Inc. The company uses Windows Autopilot pre-provisioning (formerly white glove) to set up devices in the IT department before shipping them to remote users. During pre-provisioning, the technician boots the device, presses the Windows key five times to enter pre-provisioning mode, and the device completes Azure AD join, Intune enrollment, and app installation.\n\nWhen the user receives the device and signs in, they should see a minimal setup experience.\n\nQuestion:\nWhat does the user experience when they first sign in to a pre-provisioned device?", "choices": ["No setup at all — the user goes directly to the Windows desktop", "The user must re-authenticate with Azure AD and go through a full Autopilot enrollment", "Full Windows OOBE including region, keyboard, and privacy settings", "A minimal Enrollment Status Page showing only the user-specific phase (account setup) since device setup was already completed during pre-provisioning"], "answer": [3], "explanations": ["Incorrect. The user still needs to sign in and complete the user-specific ESP phase. There is still some setup, just minimal.", "Incorrect. The device is already Azure AD joined and enrolled. The user authenticates to establish user affinity and completes only the user-specific phase.", "Incorrect. Pre-provisioning handles most of the OOBE and device setup. The user does not go through the full OOBE.", "Correct. After pre-provisioning, the device setup phase (Azure AD join, Intune enrollment, device apps/policies) is already complete. When the user signs in, they only see the account setup phase of the ESP, which installs user-targeted apps and policies. This is significantly faster than the full Autopilot experience."], "tip": "Autopilot pre-provisioning: Tech does device phase (AAD join, enroll, device apps). User does account phase (user apps, user policies). Total user wait time: minutes instead of 30-60 minutes. Great for remote worker onboarding."}, {"id": "MS102-R4-050", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Adventure Works. The IT team needs to understand which Intune license is needed for different features. A manager asks which features require the Intune Suite add-on license beyond the standard Intune Plan 1 license.\n\nQuestion:\nWhich features require the Intune Suite add-on?", "choices": ["Endpoint Privilege Management, Remote Help, Microsoft Tunnel for MAM, Advanced Endpoint Analytics, and Microsoft Cloud PKI", "Microsoft Defender for Endpoint integration, endpoint security policies, and device configuration profiles", "Windows Autopilot, Windows Update for Business, and security baselines", "Device compliance policies, app protection policies, and conditional access integration"], "answer": [0], "explanations": ["Correct. The Intune Suite add-on includes premium features beyond Plan 1: Endpoint Privilege Management (EPM), Remote Help, Microsoft Tunnel for MAM, Advanced Endpoint Analytics, Microsoft Cloud PKI, and Firmware-over-the-air (FOTA) updates. These are advanced capabilities designed for organizations with sophisticated endpoint management needs.", "Incorrect. Defender for Endpoint integration, endpoint security policies, and device configuration profiles are part of Intune Plan 1.", "Incorrect. Autopilot, WUfB, and security baselines are included in standard Intune Plan 1.", "Incorrect. These features are included in the standard Intune Plan 1 license (included in Microsoft 365 E3/E5)."], "tip": "Intune licensing: Plan 1 (in M365 E3/E5) = core MDM/MAM. Plan 2 (standalone add-on) = advanced management. Intune Suite = premium features (EPM, Remote Help, Tunnel MAM, Cloud PKI, Advanced Analytics). Know which features need which license."}]}, {"title": "Practice Exam 5", "questions": [{"id": "MS102-R5-001", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nContoso uses Microsoft Intune to manage 3,000 Windows devices. The company implements Intune's remote help feature for the helpdesk team. A help desk analyst attempts to take full control of a user's device during a remote help session but can only view the screen.\n\nQuestion:\nWhat is the most likely cause?", "choices": ["The Remote Help app on the user's device needs to be updated to the latest version", "The help desk analyst's Intune RBAC role only has 'View screen' permission, not 'Take full control' — the Elevation permission is not granted", "Remote Help does not support full control on Azure AD joined devices", "The user must explicitly accept a full control prompt before the analyst can take control"], "answer": [3], "explanations": ["Incorrect. App version would cause connection issues, not permission restrictions. If the session connects with view-only, it's a permission or consent issue.", "Incorrect. While RBAC permissions matter, Remote Help sessions have RBAC roles for view and full control. However, even with the correct role, the user must approve the elevation from view to full control.", "Incorrect. Remote Help supports full control on Azure AD joined, hybrid joined, and Entra registered devices.", "Correct. Remote Help requires explicit user consent for full control. The analyst starts with view-only, and when they request full control, the user sees a prompt they must accept. If the user doesn't accept or misses the prompt, the session stays view-only. This is a security feature to ensure users consent to remote control."], "tip": "Remote Help session flow: Analyst requests session → user accepts connection → view-only by default → analyst requests control → user must accept control prompt. User consent is always required for full control."}, {"id": "MS102-R5-002", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Fabrikam. The company needs to deploy certificates to mobile devices for Wi-Fi and VPN authentication. The IT team does not want to maintain an on-premises Certificate Authority or NDES server.\n\nQuestion:\nWhich cloud-based certificate solution should you use?", "choices": ["Azure AD Certificate-Based Authentication (CBA) — issues certificates through Azure AD", "Self-signed certificates generated by Intune automatically", "Microsoft Cloud PKI — a cloud-native certificate authority that integrates with Intune for certificate issuance without on-premises infrastructure", "Let's Encrypt certificates deployed via Intune"], "answer": [2], "explanations": ["Incorrect. Azure AD CBA allows users to authenticate to Azure AD using certificates, but it doesn't issue certificates. You still need a CA to create the certificates.", "Incorrect. Intune does not generate self-signed certificates automatically. Certificate issuance requires either an on-premises CA or Microsoft Cloud PKI.", "Correct. Microsoft Cloud PKI (part of the Intune Suite) provides a cloud-native certificate authority. It eliminates the need for on-premises CA and NDES servers. You create a CA in Intune, configure certificate profiles (SCEP), and Intune issues certificates directly to devices. No on-premises infrastructure required.", "Incorrect. Let's Encrypt provides free TLS certificates for web servers, not device authentication certificates for enterprise Wi-Fi/VPN."], "tip": "Microsoft Cloud PKI: Cloud CA + Intune integration. No NDES, no on-prem CA. Create issuing CA → deploy SCEP profiles → Intune issues certs to devices. Part of Intune Suite add-on."}, {"id": "MS102-R5-003", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Intune for Trey Research. The company wants to deploy the new Microsoft Teams app to Windows devices. The new Teams is an MSIX-based application that replaces the classic Teams.\n\nQuestion:\nWhat is the recommended deployment method for the new Microsoft Teams?", "choices": ["Download the new Teams MSIX package and deploy as a Win32 app", "Deploy classic Teams MSI and it will auto-upgrade to new Teams", "Users must download new Teams manually from teams.microsoft.com", "Deploy the new Microsoft Teams as a built-in Windows app through Intune — select 'New Microsoft Teams' under Apps > Windows > Add > Microsoft Store app (new)"], "answer": [3], "explanations": ["Incorrect. While the MSIX package can be deployed as a Win32 app, the recommended approach is through the Microsoft Store integration for automatic updates.", "Incorrect. While classic Teams can be updated to new Teams, deploying classic Teams as the initial deployment method is not recommended for new installations.", "Incorrect. Manual download is not scalable and doesn't provide centralized management.", "Correct. The new Microsoft Teams can be deployed through Intune as a Microsoft Store app. In the Intune admin center, navigate to Apps > Windows > Add > Microsoft Store app (new), search for 'Microsoft Teams (new)', and assign it. Intune handles the MSIX deployment and automatic updates through the Store."], "tip": "New Teams deployment: Microsoft Store app in Intune (recommended, auto-updates) OR teamsbootstrapper.exe (bulk provisioning). The new Teams is smaller, faster, and uses less memory than classic Teams."}, {"id": "MS102-R5-004", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Woodgrove Bank. The company needs to enroll 100 corporate-owned Android devices that will be used as digital signage displays in bank branches. The devices will run a single kiosk app and should not have any user association.\n\nQuestion:\nWhich Android Enterprise enrollment mode should you use?", "choices": ["Android device administrator with kiosk mode", "Personally-owned work profile", "Corporate-owned dedicated device with single-app kiosk mode", "Corporate-owned fully managed (user-associated)"], "answer": [2], "explanations": ["Incorrect. Device administrator enrollment is deprecated. Dedicated device mode is the current Android Enterprise solution for kiosk and signage scenarios.", "Incorrect. Work profile is for personal BYOD devices, not corporate-owned signage displays.", "Correct. Dedicated device enrollment is designed for corporate-owned devices without user affinity. Configure single-app kiosk mode to lock the device to one application (the digital signage app). Devices enroll without user sign-in and are managed as shared/unattended devices.", "Incorrect. Fully managed with user association is for devices assigned to a specific user, not shared or unattended devices like digital signage."], "tip": "Android Enterprise dedicated devices: No user affinity, kiosk mode (single or multi-app), corporate-owned. Perfect for: digital signage, kiosks, shared tablets, point-of-sale. Enroll with QR code or token."}, {"id": "MS102-R5-005", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Litware Inc. The company uses Microsoft Entra ID with conditional access. The IT team needs to create a conditional access policy that applies only when users access Microsoft 365 from a device that is NOT compliant and NOT Azure AD joined.\n\nQuestion:\nWhich condition should you use in the conditional access policy to target unmanaged devices?", "choices": ["Condition: Filter for devices > exclude devices where device.isCompliant equals True or device.trustType equals AzureAD", "Condition: Device platforms > select all platforms", "Grant: Require device to be marked as compliant (this implicitly targets noncompliant devices)", "Condition: Client apps > select 'Browser' and 'Mobile apps and desktop clients'"], "answer": [0], "explanations": ["Correct. Device filters in conditional access allow you to exclude managed/compliant devices and target the policy only at unmanaged devices. By excluding devices where isCompliant equals True or trustType equals AzureAD/ServerAD, the policy applies only to unmanaged, noncompliant devices.", "Incorrect. Device platforms filter by OS type (Windows, iOS, Android), not by management or compliance status.", "Incorrect. 'Require compliant device' in the Grant control blocks noncompliant devices but applies to all targeted users/devices. It doesn't specifically target unmanaged devices—it would also block compliant devices if they don't meet the requirement.", "Incorrect. Client app conditions filter by the type of application used (browser, desktop client), not by device management status."], "tip": "Device filters in conditional access: Filter by device properties (isCompliant, trustType, manufacturer, model, OS version). Use 'Include' to target specific devices or 'Exclude' to exempt devices. Powerful for BYOD vs corporate policies."}, {"id": "MS102-R5-006", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Relecloud. The company has 200 Windows 365 Cloud PCs. A user reports that their Cloud PC is experiencing performance issues. The IT team needs to quickly restore the Cloud PC to a known good state without losing the user's data.\n\nQuestion:\nWhich Windows 365 action should you use?", "choices": ["Restore — restores the Cloud PC to a previous point-in-time snapshot while preserving the restore point's data state", "Restart — restart the Cloud PC to clear temporary issues", "Resize — increase the CPU/RAM allocation to fix performance issues", "Reprovision — deletes and recreates the Cloud PC from scratch (loses all data)"], "answer": [0], "explanations": ["Correct. Windows 365 automatically creates restore points for Cloud PCs. The Restore action allows you to restore a Cloud PC to a previous point-in-time, reverting to the state at that snapshot (including installed software, configurations, and user data as it existed at that point). This is useful for recovering from software issues or misconfigurations.", "Incorrect. Restart fixes temporary issues like frozen processes but doesn't resolve persistent performance problems caused by software corruption.", "Incorrect. Resize changes the compute resources but doesn't fix software-related performance issues (corrupt drivers, runaway processes, etc.).", "Incorrect. Reprovision creates a fresh Cloud PC from the provisioning policy image. All user data, installed apps, and customizations are lost."], "tip": "Windows 365 recovery actions: Restart (temporary fix). Restore (roll back to restore point, keeps data at that point). Reprovision (factory reset, loses everything). Resize (change hardware specs). Use Restore for software issues."}, {"id": "MS102-R5-007", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nAdventure Works uses Microsoft 365 E5. The company is implementing a Zero Trust identity strategy. The security team wants to deploy passwordless authentication for all users using Microsoft Authenticator's passwordless phone sign-in feature.\n\nQuestion:\nWhat are the prerequisites for enabling passwordless phone sign-in with Microsoft Authenticator?", "choices": ["Enable security defaults in Azure AD which automatically enables passwordless sign-in", "Enable Microsoft Authenticator as an authentication method in Entra Authentication methods, users must register the Authenticator app with their account, and the app must be configured for push notifications (not just TOTP)", "Deploy FIDO2 security keys and Microsoft Authenticator as a combined solution", "Users must have Microsoft 365 E5 licenses and Windows Hello for Business configured"], "answer": [1], "explanations": ["Incorrect. Security defaults enable MFA but do not enable passwordless sign-in. Passwordless requires explicit configuration in Authentication methods.", "Correct. Prerequisites: (1) Enable Microsoft Authenticator in Entra admin center > Authentication methods > Microsoft Authenticator > set Authentication mode to 'Passwordless'. (2) Users must register the Authenticator app with their Azure AD account. (3) The app must support push notifications (not just TOTP codes). (4) Device must meet the Authenticator app requirements (iOS 8+, Android 6+).", "Incorrect. FIDO2 keys are a separate passwordless method. Authenticator passwordless works independently without FIDO2 keys.", "Incorrect. Passwordless phone sign-in doesn't require E5 or Windows Hello. It works with Azure AD Premium P1 or P2 and the Authenticator app."], "tip": "Authenticator passwordless: Entra Authentication methods > Authenticator > Authentication mode: Passwordless. User signs in with username → number matching on Authenticator → biometric. No password needed."}, {"id": "MS102-R5-008", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Intune for Northwind Traders. The company uses Apple DEP (ADE) with 500 supervised iOS devices. The IT team wants to prevent users from removing the MDM management profile from their corporate devices.\n\nQuestion:\nHow can you prevent MDM profile removal on supervised iOS devices?", "choices": ["When devices are supervised through Apple Business Manager and enrolled via ADE, the MDM profile is non-removable by default — users cannot remove it", "Deploy a configuration profile that locks the MDM profile", "Configure a compliance policy that marks devices as noncompliant if the MDM profile is removed", "Set a device restriction policy to block MDM profile removal"], "answer": [0], "explanations": ["Correct. When iOS devices are supervised (through Apple Business Manager/ADE), the MDM enrollment profile is non-removable by default. Users cannot go to Settings > General > VPN & Device Management and remove the management profile. This is a built-in feature of supervised devices enrolled through ADE.", "Incorrect. There is no separate 'profile lock' configuration. The non-removable property comes from the supervised enrollment through ADE.", "Incorrect. If the user removed the MDM profile, the device would lose contact with Intune and the compliance policy couldn't be evaluated. Prevention is better than detection.", "Incorrect. While device restrictions can control many features, MDM profile removal prevention is handled at the enrollment level for supervised devices, not through a separate restriction policy."], "tip": "iOS supervision benefits: Non-removable MDM profile, silent app installation, activation lock bypass, additional restriction options, lost mode. Supervision = ADE enrollment via Apple Business Manager."}, {"id": "MS102-R5-009", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Contoso. The IT team wants to use advanced endpoint analytics to understand which devices are providing poor user experience. They specifically want proactive insights like:\n- Devices with anomalous battery drain\n- Devices with abnormal app launch times\n- Devices where OS crashes are trending upward\n\nQuestion:\nWhich feature provides these proactive anomaly-based insights?", "choices": ["Endpoint analytics > Startup performance", "Endpoint analytics > Application reliability", "Microsoft Defender for Endpoint > Device health reports", "Advanced Endpoint Analytics with anomaly detection (part of Intune Suite)"], "answer": [3], "explanations": ["Incorrect. Startup performance shows average metrics and rankings, but doesn't provide anomaly detection or proactive insights about battery drain or crash trends.", "Incorrect. Application reliability reports crashes and hangs, but standard endpoint analytics doesn't provide anomaly-based detection or proactive alerting.", "Incorrect. Defender for Endpoint device health reports focus on security posture (sensor health, AV status, exposure level), not user experience metrics like battery drain or app launch times.", "Correct. Advanced Endpoint Analytics (part of the Intune Suite add-on) provides anomaly detection that proactively identifies devices with unusual patterns: battery drain anomalies, app launch time degradation, OS crash frequency trends, and boot time regression. It uses machine learning to detect deviations from normal baselines and surfaces them as actionable insights."], "tip": "Endpoint analytics tiers: Standard (in Intune) = startup performance, app reliability, work from anywhere. Advanced (Intune Suite) = anomaly detection, battery insights, device query, enhanced timeline. Advanced requires add-on license."}, {"id": "MS102-R5-010", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Tailspin Toys. The company is configuring conditional access for B2B guest users from partner organizations. The security team requires that:\n- Guest users from Fabrikam must use MFA\n- Guest users from Fabrikam must use compliant devices\n- Contoso trusts Fabrikam's MFA and device compliance\n- Guest users from ALL other organizations must be blocked\n\nQuestion:\nHow should you configure cross-tenant access settings?", "choices": ["Configure external collaboration settings to allow invitations only from Fabrikam", "Configure default inbound settings to allow all external access, then add specific blocked organizations", "Configure default inbound settings to block all external access, then add Fabrikam as a partner with allowed inbound access and trust settings", "Use conditional access policies alone to manage all guest access"], "answer": [2], "explanations": ["Incorrect. External collaboration settings control who can be invited, but they don't provide MFA trust or device compliance trust. Cross-tenant access settings are needed for the trust requirements.", "Incorrect. Allowing all by default and blocking specific organizations is impractical — you'd need to block every other organization in the world. Block-by-default with specific allowances is more secure.", "Correct. Set the default cross-tenant inbound access to 'Block all'. Then add Fabrikam as a specific partner organization with inbound access allowed for their users. In Fabrikam's trust settings, enable 'Trust MFA from Fabrikam' and 'Trust compliant devices from Fabrikam'. This allows only Fabrikam guests while blocking all other organizations.", "Incorrect. Conditional access can require MFA/compliance for guests, but it cannot differentiate between partner organizations or trust external MFA claims. Cross-tenant access settings provide this granularity."], "tip": "Cross-tenant access strategy: Block all by default → allow specific trusted partners. Per-partner: trust MFA, trust compliance, specify allowed users. This is the Zero Trust approach to B2B collaboration."}, {"id": "MS102-R5-011", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Fabrikam. The company needs to configure device grouping for efficient policy targeting. The IT team has 5,000 devices across departments and wants automatic group membership based on device attributes.\n\nQuestion:\nWhich grouping strategy is most efficient for targeting compliance policies to specific device types?", "choices": ["Both B and C are valid; use dynamic groups for broad categorization and assignment filters for fine-grained targeting within assignments", "Use assignment filters on policy assignments to dynamically target devices without creating separate groups", "Create dynamic Azure AD device groups using device properties (OS, manufacturer, enrollment profile, ownership) for automatic membership", "Create static device groups and manually add devices as they enroll"], "answer": [0], "explanations": ["Correct. Best practice: Use dynamic Azure AD device groups for broad categorization (all Windows devices, all iOS devices, all corporate-owned). Then use assignment filters on individual policy assignments for fine-grained targeting within those groups (only Surface devices, only devices with specific OS versions). This combination is the most efficient and scalable.", "Partially correct. Assignment filters provide dynamic targeting within a policy assignment but work best when combined with groups.", "Partially correct. Dynamic groups automatically categorize devices but require separate groups for each targeting criteria.", "Incorrect. Static groups require manual maintenance, don't scale, and devices aren't added automatically on enrollment."], "tip": "Intune targeting strategy: Dynamic groups = broad categories (platform, ownership, department). Assignment filters = fine-grained within assignments (manufacturer, model, OS version). Filters evaluate at policy deployment, not membership."}, {"id": "MS102-R5-012", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Pratum Inc. The compliance team implements data lifecycle management. They need to automatically apply retention labels to emails based on a condition: emails containing the keyword 'confidential' in the subject should be labeled 'Retain 7 years'.\n\nQuestion:\nWhich auto-labeling method should you use?", "choices": ["Manually instruct users to apply the label to confidential emails", "Create a mail flow rule that applies the retention label to matching emails", "Create a DLP policy that applies the retention label when the keyword is detected", "Create a retention label with auto-apply policy using keyword query (Subject:confidential) targeted to Exchange"], "answer": [3], "explanations": ["Incorrect. Manual labeling doesn't scale and is unreliable. Auto-apply policies ensure consistent label application across all qualifying content.", "Incorrect. Mail flow rules (transport rules) can add headers, redirect, or classify messages, but they cannot apply Microsoft Purview retention labels.", "Incorrect. DLP policies detect and protect sensitive content but cannot apply retention labels. DLP and retention labeling are separate features.", "Correct. In Microsoft Purview, create a retention label 'Retain 7 years'. Then create an auto-apply label policy with the condition type 'Apply label to content that contains specific words or phrases' or 'Apply label based on a KQL query'. Use the KQL query 'Subject:confidential' targeted to Exchange locations. The policy automatically applies the retention label to matching emails."], "tip": "Auto-apply retention labels: KQL query (keywords, properties), Sensitive info types (SSN, credit cards), or Trainable classifiers (ML-based). Targets: Exchange, SharePoint, OneDrive. Runs continuously on new and existing content."}, {"id": "MS102-R5-013", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Intune for Litware Inc. The company wants to configure managed browser for iOS and Android devices. All web links opened from managed apps (Outlook, Teams) should open in Microsoft Edge instead of the device's default browser. Edge should also have an app protection policy applied.\n\nQuestion:\nHow should you configure this?", "choices": ["Create a device restriction profile that sets Edge as the default browser", "Set 'Restrict web content transfer with other apps' to 'Microsoft Edge' in the Outlook and Teams app protection policies", "Deploy Edge as a required app and hope users choose it as their default browser", "Configure a conditional access policy that blocks browser access except Microsoft Edge"], "answer": [1], "explanations": ["Incorrect. Device restriction profiles cannot force a default browser on iOS/Android for managed app links. The managed browser setting is in the app protection policy.", "Correct. In the app protection policy for Outlook and Teams, under Data transfer settings, set 'Restrict web content transfer with other apps' to 'Microsoft Edge'. This forces all web links opened from managed apps to open in Microsoft Edge (which also has an APP applied). This is the managed browser configuration for Intune.", "Incorrect. Simply deploying Edge doesn't force managed apps to open links in Edge. The app protection policy setting is required.", "Incorrect. Conditional access controls which browsers can access cloud apps, not which browser opens links from managed apps."], "tip": "Managed browser in APP: 'Restrict web content transfer with other apps: Microsoft Edge'. Links from managed apps → Edge (with APP). Edge becomes the corporate browser for managed app links. Works on iOS and Android."}, {"id": "MS102-R5-014", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Adventure Works. The company's IT team needs to run a real-time device query to check whether a specific Windows device has a particular software installed. They need the answer immediately, not from a cached report.\n\nQuestion:\nWhich Intune feature provides real-time device querying?", "choices": ["Microsoft Graph API — query device properties", "Advanced Endpoint Analytics > Device query — run KQL queries against live device data in real-time", "Intune Data Warehouse — query device inventory data", "Endpoint analytics > Application reliability — check installed app data"], "answer": [1], "explanations": ["Incorrect. Microsoft Graph API provides Intune management data (assigned policies, compliance status) but doesn't query real-time device state like installed software or running processes.", "Correct. Device query (part of Advanced Endpoint Analytics in the Intune Suite) allows administrators to run real-time KQL queries against Windows devices. You can query installed software, running processes, services, registry keys, event logs, and more — directly from the live device. Results are returned in near real-time.", "Incorrect. The Data Warehouse contains historical data that's updated periodically, not real-time device state. Queries may be hours old.", "Incorrect. Application reliability tracks app crashes/hangs over time. It doesn't provide real-time queries about installed software."], "tip": "Device query: Real-time KQL queries against live devices. Query: installed apps, processes, services, registry, hardware, network config. Part of Intune Suite. Think of it as 'live device investigation from the cloud'."}, {"id": "MS102-R5-015", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Contoso. The security team notices that the company's Secure Score has dropped by 15 points over the past month. They need to identify which specific actions caused the decrease.\n\nQuestion:\nWhere can they find this information?", "choices": ["Microsoft Defender portal > Secure Score > History tab showing score changes over time with specific improvement actions that changed", "Microsoft Entra admin center > Security > Audit logs", "Microsoft 365 admin center > Health > Message center", "Microsoft Purview > Compliance Manager > Assessment history"], "answer": [0], "explanations": ["Correct. The Secure Score History tab shows score changes over time. Each data point identifies which improvement actions caused the score to increase or decrease, including: actions that regressed (e.g., MFA was disabled for some users), actions completed (improving score), and Microsoft-initiated changes (new recommendations added).", "Incorrect. Audit logs track admin actions in Azure AD but don't provide Secure Score change analysis.", "Incorrect. Message center shows service announcements and planned changes, not Secure Score history.", "Incorrect. Compliance Manager tracks compliance posture, not security posture. Different tool, different purpose."], "tip": "Secure Score analysis: Overview (current score + comparison). Improvement actions (what to fix). History (score changes over time + root cause). Metrics & trends (long-term tracking). Use History to investigate score drops."}, {"id": "MS102-R5-016", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Tailwind Traders. The company has 500 Windows devices. A new security requirement mandates that all devices must have firmware-level protection enabled, specifically:\n- Virtualization-based security (VBS) must be enabled\n- Hypervisor-protected code integrity (HVCI) must be running\n\nQuestion:\nHow should you verify and enforce these settings?", "choices": ["These settings can only be configured in the device BIOS — Intune cannot manage firmware settings", "Deploy a PowerShell script that enables VBS and HVCI through registry modifications", "Create a device compliance policy with Windows Health Attestation settings that verify VBS and HVCI status. Deploy a device configuration profile via Settings Catalog to enable these features.", "Configure Microsoft Defender for Endpoint to enforce firmware protection"], "answer": [2], "explanations": ["Incorrect. While BIOS settings (virtualization technology) are prerequisites, VBS and HVCI are OS-level features that are enabled through Windows configuration, which Intune can manage.", "Incorrect. While registry modifications can enable VBS/HVCI, this approach lacks verification and compliance tracking. A compliance policy is needed to verify the settings are actually active.", "Correct. Two parts: (1) Configuration: Use the Settings Catalog to configure VBS and HVCI settings (Device Guard > Enable Virtualization Based Security, Hypervisor Enforced Code Integrity). (2) Verification: Create a compliance policy using Health Attestation to verify that VBS and code integrity are actually running at boot time. This ensures both deployment and ongoing verification.", "Incorrect. Defender for Endpoint can report on VBS/HVCI status, but it doesn't enforce or configure these settings. Configuration is done through Intune profiles."], "tip": "VBS/HVCI deployment: (1) BIOS prerequisite: virtualization enabled (manual/FOTA). (2) Intune Settings Catalog: enable VBS + HVCI. (3) Compliance: Health attestation verifies VBS/HVCI running at boot. All three layers needed."}, {"id": "MS102-R5-017", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Datum Corporation. The company wants to configure Microsoft Entra ID Protection risk-based conditional access. The security team needs to understand the difference between sign-in risk and user risk.\n\nQuestion:\nWhich statement correctly describes the difference?", "choices": ["Sign-in risk requires Defender for Endpoint. User risk requires Defender for Identity.", "Sign-in risk is for cloud-only users. User risk is for hybrid users.", "Sign-in risk evaluates the real-time risk of a specific authentication attempt (anonymous IP, impossible travel, malware-linked IP). User risk evaluates the overall likelihood that a user's identity is compromised (leaked credentials, threat intelligence).", "Sign-in risk and user risk are the same thing measured at different times"], "answer": [2], "explanations": ["Incorrect. Both are native Identity Protection features. They don't require Defender for Endpoint or Defender for Identity (though DfI can contribute signals to user risk).", "Incorrect. Both sign-in risk and user risk apply to all user types (cloud-only and hybrid).", "Correct. Sign-in risk is a real-time assessment of each authentication attempt: was this sign-in from an anonymous IP, impossible travel, unfamiliar location, or malware-infected device? User risk is a cumulative assessment of the user account: are the credentials leaked, has threat intelligence linked the account to an attack? Different risks require different remediation: sign-in risk → require MFA. User risk → require password change.", "Incorrect. They measure fundamentally different things and operate independently."], "tip": "Sign-in risk = 'Is THIS sign-in suspicious?' → Remediation: require MFA. User risk = 'Is this USER compromised?' → Remediation: require password change. Configure separate conditional access policies for each."}, {"id": "MS102-R5-018", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Intune for Relecloud. The company has 300 Windows devices with Microsoft 365 Apps installed. The security team wants to ensure that Office macros in files downloaded from the internet are blocked by default, following Microsoft's recommended security configuration.\n\nQuestion:\nHow should you configure this?", "choices": ["Create a device configuration profile using the Settings Catalog to configure 'Block macros from running in Office files from the Internet' for each Office application", "Configure an attack surface reduction (ASR) rule to block all Office macros", "Both A and B are valid approaches; the Settings Catalog provides device-level enforcement while cloud policy provides user-level enforcement", "Deploy an Office cloud policy that blocks macros from internet sources"], "answer": [2], "explanations": ["Partially correct. Settings Catalog can configure the macro block per Office application.", "Incorrect. ASR rules related to Office (like 'Block Office apps from creating child processes') don't specifically target internet-sourced macros. The macro blocking policy is a separate Office Trust Center setting.", "Correct. Both methods work: (1) Settings Catalog > configure 'VBA Macro Notification Settings' for each Office app with 'Block macros from running in Office files from the Internet' enabled (device-level). (2) Office cloud policy (Microsoft 365 Apps admin center > Policy management) can set the same policy at the user level. Use Settings Catalog for device-level enforcement or cloud policy for user-level enforcement.", "Partially correct. Office cloud policy in the Microsoft 365 Apps admin center can also configure this setting."], "tip": "Office macro security: 'Block macros from internet' (Trust Center policy via Settings Catalog or cloud policy). ASR rule 'Block Office from creating child processes' is complementary but different. Use both for defense in depth."}, {"id": "MS102-R5-019", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Wingtip Toys. The company provisions Windows 365 Cloud PCs for seasonal workers who only need access for 3 months at a time. When the season ends, the Cloud PCs should be automatically deprovisioned to save costs.\n\nQuestion:\nHow should you manage the lifecycle of these seasonal Cloud PCs?", "choices": ["Use Power Automate to schedule Cloud PC deletion", "Use Azure AD group-based licensing — when seasonal workers are removed from the license group, their Cloud PCs are automatically deprovisioned after the grace period", "Manually delete each Cloud PC at the end of the season", "Set an expiration date on the Cloud PC provisioning policy"], "answer": [1], "explanations": ["Incorrect. While Power Automate could be built for this, group-based licensing is the native, supported mechanism.", "Correct. Windows 365 Cloud PCs are tied to the user's Windows 365 license. Use Azure AD group-based licensing: add seasonal workers to a license group when their season starts (gets Cloud PC provisioned). Remove them from the group when the season ends (license removed → Cloud PC enters a grace period → then deprovisioned). This automates the lifecycle.", "Incorrect. Manual deletion for seasonal workers is not scalable and error-prone.", "Incorrect. Provisioning policies don't have built-in expiration dates for Cloud PCs."], "tip": "Windows 365 lifecycle: License assigned → Cloud PC provisioned. License removed → grace period (7 days default) → Cloud PC deprovisioned. Use group-based licensing for automated lifecycle management."}, {"id": "MS102-R5-020", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Northwind Traders. The company needs to ensure that all Microsoft Teams meetings with external participants are recorded and that recordings are automatically retained for 2 years.\n\nQuestion:\nHow should you configure this?", "choices": ["Create a DLP policy for Teams meetings that captures recordings", "Configure an eDiscovery hold on all Teams recordings", "Configure a Teams meeting policy that enables automatic recording, then create a Purview retention policy for Teams meeting recordings with 2-year retention", "Enable the Teams admin center recording policy and set the retention to 2 years in Teams settings"], "answer": [2], "explanations": ["Incorrect. DLP policies detect and protect sensitive content in messages, not manage meeting recordings or retention.", "Incorrect. eDiscovery holds preserve content for investigation, not for ongoing compliance retention. Holds are indefinite and don't auto-delete after a period.", "Correct. (1) In Teams admin center, create a meeting policy with 'Auto-recording' enabled or configure compliance recording for meetings with external participants. (2) Teams meeting recordings are stored in OneDrive/SharePoint. Create a Purview retention policy targeting SharePoint/OneDrive that retains recordings for 2 years. The retention policy can target the specific SharePoint location where Teams recordings are stored.", "Incorrect. Teams admin center has a recording expiration setting but it's limited (default 120 days, max configurable). For 2-year retention, you need a Purview retention policy which overrides the Teams expiration setting."], "tip": "Teams meeting recordings: Stored in OneDrive (1:1/group) or SharePoint (channel meetings). Retention: Purview retention policy (overrides Teams expiration). Teams admin setting only controls default expiration, Purview controls long-term retention."}, {"id": "MS102-R5-021", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Contoso. The company uses Windows Local Administrator Password Solution (LAPS) managed by Microsoft Entra ID and Intune. The IT help desk needs to retrieve the local admin password for a device to perform troubleshooting.\n\nQuestion:\nWhere can the help desk retrieve the LAPS password?", "choices": ["Microsoft Entra admin center > Devices > select device > Local administrator password recovery", "Active Directory Users and Computers > device object > LAPS tab", "Both A and B provide access to the cloud-managed LAPS password", "Intune admin center > Devices > select device > scroll to Local admin password section"], "answer": [2], "explanations": ["Partially correct. Entra admin center shows the LAPS password for the device.", "Incorrect. Active Directory Users and Computers shows LAPS passwords for on-premises AD-managed LAPS, not cloud-native Entra LAPS.", "Correct. Cloud-managed LAPS passwords can be retrieved from both the Microsoft Entra admin center (Devices > device > Local administrator password) and the Intune admin center (Devices > device > Local admin password). Both show the current password and its expiration. RBAC controls who can view passwords.", "Partially correct. Intune admin center also shows the LAPS password on the device details page."], "tip": "Cloud LAPS: Password stored in Entra ID, viewable in Entra and Intune portals. Configure via Intune Account protection policy. Auto-rotates on schedule. Requires Windows 10 21H2+ with April 2023 update or later."}, {"id": "MS102-R5-022", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Fabrikam. The company wants to implement phishing-resistant MFA using conditional access authentication strengths. The security team needs to require phishing-resistant MFA for administrators accessing Azure portal.\n\nQuestion:\nWhich authentication methods qualify as 'phishing-resistant' in Microsoft Entra?", "choices": ["SMS OTP and voice call", "Any MFA method including Authenticator TOTP codes", "Microsoft Authenticator push notifications with number matching", "FIDO2 security keys, Windows Hello for Business, and certificate-based authentication (CBA)"], "answer": [3], "explanations": ["Incorrect. SMS and voice are the weakest MFA methods and are highly susceptible to phishing (SIM swap, social engineering).", "Incorrect. TOTP codes can be phished through real-time proxy attacks. Only hardware-bound cryptographic methods are phishing-resistant.", "Incorrect. While Authenticator push with number matching is more resistant than basic push, it is NOT classified as phishing-resistant by Microsoft. It's classified as 'multifactor authentication' strength, not 'phishing-resistant MFA' strength.", "Correct. Microsoft defines phishing-resistant MFA as methods that are cryptographically bound to the sign-in session and cannot be phished: FIDO2 security keys (hardware-bound), Windows Hello for Business (device-bound biometric/PIN), and Certificate-based authentication (CBA with smart cards). These are the only methods in the 'Phishing-resistant MFA' authentication strength."], "tip": "Authentication strengths: MFA (any MFA method) < Passwordless MFA (Authenticator passwordless, FIDO2, WHfB) < Phishing-resistant MFA (FIDO2, WHfB, CBA only). Use CA to require specific strength for high-risk scenarios."}, {"id": "MS102-R5-023", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Intune for Trey Research. The company needs to deploy a Win32 application that requires a device restart after installation. The IT team wants Intune to handle the restart gracefully — notifying the user and allowing them to defer for up to 2 hours.\n\nQuestion:\nHow should you configure the restart behavior for this Win32 app?", "choices": ["Configure the return codes in the Win32 app deployment — map the app's restart return code (e.g., 3010) to 'Soft reboot' behavior, and configure restart grace period in the app assignment", "The user must manually restart — Intune cannot trigger device restarts after app installation", "Create a separate Intune script that reboots the device after app detection confirms installation", "Add a post-installation PowerShell script that triggers shutdown /r /t 7200"], "answer": [0], "explanations": ["Correct. Win32 apps in Intune support return code mapping. The standard restart code 3010 can be mapped to 'Soft reboot' which shows a user notification allowing restart deferral. Configure the restart grace period and deadline in the app assignment settings. Users see a notification and can defer the restart within the allowed timeframe.", "Incorrect. Intune can handle restart requirements through return code configuration.", "Incorrect. Separate scripts are unnecessary. Intune's built-in return code handling manages restarts natively.", "Incorrect. A PowerShell shutdown command forces a restart without Intune's graceful notification and deferral capabilities."], "tip": "Win32 app return codes: 0 = success. 1707 = success. 3010 = soft reboot (user can defer). 1641 = hard reboot (forced). Custom codes can be mapped. Configure restart behavior through return codes, not separate scripts."}, {"id": "MS102-R5-024", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Woodgrove Bank. The company uses Apple Automated Device Enrollment (ADE) for iOS devices. During enrollment, the IT team wants to skip certain setup assistant screens (like Apple Pay, Siri, Location Services) to speed up the setup process.\n\nQuestion:\nWhere do you configure which setup assistant screens to skip?", "choices": ["Create a device configuration profile with setup assistant restrictions", "Intune admin center > Devices > Enrollment > Apple > Enrollment program tokens > select token > Profiles > create/edit enrollment profile > Setup Assistant customization", "Deploy a mobileconfig file that configures setup assistant options", "Apple Business Manager portal > Devices > MDM server settings"], "answer": [1], "explanations": ["Incorrect. Device configuration profiles apply after enrollment. Setup Assistant screens appear during enrollment, before profiles are applied.", "Correct. In the Intune enrollment profile for ADE, there's a 'Setup Assistant' section where you choose which screens to show or hide during device setup. You can skip: Passcode, Location Services, Restore, Apple ID, Terms and Conditions, Touch/Face ID, Apple Pay, Siri, Display Tone, Privacy, and more.", "Incorrect. Mobileconfig files don't control the enrollment setup experience. The ADE enrollment profile in Intune handles this.", "Incorrect. Apple Business Manager assigns devices to MDM servers but doesn't control which setup screens to skip. That's configured in the MDM (Intune)."], "tip": "ADE enrollment profile: Controls the entire out-of-box experience. Skip screens = faster deployment. Supervised mode toggle. User affinity settings. Department and support info. All configured before the device is even touched."}, {"id": "MS102-R5-025", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Tailspin Toys. The compliance team needs to investigate a potential data breach. They must search all emails, Teams chats, SharePoint files, and OneDrive files for content containing specific keywords within a specific date range.\n\nQuestion:\nWhich tool should they use?", "choices": ["Microsoft Purview > Audit log search", "Microsoft Purview > Content search — search across all Microsoft 365 content locations", "Microsoft Defender portal > Advanced hunting", "Exchange Online > Compliance search in EAC"], "answer": [1], "explanations": ["Incorrect. Audit log search shows user and admin activity (who accessed what, when) but doesn't search the content of emails, documents, or chats.", "Correct. Content search in Microsoft Purview allows you to search across Exchange mailboxes (emails), Teams conversations (chats and channel messages), SharePoint sites, and OneDrive accounts simultaneously. You can specify keyword queries, date ranges, specific senders/recipients, and other conditions. Results can be previewed and exported.", "Incorrect. Advanced hunting in Defender searches security event data (alerts, device events, email metadata), not email/document content.", "Incorrect. Exchange admin center compliance search is limited to Exchange mailboxes. For a cross-service search including Teams, SharePoint, and OneDrive, use Content search in Purview."], "tip": "Investigation tools: Content search = find content (emails, files, chats). Audit log = find activities (who did what). eDiscovery = legal hold + review + export. Advanced hunting = security events. Choose based on what you're looking for."}, {"id": "MS102-R5-026", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Pratum Inc. The company wants to configure Windows Hello for Business for all Azure AD joined Windows devices. The IT team needs:\n- PIN with minimum 6 digits\n- Biometric authentication enabled\n- TPM required\n\nQuestion:\nWhere should you configure Windows Hello for Business in Intune?", "choices": ["Endpoint security > Account protection > create a Windows Hello for Business policy", "Device configuration > Identity protection > Windows Hello for Business", "Tenant administration > Windows Hello for Business (tenant-wide setting)", "All three locations can configure WHfB, but Account protection (Endpoint security) is the recommended modern approach for granular group targeting"], "answer": [3], "explanations": ["Partially correct. Account protection is the recommended path.", "Partially correct. Identity protection templates also configure WHfB.", "Partially correct. Tenant-wide setting applies to all users but lacks granular group targeting.", "Correct. Windows Hello for Business can be configured in three locations: (1) Endpoint security > Account protection (recommended, group-targeted). (2) Device configuration > Identity protection template. (3) Tenant administration > Windows Hello for Business (tenant-wide). The Account protection approach is recommended for granular control. If the tenant-wide setting is enabled, it can conflict with targeted policies — disable tenant-wide and use Account protection instead."], "tip": "WHfB configuration priority: Disable tenant-wide setting (Not configured). Use Endpoint security > Account protection for group-targeted policies. Configure PIN complexity, biometrics, TPM requirement, key type."}, {"id": "MS102-R5-027", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Litware Inc. The company uses Microsoft Defender for Office 365. A user reports receiving a phishing email that bypassed Safe Links and Safe Attachments protections.\n\nQuestion:\nWhat should the security team do to investigate and respond?", "choices": ["Use Threat Explorer in the Defender portal to investigate the email — trace delivery, check URL detonation results, check attachment scan results, and use 'Soft delete' or 'Hard delete' remediation to remove the email from all recipient mailboxes", "Create a mail flow rule to block all emails from the sender", "Check the email headers manually and block the sender domain", "Disable Safe Links and Safe Attachments since they failed, and use a third-party solution"], "answer": [0], "explanations": ["Correct. Threat Explorer provides comprehensive investigation: (1) Search by sender, subject, or message ID to find all instances. (2) Review why protection was bypassed (zero-day URL, encrypted attachment, allow list override). (3) Check URL detonation and attachment sandbox results. (4) Use remediation actions (soft delete, hard delete, move to junk) to remove the phishing email from all recipient mailboxes. (5) Submit to Microsoft for analysis.", "Incorrect. Mail flow rules prevent future emails but don't remove the existing phishing email from mailboxes. Investigation with Threat Explorer is needed first.", "Incorrect. Manual header inspection is insufficient. Blocking a single sender domain doesn't address the actual threat or remove the email from other mailboxes.", "Incorrect. Disabling protections reduces security. The correct response is to investigate why the specific email bypassed protections and improve the configuration."], "tip": "Phishing response: Threat Explorer (investigate + remediate) → check why bypassed (overrides, ZAP, allow lists) → remove from all mailboxes → submit to Microsoft → improve policies. Don't just block the sender."}, {"id": "MS102-R5-028", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Intune for Adventure Works. The company wants to use Intune to manage Microsoft Edge browser settings across all Windows devices. They need to configure:\n- Homepage URL\n- Block certain websites\n- Disable InPrivate browsing\n- Configure proxy settings\n\nQuestion:\nWhat is the most comprehensive way to manage Edge settings in Intune?", "choices": ["Use an app configuration policy for Microsoft Edge", "Use the Settings Catalog — search for Microsoft Edge settings which provides access to hundreds of Edge policies", "Deploy an ADMX template for Microsoft Edge in Intune", "Create an OMA-URI custom profile with Edge CSP settings"], "answer": [1], "explanations": ["Incorrect. App configuration policies for Edge are primarily used for managed browser settings on mobile platforms (iOS/Android), not comprehensive Windows Edge management.", "Correct. The Settings Catalog in Intune provides the most comprehensive access to Microsoft Edge policies. Search for 'Microsoft Edge' to find hundreds of configurable policies including: homepage URL, site blocking (URLBlocklist/URLAllowlist), InPrivate browsing control, proxy configuration, extension management, and more. The Settings Catalog is searchable and provides descriptions for each setting.", "Incorrect. While ADMX templates (Administrative templates) include Edge settings, the Settings Catalog provides a more complete and searchable interface with all Edge policies.", "Incorrect. Custom OMA-URI can configure Edge settings but requires knowing the exact CSP paths and values. The Settings Catalog provides a user-friendly interface with the same capabilities."], "tip": "Edge management in Intune: Settings Catalog (most comprehensive, all Edge policies). Administrative templates (subset of policies). App config policy (mobile Edge). Settings Catalog is the modern recommended approach."}, {"id": "MS102-R5-029", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Contoso. A Windows Autopilot deployment profile is configured for user-driven Azure AD join. During deployment, a user reports the enrollment fails with error 801c03ed — 'This device is not authorized to enroll. You can try to enroll this device again, or contact your system administrator with the error code 801c03ed.'\n\nQuestion:\nWhat is the most likely cause of this error?", "choices": ["The device is not registered in Autopilot", "The Intune MDM authority is not configured", "The Autopilot profile is not assigned to the device", "The Azure AD device enrollment limit has been reached for the user — the user has too many registered devices"], "answer": [3], "explanations": ["Incorrect. If the device wasn't registered in Autopilot, the user wouldn't see the Autopilot OOBE experience at all.", "Incorrect. MDM authority configuration issues would affect all users, not just one user's enrollment.", "Incorrect. If the profile wasn't assigned, the device would go through standard OOBE, not show an Autopilot-related enrollment error.", "Correct. Error 801c03ed typically indicates the user has reached the Azure AD device registration limit. By default, users can register up to 50 devices (configurable). If the user has reached this limit, new device enrollments fail. Resolution: increase the device limit in Azure AD > Devices > Device Settings, or remove stale device records for the user."], "tip": "Common Autopilot errors: 801c03ed = device limit reached. 80180014 = MDM enrollment failed. 80070774 = network timeout. 801c0003 = device not found in Autopilot. Check Azure AD device limits and stale records first."}, {"id": "MS102-R5-030", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Datum Corporation. The company uses Microsoft Purview Insider Risk Management to detect and respond to insider threats. The security team wants to identify users who may be exfiltrating data before leaving the company.\n\nQuestion:\nWhich insider risk policy template should they use?", "choices": ["General data leaks template", "Data theft by departing users template — detects data exfiltration activities correlated with HR departure signals", "Security policy violations template", "Patient data misuse template"], "answer": [1], "explanations": ["Incorrect. General data leaks detect data movement outside the organization but don't correlate with departure signals. They cast a wider net without focusing on departing employees.", "Correct. The 'Data theft by departing users' template in Insider Risk Management specifically correlates data exfiltration indicators (file downloads, USB copies, cloud uploads, email attachments) with HR departure signals (resignation date from the HR connector, Azure AD account disable date). This template focuses risk detection on the critical period before and after an employee's departure.", "Incorrect. Security policy violations detect users who bypass security controls but aren't specifically focused on departing users' data theft patterns.", "Incorrect. Patient data misuse is specific to healthcare organizations and doesn't focus on departing employees."], "tip": "Insider risk templates: Data theft by departing users (HR signals + exfiltration). General data leaks (broad exfiltration). Security policy violations (DLP/ASR bypasses). Data leaks by risky users (risk score + exfiltration). Match template to scenario."}, {"id": "MS102-R5-031", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Fabrikam. The company purchases 300 new laptops from Lenovo. The vendor pre-registers the devices in Windows Autopilot using their hardware hashes. The IT team needs to verify the devices appear in the Autopilot device list.\n\nQuestion:\nWhere do you verify Autopilot device registration?", "choices": ["Microsoft Entra admin center > Devices > All devices", "Intune admin center > Devices > Enrollment > Windows > Windows Autopilot > Devices", "Microsoft 365 admin center > Devices", "Azure portal > Virtual machines"], "answer": [1], "explanations": ["Incorrect. Entra Devices shows registered/joined devices, not Autopilot-registered devices that haven't yet enrolled.", "Correct. Autopilot-registered devices appear in Intune admin center under Devices > Enrollment > Windows > Windows Autopilot > Devices. Here you can see hardware hashes, serial numbers, assigned profiles, and enrollment status. Devices appear here before they're even powered on for the first time.", "Incorrect. The M365 admin center shows active devices, not the Autopilot registration list.", "Incorrect. Azure VMs are cloud virtual machines, not physical Autopilot devices."], "tip": "Autopilot device list: Shows registered devices before enrollment. Vendor uploads hardware hashes → devices appear in Autopilot list → assign profile → ship to user → user powers on → Autopilot runs."}, {"id": "MS102-R5-032", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Relecloud. The company uses sensitivity labels to classify and protect documents. The legal team needs a sensitivity label that:\n- Encrypts documents automatically\n- Allows only the Legal department to open encrypted files\n- Prevents forwarding of labeled emails\n- Applies a watermark to documents\n\nQuestion:\nWhich sensitivity label settings should you configure?", "choices": ["Apply content marking (watermark) + Encryption with specific permissions: Legal group has Full Control, 'Do Not Forward' for emails", "Apply content marking only — encryption must be configured separately through Azure RMS templates", "Apply content marking + Azure Information Protection classic client for encryption", "Apply content marking + DLP policy for encryption enforcement"], "answer": [0], "explanations": ["Correct. Configure the sensitivity label with: (1) Encryption: 'Configure encryption settings' > assign permissions to the Legal department group (Co-Owner or custom permissions). (2) Content marking: enable watermark with custom text. (3) For email-specific behavior: the 'Do Not Forward' option prevents recipients from forwarding, printing, or copying encrypted emails. All settings are configured within the single sensitivity label.", "Incorrect. Sensitivity labels have built-in encryption capabilities. Separate Azure RMS templates are not required — the label can define encryption settings directly.", "Incorrect. The AIP classic client is deprecated. Sensitivity labels in Microsoft Purview with built-in labeling handle all these requirements natively.", "Incorrect. DLP policies detect and protect data based on sensitive information types, but they don't apply encryption the same way sensitivity labels do. Labels provide persistent encryption that travels with the document."], "tip": "Sensitivity label capabilities: Encryption (who can access, what permissions). Content marking (headers, footers, watermarks). Auto-labeling (apply based on content). All in one label — no separate tools needed."}, {"id": "MS102-R5-033", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Intune for Wingtip Toys. The company deploys a Win32 app via Intune. The app installation succeeds according to the return code, but Intune still shows the app as 'Not installed' on the device.\n\nQuestion:\nWhat is the most likely cause?", "choices": ["The Intune Management Extension service needs to be restarted", "The device hasn't synced with Intune since the installation", "The detection rule is misconfigured — it doesn't correctly identify the installed application, so Intune can't verify the installation", "The Win32 app cache is corrupted"], "answer": [2], "explanations": ["Incorrect. Restarting the IME service may trigger a re-evaluation, but if the detection rule is wrong, the app will still show as not installed.", "Incorrect. The Intune Management Extension evaluates detection rules locally on the device. A sync delay might cause a brief reporting delay, but the detection rule running locally would still show the correct status.", "Correct. After installing a Win32 app, Intune uses the detection rule to verify the app is actually installed. If the detection rule checks for the wrong file path, registry key, or MSI product code, Intune cannot confirm the installation and reports 'Not installed'. Fix: verify the detection rule matches the actual installation artifacts (correct file path, registry key, or MSI GUID).", "Incorrect. Cache corruption would cause installation failures, not post-install detection issues."], "tip": "Win32 app detection rules: File (path + version/size/date). Registry (key + value). MSI (product code). If app installs but shows 'Not installed', the detection rule doesn't match the actual installation. Test detection rules manually."}, {"id": "MS102-R5-034", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Northwind Traders. The company uses co-management with Configuration Manager and Intune. Some workloads are managed by ConfigMgr and others by Intune. The IT team wants to move the 'Compliance policies' workload from ConfigMgr to Intune.\n\nQuestion:\nWhat happens when the compliance policies workload is moved to Intune?", "choices": ["Only new devices use Intune compliance — existing devices continue using ConfigMgr compliance", "Both ConfigMgr and Intune evaluate compliance simultaneously and the strictest result wins", "All existing ConfigMgr compliance baselines are automatically migrated to Intune compliance policies", "Intune becomes the authority for device compliance evaluation — ConfigMgr compliance baselines no longer apply, and you must create equivalent Intune compliance policies"], "answer": [3], "explanations": ["Incorrect. The workload switch affects all devices in the targeted co-management collection (pilot or production), not just new devices.", "Incorrect. Only one authority manages each workload at a time. They don't evaluate simultaneously — it's either ConfigMgr or Intune for compliance.", "Incorrect. There is no automatic migration of ConfigMgr compliance baselines to Intune policies. You must manually create equivalent policies in Intune.", "Correct. When the compliance policies workload is switched to Intune, Intune becomes the sole authority for evaluating device compliance. ConfigMgr compliance baselines are no longer evaluated for the co-managed devices in the pilot or production collection. You must create equivalent Intune compliance policies before switching the workload to avoid a gap in compliance evaluation."], "tip": "Co-management workload switch: Create equivalent Intune policies BEFORE switching. Workloads: Compliance, Device config, Resource access, Windows Update, Endpoint Protection, Client apps. Switch per-workload, not all at once."}, {"id": "MS102-R5-035", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for A.Datum Corporation. The company uses conditional access with Terms of Use (ToU). The compliance team requires all users to acc
