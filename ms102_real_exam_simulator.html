ption = built-in Defender XDR AI feature. No configuration needed. Detects ransomware, BEC, and other advanced attacks. Automatically contains compromised assets (disable accounts, isolate devices)."}, {"id": "MS102-R2-026", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nContoso has 2,000 Windows 11 devices managed by Intune. You deploy a device configuration profile that configures Windows Firewall rules. After deployment, you notice that 300 devices show a status of 'Error' for the profile.\n\nYou need to troubleshoot the errors.\n\nQuestion:\nWhere should you look for detailed error information?", "choices": ["Tenant administration > Troubleshooting + support > Troubleshoot to search for a specific user's device issues", "Both A and C provide useful troubleshooting information, but the per-setting status on the profile gives the most specific error details", "Reports > Endpoint analytics > Proactive remediations", "Devices > Configuration profiles > select the profile > Device status > select an errored device > Per-setting status to see which specific setting failed"], "answer": [1], "explanations": ["Partially correct. The Troubleshoot blade provides an overview of profile deployment status for a specific user/device, but it may not show the per-setting error detail.", "Correct. Both approaches are useful: The profile's per-setting status (A) shows exactly which setting caused the error and the specific error code. The Troubleshoot blade (C) provides a user/device-centric view of all assigned profiles and their status. For the most detailed error information about which specific firewall rule failed, the per-setting status (A) is most valuable.", "Incorrect. Proactive remediations run custom detection and remediation scripts. They do not provide troubleshooting information for configuration profile deployment errors.", "Partially correct. The per-setting status shows exactly which firewall rule setting failed and the error code, but the Troubleshoot blade also provides useful aggregated information."], "tip": "Profile troubleshooting flow: Profile > Device status (which devices failed) > Per-setting status (which setting failed + error code). Also useful: Troubleshooting blade for user/device-centric view."}, {"id": "MS102-R2-027", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 for Trey Research. The company needs to ensure that external users (guests) invited to collaborate on SharePoint sites cannot download or print documents containing the sensitivity label 'Internal Only'. Guests should be able to view documents in the browser.\n\nQuestion:\nHow should you implement this?", "choices": ["Create a conditional access session policy with Defender for Cloud Apps app control that blocks download/print for guest users accessing files labeled 'Internal Only'", "Configure the SharePoint site sharing settings to block downloads for external users at the site level", "Configure the 'Internal Only' sensitivity label encryption to grant guests View Only permissions (View, Open, Read) but not Copy, Print, or Download", "Configure the 'Internal Only' sensitivity label to apply content marking only (headers/footers) and rely on SharePoint permissions"], "answer": [2], "explanations": ["Incorrect. While conditional access app control with Defender for Cloud Apps can control downloads, it applies session-level controls based on user type and conditions—it cannot directly filter by sensitivity label in session policies.", "Incorrect. SharePoint site-level download blocking applies to ALL users or ALL external users at the site level. It cannot be targeted based on sensitivity labels. Documents without the 'Internal Only' label should still be downloadable by guests.", "Correct. Configure the 'Internal Only' sensitivity label with encryption that grants guest/external users only View permissions (View Content, Open, Read). This prevents download of the original file, printing, and copying while allowing browser-based viewing. The encryption travels with the document regardless of where it's accessed.", "Incorrect. Content marking (headers/footers) is visual only and does not enforce access restrictions. Guests could still download and print documents."], "tip": "Sensitivity label encryption permissions control what users can DO with a document (view, edit, copy, print, download). For view-only external access: grant only View/Open/Read permissions to external users in the label encryption settings."}, {"id": "MS102-R2-028", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage 1,000 Windows 11 devices with Intune for Datum Corporation. The company wants to deploy Google Chrome as a managed browser and configure the following settings:\n- Homepage: https://portal.datum.com\n- Block incognito mode\n- Disable password manager\n- Force SafeSearch on Google\n\nQuestion:\nWhat is the most efficient way to deploy Chrome and manage these settings?", "choices": ["Deploy Chrome as a Win32 app, then use a Chrome Enterprise ADMX template imported into Intune Administrative Templates", "Deploy Chrome as a Windows app (Microsoft Store) and configure settings via Chrome's cloud management console", "Deploy Chrome MSI via PowerShell script and configure settings via registry keys in a separate script", "Deploy Chrome as a Win32 app, then create a device configuration profile using the Settings Catalog with Chrome ADMX-backed policies"], "answer": [3], "explanations": ["Incorrect. While importing Chrome ADMX templates works, the Settings Catalog already includes Chrome policies natively. Importing custom ADMX is unnecessary additional work.", "Incorrect. Chrome from the Microsoft Store has limitations and may not support all enterprise management features. Additionally, Chrome's cloud management console is a separate Google service, not integrated with Intune.", "Incorrect. Using PowerShell scripts for both deployment and configuration is harder to manage, doesn't provide Intune reporting, and requires manual registry key management instead of using built-in policy settings.", "Correct. Deploy Chrome as a Win32 app (.intunewin) for reliable installation with detection rules. Then use the Settings Catalog, which includes Chrome ADMX-backed policies natively (Google Chrome category). You can configure homepage, incognito mode, password manager, and SafeSearch directly without importing custom ADMX files."], "tip": "Chrome management in Intune: Deploy as Win32 app + Settings Catalog (has built-in Chrome ADMX policies). No need to import ADMX files manually. Settings Catalog covers 200+ Chrome policies natively."}, {"id": "MS102-R2-029", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nFabrikam uses Microsoft Intune to manage 3,000 Windows devices. The company needs to implement a phased rollout of Windows 11 24H2 feature update:\n- Phase 1: IT department (100 devices) — immediate availability\n- Phase 2: Early adopters (400 devices) — available 14 days after Phase 1\n- Phase 3: All remaining devices (2,500 devices) — available 30 days after Phase 1\n\nIf critical issues are found during any phase, the rollout must be pausable.\n\nQuestion:\nWhich Intune feature should you use?", "choices": ["Update rings for Windows 10 and later with different deferral periods for each group", "Windows Autopatch with deployment rings", "Feature updates for Windows 10 and later with gradual rollout settings for each phase group", "Quality updates for Windows 10 and later with expedited deployment"], "answer": [2], "explanations": ["Incorrect. Update rings control deferral periods for all updates (quality + feature), but they defer from the Microsoft release date, not from each other. You cannot configure 'Phase 2 starts 14 days after Phase 1' with update rings alone.", "Incorrect. Windows Autopatch is a separate service that automates Windows update management. It requires additional setup and uses its own deployment ring system. While it could work, the question asks about Intune-native features.", "Correct. Feature update policies in Intune allow you to target a specific Windows version (24H2) to device groups with gradual rollout options. You can configure different start dates or phases and pause the rollout if issues arise. Create three policies targeting each group with staggered availability dates.", "Incorrect. Quality updates handle monthly cumulative updates, not feature updates. Expedited quality updates bypass deferral for critical security patches, which is unrelated to feature update phased rollout."], "tip": "Feature update rollout control: Feature updates policy (specific version targeting + pause/resume + phased rollout). Update rings (ongoing deferral from release date). Different tools for different scenarios."}, {"id": "MS102-R2-030", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou are configuring Microsoft Defender for Endpoint for Northwind Traders. The security team wants endpoint detection and response (EDR) telemetry from all Windows devices. Some devices are running Windows 10 Pro (not Enterprise/Education) and do not have the full Defender for Endpoint Plan 2 license.\n\nQuestion:\nWhich Defender for Endpoint capability is available on Windows 10/11 Pro devices with a Microsoft 365 Business Premium license?", "choices": ["Defender for Endpoint Plan 2 is included in Business Premium and fully supports Windows Pro", "Full EDR with advanced hunting, automated investigation, and threat analytics", "EDR in block mode only, which provides post-breach protection but no full EDR telemetry", "Defender for Endpoint Plan 1 capabilities: next-generation protection, attack surface reduction, and device control, but NOT EDR"], "answer": [3], "explanations": ["Incorrect. Business Premium includes Plan 1, not Plan 2. Full Plan 2 capabilities require E5 or a Plan 2 add-on license.", "Incorrect. Full EDR with advanced hunting and automated investigation requires Defender for Endpoint Plan 2, which is included in Microsoft 365 E5 or as a standalone add-on. It is not included in Business Premium.", "Incorrect. EDR in block mode is a feature of Plan 2 that runs on devices using third-party antivirus. It is not the same as Plan 1 capabilities.", "Correct. Microsoft 365 Business Premium includes Defender for Endpoint Plan 1, which provides next-generation antivirus protection, attack surface reduction rules, device control, and web content filtering. However, it does NOT include EDR (endpoint detection and response), advanced hunting, or automated investigation capabilities."], "tip": "Defender for Endpoint licensing: Plan 1 (Business Premium, M365 E3 add-on) = prevention only (AV, ASR, device control). Plan 2 (M365 E5, standalone) = prevention + EDR + hunting + AIR + threat analytics."}, {"id": "MS102-R2-031", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nTailwind Traders uses Microsoft Intune with 1,500 Windows 11 devices. You need to configure a VPN profile that:\n- Uses IKEv2 as the tunnel protocol\n- Automatically connects when users access internal resources (*.tailwindtraders.internal)\n- Requires a device certificate for authentication\n- Splits tunneling so that only traffic to 10.0.0.0/8 goes through the VPN\n\nQuestion:\nWhich Intune configuration profile settings must you configure? (Select the setting that enables automatic VPN connection)", "choices": ["Connection type: IKEv2; Per-app VPN: Select all internal apps", "Connection type: IKEv2; Always-on VPN: Enable", "Connection type: IKEv2; VPN on-demand rules: Connect when DNS name matches *.tailwindtraders.internal", "Connection type: IKEv2; DNS suffix rules: tailwindtraders.internal with DNS servers for internal resolution"], "answer": [3], "explanations": ["Incorrect. Per-app VPN routes traffic from specific applications through the VPN. The requirement is domain-based triggering (*.tailwindtraders.internal), not app-based.", "Incorrect. Always-on VPN keeps the VPN connected at all times, which is not what's required. The scenario asks for automatic connection only when accessing internal resources, not a permanent connection.", "Incorrect. VPN on-demand rules with DNS matching are an iOS/macOS feature. For Windows VPN profiles in Intune, automatic connection based on DNS resolution uses DNS suffix rules and Name Resolution Policy Table (NRPT) entries.", "Correct. DNS-based split tunneling with DNS suffix rules triggers the VPN connection when the device attempts to resolve names matching the specified DNS suffix (tailwindtraders.internal). Combined with split tunneling routes (10.0.0.0/8), this provides on-demand VPN connectivity only when accessing internal resources."], "tip": "Windows VPN auto-trigger: DNS suffix rules + NRPT for domain-based triggering. Always-on = permanent connection. Per-app = app-based triggering. On-demand rules = iOS/macOS only."}, {"id": "MS102-R2-032", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Pratum Inc. The compliance team discovers that a former contractor's personal Gmail account was added as a forwarding address on an executive's mailbox, forwarding all incoming email externally. This went undetected for 3 months.\n\nThe team wants to prevent this from happening again.\n\nQuestion:\nWhat should you configure to detect and prevent unauthorized email forwarding to external addresses?", "choices": ["Create a mail flow rule (transport rule) that blocks external forwarding and logs matches to the compliance team", "Enable mailbox auditing and review the audit logs monthly", "Configure an alert policy in Microsoft Purview to notify when forwarding rules are created, AND create a remote domains policy blocking auto-forwarding", "Block POP/IMAP access for all mailboxes to prevent external client forwarding"], "answer": [2], "explanations": ["Incorrect. A mail flow rule blocking external forwarding prevents the data leak but doesn't provide proactive alerting when someone attempts to create a forwarding rule. The combination of detection and prevention is needed.", "Incorrect. Mailbox auditing records the creation of forwarding rules, but monthly log review is reactive and slow. The forwarding went undetected for 3 months in this scenario—periodic review is insufficient.", "Correct. Two controls are needed: (1) An alert policy (or mail flow rule) that notifies the compliance team when a forwarding rule to an external address is created—this is the detection control. (2) A remote domains policy (Set-RemoteDomain Default -AutoForwardEnabled $false) that blocks automatic forwarding to external domains at the transport level—this is the prevention control. Together, they detect attempts and block the actual forwarding.", "Incorrect. POP/IMAP controls external client access to mailboxes. Inbox forwarding rules operate server-side and are not affected by POP/IMAP settings."], "tip": "Email forwarding defense: Prevention = remote domain auto-forward blocking (transport-level block). Detection = alert policies or mail flow rules that notify on forwarding rule creation. Use both together."}, {"id": "MS102-R2-033", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 Apps deployment for Relecloud. The company uses OneDrive Known Folder Move (KFM) to sync Desktop, Documents, and Pictures folders to OneDrive. A user reports that after a fresh Windows installation and Microsoft 365 Apps setup, their OneDrive files are not available offline. The user needs to work on a flight without internet.\n\nQuestion:\nWhat should you configure to ensure critical files are available offline?", "choices": ["Disable Files On-Demand in the OneDrive sync client settings so all files are downloaded locally", "Switch from OneDrive to a local backup solution for offline access", "Configure OneDrive Files On-Demand to remain enabled, and use the 'Always keep on this device' attribute for the specific folders the user needs offline", "Increase the OneDrive storage quota for the user so all files can sync"], "answer": [2], "explanations": ["Incorrect. Disabling Files On-Demand downloads ALL OneDrive files to the local device, which may be tens or hundreds of gigabytes. This wastes disk space and bandwidth and is not scalable.", "Incorrect. Abandoning OneDrive for a local backup solution removes all the benefits of cloud sync, collaboration, and Known Folder Move. The scenario has a simple configuration solution.", "Correct. Keep Files On-Demand enabled (saves disk space for most files) and pin critical folders/files as 'Always keep on this device'. This downloads those specific files for offline access while other files remain cloud-only until accessed. This can be configured by the user or via Intune/Group Policy for specific folders.", "Incorrect. Storage quota affects how much the user can store in OneDrive, not which files are available offline. Files On-Demand controls local availability."], "tip": "OneDrive offline access: Files On-Demand (default) = cloud-only until opened. Pin files/folders as 'Always keep on this device' for guaranteed offline access. Best practice: enable FoD + pin critical folders."}, {"id": "MS102-R2-034", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for A.Datum Corporation. The company is deploying 300 new Surface devices using Windows Autopilot. The Enrollment Status Page (ESP) is configured to:\n- Block device use until all required apps and policies are installed\n- Track installation progress for Win32 apps: CRM Suite, Adobe Creative Cloud, and Microsoft Project\n- Show a timeout error if installation takes longer than 60 minutes\n\nAfter deployment, users report that the ESP frequently times out because Adobe Creative Cloud (3.5 GB) takes too long to download.\n\nQuestion:\nHow should you resolve this without removing the app from the ESP tracking?", "choices": ["Change the Adobe Creative Cloud app assignment from Required to Available, then re-add it as a required app after ESP completes", "Convert the Adobe Creative Cloud deployment to use the Intune Win32 app download optimization by enabling Content delivery network (CDN) fallback", "Increase the ESP timeout from 60 to 120 minutes", "Pre-cache the app content using Delivery Optimization peer-to-peer with a Configuration Manager distribution point"], "answer": [2], "explanations": ["Incorrect. Changing the assignment from Required to Available removes the app from ESP tracking entirely. The app would not be installed during the enrollment phase, and users would need to manually install it from Company Portal later.", "Incorrect. Intune Win32 apps already use CDN-based delivery. There is no separate 'CDN fallback' toggle. The issue is download time for a large file, not the delivery mechanism.", "Correct. The most straightforward fix is to increase the ESP timeout to accommodate the large app download. 60 minutes may be insufficient for a 3.5 GB download on slower network connections. Increasing to 90-120 minutes gives adequate time while still blocking device use until installation completes.", "Incorrect. While Delivery Optimization can help with bandwidth in subsequent deployments, the first device in a location still needs to download from the Intune CDN. Also, ConfigMgr distribution points require co-management setup, which adds complexity."], "tip": "ESP timeout: Default is 60 minutes. For environments with large required apps, increase to 90-120 minutes. Also consider: pre-provisioning (white glove) to pre-install apps before user gets the device."}, {"id": "MS102-R2-035", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nNorthwind Traders uses Microsoft 365 E5. The security team needs to identify all files in SharePoint Online and OneDrive that contain credit card numbers and are shared with external users. They need an ongoing view, not just a one-time report.\n\nQuestion:\nWhich Microsoft Purview feature provides this ongoing visibility?", "choices": ["Data Loss Prevention — create a DLP policy with the Credit Card Number SIT and monitor matches in DLP alerts", "Activity explorer — view DLP policy matches for credit card detection rules", "Content search — search for credit card numbers across SharePoint and OneDrive", "Content explorer — browse files matching the Credit Card Number sensitive information type"], "answer": [0], "explanations": ["Correct. Create a DLP policy targeting SharePoint and OneDrive with the Credit Card Number sensitive information type, with a rule condition of 'Content is shared with people outside my organization'. Configure the policy in test mode first or with alerting. DLP alerts provide ongoing monitoring of matches, and the Activity explorer shows real-time policy matches. This gives continuous visibility.", "Incorrect. Activity explorer shows DLP policy match activities, but only if a DLP policy is already configured. On its own, it doesn't provide the initial identification of files.", "Incorrect. Content search provides point-in-time search results. It does not provide ongoing monitoring or identify external sharing status.", "Incorrect. Content explorer shows files matching sensitive information types, but it does not filter by sharing status (externally shared or not). It shows content classification, not sharing context."], "tip": "Ongoing monitoring of sensitive data + sharing = DLP policy. One-time search = Content search. Browse classified content = Content explorer. View policy activity = Activity explorer (requires DLP policy first)."}, {"id": "MS102-R2-036", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage 500 Windows devices for Litware Inc. using Intune. The company has a Remote Desktop app (mstsc.exe) that IT staff use to connect to servers. The security team requires that only members of the IT Helpdesk group can use Remote Desktop on their managed devices. All other users must be blocked.\n\nQuestion:\nWhich Intune feature should you use?", "choices": ["Attack surface reduction rule: Block executable content from running unless they meet a prevalence, age, or trusted list criteria", "Device configuration profile with a blocked apps list including mstsc.exe for the non-IT group", "App protection policy blocking mstsc.exe for non-IT users", "Endpoint security > Application control using Windows Defender Application Control (WDAC) or AppLocker policy deployed via Intune"], "answer": [3], "explanations": ["Incorrect. This ASR rule blocks files based on prevalence and age heuristics across the Microsoft ecosystem. It is designed to block potentially malicious new executables, not to control access to legitimate built-in Windows tools like mstsc.exe.", "Incorrect. There is no 'blocked apps list' in Windows device configuration profiles. Windows device restrictions in Intune do not include app blocking for desktop Win32 applications (this feature exists for mobile platforms like iOS/Android).", "Incorrect. App protection policies (MAM) manage mobile app data protection (cut/copy/paste, PIN, encryption). They do not control which Windows desktop applications can run.", "Correct. Windows Defender Application Control (WDAC) or AppLocker policies deployed through Intune can control which applications users are allowed to run. Create a policy that allows mstsc.exe only for the IT Helpdesk group while blocking it for all other users. This provides granular application execution control."], "tip": "Windows app execution control: WDAC (recommended, modern) or AppLocker (legacy but simpler). Both can be deployed via Intune. Device restriction 'blocked apps' only works on mobile platforms."}, {"id": "MS102-R2-037", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nContoso uses Microsoft 365 E5 with Microsoft Defender for Endpoint. A security analyst discovers a suspicious PowerShell script running on multiple devices. The analyst wants to:\n1. Understand what the script does\n2. Find all devices where this script has executed\n3. Determine which user accounts ran the script\n\nQuestion:\nWhich feature in the Microsoft Defender portal should the analyst use?", "choices": ["Hunting > Advanced hunting > query the DeviceProcessEvents table for the PowerShell script command line across all devices", "Endpoint > Device inventory > select a device > Timeline > filter for PowerShell events", "Incidents > check if an automated incident exists for the suspicious script execution", "Endpoint > Vulnerability management > check for PowerShell-related vulnerabilities"], "answer": [0], "explanations": ["Correct. Advanced hunting with KQL queries against the DeviceProcessEvents table allows searching across all onboarded devices. The analyst can query for the script filename, command-line parameters, or script content hash to find: all devices where it ran (DeviceName), which users ran it (AccountName), when it executed (Timestamp), and the full command line (ProcessCommandLine).", "Incorrect. The device Timeline shows events for a single device. The analyst needs to search across ALL devices to find where the script executed, which the Timeline cannot do.", "Incorrect. An automated incident may exist if Defender detected the script as malicious, but the analyst's specific requirements include understanding the script's behavior, finding all execution instances, and identifying user accounts—which requires direct data querying via Advanced hunting.", "Incorrect. Vulnerability management tracks software vulnerabilities and missing patches. It does not track script execution or provide forensic investigation capabilities."], "tip": "Advanced hunting tables: DeviceProcessEvents = process execution. DeviceNetworkEvents = network connections. DeviceFileEvents = file operations. DeviceLogonEvents = sign-ins. Use these for cross-device forensic analysis."}, {"id": "MS102-R2-038", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Intune for Tailspin Toys. The company has a BYOD policy allowing personal iOS and Android devices. Users install the Company Portal and enroll. The IT team deploys Outlook, Teams, and OneDrive as required apps with app protection policies.\n\nA user reports they cannot open PDF attachments in Outlook. When they tap a PDF, Outlook displays: 'No app available to open this file.'\n\nQuestion:\nWhat is the most likely cause?", "choices": ["The app protection policy 'Send org data to other apps' is set to 'Policy managed apps' and no managed PDF reader is installed", "The device's operating system version is too old to support PDF rendering in Outlook", "The PDF attachment exceeds the maximum file size limit configured in the Outlook app configuration policy", "The PDF reader app is not installed on the device"], "answer": [0], "explanations": ["Correct. When the app protection policy restricts 'Send org data to other apps' to 'Policy managed apps', Outlook can only open files in apps that also have an app protection policy applied. If no managed PDF reader (like Adobe Acrobat with APP, or Microsoft Edge with APP) is installed, Outlook has no eligible app to hand the PDF to, resulting in the 'No app available' error.", "Incorrect. Outlook's built-in PDF viewing works on modern iOS and Android versions. An OS version issue would cause a different error, not an 'app availability' error.", "Incorrect. App protection policies do not have a maximum file size setting for attachments. File size limits are controlled by Exchange Online transport rules, not APP.", "Incorrect. If a PDF reader was installed and the APP allowed opening in any app, the PDF would open. The error 'No app available' combined with APP suggests the policy is restricting which apps can receive the data."], "tip": "APP 'Send org data to: Policy managed apps' = data can only go to apps with APP applied. Solution: deploy a managed PDF reader (Edge, Adobe Acrobat) with its own APP, or use 'Policy managed apps with OS sharing'."}, {"id": "MS102-R2-039", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Adventure Works. The company deploys a device restriction profile to 1,000 Windows 11 devices that blocks the Camera app. After deployment, several users report they cannot use their webcam in Microsoft Teams meetings even though only the Camera app was supposed to be blocked.\n\nQuestion:\nWhat happened?", "choices": ["The device restriction created a conflict with the Teams app protection policy", "The Teams meeting policy in the Teams admin center also needs to allow camera use", "The device restriction blocked the camera hardware entirely, not just the Camera app. Windows device restrictions disable the camera device, which affects ALL apps that use the camera.", "Microsoft Teams uses the same API as the Camera app, so blocking one blocks the other"], "answer": [2], "explanations": ["Incorrect. App protection policies manage data protection within apps (cut/copy/paste, encryption). They do not interact with device hardware restrictions.", "Incorrect. Teams meeting policies control whether camera features are available in Teams meetings, but they don't override a device-level camera block. The issue is the Intune device restriction, not Teams policy.", "Correct. The Windows device restriction setting for 'Camera' disables the camera device at the hardware/driver level, not just the Windows Camera app. This blocks ALL applications from accessing the camera, including Teams, Zoom, and any other video app. To block only the Camera app while allowing camera hardware for other apps, use AppLocker or WDAC instead.", "Incorrect. Teams and the Camera app use different application interfaces to access the camera hardware. However, the device restriction blocks at the hardware level, which is why both are affected."], "tip": "Device restriction 'Camera: Block' = disables camera HARDWARE (affects all apps). To block only the Camera app: use WDAC/AppLocker to block the Camera app executable while leaving the camera device enabled."}, {"id": "MS102-R2-040", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nWoodgrove Bank uses Microsoft 365 E5 with Microsoft Defender for Cloud Apps. The CISO wants to identify shadow IT usage—specifically, which unsanctioned cloud applications employees are using and how much data is being uploaded to them.\n\nQuestion:\nWhich Defender for Cloud Apps feature provides this visibility?", "choices": ["App governance — monitor OAuth app permissions and behavior", "Cloud App Catalog — browse and risk-score all cloud applications", "Connected apps — view API-connected cloud applications and their status", "Cloud discovery — analyze traffic logs to identify cloud apps in use, data volume, and users"], "answer": [3], "explanations": ["Incorrect. App governance monitors OAuth apps that have been granted permissions to access Microsoft 365 data. It focuses on app-to-API access patterns, not employee web traffic to cloud services.", "Correct but insufficient. The Cloud App Catalog rates cloud apps for risk, but it doesn't tell you which apps your users are actually using. It's a reference catalog, not a discovery tool.", "Incorrect. Connected apps shows cloud applications that are integrated with Defender for Cloud Apps via API connectors (sanctioned apps like Box, Salesforce). It does not discover unsanctioned shadow IT usage.", "Correct. Cloud discovery analyzes firewall and proxy traffic logs (or uses Defender for Endpoint network data) to identify which cloud applications employees are using, including upload/download volumes, number of users, and transaction counts. This is the purpose-built shadow IT discovery feature."], "tip": "Shadow IT discovery: Cloud discovery (traffic analysis → which apps are used). Cloud App Catalog (risk database → how risky are those apps). App governance (OAuth monitoring → what permissions do apps have)."}, {"id": "MS102-R2-041", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage 2,000 Windows devices for Contoso using Intune. A new corporate policy requires that all devices must encrypt removable USB drives with BitLocker To Go before any data can be written to them. If a USB drive is not encrypted, write access should be blocked while read access remains allowed.\n\nQuestion:\nWhich Intune profile should you configure?", "choices": ["Device compliance policy requiring BitLocker on removable drives", "Endpoint security > Disk encryption > BitLocker profile with 'Require encryption for removable data drives' and 'Block write access to removable drives not protected by BitLocker'", "Endpoint security > Attack surface reduction > Device control for removable storage", "Device configuration > Endpoint protection > BitLocker settings for removable drives"], "answer": [1], "explanations": ["Incorrect. Compliance policies evaluate device state but do not enforce settings. A compliance policy cannot enforce BitLocker encryption on removable drives—it can only check if the OS drive is encrypted.", "Correct. The endpoint security Disk encryption profile includes BitLocker settings specifically for removable data drives. 'Block write access to removable data drives not protected by BitLocker' allows reading unencrypted drives but blocks writing. Combined with enforcing BitLocker encryption on removable drives, this meets both requirements.", "Incorrect. ASR device control manages access to removable storage (allow/block read/write), but it does not enforce BitLocker encryption on removable drives. It can block USB access entirely but cannot conditionally allow encrypted-only writes.", "Incorrect. While endpoint protection templates include BitLocker settings, the recommended path for encryption management in Intune is under Endpoint security > Disk encryption. Both can work, but Endpoint security provides the current, streamlined experience."], "tip": "BitLocker To Go (removable drives): Endpoint security > Disk encryption. Key setting: 'Block write access to removable drives not protected by BitLocker' = read unencrypted, block write until encrypted."}, {"id": "MS102-R2-042", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nFabrikam uses Microsoft 365 E5 and has enabled Microsoft Purview Audit (Premium). The security team is investigating a potential data breach and needs to determine exactly which emails a suspected malicious insider accessed in a colleague's mailbox using delegate access over the past 90 days.\n\nQuestion:\nWhich audit log activity should they search for?", "choices": ["FolderBind — records when a mailbox folder is accessed", "MessageBind — records when a message is opened in the mailbox", "Send — records when emails are sent from the mailbox", "MailItemsAccessed — records when mail items are accessed via protocols like IMAP, MAPI, or OWA"], "answer": [3], "explanations": ["Incorrect. FolderBind records when a folder is opened (Inbox, Sent Items, etc.) but does not record which specific messages within the folder were accessed.", "Incorrect. MessageBind was the predecessor to MailItemsAccessed in older audit logging. It has been largely superseded by MailItemsAccessed in Audit Premium, which provides more comprehensive access tracking.", "Incorrect. The Send operation records when emails are sent from the mailbox, not when they are read or accessed. This would not show which emails the insider viewed.", "Correct. MailItemsAccessed is an Audit Premium event that records when mail items are accessed via mail protocols (sync or bind operations). This captures delegate access, OWA viewing, and client sync operations. It provides the detailed access records needed to determine exactly which emails were read by the delegated user over the 90-day period."], "tip": "Audit Premium key events: MailItemsAccessed = which emails were read/synced (critical for breach investigation). SearchQueryInitiatedExchange = what email searches were performed. SearchQueryInitiatedSharePoint = what SharePoint searches were done."}, {"id": "MS102-R2-043", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 Apps for 800 users at Trey Research using Intune. The company uses Sensitivity Labels from Microsoft Purview. The security team reports that users cannot see or apply sensitivity labels in Word, Excel, and PowerPoint desktop apps.\n\nThe Sensitivity labels are published in a label policy in the Purview compliance portal. Labels work correctly in Outlook and Office for the web.\n\nQuestion:\nWhat is the most likely cause?", "choices": ["The label policy needs to be assigned to specific user groups, not published to all users", "The Azure Information Protection unified labeling client add-in needs to be installed", "The Office apps are using a version that does not support built-in sensitivity labeling (requires version 2111 or later for Current Channel)", "Sensitivity labels require Microsoft 365 E5 licenses, which the users may not have"], "answer": [2], "explanations": ["Incorrect. If the label policy were not published to the users, labels would not work in any application—including Outlook and Office for the web. The fact that labels work in those apps means the policy is correctly published.", "Incorrect. The Azure Information Protection (AIP) unified labeling client is an older add-in that is being deprecated. Built-in sensitivity labeling in Office does not require the AIP client. If AIP is installed alongside a supported Office version, it can actually conflict with built-in labeling.", "Correct. Built-in sensitivity labeling in Office desktop apps requires a minimum version: Microsoft 365 Apps version 2111 (Current Channel) or later. If the Office apps are on an older version, sensitivity labels will not appear in the desktop apps. Labels work in Outlook (which may have different version requirements) and Office for the web (always up to date), which explains why those work.", "Incorrect. Sensitivity labels are available with various Microsoft 365 licenses including E3 (with limitations on auto-labeling). Basic manual labeling does not require E5."], "tip": "Sensitivity labels in Office desktop: Check the Office version first. Built-in labeling requires M365 Apps version 2111+. If labels work in web but not desktop, it's almost always a version issue."}, {"id": "MS102-R2-044", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nAdatum has 1,200 Windows 11 devices managed by Intune. You create a PowerShell remediation script (Proactive remediation) that checks if the Windows Time service (w32time) is running and restarts it if stopped. You assign the remediation to all devices with a schedule of every 1 hour.\n\nAfter 24 hours, you check the Remediations monitoring and see that 200 devices show 'Detection: Issue found, Remediation: Failed'.\n\nQuestion:\nWhat is the most likely cause of the remediation failure?", "choices": ["The remediation script has a syntax error that causes it to fail on execution", "The Windows Time service is disabled via Group Policy on those devices, and the remediation script cannot override Group Policy", "The 1-hour schedule is too frequent and Intune is throttling the script execution", "The remediation script is running in the user context and does not have permission to restart the Windows Time service — it needs to run as SYSTEM"], "answer": [3], "explanations": ["Incorrect. If the script had a syntax error, ALL devices would show remediation failure, not just 200. The detection script works correctly (it found the issue), suggesting the scripts are syntactically valid.", "Incorrect. While Group Policy could override local changes, the error would show as 'Remediation: Success' (the script ran and restarted the service) followed by the service stopping again at the next GP refresh. The status would cycle between 'No issue' and 'Issue found', not 'Remediation: Failed'.", "Incorrect. Intune does not throttle remediation scripts based on schedule frequency. A 1-hour schedule is within supported limits.", "Correct. By default, Proactive remediation scripts run in the user context. The Windows Time service (w32time) is a system service that requires SYSTEM or administrator privileges to restart. If the remediation script runs as the logged-in user (standard user), it will fail with 'Access Denied' when attempting Restart-Service w32time. The fix: set 'Run this script using the logged-on credentials' to No (runs as SYSTEM)."], "tip": "Proactive remediation execution context: 'Logged-on credentials: Yes' = user context (default). 'No' = SYSTEM context. Always use SYSTEM for scripts that modify services, registry (HKLM), or system files."}, {"id": "MS102-R2-045", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Wingtip Toys. The company operates in the European Union and must comply with GDPR. The DPO needs a dashboard showing:\n- The organization's compliance posture against GDPR requirements\n- Which GDPR controls are implemented vs. gaps\n- An overall compliance score\n- Recommended improvement actions\n\nQuestion:\nWhich Microsoft Purview feature provides this?", "choices": ["Compliance Manager with the GDPR assessment template", "Microsoft Secure Score with the compliance category filter", "Audit > Audit log search with GDPR-related activities filter", "Data classification > Overview dashboard"], "answer": [0], "explanations": ["Correct. Compliance Manager in Microsoft Purview provides pre-built assessment templates for regulations including GDPR. It shows: a compliance score, control implementation status (implemented, not implemented, partially implemented), gaps analysis, and prioritized improvement actions. This is the purpose-built tool for regulatory compliance posture assessment.", "Incorrect. Microsoft Secure Score measures security posture (MFA, conditional access, Defender features), not regulatory compliance. It has no GDPR-specific assessment capability.", "Incorrect. Audit log search records user and admin activities. It does not provide compliance posture assessment, scoring, or gap analysis against regulatory frameworks.", "Incorrect. Data classification overview shows statistics about sensitive information types, sensitivity labels, and retention labels in your environment. It does not map to GDPR regulatory requirements or provide compliance gap analysis."], "tip": "Compliance posture → Compliance Manager (regulatory assessments + scores + gap analysis). Security posture → Secure Score (security configuration + improvement recommendations). Different tools for different purposes."}, {"id": "MS102-R2-046", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Relecloud. The company wants to allow users to access corporate resources from both managed (enrolled) and unmanaged (personal) Windows devices. However, the security requirements differ:\n- Managed devices: full access to all Microsoft 365 apps\n- Unmanaged devices: browser-only access to SharePoint Online and Exchange Online, with no file download allowed\n\nQuestion:\nHow should you implement the restriction for unmanaged devices?", "choices": ["Configure SharePoint tenant-level settings to block unmanaged device access", "Create a conditional access policy for unmanaged devices that blocks access to all cloud apps except SharePoint and Exchange", "Create a conditional access policy for unmanaged devices with session controls using Conditional Access App Control (Defender for Cloud Apps) to enforce browser-only access with download blocking", "Create an app protection policy for Windows that restricts data transfer on unmanaged devices"], "answer": [2], "explanations": ["Incorrect. SharePoint tenant-level unmanaged device settings can limit access but apply to all unmanaged access globally. They don't provide the granular control of allowing browser access while blocking downloads, combined with Exchange policies.", "Incorrect. This allows full access to SharePoint and Exchange from unmanaged devices. It does not enforce browser-only access or block file downloads.", "Correct. Conditional access with session controls using Conditional Access App Control (MCAS/Defender for Cloud Apps) provides granular session-level controls. For unmanaged devices (filter: device is not compliant or not Azure AD joined), enforce: browser-only access (block desktop app sign-in), and configure session policy to block downloads while allowing browser viewing.", "Incorrect. App protection policies for Windows are limited in scope and don't provide the download-blocking capability for browser sessions that conditional access app control provides."], "tip": "Unmanaged device access control: Conditional access (which apps) + Session controls via MCAS/Defender for Cloud Apps (how they can interact with data). Session controls: block download, block upload, block print, block copy."}, {"id": "MS102-R2-047", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nContoso uses Microsoft 365 E5. The security team configures a Safe Attachments policy for Exchange Online. The policy is set to 'Dynamic Delivery' mode.\n\nA user receives an email with a Word document attachment. The user opens the email in Outlook.\n\nQuestion:\nWhat happens to the attachment while Safe Attachments is scanning it?", "choices": ["The email and attachment are delivered normally, and a background scan occurs. If malicious, the attachment is removed retroactively.", "The email is delivered but the attachment is permanently removed. The user must request the attachment from the sender again.", "The email is delivered immediately but the attachment is replaced with a placeholder. The original attachment becomes available after scanning confirms it is safe.", "The entire email is held in quarantine until scanning is complete; the user does not see the email"], "answer": [2], "explanations": ["Incorrect. This describes a 'monitor-only' or retroactive approach. Dynamic Delivery actively replaces the attachment during scanning—it doesn't deliver the original attachment and remove it later.", "Incorrect. The attachment is not permanently removed. It is temporarily replaced with a placeholder and restored after scanning (if clean).", "Correct. Dynamic Delivery delivers the email body immediately to the user's inbox. The attachment is replaced with a placeholder document that informs the user the attachment is being scanned. Once scanning completes (typically within minutes), the placeholder is replaced with the original attachment. If the attachment is found to be malicious, it is removed and the user is notified.", "Incorrect. This describes the 'Block' mode behavior, where emails with detected malicious attachments are quarantined. Dynamic Delivery delivers the email body immediately."], "tip": "Safe Attachments modes: Block = quarantine entire email. Replace = remove attachment (deliver email without it). Dynamic Delivery = deliver email with placeholder, swap in real attachment after scan. Monitor = log only."}, {"id": "MS102-R2-048", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Intune for A.Datum. The company deploys a Win32 application (.intunewin) to 1,000 Windows devices. The app uses the following detection rule:\n- Registry: HKLM\\SOFTWARE\\A.Datum\\CRMApp, Value: Version, Value data equals 3.5.1\n\nAfter deployment, Intune reports that 500 devices show the app as 'Not installed' even though the app was successfully installed. You verify manually on several 'Not installed' devices that the app is indeed installed and running.\n\nQuestion:\nWhat is the most likely cause of the incorrect detection?", "choices": ["The detection rule should use 'Version' data type instead of 'String' comparison", "The Win32 app content was corrupted during upload and needs to be re-uploaded", "The Intune management extension service is not running on those devices", "The detection rule is checking the 64-bit registry but the app installs to the 32-bit registry (WoW6432Node) — the detection rule needs 'Associated with a 32-bit app on 64-bit clients' checked"], "answer": [3], "explanations": ["Incorrect. While using the correct data type matters, string comparison would still find the version value '3.5.1' if the registry path were correct. The issue is the registry path, not the comparison type.", "Incorrect. If the content were corrupted, installation would fail on all devices, not just show incorrect detection on some.", "Incorrect. If the Intune management extension weren't running, the app wouldn't have been installed successfully in the first place. The app IS installed, but detection fails.", "Correct. On 64-bit Windows, 32-bit applications write registry keys to HKLM\\SOFTWARE\\WOW6432Node\\ instead of HKLM\\SOFTWARE\\. If the detection rule checks HKLM\\SOFTWARE\\A.Datum\\CRMApp but the app wrote to the WoW6432Node path, the detection fails. Enabling 'Associated with a 32-bit app on 64-bit clients' in the detection rule redirects the check to the correct WoW6432Node path."], "tip": "Win32 app detection on 64-bit Windows: 32-bit apps write to WoW6432Node. Check 'Associated with a 32-bit app on 64-bit clients' to redirect registry detection to the correct path. This is the #1 cause of 'installed but showing as Not installed'."}, {"id": "MS102-R2-049", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nFabrikam uses Intune to manage 800 Windows devices. The company recently implemented a Zero Trust security model. As part of this, they want to ensure that devices can only access corporate resources if they meet ALL of the following conditions:\n- Device is Azure AD joined\n- Device is enrolled in Intune\n- Device is compliant with all compliance policies\n- User has completed MFA\n- User risk level is not High\n\nQuestion:\nHow should you implement this?", "choices": ["Use Intune compliance policies to check all conditions and block noncompliant devices", "Create separate conditional access policies for each condition to maintain granular control", "Create a single conditional access policy with all conditions: Require compliant device AND Require MFA AND User risk: exclude High", "Configure a single conditional access policy: Grant requires both 'Require device to be marked as compliant' and 'Require multi-factor authentication', with User risk condition set to High → Block"], "answer": [3], "explanations": ["Incorrect. Compliance policies evaluate device state but cannot enforce MFA or user risk conditions. These are conditional access capabilities, not Intune compliance capabilities.", "Incorrect. Separate policies for each condition may not enforce all conditions simultaneously. A user could satisfy one policy without satisfying all. Conditional access policies are independently evaluated, and access is granted if ANY policy grants it.", "Incorrect. You cannot combine 'Require compliant device' and 'Require MFA' as AND conditions in the same grant control using the standard 'Require all the selected controls' without also properly configuring the user risk condition as a separate control.", "Correct. A single conditional access policy targeting all cloud apps: Grant control requires 'Require device to be marked as compliant' (ensures Azure AD joined + Intune enrolled + compliant) AND 'Require multi-factor authentication' with 'Require all the selected controls'. Add a condition: User risk = High → Block. This enforces all five conditions. Device compliance inherently requires Azure AD join and Intune enrollment."], "tip": "Zero Trust conditional access: 'Require compliant device' covers Azure AD join + Intune enrollment + compliance. Add 'Require MFA' for authentication strength. Add User risk condition for identity protection. One comprehensive policy."}, {"id": "MS102-R2-050", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nLitware uses Microsoft 365 E5. The organization wants to implement a governance process for Microsoft Teams. The requirements are:\n- Teams must have at least one owner at all times\n- Teams with no activity for 90 days should be automatically archived\n- Teams that have been inactive for 180 days should be automatically deleted\n- Team creation should be restricted to members of the IT department\n\nQuestion:\nWhich combination of features implements these requirements?", "choices": ["Microsoft Purview retention policy for Teams + Azure AD group creation restriction", "Azure AD group expiration policy (180 days) + Azure AD group creation restriction to IT department + Teams inactivity policy for archiving", "Power Automate flows to check team activity and archive/delete inactive teams + Azure AD group naming policy", "Teams admin center policies for all four requirements"], "answer": [1], "explanations": ["Incorrect. Purview retention policies control data retention (keeping or deleting content), not team lifecycle management (archiving, deleting inactive teams). Retention policies don't archive or delete the team itself.", "Correct. (1) Azure AD group expiration policy set to 180 days handles automatic deletion—owners are notified before expiration, and unrenewed groups (Teams) are deleted. (2) Azure AD group creation restriction (via PowerShell: only the IT department security group can create Microsoft 365 groups/Teams) handles team creation restriction. (3) Teams admin center or custom policies handle the 90-day archive requirement. (4) Owner requirement is enforced by default in Teams (teams must have an owner, and orphaned teams can be managed via policy).", "Incorrect. While Power Automate could be built to handle lifecycle, it's a custom solution requiring development and maintenance. Azure AD group expiration is the native, supported mechanism for team lifecycle management.", "Incorrect. The Teams admin center does not provide automatic archiving based on inactivity, automatic deletion, or group creation restrictions. These require Azure AD-level configuration."], "tip": "Teams lifecycle: Azure AD group expiration = automatic deletion of inactive teams. Azure AD group creation restriction = control who can create teams. Teams inactivity policies (preview) = archive inactive teams."}]}, {"title": "Practice Exam 3", "questions": [{"id": "MS102-R3-001", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Contoso. The company deploys Windows Hello for Business to all Azure AD joined Windows 11 devices. Users must use a PIN or biometric to sign in. The security policy requires:\n- Minimum PIN length of 6 digits\n- PIN must include at least one uppercase letter\n- PIN recovery must be enabled\n- Trusted Platform Module (TPM) is required\n\nQuestion:\nWhere should you configure these settings?", "choices": ["All three options can configure Windows Hello, but Endpoint security > Account protection is the recommended location in Intune", "Device configuration > Identity protection > Windows Hello for Business", "Endpoint security > Account protection > Windows Hello for Business profile", "Azure AD > Devices > Windows Hello for Business > Tenant-wide policy"], "answer": [0], "explanations": ["Correct. Windows Hello for Business can be configured in multiple places: (1) Endpoint security > Account protection (recommended), (2) Device configuration > Identity protection, (3) Azure AD tenant-wide settings. The Endpoint security path is recommended because it provides the most comprehensive settings including PIN complexity, TPM requirement, and recovery options.", "Partially correct. Identity protection templates include Windows Hello settings but this is the older configuration path.", "Partially correct. This is the recommended path, but not the only valid option.", "Partially correct. The Azure AD tenant-wide policy sets basic enable/disable and some settings, but provides fewer options than Intune profiles."], "tip": "Windows Hello for Business configuration hierarchy: Intune Endpoint security > Account protection (most control) > Device config > Identity protection (legacy path) > Azure AD tenant-wide (basic settings). If multiple are configured, Intune policy takes precedence."}, {"id": "MS102-R3-002", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nPratum Inc. uses Microsoft 365 E5. A departing employee is suspected of stealing proprietary source code by uploading files to a personal cloud storage account in the two weeks before their resignation. The insider risk management policy 'Data theft by departing users' flagged the activity.\n\nThe risk analyst needs to review the specific files that were uploaded and the destinations.\n\nQuestion:\nWhere should the analyst review this information?", "choices": ["Microsoft Defender for Endpoint > Device timeline > filter for file upload activities", "Microsoft Purview > Insider risk management > Alerts > select the alert > Activity explorer tab showing the detailed timeline of file activities", "Microsoft Purview > Audit > Search for FileUploaded activities by the user", "Microsoft Purview > eDiscovery > Search the user's OneDrive for recently modified files"], "answer": [1], "explanations": ["Incorrect. Defender for Endpoint device timeline shows endpoint activities but doesn't correlate them with insider risk policy triggers or departing employee context.", "Correct. The insider risk management Activity explorer provides a detailed timeline of all activities that triggered the risk alert, including file names, upload destinations (e.g., Dropbox, Google Drive), timestamps, and data volume. This is the purpose-built investigation view for insider risk alerts.", "Incorrect. Audit logs can show some file activities, but they don't provide the insider risk context (departing user, risk score, correlated activities) or external upload destination details.", "Incorrect. eDiscovery searches for content stored in Microsoft 365, not files uploaded to external cloud storage. The source code was uploaded externally, so eDiscovery wouldn't capture the destination."], "tip": "Insider risk investigation workflow: Alerts → Activity explorer (detailed timeline) → User activity (all activities across a time range) → Content explorer (review actual file content). All within the Insider risk management console."}, {"id": "MS102-R3-003", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Intune for Woodgrove Bank. The company deploys Microsoft Outlook on managed iOS devices. The IT team needs to configure Outlook with the following settings:\n- Pre-configure the user's corporate email account (Exchange Online) so users don't need to manually set it up\n- Set the default signature to 'Woodgrove Bank - Confidential'\n- Block users from adding personal email accounts to Outlook\n\nQuestion:\nWhich Intune feature should you use for these configurations?", "choices": ["App configuration policy for managed devices targeting Microsoft Outlook", "App protection policy for Outlook", "Device restriction profile blocking personal accounts", "Device configuration profile > Email profile for iOS"], "answer": [0], "explanations": ["Correct. App configuration policies for managed devices allow you to push configuration settings directly to Outlook. You can: pre-configure the Exchange Online account using the user's UPN/email, set a default email signature, and restrict account types (block personal accounts by setting 'Allowed account types' to organizational accounts only).", "Correct but limited. App protection policies control data protection (PIN, encryption, cut/copy restrictions) but do not pre-configure email accounts, default signatures, or block personal account additions.", "Incorrect. Device restriction profiles control device-level features (camera, screenshots, etc.), not app-specific configurations like email account restrictions within Outlook.", "Incorrect. iOS email profiles configure the native iOS Mail app, not Microsoft Outlook. Outlook has its own configuration interface through app configuration policies."], "tip": "Outlook mobile configuration: App configuration policy (pre-configure accounts, signatures, features). App protection policy (data protection: PIN, encryption, copy restrictions). These are complementary—use both together."}, {"id": "MS102-R3-004", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nTailspin Toys uses Intune with 1,000 Windows devices. The company needs to deploy a security baseline that configures:\n- Windows Firewall rules\n- BitLocker settings\n- Microsoft Defender Antivirus settings\n- Attack surface reduction rules\n- Windows Update settings\n\nUsing a single, consistent configuration based on Microsoft's security recommendations.\n\nQuestion:\nWhich Intune feature provides this?", "choices": ["Deploy the Windows security baseline from Endpoint security > Security baselines", "Create individual device configuration profiles for each security setting category", "Import a custom ADMX template with Microsoft's recommended security settings", "Deploy the Microsoft Defender for Endpoint security baseline"], "answer": [0], "explanations": ["Correct. The Windows security baseline in Intune (Endpoint security > Security baselines) provides Microsoft's recommended security configurations including Firewall, BitLocker, Defender AV, ASR, and more. It's a pre-configured, tested set of settings that follows Microsoft's security best practices.", "Incorrect. While creating individual profiles works, it requires configuring each setting manually across multiple profiles. Security baselines provide pre-configured, Microsoft-recommended settings in a single deployment.", "Incorrect. Custom ADMX templates require manual configuration of each setting. Security baselines provide Microsoft's recommended values out of the box, reducing configuration effort and ensuring best-practice alignment.", "Incorrect. The Defender for Endpoint baseline covers Defender-specific settings (AV, ASR, EDR) but does not include Windows Firewall, BitLocker, or Windows Update settings. It's a subset of the full security baseline."], "tip": "Security baselines in Intune: Windows baseline (broad, covers OS + security features) vs. Defender for Endpoint baseline (Defender-specific) vs. Edge baseline (browser-specific). Use Windows baseline for comprehensive OS security."}, {"id": "MS102-R3-005", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 E5 for Adventure Works. The legal team asks you to configure a retention policy that:\n- Retains all SharePoint documents for 5 years from the date the document was last modified\n- After 5 years, documents should be automatically deleted\n- The policy should apply to ALL SharePoint sites, including those created in the future\n\nQuestion:\nHow should you configure the retention policy?", "choices": ["Create a retention policy with location: All SharePoint sites, retention period: 5 years based on 'When items were last modified', action: Delete items automatically", "Create a retention policy per site with 5-year retention — new sites must be added manually as they're created", "Create a retention label with 5-year retention from last modified, then auto-apply it to all SharePoint content", "Create a retention policy with location: All SharePoint sites, retention period: 5 years based on 'When items were created', action: Delete"], "answer": [0], "explanations": ["Correct. A retention policy targeting 'All SharePoint sites' with 5-year retention based on 'When items were last modified' and automatic deletion after the retention period. The 'All sites' scope automatically includes future sites.", "Incorrect. Creating per-site policies is not scalable and would miss new sites. The 'All SharePoint sites' location in a retention policy automatically covers existing and future sites.", "Incorrect. While retention labels can be configured with 'last modified' as the trigger, they require per-item application (manual or auto-apply). Auto-applying labels adds complexity and processing time. For a blanket policy across all sites, a retention policy is simpler and more appropriate.", "Incorrect. The retention trigger should be 'When items were last modified', not 'When items were created'. Using creation date would delete documents that were recently modified but created more than 5 years ago."], "tip": "Retention policy vs. retention label: Policy = blanket coverage across locations (simpler, automatic). Label = per-item control (more granular, supports disposition review). For org-wide retention: use policies."}, {"id": "MS102-R3-006", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nFabrikam uses Intune to manage 2,000 Windows 11 devices. The IT team deploys a device configuration profile that sets the desktop wallpaper to a corporate-branded image. After deployment, they receive complaints that the wallpaper only applies when users sign in for the first time but reverts to the default after a reboot.\n\nYou investigate and find the wallpaper setting is configured in a Device restriction profile under Personalization.\n\nQuestion:\nWhat is the likely cause of the wallpaper reverting?", "choices": ["The wallpaper image URL is hosted on a server that becomes unreachable after the first sign-in", "The device restriction wallpaper setting applies only during initial provisioning and is not enforced continuously — use a CSP-based Settings Catalog policy instead for persistent enforcement", "The Group Policy Wallpaper setting is overriding the Intune configuration at each reboot", "The user has administrator rights and is changing the wallpaper manually"], "answer": [1], "explanations": ["Incorrect. The wallpaper is downloaded and cached locally. URL availability after initial download wouldn't cause the wallpaper to revert.", "Correct. The Device restriction Personalization settings (desktop wallpaper image) in some configurations apply the wallpaper once but don't continuously enforce it. Using the Settings Catalog to configure the DesktopImageUrl and LockScreenImageUrl CSP settings provides more reliable persistent enforcement, as these settings are re-applied at each policy refresh.", "Incorrect. If a Group Policy was overriding the setting, the wallpaper would either never apply from Intune or consistently show the GP version. The intermittent behavior (works on first login, reverts later) suggests the Intune setting is not being re-enforced.", "Incorrect. Even with admin rights, if the Intune policy properly enforced the wallpaper, the user's changes would be overwritten at the next policy sync. The issue is that the setting isn't being re-enforced."], "tip": "Intune configuration profiles: Device restrictions template = basic settings that may not re-enforce on every sync. Settings Catalog = more granular control with CSP-backed settings that are persistently enforced. When in doubt, prefer Settings Catalog."}, {"id": "MS102-R3-007", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou are the security administrator for Northwind Traders (Microsoft 365 E5). The CEO's executive assistant reports that they received an email from what appeared to be a trusted vendor, containing a link to download an invoice. The assistant clicked the link and was redirected to a phishing page.\n\nMicrosoft Defender for Office 365 Safe Links was enabled. You need to determine why Safe Links did not block the URL.\n\nQuestion:\nWhich is the most likely reason Safe Links did not protect the user?", "choices": ["Safe Links does not protect against phishing pages, only malware downloads", "Safe Links only scans URLs at the time of email delivery; the URL was clean at delivery time but weaponized later (time-of-delivery vs. time-of-click)", "The URL was on the tenant-level Safe Links allow list (Global settings > Do not rewrite URLs)", "The user was not covered by a Safe Links policy because the default policy was not configured"], "answer": [2], "explanations": ["Incorrect. Safe Links protects against both phishing pages and malware downloads. When a user clicks a link, Safe Links checks the URL against known phishing sites and detonates the target page if needed.", "Incorrect. Safe Links in Defender for Office 365 performs time-of-click URL checking, not just time-of-delivery. When the user clicks the link, Safe Links re-checks the URL in real time. A URL that was clean at delivery and later weaponized would still be caught at click time.", "Correct. If the phishing URL or its domain was added to the tenant-level allow list in Safe Links global settings ('Do not rewrite the following URLs'), Safe Links would not scan or block it. This is a common misconfiguration—allow lists bypass all Safe Links protection for the listed URLs.", "Incorrect. Microsoft 365 E5 includes a default Safe Links policy (Built-in protection) that covers all users. If no custom policy exists, the built-in protection still provides coverage."], "tip": "Safe Links time-of-click: Checks URL when user clicks, not when email arrives. If Safe Links 'didn't work', check: (1) Allow list entries, (2) Policy scope/assignment, (3) Safe Links rewrites being stripped by third-party tools."}, {"id": "MS102-R3-008", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Intune for Relecloud. The company has 500 Windows devices and wants to ensure Microsoft Edge is the default browser for all managed devices. Users should not be able to change the default browser setting. Additionally, Microsoft Edge must open all .pdf files instead of Adobe Acrobat.\n\nQuestion:\nHow should you configure this?", "choices": ["Use Microsoft Edge app configuration to set Edge as default in its own settings", "Deploy a PowerShell script that sets the default browser and file association registry keys", "Create a device configuration profile using the Settings Catalog to configure default app associations using an XML file that maps HTTP/HTTPS protocols and .pdf extension to Edge", "Create a Group Policy preference to set Edge as the default browser"], "answer": [2], "explanations": ["Incorrect. Edge's own settings allow users to request becoming the default browser, but this is a user-facing prompt, not an enforced policy. Users could change it back.", "Incorrect. Setting registry keys for default app associations via PowerShell is unreliable in Windows 10/11. Microsoft uses a hash-based validation system for default app settings that prevents direct registry modification by scripts.", "Correct. Windows 10/11 requires a properly formatted DefaultAssociations.xml file to set default app associations. In Intune, use the Settings Catalog to configure 'Default Associations Configuration' which pushes the XML file that maps HTTP, HTTPS, .htm, .html protocols to Edge and .pdf extension to Edge. This is the Microsoft-supported method and cannot be overridden by users.", "Incorrect. Group Policy preferences for default browser are not enforced on Azure AD-joined devices without on-premises infrastructure. Also, GPP for default associations has limited reliability in Windows 10/11."], "tip": "Default app associations in Windows 10/11: Must use DefaultAssociations.xml deployed via Intune Settings Catalog or GPO. Direct registry editing doesn't work (hash validation). This is the only reliable method."}, {"id": "MS102-R3-009", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nA.Datum Corporation uses Microsoft Intune with 1,500 Windows devices. The company is planning to migrate from Windows 10 22H2 to Windows 11 23H2. Before deploying the feature update, the IT team wants to ensure all devices are compatible with Windows 11 (TPM 2.0, Secure Boot, compatible CPU).\n\nQuestion:\nWhich tool should the IT team use to assess device readiness?", "choices": ["Run a PowerShell script across all devices that checks TPM and CPU compatibility", "Download and run the PC Health Check app on each device", "Use Advanced Hunting in Defender for Endpoint to query device hardware capabilities", "Microsoft Intune > Reports > Windows updates > Windows feature update device readiness report"], "answer": [3], "explanations": ["Incorrect. A PowerShell script could check TPM and CPU, but building a comprehensive compatibility check script is reinventing the wheel when Intune provides a built-in readiness report.", "Incorrect. The PC Health Check app works on individual devices but is not scalable for 1,500 devices. It requires manual installation and running on each device.", "Incorrect. While Advanced Hunting can query some device properties, it doesn't provide a dedicated readiness assessment for Windows 11 compatibility. The built-in readiness report is more comprehensive and purpose-built.", "Correct. The Windows feature update device readiness report in Intune identifies which devices are eligible for Windows 11 and which have compatibility issues (missing TPM 2.0, unsupported CPU, insufficient storage, etc.). This provides a centralized view across all 1,500 managed devices without any on-device action."], "tip": "Windows 11 readiness assessment: Intune > Reports > Windows updates > Feature update device readiness. Built-in report covering TPM, Secure Boot, CPU, RAM, storage, DirectX. No scripts or on-device tools needed."}, {"id": "MS102-R3-010", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nWingtip Toys uses Microsoft 365 E5. The CISO wants to prevent users from granting consent to third-party applications that request high-privilege permissions (like read all email, access all files, or send mail on behalf of the user). Regular low-privilege app consent should still be allowed.\n\nQuestion:\nWhat should you configure in Microsoft Entra?", "choices": ["Configure the admin consent workflow and set user consent to 'Allow user consent for apps from verified publishers, for selected permissions' — only allow low-risk permissions", "Configure a Defender for Cloud Apps policy to revoke high-privilege OAuth app consents", "Disable user consent entirely — all app consents require admin approval", "Create a conditional access policy blocking access to third-party apps"], "answer": [0], "explanations": ["Correct. In Microsoft Entra > Enterprise applications > Consent and permissions > User consent settings, select 'Allow user consent for apps from verified publishers, for selected permissions'. Then configure the permission classification to define which permissions are 'Low risk' (e.g., User.Read, openid, profile) and allow user consent only for those. High-privilege permissions (Mail.ReadWrite, Files.ReadWrite.All) require admin consent workflow approval.", "Incorrect. Defender for Cloud Apps can detect and revoke excessive OAuth app permissions, but this is reactive (after consent is granted). The requirement is to prevent the consent from happening in the first place.", "Incorrect. Disabling all user consent creates excessive admin overhead. Every low-privilege app request (read user profile, sign in) would require admin approval, which is not necessary for basic permissions.", "Incorrect. Conditional access controls access to apps, not the OAuth consent process. Users could still consent to apps; they just might be blocked from accessing them."], "tip": "OAuth consent strategy: Allow user consent for low-risk, verified publisher permissions only. Require admin consent workflow for high-privilege permissions. Configure permission classifications in Entra to define 'low risk'."}, {"id": "MS102-R3-011", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Microsoft Intune for Contoso. The IT team deploys a device configuration profile to 500 Windows devices. The profile configures Wi-Fi settings for the corporate network. Two weeks later, you decide the profile is no longer needed and delete it from Intune.\n\nQuestion:\nWhat happens to the Wi-Fi settings on the 500 devices after the profile is deleted?", "choices": ["The devices become noncompliant until a new profile is assigned", "The Wi-Fi settings remain on the devices — deleting a profile does not revert settings to pre-profile state on Windows", "The Wi-Fi settings are immediately removed from all devices", "The Wi-Fi settings are removed after the next device sync"], "answer": [1], "explanations": ["Incorrect. Compliance is evaluated by compliance policies, not configuration profiles. Removing a configuration profile does not affect compliance status.", "Correct. When you delete or unassign a device configuration profile in Intune, Windows devices retain the configured settings (in most cases). The settings are 'tattooed' — they remain at whatever value the profile set. This is true for many Windows CSP settings. The device simply stops reporting compliance for that profile. To revert settings, you would need to deploy a new profile with the original/default values.", "Incorrect. Deleting a device configuration profile does not necessarily remove the configured settings from Windows devices. The behavior varies by setting type and platform.", "Incorrect. The profile removal is processed at next sync, but for most Windows configuration settings, removing the profile does not remove the configured values."], "tip": "Profile removal behavior varies by platform: Windows = settings typically persist ('tattooed'). iOS/Android = settings are usually removed when the profile is unassigned. Always test profile removal behavior before relying on it."}, {"id": "MS102-R3-012", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou are configuring Microsoft Defender for Endpoint for Tailwind Traders. The SOC team needs to create custom alert rules that trigger when a specific sequence of activities is detected:\n1. A user downloads a file from an external URL\n2. Within 5 minutes, a new scheduled task is created on the same device\n3. Within 10 minutes, outbound network connection to a known C2 IP range is observed\n\nQuestion:\nWhich feature should the SOC team use to create this multi-step detection?", "choices": ["Alert tuning rules in Endpoint > Configuration > Alert tuning", "Attack surface reduction rules with custom exclusions", "Indicator of compromise (IoC) rules for the C2 IP addresses", "Custom detection rules using KQL (Kusto Query Language) in Advanced Hunting"], "answer": [3], "explanations": ["Incorrect. Alert tuning rules modify existing alert severity or suppress alerts. They cannot create new multi-step detection logic.", "Incorrect. ASR rules block specific attack surface behaviors (like Office creating child processes). They cannot create custom multi-step detection logic or correlate activities across different event types.", "Incorrect. IoC rules for C2 IPs would generate alerts for network connections to those IPs, but they cannot correlate the multi-step sequence (file download → scheduled task → C2 connection) as a single detection.", "Correct. Custom detection rules in Advanced Hunting allow you to write KQL queries that correlate multiple tables (DeviceFileEvents for file downloads, DeviceProcessEvents for
