 Office 365 focuses on email threats, not identity-level persistence mechanisms. It won't discover or remove rogue admin accounts or mail forwarding rules."], "tip": "Post-compromise checklist: Reset passwords + revoke tokens + remove rogue accounts + remove mail rules + check OAuth app consents + review audit logs. Always look for ALL persistence mechanisms."}, {"id": "MS102-R1-038", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou need to deploy a custom line-of-business (LOB) Android app to 500 corporate-owned, fully managed Android Enterprise devices using Microsoft Intune. The app is not available in the Google Play Store. You have the APK file.\n\nQuestion:\nHow should you add this app in the Intune admin center?", "choices": ["Apps > Android > Add > Managed Google Play app > Upload the APK as a private app", "Apps > Android > Add > Android store app > Enter a custom URL to the APK", "Apps > Android > Add > Line-of-business app > Upload the APK file directly", "Apps > Android > Add > Web link > Host the APK on a web server"], "answer": [0], "explanations": ["Correct. For Android Enterprise fully managed devices, apps must be distributed through Managed Google Play. You upload your custom APK as a private app in Managed Google Play through the Intune console. This publishes it to your organization's private store, making it available for assignment to fully managed devices.", "Incorrect. 'Android store app' references public Google Play Store listings by URL. A custom LOB app not in the public store cannot be added this way.", "Incorrect. The 'Line-of-business app' option for Android uploads an APK for device administrator enrollment, not Android Enterprise. Fully managed devices use Android Enterprise and require apps to come through Managed Google Play.", "Incorrect. Web links create home screen shortcuts to websites, not install native Android applications."], "tip": "Android Enterprise app deployment: ALL apps (store, LOB, web) must go through Managed Google Play. For custom APKs: upload as a private app in Managed Google Play via Intune. Direct APK sideloading is for device administrator mode only."}, {"id": "MS102-R1-039", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nA.Datum Corporation has a hybrid environment with Microsoft Intune and Microsoft Configuration Manager (SCCM). They enable co-management for 2,000 Windows devices. Currently, Configuration Manager handles all workloads.\n\nThe IT team wants to move the compliance policies workload to Intune while keeping all other workloads managed by Configuration Manager.\n\nQuestion:\nWhere do you configure this workload transition?", "choices": ["In the Configuration Manager console under Administration > Cloud Services > Co-management > Properties > Workloads tab, slide the Compliance policies slider to Intune", "In the Microsoft Intune admin center under Tenant administration > Connectors and tokens > Co-management", "Run the Set-CoManagementWorkload PowerShell cmdlet from the Configuration Manager server", "In Azure AD under Device settings > Co-management workload configuration"], "answer": [0], "explanations": ["Correct. Co-management workload transitions are configured in the Configuration Manager console. Navigate to Administration > Cloud Services > Co-management, open Properties, go to the Workloads tab, and slide the 'Compliance policies' workload slider from Configuration Manager to Intune (either Pilot Intune for a test group, or Intune for all co-managed devices).", "Incorrect. While the Intune admin center shows co-management status and enrollment, workload transition is configured in the Configuration Manager console, not Intune.", "Incorrect. There is no Set-CoManagementWorkload cmdlet. Workload transitions are managed through the Configuration Manager console GUI.", "Incorrect. Azure AD Device settings control device registration and MDM enrollment, not co-management workload distribution between Intune and Configuration Manager."], "tip": "Co-management workload control lives in ConfigMgr console, not Intune. Each workload has a slider: ConfigMgr ← → Pilot Intune ← → Intune. Pilot uses a specific collection for testing before full transition."}, {"id": "MS102-R1-040", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nWoodgrove Bank uses Microsoft 365 E5. The risk management team requires that all Microsoft 365 audit log data be retained for 10 years to meet banking regulations. The default retention period for audit logs is 180 days (E5 license provides up to 1 year by default).\n\nQuestion:\nHow should you configure 10-year audit log retention?", "choices": ["Configure a Microsoft Purview retention policy scoped to audit data with a 10-year retention period", "In Microsoft Purview > Audit > Audit retention policies, create a policy with a 10-year retention period", "Export audit logs to an Azure Storage account and configure a 10-year retention policy on the storage account", "Use PowerShell: Set-UnifiedAuditLogRetentionPolicy to create a custom retention policy for 10 years"], "answer": [1], "explanations": ["Incorrect. Standard Purview retention policies scope to workloads like Exchange, SharePoint, and Teams—not to audit log data. Audit log retention has its own dedicated policy configuration under the Audit section.", "Correct. In Microsoft Purview compliance portal, navigate to Audit > Audit retention policies and create a custom policy with a 10-year retention period. With Microsoft 365 E5 and the Audit Premium capability, you can set retention policies for up to 10 years. You can target specific record types or all audit activities.", "Incorrect. Exporting to Azure Storage is a workaround but is not the native Microsoft 365 solution. Microsoft Purview natively supports 10-year audit log retention with the appropriate license.", "Incorrect. While New-UnifiedAuditLogRetentionPolicy is a valid PowerShell cmdlet for creating audit retention policies, the question asks about the UI-based configuration. However, the key insight is that 10-year retention requires the Audit (Premium) add-on license, which the answer should address."], "tip": "Audit log retention: E3 = 180 days (default). E5 = 1 year default, up to 10 years with custom audit retention policies. Configured in Purview > Audit > Audit retention policies (not general retention policies)."}, {"id": "MS102-R1-041", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Windows devices for Contoso using Microsoft Intune. A remote worker's laptop is lost. The device is Azure AD joined and enrolled in Intune. The device has BitLocker enabled with the recovery key escrowed to Azure AD. The laptop contains confidential client data.\n\nThe security team requires that the data be made inaccessible immediately.\n\nQuestion:\nWhich remote action should you perform from the Intune admin center?", "choices": ["Remote lock — locks the device with a PIN", "Wipe — factory resets the device and removes all data", "Retire — removes corporate data and management profile", "Delete — removes the device record from Intune"], "answer": [1], "explanations": ["Incorrect. Remote lock locks the device screen, but a sophisticated attacker could still access the hard drive by removing it from the laptop. Since the data is confidential, a wipe is the appropriate action.", "Correct. Wipe performs a factory reset, removing all data including the OS and files. Combined with BitLocker encryption (the attacker doesn't have the recovery key since it's escrowed to Azure AD), this makes the data inaccessible. Wipe is the strongest action for a lost device with confidential data.", "Incorrect. Retire removes only corporate data (managed apps, profiles, email accounts) but leaves personal files and the OS intact. Confidential client data stored locally would remain accessible if the thief can bypass Windows sign-in.", "Incorrect. Delete only removes the device record from Intune's management console. It does not perform any action on the physical device. The data remains completely intact."], "tip": "Lost device with confidential data → Wipe (factory reset). Employee leaving → Retire (remove corporate data only). Remove stale record → Delete. Temporarily secure → Remote lock."}, {"id": "MS102-R1-042", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou are configuring insider risk management in Microsoft Purview for Datum Corporation. The HR department will provide a CSV file containing the names and dates of employees who have submitted resignations. When an employee resigns, the insider risk policy should begin monitoring for data exfiltration activities such as downloading large volumes of files, printing sensitive documents, and copying to USB.\n\nQuestion:\nWhich insider risk management policy template should you use?", "choices": ["Data leaks by priority users", "Data theft by departing users", "General data leaks", "Security policy violations"], "answer": [1], "explanations": ["Incorrect. 'Data leaks by priority users' monitors designated high-impact users (executives, people with access to sensitive projects) regardless of employment status. It is not triggered by resignation events.", "Correct. 'Data theft by departing users' is specifically designed for this scenario. It uses the HR connector to import resignation/termination dates and automatically begins monitoring departing employees for exfiltration indicators. The policy activates a risk window around the departure date.", "Incorrect. General data leaks monitors for data leakage indicators across all users based on DLP policy matches. It is not specifically triggered by HR-provided resignation data and does not use the departing user trigger.", "Incorrect. Security policy violations monitors for activities like disabling security software, installing unauthorized apps, or circumventing security controls. It does not focus on data exfiltration by departing employees."], "tip": "Insider risk templates: Departing users = HR connector resignation trigger. General data leaks = DLP policy match trigger. Priority users = manually designated user group. Security violations = security control bypass."}, {"id": "MS102-R1-043", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 Apps for 3,000 users at Wingtip Toys using Microsoft Intune. The company uses three update channels:\n- IT department (50 users): Current Channel (Preview) for early testing\n- Early adopters (200 users): Current Channel for pre-production validation\n- All other users (2,750 users): Monthly Enterprise Channel for stability\n\nAn issue is discovered in the latest Monthly Enterprise Channel update that corrupts Excel macros. You need to roll back to the previous version for the 2,750 production users as quickly as possible.\n\nQuestion:\nWhat is the fastest method to roll back the Monthly Enterprise Channel update?", "choices": ["In Intune, uninstall the Microsoft 365 Apps assignment and redeploy specifying the previous version", "Create an Intune device configuration profile using the Settings Catalog to set the target version to the previous build number", "Use the Office Deployment Tool (ODT) with a configuration.xml specifying TargetVersion to deploy the previous version", "Use the Microsoft 365 Apps admin center > Servicing > Monthly Enterprise Channel > Roll back"], "answer": [1], "explanations": ["Incorrect. Uninstalling and redeploying Microsoft 365 Apps is extremely disruptive—users lose access to Office during reinstallation. This is the slowest and most impactful approach.", "Correct. Using the Settings Catalog in Intune, set 'Target Version' (under Microsoft Office 2016 > Updates) to the previous build number for the group containing the 2,750 users. Office will automatically roll back to the specified version on the next update check. This is the fastest method because it leverages existing Intune infrastructure and doesn't require any on-device action.", "Incorrect. The ODT requires running a command on each device (setup.exe /configure), which is not practical for 2,750 devices and would be slower than using Intune policy.", "Incorrect. The Microsoft 365 Apps admin center servicing profiles can control update rollout, but the fastest rollback for Intune-managed devices is through Intune itself using the Settings Catalog or Cloud Policy."], "tip": "Office rollback via Intune: Settings Catalog → Target Version = previous build. Office automatically downgrades. No user disruption, no on-device tools needed."}, {"id": "MS102-R1-044", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou are implementing conditional access for Fabrikam. The security policy requires:\n- All users must use MFA when accessing Microsoft 365 from outside the corporate network\n- Users on the corporate network (IP range 203.0.113.0/24) should not be prompted for MFA\n- Guest users must always use MFA regardless of location\n\nQuestion:\nHow should you configure the conditional access policies?", "choices": ["Create one policy: All users > All cloud apps > Grant: Require compliant device OR MFA. Trust the corporate network IP as a compliant network", "Create one policy: All users > All cloud apps > Exclude location 203.0.113.0/24 > Grant: Require MFA. Create a second policy: Guest users > All cloud apps > Any location > Grant: Require MFA", "Create one policy: All users including guests > All cloud apps > Condition: Not on trusted network > Grant: Require MFA. Create a second policy: Guest users > All cloud apps > Any location > Grant: Require MFA", "Create one policy: All users > All cloud apps > Any location > Grant: Require MFA. Define 203.0.113.0/24 as a trusted location and exclude it from the policy conditions"], "answer": [2], "explanations": ["Incorrect. 'Require compliant device OR MFA' introduces device compliance as an alternative, which is not in the requirements. Also, there's no concept of a 'compliant network' in conditional access—only named/trusted locations.", "Incorrect. The first policy excluding the corporate IP works for regular users, but the second policy for guests creates a conflict. With two separate policies, processing order matters and the exclude in policy 1 might still exempt guest users on the corporate network.", "Correct. Policy 1: Targets All users (includes guests), condition 'Not on trusted network', requires MFA. This handles MFA for everyone off the corporate network. Policy 2: Targets Guest users specifically, no location condition (any location), requires MFA. This ensures guests on the corporate network are still prompted for MFA. The guest-specific policy takes effect even when they're on the trusted network.", "Incorrect. Excluding the trusted location from a single policy exempts ALL users on that network from MFA, including guest users. This violates the requirement that guests must always use MFA."], "tip": "Conditional access with guest exceptions: Use a general policy for all users with location exclusion + a guest-specific policy without location exclusion. More specific policies (guest users) override general policies."}, {"id": "MS102-R1-045", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou are configuring Microsoft Purview Data Loss Prevention for Trey Research. The company needs to prevent users from uploading files containing source code to personal cloud storage services (Dropbox, Google Drive, iCloud) from their managed Windows endpoints.\n\nQuestion:\nWhich DLP policy location should you configure?", "choices": ["SharePoint sites — to prevent source code from being shared externally from SharePoint", "Exchange email — to block source code attachments sent to external recipients", "Microsoft Defender for Cloud Apps — to block uploads via the Cloud App Security proxy", "Devices (Endpoint DLP) — to monitor and block file uploads from Windows endpoints to cloud storage services"], "answer": [3], "explanations": ["Incorrect. SharePoint DLP monitors content stored in SharePoint and OneDrive. It does not monitor or block local file uploads from the Windows endpoint to third-party cloud storage.", "Incorrect. Exchange DLP monitors email content. It does not control file uploads from the Windows desktop to cloud storage applications.", "Incorrect. Defender for Cloud Apps can block uploads via session control, but this requires users to access cloud storage through a browser with conditional access app control. Direct desktop app uploads (Dropbox sync client, Google Drive client) would bypass this.", "Correct. Endpoint DLP monitors activities on managed Windows (and macOS) devices, including file uploads to cloud services, copy to USB, print, and copy to clipboard. You can create a policy targeting the 'Devices' location that detects source code content and blocks the 'Upload to cloud service' activity for restricted cloud services like Dropbox, Google Drive, and iCloud."], "tip": "DLP locations: Exchange = email. SharePoint/OneDrive = cloud-stored files. Teams = messages. Devices (Endpoint DLP) = local file activities (USB, print, upload to cloud, clipboard). Use Endpoint DLP for local device control."}, {"id": "MS102-R1-046", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nLitware Inc. has 500 Windows 11 devices enrolled in Intune. The IT team uses Intune device configuration profiles to manage settings. After deploying a new Wi-Fi profile, 50 devices report a conflict status for the profile.\n\nYou need to identify what is causing the conflict.\n\nQuestion:\nWhere should you look in the Intune admin center?", "choices": ["Tenant administration > Audit logs > filter by configuration profile changes", "Devices > Monitor > Device configuration > select the Wi-Fi profile > Device status, then select a conflicting device to view the conflicting settings", "Reports > Endpoint analytics > Configuration scores", "Devices > All devices > select a conflicting device > Device configuration > view all profiles and check which other profile conflicts"], "answer": [1], "explanations": ["Incorrect. Audit logs record administrative actions (who changed what policy, when), not runtime configuration conflicts between profiles on devices.", "Correct. Navigate to the Wi-Fi profile under Device configuration, view Device status to see which devices have conflicts, then select a specific device to see exactly which setting conflicts with another profile. Intune shows the conflicting setting name and the other profile that sets the same value differently.", "Incorrect. Endpoint analytics configuration scores provide an overview of configuration health, not specific per-device conflicts between profiles.", "Incorrect. While viewing profiles on a specific device shows assigned profiles, it does not directly show which specific settings conflict between profiles. The profile-level Device status view provides more detailed conflict information."], "tip": "Profile conflicts in Intune: Profile > Device status > select conflicting device = shows exactly which setting conflicts with which other profile. This is the fastest way to identify and resolve conflicts."}, {"id": "MS102-R1-047", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYour organization uses Microsoft Defender for Office 365 Plan 2. The security team wants to proactively test whether users in the Finance department are susceptible to phishing attacks. They want to send a simulated phishing email that mimics a common credential harvesting technique and track which users click the link and enter credentials.\n\nQuestion:\nWhich feature in the Microsoft Defender portal should you use?", "choices": ["Email & collaboration > Policies > Safe Links > Create a test policy", "Email & collaboration > Attack simulation training > Simulations > Create a simulation", "Email & collaboration > Explorer > Simulate phishing campaign", "Email & collaboration > Policies > Anti-phishing > Test mode"], "answer": [1], "explanations": ["Incorrect. Safe Links is a protection feature that scans URLs in real time. It does not have testing or simulation capabilities.", "Correct. Attack simulation training in Microsoft Defender for Office 365 Plan 2 allows you to create realistic phishing simulations. You select a technique (credential harvest, malware attachment, etc.), choose a payload template, target the Finance department, and launch the simulation. The tool tracks who opened the email, clicked the link, and submitted credentials, providing a detailed report.", "Incorrect. Threat Explorer analyzes real email threats, not simulated ones. There is no 'Simulate phishing campaign' option in Explorer.", "Incorrect. Anti-phishing policies do not have a 'Test mode' feature for sending simulated phishing to users."], "tip": "Attack simulation training: Credential harvest, Link in attachment, Malware attachment, Drive-by URL, OAuth consent grant. Available in Defender for Office 365 Plan 2. Tracks opens → clicks → credential submissions."}, {"id": "MS102-R1-048", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage app protection policies for Relecloud. The company allows employees to use personal Android devices to access corporate email via Outlook. The security team requires that:\n- Corporate email data must be encrypted at rest on the device\n- Users must authenticate with a 6-digit PIN before opening Outlook\n- If the device is jailbroken/rooted, Outlook must wipe corporate data\n- These policies must work WITHOUT requiring device enrollment in Intune\n\nQuestion:\nWhich type of policy meets these requirements?", "choices": ["App protection policy (MAM without enrollment) targeting Microsoft Outlook", "Device configuration profile with password and encryption requirements", "Device compliance policy targeting Android devices", "Conditional access policy requiring a compliant device for Exchange Online"], "answer": [0], "explanations": ["Correct. App protection policies (MAM without enrollment) apply to the app level, not the device level. They work on unmanaged personal devices without Intune enrollment. You can configure: data encryption (encrypt org data), PIN requirement (6-digit, required before access), and jailbreak/root detection (wipe corporate data if detected). All within the app—no device management needed.", "Incorrect. Device configuration profiles require Intune enrollment to deploy and enforce. They cannot be applied to unmanaged personal devices.", "Incorrect. Device compliance policies require devices to be enrolled in Intune. The requirement explicitly states the policies must work without device enrollment.", "Incorrect. Conditional access requiring a compliant device would block access entirely from unenrolled personal devices. The requirement is to allow access on personal devices with app-level protections."], "tip": "MAM without enrollment (APP) = manage the app, not the device. Perfect for BYOD: encryption, PIN, wipe, data transfer controls—all at the app level without touching the personal device."}, {"id": "MS102-R1-049", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nContoso has 2,000 Windows 11 devices enrolled in Intune. The company wants to implement Windows LAPS (Local Administrator Password Solution) to manage the local administrator password on all devices. Passwords must be:\n- Rotated every 30 days\n- Stored in Azure AD\n- At least 14 characters with complexity requirements\n\nQuestion:\nHow should you configure Windows LAPS in Intune?", "choices": ["Configure LAPS through Group Policy in a hybrid-joined environment only, as LAPS is not natively supported in Intune", "Create a device configuration profile using the Settings Catalog with LAPS settings for Azure AD backup, 30-day rotation, and 14-character complex passwords", "Create an endpoint security Account protection policy with LAPS settings", "Deploy a PowerShell script via Intune that runs Set-LapsADPassword every 30 days"], "answer": [2], "explanations": ["Incorrect. Windows LAPS is natively supported in Intune for both Azure AD-joined and hybrid-joined devices. The Endpoint security > Account protection blade provides built-in LAPS configuration.", "Incorrect. While the Settings Catalog does contain LAPS settings and could work, the recommended and purpose-built location for LAPS configuration in Intune is under Endpoint security > Account protection. This provides a streamlined experience specifically for LAPS.", "Correct. In the Intune admin center, navigate to Endpoint security > Account protection > Create policy > Windows LAPS. Configure: Backup directory = Azure AD, Password age (days) = 30, Password complexity = Large letters + small letters + numbers + special characters, Password length = 14. This is the Microsoft-recommended way to deploy LAPS settings via Intune.", "Incorrect. Set-LapsADPassword is for on-premises AD LAPS, not Azure AD LAPS. Also, managing LAPS via custom scripts bypasses Intune's built-in LAPS management and reporting capabilities."], "tip": "Windows LAPS in Intune: Endpoint security > Account protection > LAPS policy. Supports Azure AD backup (cloud-only) and on-premises AD backup (hybrid). Settings Catalog also works but Account protection is the recommended path."}, {"id": "MS102-R1-050", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou are the Microsoft 365 administrator for Adventure Works Cycles. The company's Microsoft 365 E5 license is up for renewal. Management wants to understand the current security posture before renewal. They request a report showing:\n- The organization's overall security score\n- Which recommended security improvements would have the most impact\n- Comparison against similar organizations in the same industry\n\nQuestion:\nWhere should you direct management to view this information?", "choices": ["Microsoft Purview compliance portal > Compliance Manager > Compliance score", "Microsoft Entra admin center > Security > Identity Secure Score", "Microsoft 365 admin center > Health > Service health dashboard", "Microsoft Defender portal > Secure Score"], "answer": [3], "explanations": ["Incorrect. Compliance Manager and Compliance score focus on regulatory compliance posture (GDPR, HIPAA, etc.), not security configuration. It measures compliance controls, not security improvements.", "Incorrect. Identity Secure Score focuses only on Azure AD/Entra ID identity security (MFA adoption, privileged access, etc.). It does not cover the full Microsoft 365 security posture including endpoint, email, and data security.", "Incorrect. Service health dashboard shows the operational status of Microsoft 365 services (outages, incidents). It has nothing to do with security posture or recommendations.", "Correct. Microsoft Secure Score in the Defender portal provides: (1) An overall security score based on configured security features, (2) Ranked improvement actions showing which changes would increase the score most, and (3) Industry comparison showing how your organization compares to similar-sized organizations in your sector."], "tip": "Microsoft Secure Score = overall security posture + improvement recommendations + industry comparison. Identity Secure Score = identity-only subset. Compliance Score = regulatory compliance posture. Different tools for different purposes."}]}, {"title": "Practice Exam 2", "questions": [{"id": "MS102-R2-001", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou are migrating device management from a third-party MDM solution to Microsoft Intune for Contoso. The company has 1,500 iOS devices currently managed by the third-party MDM. You need to migrate these devices to Intune without wiping them.\n\nQuestion:\nWhat is the correct migration approach?", "choices": ["Reset the Apple Push Notification service (APNs) certificate and re-enroll all devices with the new MDM authority", "Unenroll devices from the third-party MDM first, then enroll them in Intune — iOS supports only one MDM authority at a time", "Use the Intune Migration Tool to transfer management profiles from the third-party MDM to Intune automatically", "Enroll the devices in Intune while they are still managed by the third-party MDM; both MDM solutions can co-manage iOS devices"], "answer": [1], "explanations": ["Incorrect. Resetting the APNs certificate would break push notification capability for ALL managed iOS devices. The APNs certificate should be preserved and can be reused if the same Apple ID is used.", "Correct. iOS supports only one MDM authority per device. The migration process is: (1) unenroll from the third-party MDM (removes the MDM profile but does not wipe the device), then (2) enroll in Intune (installs the Intune MDM profile). The device data is preserved throughout.", "Incorrect. There is no 'Intune Migration Tool' that transfers management profiles between MDM solutions. Migration requires unenrolling from one and enrolling in the other.", "Incorrect. iOS devices can only be managed by one MDM solution at a time. Attempting to enroll in a second MDM while still managed by the first will fail or cause the first MDM profile to be removed."], "tip": "iOS MDM migration: Unenroll from old MDM → enroll in new MDM. One MDM at a time. Device is NOT wiped during unenrollment—only the MDM profile is removed."}, {"id": "MS102-R2-002", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nPratum Inc. uses Microsoft 365 E5 with Microsoft Defender for Endpoint. The SOC team discovers that an attacker is using a legitimate system tool (certutil.exe) to download malicious payloads onto compromised devices. They want to block certutil.exe from making network connections while still allowing it to be used for local certificate operations.\n\nQuestion:\nWhich feature should the SOC team configure?", "choices": ["Microsoft Defender Firewall rule blocking certutil.exe outbound connections", "Attack surface reduction (ASR) rule: Block executable content from email client and webmail", "Custom indicator in Defender for Endpoint: Block certutil.exe as a file indicator", "Attack surface reduction (ASR) rule: Block process creations originating from PsExec and WMI commands"], "answer": [0], "explanations": ["Correct. A Microsoft Defender Firewall rule can specifically block outbound network connections for certutil.exe while allowing the executable to run locally for certificate management. This surgically addresses the threat without blocking the tool entirely.", "Incorrect. This ASR rule blocks executable content downloaded via email clients. It does not control network connections from certutil.exe.", "Incorrect. Blocking certutil.exe as a file indicator would prevent the file from executing entirely, which breaks local certificate operations. The requirement is to allow local use while blocking network connections.", "Incorrect. This ASR rule blocks processes created via PsExec and WMI, not network connections from certutil.exe. It targets lateral movement techniques, not LOLBin abuse."], "tip": "LOLBin defense: Use Windows Firewall rules to block specific executables from making network connections. This allows local functionality while preventing download abuse. ASR rules target broader attack patterns."}, {"id": "MS102-R2-003", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Microsoft Intune for Woodgrove Bank. The security team requires that the Microsoft Outlook app on iOS and Android devices must:\n- Block cut, copy, and paste of corporate email content to non-managed apps\n- Allow paste from non-managed apps INTO Outlook\n- Require Face ID or fingerprint to open the app\n\nYou are configuring an App Protection Policy.\n\nQuestion:\nWhat value should you set for 'Restrict cut, copy, and paste between other apps'?", "choices": ["Blocked", "Any app", "Policy managed apps with paste in", "Policy managed apps"], "answer": [2], "explanations": ["Incorrect. 'Blocked' prevents all cut/copy/paste operations including pasting data FROM non-managed apps into Outlook. The requirement allows paste into Outlook from any app.", "Incorrect. 'Any app' allows unrestricted cut/copy/paste to any app, which violates the requirement to block copying corporate email content to non-managed apps.", "Correct. 'Policy managed apps with paste in' allows: (1) Pasting from any app INTO the managed app (Outlook), (2) Only allows pasting FROM the managed app to other policy-managed apps. This meets both requirements: blocking copy-out to unmanaged apps while allowing paste-in from anywhere.", "Incorrect. 'Policy managed apps' restricts paste operations to managed apps only. This would block pasting from non-managed apps into Outlook, violating the requirement to allow paste from any source."], "tip": "APP clipboard settings: 'Policy managed apps with paste in' = the goldilocks setting for most organizations. Blocks data OUT to unmanaged apps while allowing data IN from anywhere."}, {"id": "MS102-R2-004", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nA.Datum uses Microsoft Intune with 2,000 Windows devices. The company policy requires that USB storage devices are blocked on all devices EXCEPT for the Accounting department, which needs USB access for encrypted backup drives with a specific vendor ID (VID_1234).\n\nQuestion:\nHow should you implement this in Intune?", "choices": ["Create an endpoint security Attack Surface Reduction policy blocking USB storage for All Devices, then create an exception policy for Accounting allowing all USB storage", "Create an endpoint security Disk encryption policy that blocks unencrypted USB storage for all users", "Deploy a custom PowerShell script that modifies the registry to disable USB mass storage on all devices except those in the Accounting OU", "Create a device configuration profile using Administrative Templates to disable USB storage for All Devices, then use a Defender for Endpoint device control policy to allow specific vendor ID for the Accounting group"], "answer": [3], "explanations": ["Incorrect. An ASR exception policy allowing all USB storage for Accounting is too broad—it allows any USB device, not just the specific vendor's encrypted drives. The requirement specifies a specific vendor ID.", "Incorrect. Disk encryption policies manage BitLocker/FileVault, not USB access control. There is no option in disk encryption policies to block USB based on encryption status.", "Incorrect. While a PowerShell script could modify registry keys to disable USB, it lacks the granularity to allow specific vendor IDs. Also, Intune groups are not OU-based, and custom scripts are harder to maintain and report on than native policies.", "Correct. Use a combination: (1) Administrative Templates to disable USB storage class drivers for All Devices, (2) Defender for Endpoint device control policies to create an allow list for specific vendor IDs (VID_1234) targeted to the Accounting group. Device control allows granular USB control by vendor ID, product ID, and serial number."], "tip": "USB control in Intune: Block all USB via Administrative Templates or ASR → Allow specific devices via Defender for Endpoint Device Control (filter by VID, PID, serial number, device type)."}, {"id": "MS102-R2-005", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou are the compliance administrator for Relecloud. The legal team receives notice of pending litigation and needs to preserve all email communications for 10 specific custodians. The preservation must:\n- Cover mailbox content, OneDrive files, and Teams chats\n- Prevent custodians from deleting relevant content\n- Allow the legal team to search and review the preserved content\n- Be managed as a single case\n\nQuestion:\nWhich tool should you use?", "choices": ["Microsoft Purview > Information protection > Sensitivity labels with encryption", "Microsoft Purview > eDiscovery > Standard > Create a case with a hold", "Microsoft Purview > Data lifecycle management > Retention policies", "Microsoft Purview > eDiscovery > Premium > Create a case with custodians and holds"], "answer": [3], "explanations": ["Incorrect. Sensitivity labels with encryption protect content from unauthorized access but do not preserve content for legal holds or provide eDiscovery case management.", "Incorrect. eDiscovery Standard supports case creation and holds, but it has limitations: holds are location-based (not custodian-based), it lacks custodian management, and it doesn't provide the advanced review set functionality needed for litigation review.", "Incorrect. Retention policies preserve content but are organization-wide or location-based, not designed for specific litigation custodians. They also don't provide search, review, or case management capabilities.", "Correct. eDiscovery Premium (formerly Advanced eDiscovery) provides: (1) Custodian management—add the 10 custodians and automatically identify their mailboxes, OneDrive, and Teams data, (2) Custodian holds that preserve content across all custodian data sources, (3) Review sets for the legal team to search, review, and tag content, (4) Single case management for the entire matter."], "tip": "eDiscovery Standard = basic search + hold + export. eDiscovery Premium = custodian management + custodian holds + review sets + analytics + advanced processing. For litigation with named custodians → Premium."}, {"id": "MS102-R2-006", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Tailspin Toys. The company has Windows 11 devices in three rings:\n- Ring 0 (IT testers): 50 devices, gets feature updates immediately\n- Ring 1 (Early adopters): 200 devices, gets feature updates 30 days after Ring 0\n- Ring 2 (Production): 2,000 devices, gets feature updates 60 days after Ring 0\n\nWindows 11 24H2 has been released. After Ring 0 testing, a critical issue is discovered. You need to pause the feature update rollout to Ring 1 and Ring 2.\n\nQuestion:\nWhat should you do?", "choices": ["Edit the feature update deployment policy and set the rollout state to Paused for Ring 1 and Ring 2 groups", "Create a safeguard hold by reporting the issue through the Windows Update for Business reports", "Delete the update ring assignments for Ring 1 and Ring 2", "Set the feature update deferral period to 365 days for Ring 1 and Ring 2 update rings"], "answer": [0], "explanations": ["Correct. In Intune, feature update policies (Devices > Windows > Feature updates for Windows 10 and later) have a Pause/Resume capability. You can pause the rollout for specific groups (Ring 1 and Ring 2) to prevent those devices from receiving the update while you investigate the issue. When the issue is resolved, you resume the rollout.", "Incorrect. Safeguard holds are applied by Microsoft when they detect known compatibility issues. Administrators cannot create safeguard holds—they can only pause their own deployment policies.", "Incorrect. Deleting the update ring assignments would remove all update management for those devices, not just pause feature updates. They might receive updates directly from Windows Update without any controls.", "Incorrect. Setting a 365-day deferral is a workaround, but it's not the intended mechanism. It also changes the ongoing policy rather than temporarily pausing the specific update. When you want to resume, you'd need to change it back."], "tip": "Feature update deployment control: Pause = temporarily stop rollout (keeps policy intact, easy to resume). Deferral = delay updates by X days from release. Safeguard holds = Microsoft-initiated blocks for known issues."}, {"id": "MS102-R2-007", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nNorthwind Traders uses Microsoft Defender for Identity (formerly Azure ATP). The security team notices alerts indicating that an attacker is performing reconnaissance using LDAP queries against domain controllers to enumerate privileged accounts.\n\nQuestion:\nWhich Defender for Identity detection is triggering these alerts?", "choices": ["Suspected DCSync attack (replication of directory services)", "Account enumeration reconnaissance", "Security principal reconnaissance (LDAP)", "Suspected Golden Ticket usage (encryption downgrade)"], "answer": [2], "explanations": ["Incorrect. DCSync detection identifies replication-based attacks where an attacker impersonates a domain controller to replicate credentials. This is a credential theft technique, not reconnaissance via LDAP queries.", "Incorrect. Account enumeration reconnaissance detects Kerberos-based account enumeration (trying to authenticate with a list of usernames to identify valid accounts). This uses Kerberos, not LDAP.", "Correct. 'Security principal reconnaissance (LDAP)' detects when an attacker queries Active Directory using LDAP to enumerate users, groups, and privileged accounts. This is a common reconnaissance technique in the early stages of an attack to map out the target environment.", "Incorrect. Golden Ticket detection identifies the use of forged Kerberos TGTs. This is a persistence/lateral movement technique, not LDAP-based reconnaissance."], "tip": "Defender for Identity reconnaissance detections: LDAP queries → Security principal reconnaissance. Kerberos enumeration → Account enumeration. DNS queries → Network-mapping reconnaissance."}, {"id": "MS102-R2-008", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 Apps for 5,000 users at Fabrikam using servicing profiles in the Microsoft 365 Apps admin center. The Current Channel servicing profile is configured to automatically update devices. After a recent update, the Finance team reports that a critical Excel macro breaks. You need to exclude the Finance team's devices from the servicing profile and roll back their Office version.\n\nQuestion:\nWhat should you do?", "choices": ["Create an Intune device configuration profile for Finance devices specifying a target version, and remove Finance devices from the servicing profile. The target version will trigger a rollback.", "Delete the servicing profile and recreate it without the Finance team's devices", "Ask Finance users to manually uninstall and reinstall the previous Office version from the Office portal", "Move Finance devices to a different Azure AD group and exclude that group from the servicing profile. Use the servicing profile's rollback feature to revert their version."], "answer": [0], "explanations": ["Correct. First, exclude Finance devices from the servicing profile so they stop receiving automated updates. Then, create an Intune configuration profile (via Settings Catalog or Administrative Templates) that sets a specific Target Version for Microsoft 365 Apps. When the target version is set to an earlier build, Office automatically rolls back to that version on the next update cycle.", "Incorrect. Deleting and recreating the entire servicing profile is disruptive to all 5,000 users. The fix should only affect the Finance team.", "Incorrect. Manual uninstall/reinstall is not scalable, disrupts user productivity, and doesn't ensure the correct version is installed.", "Incorrect. Servicing profiles do not have a built-in rollback feature. Excluding the group from the profile stops future updates but does not revert the already-installed version."], "tip": "Office version rollback: Set 'Target Version' in Intune (Settings Catalog or Admin Templates) to a previous build number. Office automatically downgrades. Servicing profiles control updates but don't do rollbacks."}, {"id": "MS102-R2-009", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Litware. A user reports they cannot enroll their personal Android device. When they install Company Portal and try to sign in, they receive the error: 'This device cannot be enrolled. Contact your IT administrator.'\n\nYou verify the user has a valid Intune license and the device is running Android 13.\n\nQuestion:\nWhat is the most likely cause?", "choices": ["The Company Portal app is outdated and needs to be updated from the Play Store", "The user needs to be assigned a Microsoft 365 E3 or E5 license instead of a standalone Intune license", "The device enrollment restriction policy blocks personally owned Android devices", "The user's password has expired and needs to be reset"], "answer": [2], "explanations": ["Incorrect. An outdated Company Portal app might cause functionality issues, but the specific error about the device not being enrollable points to a policy restriction, not an app version issue.", "Incorrect. A standalone Intune license is sufficient for device enrollment. There is no requirement for an E3 or E5 license specifically.", "Correct. The error 'This device cannot be enrolled' typically indicates that a device enrollment restriction policy is blocking the enrollment. If the default or a higher-priority device type restriction blocks personally owned devices for Android, the user's BYOD enrollment will fail with this exact error.", "Incorrect. An expired password would prevent sign-in with an authentication error, not an enrollment-specific error about the device not being allowed."], "tip": "Common enrollment error causes: 'Device cannot be enrolled' = enrollment restriction policy. 'Device limit reached' = device limit restriction. 'Not authorized' = missing license. Check enrollment restrictions first."}, {"id": "MS102-R2-010", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nAdventure Works uses Microsoft 365 E5. The security team wants to create a unified view of all security alerts across:\n- Microsoft Defender for Endpoint (device alerts)\n- Microsoft Defender for Office 365 (email alerts)\n- Microsoft Defender for Identity (identity alerts)\n- Microsoft Defender for Cloud Apps (cloud app alerts)\n\nThey want alerts automatically correlated into incidents for efficient investigation.\n\nQuestion:\nWhich portal provides this unified experience?", "choices": ["Azure AD Identity Protection portal", "Microsoft Sentinel workspace in Azure portal", "Microsoft Purview compliance portal", "Microsoft Defender portal (security.microsoft.com) with Microsoft Defender XDR"], "answer": [3], "explanations": ["Incorrect. Azure AD Identity Protection handles identity-risk alerts only. It does not aggregate alerts from Defender for Endpoint, Office 365, or Cloud Apps.", "Incorrect. Microsoft Sentinel is a SIEM/SOAR platform that can aggregate alerts from multiple sources, but it requires additional setup and licensing. The built-in unified experience across Microsoft Defender products is provided by Defender XDR.", "Incorrect. The Purview compliance portal handles compliance-related features (DLP, eDiscovery, retention, insider risk). It does not provide security alert management or incident correlation.", "Correct. Microsoft Defender XDR (formerly Microsoft 365 Defender) in the Defender portal at security.microsoft.com provides unified incident management across all four Defender products. It automatically correlates alerts from Endpoint, Office 365, Identity, and Cloud Apps into unified incidents, providing a single-pane-of-glass investigation experience."], "tip": "Microsoft Defender XDR = unified security operations across all Defender products. Microsoft Sentinel = SIEM for broader data sources (includes non-Microsoft). Defender XDR is built-in; Sentinel requires additional setup."}, {"id": "MS102-R2-011", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nTailwind Traders has 800 Windows devices enrolled in Microsoft Intune. The company requires that all devices must have Windows Defender Antivirus real-time protection enabled. Devices that disable real-time protection should be marked as noncompliant within 4 hours.\n\nYou create a compliance policy requiring Defender real-time protection.\n\nQuestion:\nWhat must you also configure to ensure noncompliance is detected within 4 hours?", "choices": ["Set the compliance policy action for noncompliance 'Mark device noncompliant' to 'Immediately' — detection timing depends on the Intune device check-in schedule which is 8 hours by default; reduce it using a custom compliance check-in schedule", "Configure Windows Defender real-time protection monitoring in Microsoft Defender for Endpoint with a 4-hour alert threshold", "Create a Proactive remediation script that checks real-time protection status every 4 hours", "Configure the compliance policy evaluation schedule (check-in frequency) to 4 hours"], "answer": [0], "explanations": ["Correct. Set the noncompliance action to 'Mark device noncompliant: Immediately' (0 days grace period). Then, to ensure detection within 4 hours, you need devices to check in with Intune frequently. By default, Windows devices check in every 8 hours. You can use the Sync action or configure device check-in schedules to reduce this interval. Note: the compliance check happens at device check-in time.", "Incorrect. Defender for Endpoint monitors security posture but does not directly tie into Intune compliance policy evaluation timing. The compliance check runs during Intune sync, not based on Defender alerts.", "Incorrect. Proactive remediations can detect and fix issues, but they are separate from the compliance framework. The compliance policy needs the device to check in with Intune for evaluation.", "Incorrect. There is no per-policy compliance evaluation schedule. Compliance policies are evaluated when the device checks in with Intune. The check-in frequency is configured at the device level, not the policy level."], "tip": "Compliance evaluation timing = device check-in frequency. Default: Windows 8hr, iOS/Android 8hr. To evaluate more frequently, trigger device sync via push notification or reduce check-in interval."}, {"id": "MS102-R2-012", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nContoso uses Microsoft 365 E5 with Microsoft Defender for Office 365 Plan 2. A user in the Marketing department reports receiving a suspicious email with a PDF attachment. The user has not opened the attachment. The security team needs to determine if the PDF is malicious before taking action.\n\nQuestion:\nWhat is the fastest way to analyze the PDF attachment in the Defender portal?", "choices": ["Create a custom detection rule in Advanced Hunting to scan for the PDF hash", "Download the PDF to an isolated VM and run it manually", "Submit the PDF to the Microsoft Security Intelligence portal for manual analysis", "Go to Email & collaboration > Explorer, find the email, and check the detection technology and detonation details in the email flyout"], "answer": [3], "explanations": ["Incorrect. Advanced Hunting queries historical data and requires you to already know the file hash. It doesn't provide real-time analysis of the attachment content.", "Incorrect. Manually analyzing in a VM requires significant time and expertise. The Defender portal already provides automated sandboxing through Safe Attachments.", "Incorrect. Submitting to the Security Intelligence portal is for reporting new threats and takes time for analysis. It is not the fastest method for immediate analysis.", "Correct. In Threat Explorer, locate the email and open the email details flyout. If Safe Attachments has already detonated the PDF, you'll see the verdict (malicious/clean/pending) and detonation details including behavior analysis. If not yet detonated, you can submit it for analysis. This gives you the fastest result using the built-in tools."], "tip": "Threat Explorer email flyout shows: delivery action, detection technology, threats detected, URL clicks, and Safe Attachments detonation verdict. Fastest built-in analysis for suspicious emails."}, {"id": "MS102-R2-013", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Windows 365 Cloud PCs for Pratum Inc. using Microsoft Intune. The company wants to deploy a custom LOB application to 200 Cloud PCs. The application installer is 4.5 GB in size, packaged as an MSI.\n\nQuestion:\nWhat is the best deployment method?", "choices": ["Deploy as a line-of-business (LOB) app by uploading the MSI directly", "Use Microsoft Configuration Manager to deploy the MSI to the Cloud PCs", "Deploy as a Windows app (Win32) after converting the MSI to .intunewin format using the Content Prep Tool", "Deploy using a PowerShell script that downloads the MSI from Azure Blob Storage"], "answer": [2], "explanations": ["Incorrect. LOB app deployment for MSI files in Intune has a file size limit of 8 GB but provides limited configuration options compared to Win32 apps. More importantly, Win32 deployment provides better download reliability, resume capability, and installation tracking for large files.", "Incorrect. Cloud PCs are managed by Intune, not Configuration Manager. While ConfigMgr can manage on-premises devices, it does not manage Windows 365 Cloud PCs.", "Correct. Win32 app deployment (using the Intune Content Prep Tool to create .intunewin format) supports files up to 8 GB and provides advanced features like detection rules, dependency management, requirement rules, and return codes. This is the recommended method for large applications.", "Incorrect. Using a PowerShell script to download from Blob Storage adds complexity, requires Azure Storage configuration, and bypasses Intune's built-in deployment tracking, reporting, and retry mechanisms."], "tip": "Win32 (.intunewin) vs LOB (MSI): Win32 supports detection rules, dependencies, requirements, supersedence, and better install tracking. Always prefer Win32 format for production deployments."}, {"id": "MS102-R2-014", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nFabrikam has 500 shared Android tablets used by retail employees. Each tablet is shared among 5-10 workers per shift. The company wants to:\n- Allow workers to sign in with their corporate credentials\n- Provide each worker with their own app data and settings\n- Automatically clean up user data after sign-out\n- Prevent personal app installations\n\nQuestion:\nWhich Android Enterprise enrollment mode should you use?", "choices": ["Personally-owned work profile", "Corporate-owned, fully managed", "Corporate-owned with work profile (COPE)", "Corporate-owned dedicated device (single-app or multi-app kiosk)"], "answer": [3], "explanations": ["Incorrect. Personally-owned work profile is for BYOD scenarios where the user owns the device. It doesn't support shared device scenarios or automatic cleanup between users.", "Incorrect. Fully managed devices are designed for single-user corporate devices. They don't support multiple users signing in and out with automatic data cleanup.", "Incorrect. COPE (Corporate-Owned, Personal Enabled) is for single-user devices where the company owns the device but allows personal use. It doesn't support shared device scenarios.", "Correct. Dedicated device mode with shared device configuration supports multi-user scenarios. When configured with Microsoft Entra shared device mode, workers can sign in with corporate credentials, get personalized app experiences, and have their data automatically cleaned up on sign-out. Kiosk mode can restrict which apps are available."], "tip": "Shared Android devices: Dedicated device mode + Microsoft Entra shared device mode. Supports sign-in/sign-out with automatic cleanup. Not the same as kiosk-only—shared device mode adds multi-user support."}, {"id": "MS102-R2-015", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 for Wingtip Toys. The company is subject to GDPR and needs to ensure that personal data stored in Microsoft 365 is properly classified. The DPO wants to automatically identify and label documents containing EU national identification numbers, passport numbers, and EU debit card numbers across SharePoint and OneDrive.\n\nQuestion:\nWhat should you configure in Microsoft Purview?", "choices": ["Configure Microsoft Defender for Cloud Apps file policy to scan for EU data patterns", "Create a DLP policy with sensitive information types for EU identifiers", "Create a data classification content explorer scan for EU data", "Create auto-labeling policies using sensitivity labels with conditions matching EU personal data sensitive information types"], "answer": [3], "explanations": ["Incorrect. Defender for Cloud Apps file policies can detect sensitive content and apply labels via the integration with Information Protection, but the native and recommended approach for labeling content in SharePoint/OneDrive is auto-labeling policies in Purview.", "Incorrect. DLP policies detect and protect sensitive data in transit (email, sharing), but they do not apply sensitivity labels to documents at rest. The requirement is to classify (label) existing documents.", "Incorrect. Content explorer is a read-only tool that lets you browse data that matches sensitive information types. It does not apply labels or take any action on the content.", "Correct. Auto-labeling policies in Microsoft Purview allow you to automatically apply sensitivity labels to documents in SharePoint and OneDrive based on content matching. Configure conditions using built-in sensitive information types for EU national ID numbers, EU passport numbers, and EU debit card numbers. The policy scans existing and new documents and applies the specified label."], "tip": "Classification (labeling) at rest: Auto-labeling policies in Purview. Protection in transit: DLP policies. Discovery/browsing: Content explorer. For SharePoint/OneDrive, auto-labeling is the primary tool."}, {"id": "MS102-R2-016", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou are configuring Microsoft Intune for A.Datum Corporation. The company needs to deploy certificates to Windows devices for VPN authentication. The PKI team has set up a Microsoft NDES (Network Device Enrollment Service) server for SCEP certificate issuance.\n\nQuestion:\nWhich Intune component must be installed on-premises to facilitate SCEP certificate requests between Intune and the NDES server?", "choices": ["Microsoft Intune Exchange Connector installed on the NDES server", "Azure AD Application Proxy connector installed on the NDES server", "Microsoft Intune Certificate Connector installed on the NDES server or a separate Windows server", "Azure AD Connect Sync agent with certificate writeback enabled"], "answer": [2], "explanations": ["Incorrect. The Intune Exchange Connector is for integrating on-premises Exchange Server with Intune for conditional access on Exchange ActiveSync. It has nothing to do with certificate deployment.", "Incorrect. Azure AD Application Proxy enables access to on-premises web apps from the internet. While it could theoretically proxy NDES, the Intune Certificate Connector is the purpose-built solution.", "Correct. The Microsoft Intune Certificate Connector is an on-premises component that acts as a bridge between Intune (cloud) and the NDES server (on-premises). It receives certificate requests from Intune, forwards them to NDES/CA for issuance, and returns the issued certificates to Intune for deployment to devices.", "Incorrect. Azure AD Connect Sync handles directory synchronization between on-premises AD and Azure AD. Certificate writeback is not a supported feature, and Azure AD Connect doesn't facilitate SCEP certificate enrollment."], "tip": "SCEP certificate flow: Intune → Certificate Connector (on-prem) → NDES → Certificate Authority → Certificate issued → Certificate Connector → Intune → Device. The connector is the bridge."}, {"id": "MS102-R2-017", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nRelecloud uses Microsoft 365 E5. The CISO requires that when a user's Azure AD Identity Protection risk level changes to 'High', the following actions occur automatically:\n1. The user must change their password at next sign-in\n2. All existing sessions are revoked\n3. The user must re-enroll in MFA\n\nQuestion:\nWhich combination of policies achieves all three requirements?", "choices": ["User risk policy set to High → Require password change. Configure 'Revoke session' as an additional remediation action in Identity Protection. MFA re-enrollment happens automatically with password change.", "User risk policy set to High → Block access. Then manually reset password, revoke sessions via PowerShell (Revoke-AzureADUserAllRefreshToken), and delete MFA registration.", "User risk policy set to High → Require password change (handles requirement 1). Session revocation and MFA re-enrollment must be configured separately using a conditional access policy with session controls.", "Create a conditional access policy: User risk = High → Grant: Require password change + Require MFA. Use the Revoke-MgUserSignInSession Graph API via a Logic App triggered by risk events."], "answer": [2], "explanations": ["Incorrect. 'Revoke session' is not a configurable remediation action in Identity Protection user risk policies. Session revocation must be handled through conditional access or manual action. MFA re-enrollment does not happen automatically with password change.", "Incorrect. Blocking access prevents the user from signing in at all, which is more disruptive than required. The scenario wants the user to change their password, not be fully blocked.", "Correct. The user risk policy with 'Require password change' handles requirement 1. However, session revocation (requirement 2) and MFA re-enrollment (requirement 3) are not built into the user risk policy. You need: a conditional access policy that requires re-authentication (revokes active sessions for high-risk users), and for MFA re-enrollment, you must use the Authentication methods registration policy or manually require re-registration. No single policy handles all three natively.", "Incorrect. Conditional access policies don't have 'Require MFA re-enrollment' as a grant control. While the Logic App approach could work for session revocation, it adds unnecessary complexity."], "tip": "Identity Protection limitations: User risk policy can require password change OR block access. It cannot revoke sessions or require MFA re-enrollment. These need separate configurations (conditional access, Graph API, or manual admin action)."}, {"id": "MS102-R2-018", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou are configuring Managed Google Play for Tailspin Toys' Android Enterprise devices in Microsoft Intune. The company wants to allow only specific apps to appear in the Managed Google Play store on corporate devices. Users should not be able to browse or install any app not explicitly approved by IT.\n\nQuestion:\nHow should you configure this in Intune?", "choices": ["Use a device compliance policy requiring only approved apps be installed", "In the Managed Google Play store, approve only the apps you want available. On fully managed devices, only approved apps appear in the managed store by default.", "Create a device configuration profile blocking the Play Store app entirely", "Create an app protection policy that blocks installation of unapproved apps"], "answer": [1], "explanations": ["Incorrect. Compliance policies evaluate device state but do not control app installation. A noncompliant device with unapproved apps would be flagged but the apps wouldn't be prevented from being installed.", "Correct. With Android Enterprise fully managed devices, users only see apps in the Managed Google Play store that IT has approved. By approving only the specific apps you want (e.g., Outlook, Teams, a custom LOB app), users cannot browse or install unapproved apps. This is the built-in behavior of Android Enterprise Managed Google Play.", "Incorrect. Blocking the Play Store entirely prevents users from installing any app, including approved ones. The requirement is to allow specific apps while blocking others.", "Incorrect. App protection policies control data transfer and access requirements within apps. They do not control which apps users can install from the store."], "tip": "Android Enterprise + Managed Google Play = curated app store. Only IT-approved apps appear. No sideloading on fully managed devices. This is the default behavior—no extra configuration needed beyond approving apps."}, {"id": "MS102-R2-019", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nAdatum Corporation uses Microsoft Intune and has 1,000 Windows 11 devices. The company wants to implement tenant attach with Microsoft Configuration Manager to view Configuration Manager-managed devices in the Intune admin center, without co-management.\n\nQuestion:\nWhat is required to enable tenant attach?", "choices": ["Install Azure AD Connect and enable hybrid Azure AD join for all devices first", "Install the Intune Certificate Connector on the Configuration Manager site server", "In the Configuration Manager console, configure cloud attach by enabling 'Upload to Microsoft Endpoint Manager admin center' under Co-management properties", "Enable co-management in Configuration Manager and move at least one workload to Intune"], "answer": [2], "explanations": ["Incorrect. Hybrid Azure AD join is not a prerequisite for tenant attach. Tenant attach works with on-premises AD-joined devices that are not hybrid Azure AD joined.", "Incorrect. The Intune Certificate Connector is for SCEP/PKCS certificate deployment, not for tenant attach.", "Correct. Tenant attach is configured in the Configuration Manager console under Administration > Cloud Services > Cloud Attach (or Co-management). Enable 'Upload to Microsoft Endpoint Manager admin center' to sync device data to Intune. This allows viewing ConfigMgr-managed devices in the Intune portal without requiring co-management or moving any workloads.", "Incorrect. Co-management is a separate feature from tenant attach. Tenant attach provides cloud visibility without co-management. You do NOT need to move workloads to Intune for tenant attach."], "tip": "Tenant attach ≠ co-management. Tenant attach = upload device data to Intune portal (view only, some remote actions). Co-management = shared workload management between ConfigMgr and Intune. Tenant attach is simpler and requires fewer prerequisites."}, {"id": "MS102-R2-020", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nWoodgrove Bank is subject to financial industry regulations that require email archiving for 7 years. The compliance team needs to ensure that:\n- All mailbox items (including deleted items) are preserved\n- Users cannot permanently delete emails\n- After 7 years, emails are automatically deleted\n- Mailbox items modified or deleted by users are preserved in their original state\n\nQuestion:\nWhich feature combination should you implement?", "choices": ["Microsoft Purview retention policy set to 'Retain for 7 years then delete' applied to Exchange", "Litigation hold on all mailboxes (indefinite) + retention policy to delete after 7 years", "In-place archive mailboxes + retention tags with a 7-year delete policy", "Litigation hold for 7 years + In-place archive + journaling rule"], "answer": [0], "explanations": ["Correct. A Microsoft Purview retention policy configured to 'Retain items for 7 years' and 'Then delete' applied to Exchange meets all requirements: (1) All items are preserved for 7 years, (2) Users cannot permanently delete items during the retention period (deleted items are preserved in the Recoverable Items folder), (3) After 7 years, items are automatically deleted, (4) Modified/deleted items are preserved in their original state in the Preservation Hold Library.", "Incorrect. Using litigation hold (indefinite) alongside a 7-year retention policy creates a conflict. Litigation hold prevents deletion indefinitely—it overrides the retention policy's delete action. Items would never be deleted after 7 years while the hold is active.", "Incorrect. In-place archive expands mailbox storage but doesn't prevent deletion. Retention tags (MRM) manage mailbox cleanup but don't provide the immutability required. Also, MRM is being deprecated in favor of Purview retention policies.", "Incorrect. This combination is overly complex. Litigation hold prevents deletion but doesn't auto-delete after 7 years. Journaling creates copies but adds storage costs. The Purview retention policy alone handles all requirements."], "tip": "Purview retention policy = retain + delete after period + immutable during retention. Litigation hold = retain indefinitely (no auto-delete). For regulatory archiving with auto-delete → Purview retention policy."}, {"id": "MS102-R2-021", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Windows Autopilot for Contoso. A user receives a new laptop and begins the Autopilot enrollment process. During the Enrollment Status Page (ESP), the process hangs at 'Identifying' for over 30 minutes. The Autopilot profile is assigned and the device hardware hash was uploaded.\n\nQuestion:\nWhat is the most likely cause of the ESP hanging at 'Identifying'?", "choices": ["The device does not have internet connectivity or cannot reach the required Microsoft endpoints (login.microsoftonline.com, *.manage.microsoft.com)", "The Autopilot deployment profile has not synced to the device due to Intune service latency — the profile assignment may take up to 48 hours for newly imported devices", "The ESP timeout is set too low in the Autopilot profile", "The device's hardware hash was not properly uploaded to the Autopilot service"], "answer": [0], "explanations": ["Correct. The 'Identifying' phase is when the device contacts the Autopilot service to identify itself and download its deployment profile. If the device cannot reach the required Microsoft endpoints (due to network issues, proxy, firewall, or DNS), it hangs at this phase. Common culprits: corporate firewall blocking required URLs, captive portal, no DHCP.", "Incorrect. While profile sync can take time for newly imported devices, the 'Identifying' phase specifically indicates the device is trying to contact the Intune service. If the profile wasn't assigned, the device would show 'Something went wrong' after a timeout.", "Incorrect. ESP timeout settings affect how long the ESP waits for apps and policies to install, not the initial identification phase. The 'Identifying' phase has its own built-in timeout.", "Incorrect. If the hardware hash was not uploaded, the device would go through normal OOBE, not show the ESP at all. The fact that ESP is displayed means the device is recognized as an Autopilot device."], "tip": "Autopilot ESP phases: Identifying (contacting service) → Device setup (join Azure AD, enroll MDM, install device apps/policies) → Account setup (install user apps/policies). 'Identifying' hang = network connectivity issue."}, {"id": "MS102-R2-022", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nYou manage Microsoft Purview for Litware Inc. The compliance team needs to implement information barriers to prevent the Investment Banking department from communicating with the Research department via Microsoft Teams and SharePoint. Other departments should be able to communicate freely with both.\n\nQuestion:\nWhat must you configure?", "choices": ["Define organization segments for each department, then create an information barrier policy blocking communication between Investment Banking and Research", "Configure a DLP policy that blocks messages between the two departments in Teams", "Create a Teams messaging policy that blocks messages between the two departments", "Create a conditional access policy blocking Teams access for users in both departments simultaneously"], "answer": [0], "explanations": ["Correct. Information barriers in Microsoft Purview require: (1) Define segments based on Azure AD attributes (e.g., Department = 'Investment Banking', Department = 'Research'), (2) Create an information barrier policy that blocks communication between the two segments. This prevents Teams chat/call, SharePoint/OneDrive sharing, and meeting collaboration between the two departments while allowing both to communicate with other departments.", "Incorrect. DLP policies monitor and protect sensitive data content. They cannot restrict communication based on sender/recipient department membership.", "Incorrect. Teams messaging policies control which messaging features are available (edit, delete, read receipts, etc.), not which users can communicate with each other.", "Incorrect. Conditional access controls access to applications, not communication between specific users. Blocking Teams for both departments would prevent them from using Teams entirely."], "tip": "Information barriers: Segments (who) + Policies (block or allow between segments). Works across Teams, SharePoint, OneDrive. Use case: Chinese wall regulations (Investment Banking ↔ Research)."}, {"id": "MS102-R2-023", "domain": "Manage applications", "type": "single", "stem": "Scenario:\nYou manage Microsoft 365 Apps for Fabrikam using Intune. Users report that after a recent update, the Outlook add-in for a critical CRM application (CRMConnect) stopped loading. The CRM vendor confirms the add-in is incompatible with the latest Office build. You need to allow the CRM vendor time to fix the add-in while keeping Office up to date for all other functionality.\n\nQuestion:\nWhat is the best approach?", "choices": ["Use the Intune Settings Catalog to set 'Resiliency: Add-in crash behavior' to load the add-in even after crashes, and use Cloud Policy to disable add-in update checks", "Contact the CRM vendor and wait for a fix; no immediate action is needed", "Roll back the entire Office installation to the previous version for all affected users", "Use Group Policy or Intune Settings Catalog to configure the 'Managed add-ins' list, blocking the CRMConnect add-in temporarily"], "answer": [2], "explanations": ["Incorrect. The add-in isn't crashing—it's incompatible with the new Office build and won't load. Resiliency settings handle add-in crashes, not fundamental incompatibility. Disabling update checks doesn't fix the current version.", "Incorrect. The CRM add-in is described as critical. Waiting without action means users cannot use the CRM integration, which impacts business operations.", "Correct. Since the add-in is critical and broken by the latest Office build, the pragmatic approach is to set a Target Version in Intune (Settings Catalog) to roll back to the previous working build for affected users. This restores the add-in functionality while the vendor develops a fix. When the fix is ready, remove the Target Version to resume normal updates.", "Incorrect. Blocking the add-in means users can't use the critical CRM functionality at all. The goal is to restore the add-in's functionality, not disable it."], "tip": "Office add-in compatibility issues: Roll back Office to a known-working version using Target Version while the vendor fixes the add-in. This is faster than waiting for a vendor patch and less disruptive than disabling the add-in."}, {"id": "MS102-R2-024", "domain": "Deploy and manage endpoints", "type": "single", "stem": "Scenario:\nYou manage Intune for Wingtip Toys. The company has 500 macOS devices enrolled in Intune. The security team wants to deploy a custom shell script that configures the macOS firewall settings. The script must:\n- Run as root\n- Run only once per device\n- Be deployed to all macOS devices in the Sales group\n\nQuestion:\nHow should you deploy this script?", "choices": ["Package the script as a .pkg file and deploy it as a macOS LOB app", "Devices > macOS > Shell scripts > Add script > Set 'Run script as signed-in user' to No, 'Max number of times to retry' to 0, assign to Sales group", "Use a macOS compliance policy custom script to enforce the firewall settings", "Create a macOS device configuration profile with a custom payload containing the firewall commands"], "answer": [1], "explanations": ["Incorrect. Packaging a simple shell script as a .pkg is unnecessarily complex. Intune natively supports shell script deployment for macOS without requiring package conversion.", "Correct. Intune supports deploying shell scripts to macOS devices via Devices > macOS > Shell scripts. Setting 'Run script as signed-in user' to No runs the script as root. Shell scripts run once by default (unless configured to run repeatedly). Assign the script to the Sales group for targeted deployment.", "Incorrect. macOS compliance policies in Intune do not support custom scripts for enforcement. Compliance scripts evaluate compliance status; they don't configure settings.", "Incorrect. Custom configuration profiles use .mobileconfig payloads, not shell scripts. While you could create a firewall profile this way, the scenario specifically requires deploying a shell script."], "tip": "macOS management in Intune: Shell scripts (Devices > macOS > Shell scripts) for one-time or recurring script execution. Configuration profiles for declarative settings. Shell scripts run as root by default when 'signed-in user' is set to No."}, {"id": "MS102-R2-025", "domain": "Implement security and compliance", "type": "single", "stem": "Scenario:\nAdventure Works Cycles uses Microsoft 365 E5. The security team wants to configure automatic attack disruption to automatically contain compromised user accounts during an active ransomware attack. When Defender XDR detects a human-operated ransomware attack pattern, it should automatically disable the compromised account.\n\nQuestion:\nWhat must be configured for automatic attack disruption to work?", "choices": ["Configure a Microsoft Sentinel playbook that triggers account disablement on ransomware detection", "Create a custom detection rule in Advanced Hunting with automated response actions", "Automatic attack disruption is built into Microsoft Defender XDR and works automatically when Defender for Endpoint, Defender for Identity, and Defender for Office 365 are deployed — no additional configuration is required", "Enable automated investigation and remediation (AIR) in Defender for Endpoint and set automation level to Full"], "answer": [2], "explanations": ["Incorrect. Microsoft Sentinel playbooks can automate responses, but automatic attack disruption is a native Defender XDR feature that works without Sentinel.", "Incorrect. Custom detection rules require manual KQL queries and are for known patterns. Automatic attack disruption uses built-in AI-driven detection across the entire Defender XDR stack for complex attack scenarios like ransomware.", "Correct. Automatic attack disruption is a built-in capability of Microsoft Defender XDR that requires no additional configuration beyond having the Defender products deployed. It uses AI to correlate signals across Defender for Endpoint, Identity, and Office 365 to detect high-confidence attacks and automatically contain compromised accounts and devices.", "Incorrect. AIR in Defender for Endpoint handles individual alert investigation and remediation. Automatic attack disruption operates at the incident level across all Defender products and is a separate, higher-level capability."], "tip": "Automatic attack disru
