t can handle the 'delete after 7 years' part, but it doesn't make data immutable during the retention period. Users could still modify or delete records.","Archive tier is a low-cost storage tier for rarely accessed data. It reduces cost but doesn't enforce immutability or retention policies. Data in Archive can still be deleted if the user has permissions."],"tip":"Immutable storage = WORM compliance (Write Once, Read Many). Time-based retention = cannot be deleted until period expires. Legal hold = cannot be deleted until hold is removed. If the question mentions regulatory retention, compliance, or 'must not be deletable' \u2014 immutable storage."},{"id":"AZ900-E02-034","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company has Azure resources tagged with environment names: Production, Staging, Development\n- The finance team wants to see a cost breakdown by environment\n- They also want to forecast next month's spending based on current trends\n- The analysis must cover all 12 subscriptions\n\nQuestion:\nWhich Azure tool should the finance team use?","choices":["Azure Pricing Calculator","Azure Cost Management + Billing","Azure Advisor","Azure TCO Calculator"],"answer":[1],"explanations":["The Pricing Calculator estimates costs for planned Azure services before deployment. It can't analyse actual spending by tags or forecast based on current usage trends.","This option is correct. Azure Cost Management + Billing provides cost analysis views that can filter and group by tags (e.g., environment: Production/Staging/Development), covers multiple subscriptions in a single view, and includes forecasting that projects future spending based on current trends. It's the operational cost analysis tool for active Azure environments.","Azure Advisor provides cost-saving recommendations (e.g., 'resize this VM to save \u00a350/month'), but it doesn't provide cost breakdown by tags, cross-subscription cost analysis, or spending forecasts.","TCO Calculator compares on-premises costs to Azure costs for migration planning. It doesn't analyse actual current Azure spending or provide tag-based breakdowns."],"tip":"Cost Management + Billing = analyse current spending (by tag, subscription, resource group), create budgets and alerts, forecast future costs. It's the operational cost tool. Pricing Calculator = estimate future costs. TCO = compare on-prem vs Azure."},{"id":"AZ900-E02-035","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company has two Azure Virtual Networks:\n  - VNet-A (10.1.0.0/16) in UK South \u2014 hosts the web application\n  - VNet-B (10.2.0.0/16) in UK South \u2014 hosts the database servers\n- Resources in VNet-A need to communicate with resources in VNet-B over Azure's backbone network\n- Communication must be private (no traffic over the public internet)\n\nQuestion:\nWhat should you configure?","choices":["Azure VPN Gateway (site-to-site)","VNet Peering between VNet-A and VNet-B","Azure ExpressRoute","Public IP addresses on all resources"],"answer":[1],"explanations":["VPN Gateway (site-to-site) creates an encrypted tunnel, typically used for connecting on-premises networks to Azure or connecting VNets across regions. For two VNets in the same region, it's unnecessarily complex and adds latency compared to VNet Peering.","This option is correct. VNet Peering connects two virtual networks over Azure's backbone network with low latency and high bandwidth. Traffic between peered VNets stays on Microsoft's private network \u2014 it never touches the public internet. Peering within the same region (local peering) has no additional cost beyond normal egress. It's the simplest and most efficient way to connect two VNets.","ExpressRoute connects on-premises networks to Azure via a private connection. Both VNets are already in Azure \u2014 ExpressRoute is for hybrid connectivity, not VNet-to-VNet communication within Azure.","Using public IP addresses would route traffic over the public internet, which violates the 'private, no public internet' requirement. It's also a security risk and adds latency."],"tip":"VNet Peering = connect VNets within Azure (private, low latency, backbone network). VPN Gateway = connect on-premises to Azure (encrypted tunnel over internet) or VNets across regions (more complex). ExpressRoute = private dedicated connection from on-premises. For VNet-to-VNet within Azure \u2014 Peering."},{"id":"AZ900-E02-036","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A company's application currently runs on a single on-premises server\n- When the server needs maintenance or reboots, the application is completely unavailable\n- The company wants to achieve 99.99% uptime by deploying to the cloud\n- They're willing to run multiple instances of the application\n\nQuestion:\nWhat must the company implement to achieve 99.99% uptime in Azure?","choices":["Deploy to a single Azure VM with Premium SSD storage","Deploy across multiple Availability Zones","Use Azure Spot VMs for cost savings","Deploy to a single Azure region with Standard storage"],"answer":[1],"explanations":["A single Azure VM with Premium SSD provides 99.9% SLA (three nines). This is better than on-premises single server, but it doesn't reach 99.99% (four nines). A single VM is still a single point of failure.","This option is correct. Deploying across multiple Availability Zones (separate data centres within a region) with multiple VM instances achieves 99.99% SLA. If one zone goes down, the other zones keep the application running. This is the standard Azure architecture for achieving four nines of availability.","Spot VMs can be evicted at any time when Azure needs capacity. They have NO uptime SLA \u2014 the exact opposite of 99.99% availability. Spot VMs are for cost savings on interruptible workloads only.","A single region with Standard storage provides limited redundancy. Standard storage doesn't offer the same SLA as Premium, and without availability zones, you can't achieve 99.99%."],"tip":"Azure VM SLAs: Single VM (Premium SSD) = 99.9%. Availability Set = 99.95%. Availability Zones = 99.99%. The exam loves testing these exact numbers. For 99.99% \u2014 deploy across Availability Zones with multiple instances."},{"id":"AZ900-E02-037","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company wants to implement Zero Trust security for Azure resources\n- The security team needs to require Multi-Factor Authentication (MFA) for all users accessing Azure resources from outside the corporate network\n- Users inside the corporate network should be able to access resources without MFA\n- The policy should apply to all cloud applications\n\nQuestion:\nWhat should you configure in Azure Active Directory (Entra ID)?","choices":["Azure AD Multi-Factor Authentication server","Conditional Access policy with a named location condition","Azure AD Identity Protection risk-based policies","Azure AD Privileged Identity Management"],"answer":[1],"explanations":["MFA Server is a legacy on-premises component that has been deprecated. Microsoft recommends cloud-based Conditional Access for all new MFA implementations. Even when it was active, MFA Server couldn't differentiate access requirements based on network location as elegantly as Conditional Access.","This option is correct. Conditional Access policies let you define IF/THEN rules: IF a user accesses cloud apps from outside a named location (corporate network IP ranges), THEN require MFA. You define the corporate network as a 'named location' with trusted IP ranges, and the policy exempts users connecting from those IPs while requiring MFA for all other locations. This is the Microsoft-recommended Zero Trust approach.","Identity Protection risk-based policies require MFA based on sign-in risk levels (e.g., unfamiliar location, impossible travel, anonymous IP). While useful, the question asks specifically about corporate network vs external \u2014 a location-based condition, not risk-based.","Privileged Identity Management (PIM) manages just-in-time access to privileged roles. It's about activating admin roles for a limited time, not about requiring MFA based on network location for all users."],"tip":"Conditional Access = IF (condition) THEN (control). Conditions: user, location, device, app, risk level. Controls: MFA, block, require compliant device, limit access. If the question describes 'require MFA when [condition]' \u2014 Conditional Access policy."},{"id":"AZ900-E02-038","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company wants to run containerised applications without managing any container orchestration infrastructure\n- The application consists of a single container that processes messages from a queue\n- The container should start, process the messages, and stop\n- No persistent infrastructure should be running between processing jobs\n\nQuestion:\nWhich Azure service should you use?","choices":["Azure Kubernetes Service (AKS)","Azure Container Instances (ACI)","Azure App Service (container deployment)","Azure Virtual Machine with Docker"],"answer":[1],"explanations":["AKS is a managed Kubernetes platform for orchestrating multiple containers in complex microservices architectures. The question describes a single container that runs temporarily \u2014 AKS would mean maintaining a persistent cluster that runs between jobs, which violates the 'no persistent infrastructure' requirement.","This option is correct. Azure Container Instances provides the simplest way to run a container in Azure. No orchestration overhead, no persistent infrastructure \u2014 you start a container, it runs, it stops. ACI charges per-second of execution. For a single container that processes queue messages and stops, ACI is the perfect fit. It's serverless containers.","App Service can run containers but runs on persistent App Service plans (always-on infrastructure). You pay for the plan even when no messages are being processed. Doesn't meet the 'no persistent infrastructure' requirement.","A VM with Docker requires managing the VM, OS, and Docker runtime. It's always-on infrastructure with the most management overhead \u2014 the opposite of what's needed."],"tip":"ACI = simple, single containers, on-demand, serverless (pay per second). AKS = complex, multi-container, orchestrated, persistent cluster. If the question says 'single container' + 'no infrastructure to manage' + 'start/stop' \u2014 ACI. If it says 'microservices' + 'orchestration' + 'scaling' \u2014 AKS."},{"id":"AZ900-E02-039","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company has an Azure environment that has grown organically over 2 years\n- Resources are scattered across resource groups with inconsistent naming\n- Multiple people have Owner access at the subscription level\n- No policies or governance controls are in place\n- The new CIO wants to implement proper governance using Microsoft best practices\n\nQuestion:\nWhich Microsoft framework provides guidance for establishing cloud governance, including identity, security, and cost management best practices?","choices":["Azure Well-Architected Framework","Microsoft Cloud Adoption Framework (CAF)","Azure Solution Architecture guides","Microsoft Security Development Lifecycle (SDL)"],"answer":[1],"explanations":["The Well-Architected Framework (WAF) focuses on optimising existing workloads across five pillars (cost, security, reliability, performance, operational excellence). It's a workload-level framework, not an organisation-level governance and adoption framework.","This option is correct. The Microsoft Cloud Adoption Framework (CAF) is a comprehensive guide for cloud governance and adoption. It covers the entire cloud journey: Strategy, Plan, Ready, Adopt, Govern, and Manage. The Govern methodology specifically addresses identity baseline, security baseline, cost management, resource consistency, and deployment acceleration. It's the framework for establishing organisational governance.","Azure Solution Architecture guides provide reference architectures for specific technical scenarios. They're helpful for designing solutions but don't provide organisational governance frameworks.","The Security Development Lifecycle (SDL) is a software development security framework \u2014 it guides how to build secure software, not how to govern a cloud environment."],"tip":"Cloud Adoption Framework (CAF) = organisation-level guidance for adopting and governing cloud (strategy, planning, governance). Well-Architected Framework (WAF) = workload-level guidance for optimising existing architectures. CAF = 'how do we adopt cloud?' WAF = 'is our workload designed well?'"},{"id":"AZ900-E02-040","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company wants to build a serverless API backend\n- The API must handle HTTP requests and return JSON responses\n- Individual API operations take less than 30 seconds to complete\n- You want to pay nothing when the API is not being called\n- The team wants to write the API logic in Python\n\nQuestion:\nWhich Azure service should you use?","choices":["Azure Virtual Machines","Azure App Service (Standard tier)","Azure Functions with HTTP trigger (Consumption plan)","Azure API Management"],"answer":[2],"explanations":["VMs run continuously and you pay 24/7 regardless of API usage. This directly violates the 'pay nothing when not being called' requirement.","App Service Standard tier runs on always-on dedicated compute. You pay a fixed monthly rate whether the API handles 0 requests or 1 million requests. Doesn't meet the pay-per-use requirement.","This option is correct. Azure Functions with HTTP triggers on a Consumption plan is the serverless answer. Functions executes your Python code when an HTTP request arrives and charges only for the execution time (per GB-second). When no requests are coming in, you pay nothing. The Consumption plan auto-scales and supports Python, with a 10-minute max execution time per invocation (30 seconds is well within this limit).","Azure API Management is a gateway/proxy that sits in front of your APIs. It provides rate limiting, authentication, documentation, and analytics \u2014 but it's not the API backend itself. You still need a compute service (like Functions) behind it."],"tip":"Azure Functions (Consumption plan) = serverless, pay-per-execution, scales to zero. HTTP trigger = respond to HTTP requests (build APIs). If the question says 'serverless API' + 'pay nothing when idle' + 'short-running operations' \u2014 Functions with Consumption plan."},{"id":"AZ900-E02-041","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- An insurance company has 10,000 employees\n- They want to adopt cloud services but are concerned about security\n- The CISO asks: 'How can we ensure that Microsoft meets our security and compliance requirements?'\n- They need to review Microsoft's ISO 27001 audit results, SOC reports, and penetration test results\n\nQuestion:\nWhere can the CISO access these trust and compliance documents from Microsoft?","choices":["Azure Compliance Manager","Microsoft Service Trust Portal","Azure Security Centre (Defender for Cloud)","Azure Policy compliance dashboard"],"answer":[1],"explanations":["Compliance Manager helps YOU assess your ORGANISATION'S compliance posture against standards. It doesn't provide Microsoft's audit reports or third-party assessment results. It's about your compliance, not Microsoft's.","This option is correct. The Microsoft Service Trust Portal (servicetrust.microsoft.com) is the centralised repository for Microsoft's compliance documentation: ISO 27001 audit reports, SOC 1/2/3 reports, penetration test results, GDPR assessments, and more. It's designed for CISOs, auditors, and compliance officers who need to verify Microsoft's security posture.","Defender for Cloud assesses the security posture of YOUR Azure resources. It provides recommendations for your deployment, not Microsoft's compliance certifications.","The Azure Policy compliance dashboard shows whether YOUR resources comply with the policies you've defined. It has nothing to do with Microsoft's ISO or SOC compliance."],"tip":"Service Trust Portal = Microsoft's compliance proof (their audits, their certifications). Compliance Manager = your organisation's compliance assessment (your compliance posture). Defender for Cloud = your Azure resource security posture. Three different scopes \u2014 Microsoft's, your organisation's, your resources'."},{"id":"AZ900-E02-042","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company needs a data warehouse solution in Azure\n- They have 50 TB of structured data from multiple sources (ERP, CRM, web analytics)\n- Data analysts need to run complex SQL queries across all this data\n- The solution must support both batch data loading and real-time analytics\n- They want a managed service that can scale compute and storage independently\n\nQuestion:\nWhich Azure service should you use?","choices":["Azure SQL Database","Azure Synapse Analytics","Azure Cosmos DB","Azure Data Lake Storage"],"answer":[1],"explanations":["Azure SQL Database is designed for transactional (OLTP) workloads, not data warehousing (OLAP). It has a maximum database size of 100 TB but isn't optimised for the complex analytical queries across massive datasets that a data warehouse requires.","This option is correct. Azure Synapse Analytics (formerly SQL Data Warehouse) is Azure's enterprise analytics service. It provides a unified experience for data warehousing, data integration, big data analytics, and real-time analytics. It handles petabytes of data, supports T-SQL queries, scales compute and storage independently (Dedicated SQL pools), and integrates with Power BI for visualisation. It can handle both batch loading (Synapse Pipelines) and real-time streaming.","Cosmos DB is a globally distributed NoSQL database optimised for low-latency reads/writes. It's not designed for complex SQL analytical queries across 50 TB of structured data from multiple sources. Different use case entirely.","Data Lake Storage is a storage service for big data analytics \u2014 it stores raw data at massive scale. But it's just storage \u2014 it doesn't provide SQL query capabilities, compute scaling, or a data warehouse engine. Synapse Analytics often USES Data Lake Storage as its underlying storage layer."],"tip":"Synapse Analytics = data warehouse + analytics (structured data, SQL queries, OLAP). SQL Database = transactional database (OLTP). Cosmos DB = globally distributed NoSQL. Data Lake Storage = raw data storage at scale. For 'data warehouse' + 'complex SQL' + 'multiple data sources' \u2014 Synapse."},{"id":"AZ900-E02-043","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company grants a consultant temporary access to Azure resources\n- The consultant needs Contributor access to a specific resource group for a 3-month project\n- After the project ends, the access should be automatically revoked\n- The security team wants to ensure no permanent elevated access is granted to external parties\n\nQuestion:\nWhich Azure AD (Entra ID) feature should you use to provide time-limited role assignment?","choices":["Azure AD Access Reviews","Azure AD Privileged Identity Management (PIM)","Azure AD Guest Access (B2B)","Conditional Access policies"],"answer":[1],"explanations":["Access Reviews periodically review and certify who has access to what. They can help identify stale access after the fact, but they don't provide time-bound, automatically expiring role assignments. You'd still need someone to manually revoke access during a review.","This option is correct. Azure AD Privileged Identity Management (PIM) enables time-bound role assignments \u2014 you assign the Contributor role with a start and end date. When the 3-month period expires, access is automatically revoked. PIM also provides audit trails, approval workflows, and notifications. It's designed exactly for this scenario: temporary, governed, elevated access.","Guest Access (B2B) invites external users to your directory, but the invitation itself doesn't provide time-limited RBAC role assignments. The guest account would persist and the role assignment wouldn't auto-expire without PIM.","Conditional Access controls HOW users access resources (require MFA, block locations), not WHEN their role assignments expire. It's about access conditions, not time-bound role management."],"tip":"PIM = just-in-time, time-bound role activation/assignment. Access Reviews = periodic certification of who has access. Conditional Access = conditions under which access is granted. For 'temporary role assignment' or 'time-limited access that auto-expires' \u2014 PIM."},{"id":"AZ900-E02-044","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company builds IoT solutions for smart buildings\n- Thousands of IoT sensors send temperature, humidity, and occupancy data to Azure\n- The system must ingest millions of events per second\n- Data needs to be processed in real-time and also stored for batch analytics\n\nQuestion:\nWhich Azure service should you use for the high-throughput event ingestion?","choices":["Azure Queue Storage","Azure Event Hubs","Azure Service Bus","Azure Notification Hubs"],"answer":[1],"explanations":["Azure Queue Storage handles simple message queuing with much lower throughput. It processes messages individually and isn't designed for millions of events per second from thousands of producers.","This option is correct. Azure Event Hubs is a big data streaming platform and event ingestion service. It can receive and process millions of events per second from thousands of concurrent sources (IoT sensors). It supports partitioning for parallel processing, integrates with Azure Stream Analytics for real-time processing, and can capture data to Azure Data Lake or Blob Storage for batch analytics. It's the purpose-built solution for high-throughput telemetry ingestion.","Azure Service Bus is an enterprise message broker designed for transactional messaging with delivery guarantees (FIFO, dead-letter, transactions). It's for application-to-application messaging, not high-throughput telemetry ingestion from thousands of IoT sensors.","Azure Notification Hubs sends push notifications to mobile devices. It pushes messages OUT to devices, not IN from IoT sensors. Completely different direction of data flow."],"tip":"Event Hubs = high-throughput event streaming (millions/sec, big data, telemetry). Service Bus = enterprise messaging (transactions, ordering, delivery guarantees). Queue Storage = simple queuing. If the question mentions 'millions of events per second' or 'IoT telemetry ingestion' \u2014 Event Hubs."},{"id":"AZ900-E02-045","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company has deployed Azure resources using pay-as-you-go pricing\n- After analysing usage patterns, you find that several VMs run 24/7 with consistent utilisation\n- Azure Advisor recommends purchasing Reserved Instances for these VMs\n- The operations team also notices some VMs are significantly underutilised (CPU < 5%)\n\nQuestion:\nWhich Azure Advisor recommendation category identifies both the Reserved Instance opportunity and the underutilised VM observation?","choices":["Security","Reliability","Cost","Performance"],"answer":[2],"explanations":["Security recommendations cover topics like enabling MFA, applying NSG rules, and patching VMs. They don't address cost optimisation or purchasing strategies.","Reliability recommendations help improve the resilience of your applications (e.g., enable backup, add redundancy). They don't focus on cost savings or resource utilisation for financial purposes.","This option is correct. Azure Advisor's Cost category identifies opportunities to reduce spending. This includes: recommending Reserved Instances for steady-state VMs (save up to 72%), identifying underutilised or idle resources that should be resized or deallocated, and suggesting other cost optimisation strategies. Both scenarios in the question \u2014 RI recommendations and underutilised VM detection \u2014 fall under Cost recommendations.","Performance recommendations suggest ways to improve the speed and responsiveness of resources. While an underutilised VM might also appear under Performance (suggesting it's over-provisioned), the primary categorisation for cost-saving actions like RI purchases and rightsizing is the Cost category."],"tip":"Advisor Cost recommendations: buy RIs for steady workloads, resize/deallocate underutilised VMs, delete unused resources, use cheaper tiers. The Cost category is purely about saving money. Performance might note the same VM is over-provisioned, but the financial recommendation comes from Cost."},{"id":"AZ900-E02-046","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company has a web application that authenticates users\n- They need a cloud-based identity service for:\n  - User authentication (username/password, MFA)\n  - Single sign-on (SSO) to multiple SaaS applications\n  - Self-service password reset\n  - External identity provider federation (Google, Facebook)\n\nQuestion:\nWhich Azure service provides these identity management capabilities?","choices":["Azure Key Vault","Azure Active Directory (Microsoft Entra ID)","Azure Information Protection","Azure Role-Based Access Control (RBAC)"],"answer":[1],"explanations":["Key Vault stores secrets, keys, and certificates. It manages cryptographic material, not user identities. It doesn't provide authentication, SSO, or password management.","This option is correct. Azure Active Directory (now Microsoft Entra ID) is Microsoft's cloud-based identity and access management service. It provides: user authentication with MFA, SSO to thousands of SaaS apps (Salesforce, ServiceNow, etc.), self-service password reset for end users, and external identity federation (B2C for consumer identities like Google/Facebook, B2B for business partner identities). It's the identity backbone for Azure and Microsoft 365.","Azure Information Protection (now part of Microsoft Purview) classifies, labels, and protects documents. It's a data protection service, not an identity management service.","RBAC controls what authenticated users can do with Azure resources (authorization). It doesn't handle authentication, SSO, password resets, or identity federation. RBAC works ON TOP of Azure AD \u2014 Azure AD authenticates, RBAC authorises."],"tip":"Azure AD (Entra ID) = authentication (who are you?) + identity management (SSO, MFA, password reset, federation). RBAC = authorization (what can you do?). Azure AD proves identity; RBAC grants permissions. If the question is about 'sign in', 'SSO', 'MFA', or 'identity' \u2014 Azure AD."},{"id":"AZ900-E02-047","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A logistics company has 50 branch offices worldwide\n- Each branch currently runs its own email server, file server, and CRM system\n- The CTO wants to eliminate all branch office servers and move to cloud-based equivalents\n- After migration: Exchange Online for email, SharePoint Online for files, Dynamics 365 for CRM\n\nQuestion:\nWhat type of cloud migration is this?","choices":["Lift and shift (rehost)","Refactor (replatform)","Replace (SaaS adoption)","Retain (keep on-premises)"],"answer":[2],"explanations":["Lift and shift means moving existing applications as-is to cloud infrastructure (e.g., running your Exchange Server on an Azure VM). The company is NOT moving their existing servers to the cloud \u2014 they're replacing them with different SaaS products.","Refactoring means modifying an application to take advantage of cloud-native features (e.g., changing an app to use Azure SQL instead of SQL Server, or adding auto-scaling). The company isn't modifying their existing applications \u2014 they're abandoning them for SaaS alternatives.","This option is correct. Replace (also called 'repurchase' in the 6 Rs of migration) means retiring existing applications and subscribing to SaaS equivalents. Exchange Server \u2192 Exchange Online, file servers \u2192 SharePoint Online, on-premises CRM \u2192 Dynamics 365. The company is replacing custom/on-premises solutions with SaaS products. No code is migrated \u2014 they adopt a completely new product.","Retain means keeping applications on-premises because they can't or shouldn't be migrated. The question explicitly states they're eliminating all branch office servers \u2014 the opposite of retaining."],"tip":"Migration strategies (6 Rs): Rehost = lift and shift (move as-is). Refactor = optimise for cloud (modify code). Replace = adopt SaaS (abandon old, subscribe to new). Retire = decommission (no longer needed). Retain = keep on-premises. Rearchitect = rebuild cloud-native."},{"id":"AZ900-E02-048","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company is planning to deploy resources in multiple Azure regions\n- The networking team needs to understand Azure's global network architecture\n- They want to know how data travels between Azure regions\n\nQuestion:\nWhat is the name of Microsoft's global private network that connects Azure data centres?","choices":["Azure ExpressRoute","Azure Virtual WAN","Microsoft global network (backbone)","Azure Content Delivery Network"],"answer":[2],"explanations":["ExpressRoute provides private connections from YOUR on-premises network to Azure. It's a customer connectivity product, not Microsoft's internal data centre interconnect.","Azure Virtual WAN is a networking service that connects branches, VPNs, and ExpressRoute into a unified hub-and-spoke topology. It's a customer-facing product for hub networking, not Microsoft's internal backbone.","This option is correct. Microsoft's global network (backbone) is one of the largest in the world, with over 165,000 miles of fibre optic and submarine cables connecting 60+ Azure regions. When data travels between Azure regions (e.g., UK South to West Europe), it stays on Microsoft's private network \u2014 it doesn't traverse the public internet. This ensures low latency, high security, and reliable inter-region communication.","Azure CDN caches content at edge locations. While CDN uses Microsoft's network, it's a content delivery service, not the name of the global backbone itself."],"tip":"Microsoft's global backbone network connects all Azure regions privately. Traffic between Azure services in different regions stays on this private network by default. This is a security and performance benefit \u2014 data doesn't cross the public internet when moving between Azure regions."},{"id":"AZ900-E02-049","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company runs a production SQL Server database on-premises\n- They need to migrate the database to Azure with minimal downtime\n- The migration must happen live \u2014 the on-premises database must continue serving requests during migration\n- Once migration is complete, they'll cut over to Azure SQL\n\nQuestion:\nWhich Azure service facilitates this online database migration?","choices":["Azure Migrate","Azure Database Migration Service (DMS)","Azure Data Factory","Azure Site Recovery"],"answer":[1],"explanations":["Azure Migrate is the hub for discovering, assessing, and planning migrations. While it integrates with DMS for database migration, Migrate itself doesn't perform the actual database migration \u2014 it's the assessment and orchestration layer.","This option is correct. Azure Database Migration Service (DMS) supports online (continuous sync) migration from on-premises SQL Server to Azure SQL. During an online migration, DMS replicates data to Azure SQL while the source database continues serving production traffic. When the data is synchronised, you perform a quick cutover with minimal downtime. DMS also supports migration of PostgreSQL, MySQL, and other database engines.","Azure Data Factory is a data integration service for ETL/ELT pipelines. It can copy data between sources, but it's not designed for live database migration with continuous synchronisation and minimal-downtime cutover.","Azure Site Recovery replicates VMs and physical servers for disaster recovery. It doesn't migrate individual databases \u2014 it replicates entire machines. You'd use ASR to migrate the whole SQL Server VM, not just the database."],"tip":"Database Migration Service = live, online database migration with minimal downtime (continuous sync + cutover). Azure Migrate = overall migration assessment hub. Data Factory = data integration and ETL. If the question says 'database migration' + 'minimal downtime' + 'live/online' \u2014 DMS."},{"id":"AZ900-E02-050","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A company currently runs all applications on two physical servers in their office\n- Both servers are 5 years old and approaching end of life\n- The company has 25 employees and a limited IT budget\n- They want to move to the cloud to avoid purchasing new hardware\n- The CTO asks: 'What is the MAIN risk of cloud computing that we should be aware of?'\n\nQuestion:\nWhich of the following is a commonly cited risk or limitation of cloud computing?","choices":["Inability to scale resources","Dependency on internet connectivity","Higher physical security requirements for the company","Increased hardware maintenance costs"],"answer":[1],"explanations":["Cloud computing's primary advantage IS the ability to scale resources. This is a benefit, not a risk. Cloud enables scaling that small companies couldn't achieve on-premises.","This option is correct. Cloud services require reliable internet connectivity. If the company's internet connection goes down, employees cannot access cloud-hosted applications, email, or data. This is a widely recognised risk of cloud adoption \u2014 especially for small offices that may have a single internet connection. Mitigation strategies include redundant ISP connections and offline-capable applications.","Moving to the cloud REDUCES physical security requirements for the company. They no longer need to secure servers in their office \u2014 Microsoft handles physical security of Azure data centres. This is a benefit, not a risk.","Moving to the cloud ELIMINATES hardware maintenance costs. There's no hardware to maintain. The cloud provider manages all physical infrastructure. This is a benefit, not a risk."],"tip":"Common cloud risks: internet dependency, data sovereignty/residency, vendor lock-in, limited control over infrastructure, potential cost overruns without proper governance. The exam tests both benefits AND risks of cloud computing. Internet dependency is the most commonly cited operational risk."}]},{"set":3,"title":"Practice Exam 3","questions":[{"id":"AZ900-E03-001","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- Your organisation operates a global SaaS platform\n- A data centre hosting your application experiences a catastrophic power failure\n- The application automatically continues running from a secondary data centre in the same region with no data loss\n\nQuestion:\nWhich cloud concept is demonstrated when the application continues operating despite the data centre failure?","choices":["Fault tolerance","Scalability","Agility","Consumption-based pricing"],"answer":[0],"explanations":["This option is correct. Fault tolerance is the ability of a system to continue operating without interruption when a component fails. The application seamlessly continued from a secondary data centre with zero data loss and no service interruption \u2014 this is fault tolerance. It goes beyond high availability (which may allow brief disruption) by ensuring zero impact on the end user.","Scalability is the ability to increase or decrease resources to match demand. The data centre failure isn't a demand issue \u2014 it's a failure scenario.","Agility is the speed at which you can deploy and configure cloud resources. The scenario describes failure resilience, not rapid deployment.","Consumption-based pricing is a billing model. It has no relation to failure handling or resilience."],"tip":"Fault tolerance vs High availability: Fault tolerance = zero interruption during failure (seamless failover). High availability = minimal interruption (brief failover, 99.9%+ uptime). If the question says 'continues with no impact' or 'zero downtime during failure' \u2014 fault tolerance."},{"id":"AZ900-E03-002","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A large bank wants to use Azure but has concerns\n- Their legal team asks: 'If Microsoft goes bankrupt or discontinues Azure, what happens to our data and applications?'\n- The CTO raises a related concern: 'If we build everything on Azure-specific services, how difficult would it be to move to another provider?'\n\nQuestion:\nWhat cloud risk are the bank's legal team and CTO describing?","choices":["Data breach risk","Vendor lock-in","Compliance risk","Latency risk"],"answer":[1],"explanations":["Data breach risk involves unauthorised access to data. The concerns are about provider dependency and portability, not data security incidents.","This option is correct. Vendor lock-in is the risk that deep dependency on a single cloud provider makes it difficult or expensive to switch providers. Using Azure-specific services (e.g., Azure Functions, Cosmos DB, Azure AD B2C) creates tight coupling. If the provider's business changes or pricing becomes unfavourable, migration costs could be significant. This is a well-recognised cloud risk that multi-cloud strategies and open standards help mitigate.","Compliance risk involves failing to meet regulatory requirements. While related to data governance, the specific concerns raised are about provider dependency and portability, not regulatory compliance.","Latency risk involves network delays affecting application performance. The concerns are about business continuity and portability, not network performance."],"tip":"Vendor lock-in is mitigated by: using open standards (Kubernetes, PostgreSQL), avoiding proprietary-only services where possible, and maintaining data export capabilities. The exam may test your understanding of cloud risks alongside benefits."},{"id":"AZ900-E03-003","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A small company has 20 employees\n- They use a local file server for document storage\n- They use a locally installed accounting application\n- The IT manager (who is also the receptionist) manages both systems\n- The company experiences frequent issues with the file server crashing\n\nQuestion:\nWhich cloud benefit would MOST improve this company's situation?","choices":["Elasticity \u2014 automatic scaling based on demand","Reliability \u2014 built-in redundancy and fault tolerance","Geo-distribution \u2014 deploying across multiple regions","Cost optimisation \u2014 economies of scale"],"answer":[1],"explanations":["A 20-person company with a single file server doesn't need automatic scaling. Their demand is stable and small. Elasticity solves a problem they don't have.","This option is correct. Reliability is the biggest improvement for this company. Their file server crashes frequently, causing business disruption. Cloud services like SharePoint Online or Azure Files provide built-in redundancy (multiple copies of data), automatic failover, and SLA-backed uptime guarantees. The part-time IT manager no longer needs to troubleshoot server crashes \u2014 Microsoft handles infrastructure reliability.","A 20-person company in one location doesn't need global geo-distribution. Their users are all in one office.","While cloud may reduce costs, the company's primary pain point is server crashes and reliability, not cost. Solving the reliability problem is the most impactful improvement."],"tip":"When the exam presents a scenario with a specific pain point, choose the cloud benefit that directly addresses it. Frequent crashes \u2192 reliability. Unpredictable demand \u2192 elasticity. High upfront costs \u2192 OpEx model. Slow deployments \u2192 agility."},{"id":"AZ900-E03-004","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company deploys an application across three Azure Availability Zones in a region\n- Availability Zone 1 hosts the primary database\n- Availability Zone 2 hosts a synchronous replica of the database\n- Availability Zone 3 hosts another synchronous replica\n- A natural disaster destroys the data centre in Availability Zone 1\n\nQuestion:\nWhat happens to the application's database availability?","choices":["The database becomes unavailable until Zone 1 is restored","The database remains available \u2014 a replica in Zone 2 or Zone 3 is promoted to primary","All data since the last backup is lost","The database is available in read-only mode until Zone 1 recovers"],"answer":[1],"explanations":["If the architecture uses synchronous replicas across zones, the loss of Zone 1 does NOT make the database unavailable. The surviving zones hold identical copies of the data.","This option is correct. With synchronous replicas across Availability Zones, the data in Zone 2 and Zone 3 is identical to Zone 1 (zero data loss). When Zone 1 fails, one of the surviving replicas is automatically promoted to primary. The application continues with full read-write capability. This is the purpose of zone-redundant deployment \u2014 survive the complete loss of any single data centre.","Synchronous replication means every write is committed to all replicas before being acknowledged. When Zone 1 is destroyed, Zones 2 and 3 have all the data up to the last committed transaction \u2014 zero data loss.","With synchronous replicas, the promoted replica has full read-write capability. Read-only mode would only apply if the replicas were asynchronous and couldn't be safely promoted to primary, which isn't the case here."],"tip":"Availability Zones + synchronous replicas = survive data centre loss with zero data loss and automatic failover. This is why zone-redundant deployments achieve 99.99% SLA. The exam tests understanding of what happens when a zone fails."},{"id":"AZ900-E03-005","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company has an Azure subscription with multiple resource groups\n- A developer creates a virtual machine in 'ResourceGroup-Dev'\n- The developer later needs to move the VM to 'ResourceGroup-Prod'\n- The VM has a public IP address, a managed disk, and a network interface\n\nQuestion:\nCan you move an Azure resource between resource groups?","choices":["No \u2014 resources are permanently assigned to the resource group they were created in","Yes \u2014 you can move most Azure resources between resource groups within the same subscription","Yes \u2014 but only if you delete and recreate the resource in the new resource group","Yes \u2014 but only if both resource groups are in the same Azure region"],"answer":[1],"explanations":["Resources are NOT permanently assigned to a resource group. Azure supports moving resources between resource groups. This is a common misconception the exam tests.","This option is correct. Most Azure resources can be moved between resource groups (and even between subscriptions). The move operation changes the resource's logical grouping without changing the resource's physical location, configuration, or functionality. VMs, their disks, NICs, and public IPs can be moved together. The move operation is a management-plane operation \u2014 no downtime is typically required.","You do NOT need to delete and recreate resources. Azure's move operation transfers the resource's metadata to the new resource group without affecting the resource itself. Deleting and recreating would cause downtime and potential data loss.","Resource groups and resource locations are independent. A resource group can be in UK South, but contain resources deployed in West Europe. When you move a resource between groups, the resource's deployed region doesn't change."],"tip":"Resources can be moved between resource groups and subscriptions. The resource group's region is just metadata \u2014 it doesn't constrain where resources inside it are deployed. A resource in UK South can be in a resource group tagged as 'North Europe.' The exam tests this distinction."},{"id":"AZ900-E03-006","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company has deployed Azure resources and wants to control network access to an Azure SQL Database\n- The database should only be accessible from resources within a specific Azure Virtual Network\n- No traffic from the public internet should reach the database\n- The solution must provide a private IP address for the database within the VNet\n\nQuestion:\nWhich Azure networking feature should you configure?","choices":["Service Endpoints","Private Endpoints (Azure Private Link)","Azure Firewall rules","Network Security Group rules"],"answer":[1],"explanations":["Service Endpoints route traffic from a VNet to Azure SQL over the Azure backbone, but the database still has a public IP address. Traffic is secured by the route, but the public endpoint still exists and could potentially be exposed. The question asks for a private IP address within the VNet.","This option is correct. Private Endpoints (powered by Azure Private Link) create a private network interface with a private IP address in your VNet that connects to the Azure SQL Database. The database is accessible ONLY via this private IP within the VNet \u2014 no public IP, no public internet access. This is the most secure option and provides exactly what the question asks: a private IP for the database within the VNet.","Azure Firewall can filter traffic to/from the database, but it doesn't give the database a private IP address within the VNet. It's a network security appliance, not a private connectivity mechanism for PaaS services.","NSGs filter traffic by IP/port/protocol, but they can't assign a private IP to an Azure PaaS service like SQL Database. NSGs work at the subnet/NIC level for VNet-connected resources."],"tip":"Private Endpoint = private IP in YOUR VNet for Azure PaaS services (SQL, Storage, Cosmos DB, etc.). Service Endpoint = optimised routing from VNet to PaaS (still uses public IP). If the question says 'private IP address' or 'no public endpoint' for a PaaS service \u2014 Private Endpoint."},{"id":"AZ900-E03-007","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- A media company needs to process video files uploaded by users\n- When a video is uploaded to Azure Blob Storage, a function should automatically trigger to transcode the video into multiple resolutions\n- The transcoding function runs for approximately 2 minutes per video\n- The company wants a serverless, event-driven solution\n\nQuestion:\nWhich combination of Azure services should you use?","choices":["Azure Blob Storage + Azure Logic Apps","Azure Blob Storage + Azure Functions (Blob trigger)","Azure Queue Storage + Azure Virtual Machines","Azure Event Grid + Azure App Service"],"answer":[1],"explanations":["Logic Apps can trigger on blob creation and orchestrate workflows, but Logic Apps is designed for workflow orchestration and integrations (connecting SaaS services, sending emails, etc.), not for executing custom video transcoding code. Logic Apps also has per-action pricing that gets expensive for compute-intensive operations.","This option is correct. Azure Functions with a Blob trigger automatically executes code when a new blob is created in a storage container. The function runs your transcoding logic, processes the video, and saves the output. It's serverless (no infrastructure to manage), event-driven (triggered by the upload), and 2 minutes is well within the Functions timeout. Blob Storage + Blob-triggered Functions is a standard serverless pattern.","Using VMs for transcoding means maintaining always-on infrastructure. You'd need to build the queue polling, processing, and scaling logic yourself. This is the opposite of serverless.","Event Grid + App Service could work (Event Grid reacts to blob events and routes to App Service), but App Service runs continuously with dedicated infrastructure \u2014 not serverless. Functions is the serverless compute option."],"tip":"Blob Storage + Functions (Blob trigger) is a classic serverless pattern: file lands in storage \u2192 function automatically processes it. If the question describes 'when a file is uploaded, do something' in a serverless context \u2014 this is the pattern."},{"id":"AZ900-E03-008","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company has an Azure subscription with 100+ resources\n- You need to give a contractor read-only access to all resources in a single resource group named 'RG-Analytics'\n- The contractor should NOT be able to modify, create, or delete any resources\n- The contractor should NOT have any access to resources in other resource groups\n\nQuestion:\nWhat should you configure?","choices":["Assign the Contributor role at the RG-Analytics resource group scope","Assign the Reader role at the RG-Analytics resource group scope","Assign the Reader role at the subscription scope","Assign a custom role with no permissions at the subscription scope"],"answer":[1],"explanations":["Contributor allows creating, modifying, and deleting resources. The contractor needs READ-ONLY access. Contributor is far too permissive.","This option is correct. The Reader built-in role grants read-only access to all resources. Assigning it at the resource group scope (RG-Analytics) means the contractor can view everything in that resource group but cannot modify, create, or delete anything. Because it's scoped to the resource group, they have zero access to other resource groups. RBAC assignments are inherited downward, so the contractor can read all resources within RG-Analytics.","Reader at the subscription scope would give read access to ALL resource groups in the subscription, not just RG-Analytics. This violates the 'no access to other resource groups' requirement.","A custom role with no permissions is useless \u2014 it wouldn't grant any access. The Reader built-in role is the correct choice for read-only access."],"tip":"RBAC scope matters: subscription-level assignments cascade to ALL resource groups and resources. Resource group-level assignments apply only to that group. If the question says 'only this resource group' \u2014 assign at the resource group scope, not the subscription."},{"id":"AZ900-E03-009","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A university runs a research computing cluster on-premises\n- During term time, 200 researchers use the cluster at full capacity\n- During summer holidays (3 months), only 20 researchers use it\n- The university wants to reduce the cluster to 10% capacity during summer and restore it for term time\n- They DON'T want to own hardware that sits idle for 3 months\n\nQuestion:\nWhich TWO cloud characteristics address this requirement? (Select the BEST single answer that combines both needs.)","choices":["Elasticity and consumption-based pricing","High availability and fault tolerance","Geo-distribution and compliance","Security and governance"],"answer":[0],"explanations":["This option is correct. Elasticity allows the university to scale from 10% to 100% capacity based on the academic calendar. Consumption-based pricing means they only pay for the resources they use \u2014 10% of the cost during summer, full cost during term. Together, these two characteristics solve both requirements: dynamic capacity adjustment and no wasted hardware investment.","High availability and fault tolerance are about uptime and resilience. The university's problem is seasonal capacity variation, not uptime concerns.","Geo-distribution is about deploying across regions for global access. Compliance is about meeting regulations. Neither addresses seasonal capacity variation or cost optimisation.","Security and governance are important but don't address the specific requirements of scaling capacity seasonally and avoiding idle hardware costs."],"tip":"Many exam questions combine multiple cloud characteristics. Elasticity (dynamic scaling) + consumption-based pricing (pay-for-use) is a powerful combination for variable workloads. If a scenario describes seasonal/periodic capacity changes plus cost concerns \u2014 these two together."},{"id":"AZ900-E03-010","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company needs to automate repetitive IT processes in Azure\n- Tasks include: starting and stopping VMs on a schedule, cleaning up unused resources, and generating weekly reports\n- The automation must run on a schedule without manual intervention\n- The team prefers to write automation scripts in PowerShell\n\nQuestion:\nWhich Azure service should you use?","choices":["Azure Functions (Timer trigger)","Azure Automation with PowerShell runbooks","Azure Logic Apps","Azure DevOps Pipelines"],"answer":[1],"explanations":["Azure Functions can run PowerShell on a timer, but it's designed for short-lived, event-driven functions. For operational IT automation tasks like starting/stopping VMs and resource cleanup, Azure Automation is purpose-built and provides better tooling (runbook management, credential management, shared modules).","This option is correct. Azure Automation is specifically designed for IT process automation. PowerShell runbooks let you write scripts to manage Azure resources, schedules trigger them automatically, and the service provides credential management (Run As accounts, managed identities) for secure access. It's the go-to service for operational tasks like VM start/stop schedules and resource cleanup.","Logic Apps is a visual workflow automation tool that connects services with pre-built connectors. While it can schedule tasks, it's designed for workflow integration (connect SaaS apps, route data), not PowerShell-based IT automation. The team specifically wants to write PowerShell scripts.","Azure DevOps Pipelines is for CI/CD \u2014 building, testing, and deploying applications. It's not designed for operational IT automation tasks like starting/stopping VMs or cleaning up resources."],"tip":"Azure Automation = IT operations automation (PowerShell/Python runbooks, schedules, credential management). Functions = event-driven code execution (short-lived, serverless). Logic Apps = workflow orchestration (visual designer, SaaS connectors). If the question mentions 'PowerShell scripts' + 'scheduled IT tasks' \u2014 Azure Automation."},{"id":"AZ900-E03-011","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company uses Azure Active Directory (Entra ID) for identity management\n- Employees need to sign in once and access Microsoft 365, Salesforce, ServiceNow, and a custom internal web application\n- The IT team wants to reduce the number of passwords employees need to remember\n\nQuestion:\nWhich Azure AD feature enables this single sign-in experience across multiple applications?","choices":["Multi-Factor Authentication (MFA)","Single Sign-On (SSO)","Azure AD B2C","Self-Service Password Reset (SSPR)"],"answer":[1],"explanations":["MFA adds a second verification step during authentication. While it improves security, it doesn't reduce the number of passwords or enable access to multiple applications with a single sign-in.","This option is correct. Single Sign-On (SSO) allows users to authenticate once with Azure AD and then access all connected applications (Microsoft 365, Salesforce, ServiceNow, custom apps) without re-entering credentials. Azure AD supports SSO via SAML, OIDC, and password-based SSO. Users remember one set of credentials, and Azure AD handles authentication to each application.","Azure AD B2C (Business-to-Consumer) is an identity solution for customer-facing applications. It manages external consumer identities (sign up with email, Google, Facebook). It's not for internal employee SSO across enterprise applications.","SSPR allows users to reset their own passwords without contacting IT. It reduces helpdesk calls but doesn't enable single sign-on across multiple applications."],"tip":"SSO = one sign-in, access many apps. MFA = extra verification step (not fewer passwords). B2B = external business partner identities. B2C = external consumer identities. SSPR = self-service password management. For 'sign in once, access everything' \u2014 SSO."},{"id":"AZ900-E03-012","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company deploys Azure resources using ARM templates\n- The templates are stored in a Git repository and follow a CI/CD pipeline\n- A developer accidentally modifies an ARM template that removes a critical production network security group\n- The deployment succeeds, and the NSG is deleted\n\nQuestion:\nWhich Azure feature could have PREVENTED the NSG from being deleted?","choices":["Azure Monitor alert","Resource lock (CanNotDelete) on the NSG","Azure Backup of the NSG","Azure Policy with Audit effect"],"answer":[1],"explanations":["Azure Monitor would detect that the NSG was deleted AFTER the fact and send an alert. It's reactive, not preventive. The damage is already done by the time the alert fires.","This option is correct. A CanNotDelete resource lock on the NSG prevents ANY deletion \u2014 including ARM template deployments that attempt to remove it. The deployment would fail with an error when trying to delete the locked NSG, protecting the critical resource. Resource locks override RBAC permissions, so even an Owner or a CI/CD pipeline with Contributor access cannot delete a locked resource without first removing the lock.","Azure Backup provides recovery after data loss, but NSGs aren't backed up by Azure Backup (it's for VMs, databases, files). Even if recovery were possible, the question asks about prevention, not recovery.","Azure Policy with Audit effect would flag the deletion as non-compliant but would NOT prevent it. Audit only creates a compliance entry \u2014 it doesn't block operations. A Deny effect could prevent certain configurations but doesn't specifically protect individual resources from deletion like a lock does."],"tip":"Resource locks = prevent accidental deletion or modification. CanNotDelete = prevents deletion by anyone. ReadOnly = prevents any changes. Locks even override ARM template deployments. If the question says 'prevent accidental deletion of a specific resource' \u2014 resource lock."},{"id":"AZ900-E03-013","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- A financial services company needs to deploy an application in Azure\n- The application must comply with PCI DSS (Payment Card Industry Data Security Standard)\n- The IT team wants to know whether Azure's infrastructure meets PCI DSS requirements\n- They also need to verify their OWN Azure configuration complies with PCI DSS\n\nQuestion:\nWhich TWO Azure resources address these TWO different needs? (Choose the best combination.)","choices":["Azure Advisor for both requirements","Service Trust Portal for Azure's compliance + Microsoft Purview Compliance Manager for the company's compliance","Microsoft Defender for Cloud for both requirements","Azure Policy for both requirements"],"answer":[1],"explanations":["Azure Advisor provides best-practice recommendations across cost, security, reliability, performance, and operational excellence. It doesn't provide PCI DSS compliance certification for Azure or assess your organisation's PCI DSS compliance posture.","This option is correct. The Service Trust Portal provides Microsoft's PCI DSS certification and audit reports \u2014 proving that Azure's infrastructure meets PCI DSS requirements. Microsoft Purview Compliance Manager assesses YOUR organisation's compliance posture by evaluating your configurations and controls against standards like PCI DSS, providing an actionable improvement plan. Two different tools for two different scopes.","Defender for Cloud provides security recommendations and can assess against some regulatory frameworks, but it doesn't provide Microsoft's PCI DSS audit reports (that's Service Trust Portal). It partially addresses the company's compliance but doesn't cover Azure's certification proof.","Azure Policy enforces rules and evaluates compliance with organisational policies. It doesn't provide Microsoft's PCI DSS certification documentation or a comprehensive compliance assessment tool like Compliance Manager."],"tip":"Service Trust Portal = Microsoft's compliance proof (their certifications, their audits). Compliance Manager = your organisation's compliance assessment (your posture against standards). These are complementary: STP proves Azure is compliant; Compliance Manager helps YOU become compliant."},{"id":"AZ900-E03-014","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A company is designing their cloud architecture\n- They need to decide between deploying one very powerful server versus deploying four smaller servers with a load balancer\n- The application receives variable traffic throughout the day\n\nQuestion:\nWhat is the difference between vertical scaling and horizontal scaling?","choices":["Vertical scaling adds more servers; horizontal scaling adds more CPU to one server","Vertical scaling increases the power of one server; horizontal scaling adds more servers","Vertical scaling is only available in the cloud; horizontal scaling works on-premises only","There is no difference \u2014 both terms mean the same thing"],"answer":[1],"explanations":["This is backwards. Vertical scaling makes ONE server more powerful. Horizontal scaling adds MORE servers. Don't confuse the two \u2014 the exam relies on this distinction.","This option is correct. Vertical scaling (scale up/down) increases the power of a single server by adding more CPU, RAM, or storage. Horizontal scaling (scale out/in) adds or removes server instances, distributing the workload across multiple machines. Both are available in the cloud, but horizontal scaling is generally preferred because it has no upper limit and provides better fault tolerance.","Both scaling types are available in both cloud and on-premises environments. Vertical scaling on-premises means upgrading server hardware; in the cloud, it means changing the VM size. Horizontal scaling works everywhere with proper load balancing.","They are distinctly different concepts. Vertical = bigger machine. Horizontal = more machines."],"tip":"Vertical scaling = scale UP (bigger server, has a ceiling). Horizontal scaling = scale OUT (more servers, theoretically unlimited). Cloud favours horizontal scaling because there's no hardware ceiling and it provides redundancy. The exam tests definitions and which is preferred."},{"id":"AZ900-E03-015","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A company wants to use a cloud service for their customer-facing mobile application\n- The development team will write the backend API in Node.js\n- They want the cloud provider to manage the operating system, runtime, and auto-scaling\n- They need to focus ONLY on writing and deploying their application code\n\nQuestion:\nWhich cloud service model should they use, and which Azure service is an example?","choices":["IaaS \u2014 Azure Virtual Machines","PaaS \u2014 Azure App Service","SaaS \u2014 Microsoft 365","FaaS \u2014 Azure Managed Applications"],"answer":[1],"explanations":["IaaS with Azure VMs means the company manages the OS, runtime, Node.js installation, and scaling configuration themselves. The question says the provider should manage all of that \u2014 IaaS doesn't meet this requirement.","This option is correct. PaaS (Platform as a Service) is the model where the cloud provider manages the infrastructure, OS, runtime, and scaling \u2014 the developer just deploys code. Azure App Service is a PaaS offering that supports Node.js, handles auto-scaling, manages the underlying OS and runtime patches, and provides built-in deployment capabilities. The team focuses only on their API code.","SaaS is a finished application (like Microsoft 365 email). The company wants to BUILD their own application, not consume a ready-made one.","FaaS (Functions as a Service) is a subset of serverless computing. Azure Managed Applications is not a FaaS offering \u2014 it's a marketplace solution type. Azure Functions would be the FaaS example, but the question describes a full backend API, not individual event-driven functions."],"tip":"PaaS = deploy your code, provider manages everything else (OS, runtime, scaling). Classic PaaS examples on Azure: App Service (web apps), Azure SQL Database (databases), Azure Cache for Redis (caching). If 'focus only on code' + 'provider manages infrastructure' \u2014 PaaS."},{"id":"AZ900-E03-016","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company uses Azure Files to provide a shared file system for a team of 50 users\n- The file share is mounted as a network drive on Windows workstations using the SMB protocol\n- The team wants to sync a copy of the file share to an on-premises Windows Server for low-latency local access\n- Files not frequently accessed should be automatically tiered to the cloud to free up local disk space\n\nQuestion:\nWhich Azure feature should you use?","choices":["Azure Blob Storage lifecycle management","Azure File Sync","Azure Data Box","AzCopy"],"answer":[1],"explanations":["Blob Storage lifecycle management moves blobs between access tiers (Hot, Cool, Archive). It works with Blob Storage, not Azure Files, and doesn't sync files to on-premises servers.","This option is correct. Azure File Sync extends Azure Files to on-premises Windows Servers. It syncs files between the Azure file share and local servers, provides cloud tiering (infrequently accessed files are replaced with pointers on the local server and automatically downloaded when opened), and gives users low-latency local access to frequently used files while keeping the full dataset in Azure.","Azure Data Box is a physical device for transferring large amounts of data to Azure (offline migration). It's a one-time data transfer solution, not an ongoing sync service.","AzCopy is a command-line tool for copying data to/from Azure Storage. It's a manual or scripted transfer tool, not an ongoing sync service with cloud tiering capabilities."],"tip":"Azure File Sync = sync Azure Files to on-premises Windows Server + cloud tiering (auto-tier cold files to cloud). If the question mentions 'sync files between Azure and on-premises' or 'cloud tiering for file shares' \u2014 Azure File Sync."},{"id":"AZ900-E03-017","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- A company deploys a web application on Azure App Service\n- The application needs to store user profile images\n- Images should be accessible via a unique URL over HTTPS\n- The company expects to store millions of images totalling 10 TB\n- They want the cheapest storage option for frequently accessed images\n\nQuestion:\nWhich storage service and access tier should they use?","choices":["Azure Blob Storage \u2014 Hot tier","Azure Blob Storage \u2014 Archive tier","Azure Files \u2014 Standard tier","Azure Table Storage"],"answer":[0],"explanations":["This option is correct. Azure Blob Storage is designed for storing unstructured data like images, accessible via unique URLs over HTTPS. The Hot tier offers the lowest access costs for frequently read data (low per-read cost, higher storage cost). For profile images that are frequently viewed by users, Hot tier balances cost with performance. It scales to petabytes and handles millions of objects.","Archive tier has the lowest storage cost but very high access costs and hours-long rehydration time. Profile images are accessed frequently \u2014 Archive would make them inaccessible for hours on first request. Terrible user experience.","Azure Files provides file shares via SMB/NFS protocols. While files are accessible via REST API, it's designed for shared file systems, not for serving millions of images via URLs. It's also more expensive per GB than Blob Storage for this use case.","Table Storage is a NoSQL key-value store for structured data. It's not designed for storing binary objects like images."],"tip":"Blob Storage access tiers by use case: Hot = frequently accessed (profile images, active data). Cool = infrequently accessed 30+ days (monthly reports). Cold = rarely accessed 90+ days. Archive = almost never accessed 180+ days (compliance archives). Match the tier to the access pattern."},{"id":"AZ900-E03-018","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company's Azure environment has the following hierarchy:\n  - Root Management Group\n    - Production Management Group (contains 5 subscriptions)\n    - Development Management Group (contains 3 subscriptions)\n- An Azure Policy is assigned at the Root Management Group that requires all VMs to have a minimum size of Standard_B2s\n- A developer tries to create a Standard_B1s VM in a Development subscription\n\nQuestion:\nWhat happens when the developer tries to create the VM?","choices":["The VM is created successfully because Development is separate from Production","The VM creation is blocked because the policy at the Root Management Group cascades to all subscriptions","The VM is created but flagged as non-compliant","The developer is prompted to choose a different VM size"],"answer":[1],"explanations":["Management Group separation doesn't override policies from a parent group. Policies cascade downward through the hierarchy. The Development Management Group inherits policies from the Root Management Group.","This option is correct. Azure Policy assigned at the Root Management Group cascades to ALL child management groups, subscriptions, resource groups, and resources beneath it. Since both Production and Development management groups are children of the Root, the policy applies to both. The Standard_B1s VM violates the minimum size requirement, so the creation is denied with a policy violation error.","This would only happen if the policy used an Audit effect. The question implies the policy enforces (Deny effect) the minimum VM size. A Deny effect blocks the deployment, not just flags it.","Azure Policy doesn't interactively prompt users. A Deny effect simply blocks the operation and returns an error message explaining the policy violation."],"tip":"Policy inheritance: Root MG \u2192 Child MGs \u2192 Subscriptions \u2192 Resource Groups \u2192 Resources. Policies cascade DOWN, not up. A policy at a parent management group cannot be overridden by child groups. If a Deny policy is set at the root \u2014 it applies everywhere."},{"id":"AZ900-E03-019","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- A company runs a mission-critical application\n- They need to ensure that if the entire UK South Azure region becomes unavailable, the application can continue running\n- The recovery target is: application must be operational in a secondary region within 1 hour\n- Data loss of up to 5 minutes is acceptable\n\nQuestion:\nWhich Azure service should you use to replicate VMs to a secondary region and enable failover?","choices":["Azure Backup","Azure Site Recovery","Azure Traffic Manager","Azure Availability Zones"],"answer":[1],"explanations":["Azure Backup creates point-in-time copies of data for recovery. It doesn't provide continuous replication to a secondary region or automated failover. Restoring from backup takes much longer than 1 hour for a full application stack.","This option is correct. Azure Site Recovery (ASR) continuously replicates Azure VMs to a secondary region. If the primary region fails, you can fail over to the secondary region within minutes. ASR provides RPO (Recovery Point Objective) of seconds to minutes (matching the 5-minute data loss tolerance) and RTO (Recovery Time Objective) well within 1 hour. It handles VM replication, networking, and orchestrated failover/failback.","Traffic Manager routes DNS queries to different endpoints. It can direct traffic to a secondary region AFTER failover, but it doesn't replicate VMs or manage the failover process itself. Traffic Manager works WITH ASR, not instead of it.","Availability Zones protect against data centre failures WITHIN a single region. They don't protect against an entire region becoming unavailable. For region-level protection, you need cross-region replication."],"tip":"Azure Site Recovery = cross-region VM replication + automated failover (disaster recovery). Availability Zones = data centre-level protection within a region. Backup = point-in-time data recovery. For 'entire region fails' scenarios \u2014 ASR for DR. Know the difference between RPO (acceptable data loss) and RTO (acceptable downtime)."},{"id":"AZ900-E03-020","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company deploys Azure resources using a CI/CD pipeline\n- All deployments go through Azure Resource Manager (ARM)\n- The security team wants to see a log of every resource creation, modification, and deletion across all subscriptions\n- They need to send this log data to a SIEM (Security Information and Event Management) tool for long-term retention and analysis\n\nQuestion:\nWhich Azure feature provides this management-plane audit trail, and where should it be sent for long-term retention?","choices":["Azure Monitor Metrics \u2192 Azure Blob Storage","Azure Activity Log \u2192 Log Analytics workspace (or Event Hub for SIEM integration)","Azure Advisor recommendations \u2192 Azure SQL Database","Microsoft Defender for Cloud alerts \u2192 Azure Queue Storage"],"answer":[1],"explanations":["Azure Monitor Metrics tracks performance data (CPU, memory, disk IOPS), not management operations. Metrics don't tell you who created or deleted a resource.","This option is correct. The Azure Activity Log records all management-plane operations (create, update, delete, role assignments) across your subscriptions. By default it's retained for 90 days. To send it to a SIEM for long-term retention, you configure a diagnostic setting to forward Activity Log data to a Log Analytics workspace (for querying with KQL) and/or to an Event Hub (for streaming to third-party SIEM tools like Splunk or Sentinel).","Azure Advisor provides recommendations, not an audit trail of operations. Recommendations can't be exported to SQL Database for this purpose.","Defender for Cloud alerts are security-specific notifications, not a comprehensive management-plane audit log. They cover a subset of events, not every create/modify/delete operation."],"tip":"Activity Log = WHO did WHAT to WHICH resource and WHEN. Default retention: 90 days. For longer retention: send to Log Analytics workspace or storage account. For SIEM integration: stream to Event Hub. If the question mentions 'audit trail' + 'long-term retention' + 'SIEM' \u2014 Activity Log + Event Hub/Log Analytics."},{"id":"AZ900-E03-021","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company uses Microsoft Sentinel (formerly Azure Sentinel) for security operations\n- The security team needs a cloud-native SIEM and SOAR solution\n- They want to collect security data from Azure AD, Microsoft 365, Azure resources, and third-party firewalls\n- The solution must support automated threat response through playbooks\n\nQuestion:\nWhich Azure service provides SIEM and SOAR capabilities?","choices":["Microsoft Defender for Cloud","Microsoft Sentinel","Azure Monitor","Azure Active Directory Identity Protection"],"answer":[1],"explanations":["Defender for Cloud provides cloud security posture management (CSPM) and cloud workload protection (CWP). It's a security assessment and threat protection tool, not a SIEM/SOAR platform. It can feed data INTO Sentinel, but it's not a SIEM itself.","This option is correct. Microsoft Sentinel is Azure's cloud-native SIEM (Security Information and Event Management) and SOAR (Security Orchestration, Automation, and Response) solution. It collects security data from hundreds of sources (Azure, M365, AWS, firewalls, endpoints), uses AI/ML for threat detection, and supports automated response through Logic App-based playbooks. It's built on Log Analytics workspaces.","Azure Monitor collects performance and operational telemetry. While Sentinel is built on the same Log Analytics infrastructure, Monitor itself doesn't provide SIEM capabilities, threat detection, or automated security response playbooks.","Azure AD Identity Protection detects identity-based risks (risky sign-ins, compromised accounts). It's focused on identity security, not a comprehensive SIEM/SOAR platform that ingests data from multiple sources."],"tip":"Microsoft Sentinel = SIEM (collect, detect, investigate) + SOAR (automate response). Defender for Cloud = security posture + workload protection. Identity Protection = identity risk detection. If the question mentions 'SIEM', 'SOAR', 'security playbooks', or 'collect security data from multiple sources' \u2014 Sentinel."},{"id":"AZ900-E03-022","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company is designing a solution that needs to store and process structured data\n- The data includes customer orders, products, and inventory\n- The application performs complex JOIN queries across multiple related tables\n- ACID transactions are required to ensure data consistency\n- The team has extensive SQL expertise\n\nQuestion:\nWhich type of Azure database should you use?","choices":["Azure Cosmos DB (NoSQL)","Azure SQL Database (relational)","Azure Table Storage (key-value)","Azure Blob Storage (unstructured)"],"answer":[1],"explanations":["Cosmos DB is a NoSQL database that doesn't natively support complex JOIN operations across tables. While it offers some transaction support, it's designed for schema-less, horizontally scaled data \u2014 not traditional relational data with complex relationships.","This option is correct. Azure SQL Database is a fully managed relational database that supports complex SQL JOINs, ACID transactions, stored procedures, and normalised schemas. It's perfect for structured data with relationships (orders \u2192 products \u2192 inventory). The team's SQL expertise maps directly to Azure SQL Database. It's the go-to for traditional relational workloads.","Azure Table Storage is a NoSQL key-value store with no support for JOINs, complex queries, or ACID transactions. It's designed for simple lookups by key, not relational data with complex relationships.","Blob Storage is for unstructured data (files, images, videos). It has no query engine, no tables, and no transaction support."],"tip":"Relational data (tables, JOINs, ACID, structured schemas) = Azure SQL Database or other managed relational databases. NoSQL (schema-less, global distribution, massive scale) = Cosmos DB. If the question mentions JOINs, ACID transactions, or SQL expertise \u2014 relational database."},{"id":"AZ900-E03-023","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- A new Azure administrator joins your company\n- They need to learn how to create resources, configure networking, and manage security in Azure\n- They want a hands-on learning environment where they can practice without affecting production resources\n- They want free Azure credits to experiment with
