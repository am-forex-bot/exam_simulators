 execution."],"tip":"Container options by complexity: ACI (simplest, single containers, tasks) \u2192 Container Apps (serverless microservices, event-driven scaling) \u2192 AKS (full Kubernetes orchestration). If the question says 'simple container', 'no orchestration', 'quick task' \u2014 ACI. If 'microservices' or 'Kubernetes' \u2014 AKS."},{"id":"AZ900-E05-047","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company has an Enterprise Agreement (EA) with Microsoft\n- They have multiple departments: Finance, Engineering, and Marketing\n- Each department has its own Azure subscriptions\n- The billing administrator needs to review and manage invoices centrally\n\nQuestion:\nWhich Azure billing structure does this scenario describe?","choices":["A single subscription with resource groups per department","An Enterprise Agreement with an enrollment account, departments, and subscriptions hierarchy","Three separate Microsoft Customer Agreements (MCAs)","Azure Pay-As-You-Go subscriptions with shared billing"],"answer":[1],"explanations":["A single subscription with resource groups provides logical organisation but doesn't support separate departmental billing with centralised invoice management. It would combine all costs into one subscription bill.","This option is correct. An Enterprise Agreement (EA) creates a billing hierarchy: Enrollment \u2192 Departments \u2192 Accounts \u2192 Subscriptions. Each department (Finance, Engineering, Marketing) is a billing entity under the enrollment. Each department has accounts that own subscriptions. The EA administrator can view and manage all billing centrally while departments see their own costs. This is the standard enterprise billing structure in Azure.","Three separate MCAs would mean three completely separate billing agreements \u2014 no centralised management. The scenario describes ONE agreement with departmental organisation underneath it.","Pay-As-You-Go subscriptions are individual, credit-card-based subscriptions. They don't support enterprise departmental hierarchy or centralised billing management."],"tip":"Azure billing hierarchy for enterprises: Enterprise Agreement \u2192 Departments \u2192 Accounts \u2192 Subscriptions. EA gives centralised billing, volume discounts, and departmental cost allocation. Smaller organisations use Microsoft Customer Agreement (MCA) instead. Know the EA hierarchy for the exam."},{"id":"AZ900-E05-048","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company runs a web application that stores sensitive customer data\n- The security team requires that data is encrypted both at rest and in transit\n- They want to use encryption keys managed by Microsoft for simplicity\n- They also need to ensure all HTTPS traffic uses TLS 1.2 or higher\n\nQuestion:\nWhich statement about Azure encryption is correct?","choices":["Azure encrypts data at rest by default, but you must manually enable encryption in transit","Azure encrypts data in transit by default, but you must manually enable encryption at rest","Azure provides encryption at rest by default for most services using Microsoft-managed keys, and supports TLS 1.2+ for data in transit","Azure does not provide any default encryption \u2014 all encryption must be configured manually"],"answer":[2],"explanations":["While some services require HTTPS to be explicitly enforced, Azure storage services encrypt data at rest by default AND support HTTPS by default. You don't need to manually enable either in most cases \u2014 but you should enforce minimum TLS versions.","This is backwards. Azure encrypts data at rest by default for most services (Azure Storage, SQL Database, Cosmos DB, Managed Disks). Encryption at rest is automatic with Microsoft-managed keys.","This option is correct. Azure encrypts data at rest by default for most services using Microsoft-managed keys (also called platform-managed keys). Azure Storage, SQL Database, Cosmos DB, and Managed Disks all encrypt at rest automatically. For data in transit, Azure supports TLS 1.2+ and most services enforce it by default. You can also choose customer-managed keys (CMK) in Azure Key Vault for more control over encryption keys.","Azure provides extensive default encryption. Almost all data storage services encrypt at rest by default with no configuration needed. This statement is completely incorrect."],"tip":"Azure encryption defaults: At rest = automatic for most services (Storage, SQL, Cosmos DB, Managed Disks) with Microsoft-managed keys. In transit = TLS 1.2+ supported and enforced. You can upgrade to customer-managed keys (CMK) stored in Key Vault for more control. The exam expects you to know encryption at rest is ON by default."},{"id":"AZ900-E05-049","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A company runs identical production systems in two geographically separate Azure regions\n- If one region experiences a complete outage, the other region continues serving all traffic\n- The company accepts the cost of running duplicate infrastructure for this protection\n\nQuestion:\nWhich cloud concept does this architecture primarily demonstrate?","choices":["Elasticity","Agility","Fault tolerance","Cost optimisation"],"answer":[2],"explanations":["Elasticity is the ability to dynamically scale resources based on demand. Running identical systems in two regions isn't about scaling \u2014 it's about surviving failures. The infrastructure size stays constant regardless of demand.","Agility refers to the ability to quickly deploy and configure cloud resources. While the cloud enables fast multi-region deployment, the scenario is about surviving regional failures, not speed of deployment.","This option is correct. Fault tolerance is the ability of a system to continue operating without interruption when one or more components fail. Running identical systems in two regions ensures that a complete regional outage doesn't cause downtime \u2014 traffic shifts to the surviving region. This is active-active (or active-passive) fault tolerance through geographic redundancy.","This architecture is the OPPOSITE of cost optimisation \u2014 the company explicitly accepts the cost of duplicate infrastructure. Fault tolerance through redundancy increases costs but ensures continuity."],"tip":"Fault tolerance = continue operating despite failures (redundancy, replication, geographic distribution). High availability = maximise uptime (SLAs, availability zones). Disaster recovery = recover AFTER a catastrophic failure. The key distinction: fault tolerance prevents interruption, DR restores after interruption."},{"id":"AZ900-E05-050","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company needs to deploy a standard set of Azure resources for each new project\n- Every project needs: a resource group, a virtual network, a storage account, and specific Azure Policies\n- The deployment must be repeatable, consistent, and version-controlled\n- Manual portal deployments have led to configuration drift between projects\n\nQuestion:\nWhat is the BEST approach to ensure repeatable, consistent deployments?","choices":["Document the steps in a runbook and have administrators follow them manually","Use Infrastructure as Code (IaC) with ARM templates or Bicep to define all resources declaratively","Create screenshots of the portal configuration for each resource","Use Azure Advisor to recommend the correct configuration"],"answer":[1],"explanations":["A runbook with manual steps is error-prone \u2014 humans skip steps, make typos, and introduce inconsistencies. This IS the current problem (manual portal deployments causing configuration drift). Documentation doesn't prevent drift.","This option is correct. Infrastructure as Code (IaC) using ARM templates or Bicep files defines all resources declaratively in code. The template is version-controlled in Git, reviewed through pull requests, and deployed consistently every time. ARM/Bicep templates are idempotent \u2014 deploying the same template produces the same result. This eliminates configuration drift and ensures every project gets identical infrastructure.","Screenshots are documentation, not automation. They don't prevent human error during manual deployment and can't be version-controlled, parameterised, or executed automatically.","Azure Advisor provides recommendations for existing resources. It doesn't deploy or configure new resources, and it doesn't solve the problem of repeatable, consistent deployments."],"tip":"Infrastructure as Code (IaC) = repeatable, consistent, version-controlled deployments. Azure IaC options: ARM templates (JSON), Bicep (simplified ARM), Terraform (multi-cloud). Benefits: no configuration drift, idempotent, auditable, parameterised. If the question mentions 'repeatable', 'consistent', or 'configuration drift' \u2014 IaC."}]}],"MS102":[{"set":1,"title":"Practice Exam 1","questions":[{"id":"MS102-E01-037","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou want to reduce common attack techniques by blocking risky behaviors such as Office apps creating child processes.\n\nWhat should you configure?","choices":["Managed Google Play","Retention label","Autopilot profile","Attack surface reduction (ASR) rules"],"answer":[3],"explanations":["Managed Google Play is Android apps.","Retention labels are lifecycle controls.","Autopilot provisions devices. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","This option is correct. ASR rules harden endpoints by blocking behaviors commonly used by malware."],"tip":"Behavior hardening against malware \u2192 ASR rules.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E01-036","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are the Microsoft 365 endpoint administrator.\n\nYour organisation uses Microsoft 365 Business Premium licences. Users in the Finance department handle sensitive data containing passport numbers and health identifiers. You need to prevent accidental sharing via email and Microsoft Teams messages, and you must be able to review policy violations.\n\nWhat should you create?","choices":["A data loss prevention (DLP) policy in Microsoft Purview","A sensitivity label policy in Microsoft Purview","A retention policy in Microsoft Purview","An insider risk management policy in Microsoft Purview"],"answer":[0],"explanations":["This option is correct. DLP policies detect sensitive info types across Exchange and Teams, can block/warn users, and generate alerts/reports for review\u2014exactly what\u2019s required. It maps directly to the Microsoft Purview control designed for this outcome.","Sensitivity labels classify/protect content (marking/encryption) but are not the primary control for scanning and blocking sensitive info in messages.","Retention controls how long data is kept/deleted; it doesn\u2019t prevent sharing.","Insider risk is investigative/behavioral and typically retrospective; the requirement is preventative controls in messaging."],"tip":"Prevent sharing of specific sensitive info types + review violations \u2192 DLP.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E01-049","domain":"Manage applications","type":"single","stem":"Current environment:\n- Your company has 1200 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are the Microsoft 365 endpoint administrator.\n\nYou need to control Microsoft 365 Apps updates to reduce feature change frequency while still receiving security fixes.\n\nWhich update channel is generally the best fit for controlled enterprise rollouts?","choices":["Current Channel","Updates cannot be managed for Microsoft 365 Apps","Insider Beta Channel","Monthly Enterprise Channel"],"answer":[3],"explanations":["Current Channel receives features faster and changes more frequently.","Update channels are configurable and manageable.","Insider Beta is for early testing and is higher risk.","This option is correct. Monthly Enterprise Channel provides a more predictable cadence and is commonly used in managed enterprise environments."],"tip":"Choose channel based on change tolerance and testing capacity.  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM)."},{"id":"MS102-E01-026","domain":"Implement security and compliance","type":"single","stem":"You need to secure access to SharePoint Online.\n\nRequirements:\n- Require MFA\n- Block access from devices that are not compliant in Intune\n\nWhat should you configure?","choices":["A DLP policy that blocks external sharing","An app configuration policy for Microsoft Outlook","A retention policy applied to user content","Conditional Access grant controls requiring MFA AND requiring the device to be marked as compliant"],"answer":[3],"explanations":["DLP is about data exfiltration prevention, not access grant decisions based on device state.","App config adjusts app settings; it doesn\u2019t enforce MFA or device compliance.","Retention is data lifecycle, not access control.","This option is correct. Grant controls can require both MFA and a compliant device, matching the requirements."],"tip":"Access decisions based on signals \u2192 Conditional Access. Use grant controls for must-have requirements.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E01-050","domain":"Manage applications","type":"single","stem":"Employees in Finance use personal iOS and Android devices for Microsoft 365 apps.\n\nRequirements:\n- Protect corporate data inside apps (PIN, block copy/paste to personal apps)\n- Do NOT require full device enrollment\n\nWhat should you configure?","choices":["Security baselines","App protection policies (MAM without enrollment)","Windows Autopilot deployment profile","Device configuration profiles (MDM)"],"answer":[1],"explanations":["Baselines are device management configurations and generally require management/enrollment.","This option is correct. MAM-WE protects data in managed apps without enrolling the whole device.","Autopilot is Windows provisioning. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","MDM profiles require enrollment and control device-wide settings."],"tip":"BYOD without enrollment \u2192 MAM without enrollment (APP).  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM)."},{"id":"MS102-E01-043","domain":"Manage applications","type":"multi","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are preparing iOS/iPadOS devices for automated enrollment and app deployment using Intune.\n\nSelect THREE items that are commonly required for enterprise iOS/iPadOS management.","choices":["Managed Google Play","Apple Business Manager (ABM) / VPP","Enrollment profile/token for Automated Device Enrollment (ADE)","APNs certificate"],"answer":[1,2,3],"explanations":["Managed Google Play is for Android Enterprise, not iOS/iPadOS.","This option is correct. ABM/VPP supports automated enrollment and volume app purchasing/assignment.","This option is correct. ADE enrollment token/profile defines how devices enroll automatically.","This option is correct. APNs certificate is required for MDM communication with Apple devices."],"tip":"iOS enterprise stack: APNs + ABM/VPP + ADE token/profile.  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM).","pick":3},{"id":"MS102-E01-048","domain":"Manage applications","type":"single","stem":"You are reviewing a change request.\n\nEmployees in Sales use personal iOS and Android devices for Microsoft 365 apps.\n\nRequirements:\n- Protect corporate data inside apps (PIN, block copy/paste to personal apps)\n- Do NOT require full device enrollment\n\nWhat should you configure?","choices":["Windows Autopilot deployment profile","Device configuration profiles (MDM)","Security baselines","App protection policies (MAM without enrollment)"],"answer":[3],"explanations":["Autopilot is Windows provisioning. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","MDM profiles require enrollment and control device-wide settings.","Baselines are device management configurations and generally require management/enrollment.","This option is correct. MAM-WE protects data in managed apps without enrolling the whole device."],"tip":"BYOD without enrollment \u2192 MAM without enrollment (APP).  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM)."},{"id":"MS102-E01-018","domain":"Deploy and manage endpoints","type":"single","stem":"You manage Windows devices with Intune.\n\nRequirement:\n- Keep a pilot group pinned to **Windows 11, version 23H2**\n- Prevent devices from upgrading past that feature version until IT approves\n\nWhat should you configure?","choices":["Compliance policy requiring a minimum OS version","Security baseline for Windows 10 and later","Update ring for Windows 10 and later only","Feature updates policy for Windows 10 and later"],"answer":[3],"explanations":["Compliance evaluates and can block access, but does not manage upgrade targeting.","Baselines configure security settings; they do not control feature version targeting.","Update rings manage general servicing behavior/deferrals but are less direct for pinning a specific version.","This option is correct. Feature update policies can target and hold devices at a specific feature version. It aligns with how Microsoft expects you to implement this in Intune at scale."],"tip":"Pin a feature version \u2192 Feature updates policy. Tune update behavior \u2192 Update ring.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-008","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYour company has 2000 Windows 10 and Windows 11 devices enrolled in Microsoft Intune. Security requires BitLocker encryption on the operating system drive. You need to enforce this requirement with the least administrative effort and ensure compliance reporting is available.\n\nWhat should you configure?","choices":["A Windows Autopilot deployment profile with BitLocker pre-provisioning","An endpoint security Disk Encryption policy","A device configuration profile using the Endpoint Protection template","A PowerShell script deployed via Intune to enable BitLocker"],"answer":[1],"explanations":["Autopilot settings mainly apply at provisioning time and won\u2019t reliably remediate an already enrolled estate. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","This option is correct. Disk Encryption policies in the Endpoint security blade are purpose-built for BitLocker and integrate cleanly with Intune reporting. Least effort + compliance visibility is what this question is testing.","This can configure BitLocker, but it\u2019s a broader profile and not the most focused approach for encryption management and reporting.","A script can enable BitLocker, but you\u2019ll typically lose strong native policy lifecycle and reporting. It fails the 'least administrative effort' requirement. Scripts can work, but they usually weaken native reporting/managed lifecycle compared with policy-based configuration."],"tip":"If the question is a security control + compliance visibility, Microsoft often expects Endpoint security (Disk encryption/AV/Firewall/ASR).  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-001","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are the Microsoft 365 endpoint administrator.\n\nYour company is migrating from on\u2011premises Group Policy to Intune. You have 500 Windows 11 devices that are hybrid joined. During the transition, some settings are delivered by both Group Policy and MDM.\n\nYou need Intune MDM settings to take precedence when there is a conflict for the same configuration.\n\nWhat should you configure?","choices":["Create a compliance policy that marks devices as compliant","Configure the ControlPolicyConflict policy CSP and set MDMWinsOverGP to enabled","Set the MDM enrollment URL in Group Policy to point to Intune","Convert all devices to Entra ID join immediately to eliminate Group Policy"],"answer":[1],"explanations":["Compliance evaluates device state; it doesn\u2019t resolve config conflicts between policy sources.","This is the Windows mechanism that tells the device to prefer MDM where both sources manage the same setting (when supported). It aligns with how Microsoft expects you to implement this in Intune at scale.","This enables auto-enrollment, but it does not control which policy source wins when both set the same value.","That would remove GP influence, but the question explicitly describes coexistence during migration."],"tip":"Enrollment (URLs) \u2260 conflict resolution. Conflict behavior is controlled by CSP policy (where applicable).  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-010","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are standardising configuration across departments.\n\nYou are provisioning shared kiosk devices that should set up without user credentials and automatically enroll in Intune.\n\nWhich Autopilot mode is most appropriate?","choices":["Hybrid join only","User-driven mode","Windows Update ring","Self-deploying mode"],"answer":[3],"explanations":["Hybrid join is about joining on-prem AD, not kiosk mode.","User-driven requires user sign-in during OOBE; not ideal for kiosk devices.","Update rings manage updates, not provisioning mode.","This option is correct. Self-deploying is designed for kiosks/shared devices with minimal user interaction (with prerequisites). It aligns with how Microsoft expects you to implement this in Intune at scale."],"tip":"Shared/kiosk devices \u2192 Autopilot self-deploying (if prerequisites are met).  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-028","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou need to detect and block the sharing of passport numbers in Exchange Online email, and you want policy tips and audit reporting.\n\nWhat should you configure?","choices":["Autopilot profile","Device configuration profile","Update ring","Data Loss Prevention (DLP) policy"],"answer":[3],"explanations":["Autopilot is provisioning, not content policy. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","Device configuration profiles configure device settings, not Exchange content scanning.","Update rings are for Windows updates.","This option is correct. DLP is designed to detect sensitive info types and enforce actions (block/warn) with reporting. It maps directly to the Microsoft Purview control designed for this outcome."],"tip":"Sensitive info detection + prevention + reporting \u2192 DLP.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E01-047","domain":"Manage applications","type":"multi","stem":"Current environment:\n- Your company has 300 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are standardising configuration across departments.\n\nYou are preparing iOS/iPadOS devices for automated enrollment and app deployment using Intune.\n\nSelect THREE items that are commonly required for enterprise iOS/iPadOS management.\n\nWhat should you do first?","choices":["Managed Google Play","Enrollment profile/token for Automated Device Enrollment (ADE)","Apple Business Manager (ABM) / VPP","APNs certificate"],"answer":[1,2,3],"explanations":["Managed Google Play is for Android Enterprise, not iOS/iPadOS.","This option is correct. ADE enrollment token/profile defines how devices enroll automatically.","This option is correct. ABM/VPP supports automated enrollment and volume app purchasing/assignment.","This option is correct. APNs certificate is required for MDM communication with Apple devices."],"tip":"iOS enterprise stack: APNs + ABM/VPP + ADE token/profile.  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM).","pick":3},{"id":"MS102-E01-045","domain":"Manage applications","type":"multi","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are reviewing a change request.\n\nYou are preparing iOS/iPadOS devices for automated enrollment and app deployment using Intune.\n\nSelect THREE items that are commonly required for enterprise iOS/iPadOS management.\n\nChoose the best answer.","choices":["Apple Business Manager (ABM) / VPP","Managed Google Play","APNs certificate","Enrollment profile/token for Automated Device Enrollment (ADE)"],"answer":[0,2,3],"explanations":["This option is correct. ABM/VPP supports automated enrollment and volume app purchasing/assignment.","Managed Google Play is for Android Enterprise, not iOS/iPadOS.","This option is correct. APNs certificate is required for MDM communication with Apple devices.","This option is correct. ADE enrollment token/profile defines how devices enroll automatically."],"tip":"iOS enterprise stack: APNs + ABM/VPP + ADE token/profile.  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM).","pick":3},{"id":"MS102-E01-033","domain":"Implement security and compliance","type":"single","stem":"You are standardising configuration across departments.\n\nYou need to secure access to Microsoft Teams.\n\nRequirements:\n- Require MFA\n- Block access from devices that are not compliant in Intune\n\nWhat should you configure?","choices":["A retention policy applied to user content","A DLP policy that blocks external sharing","An app configuration policy for Microsoft Outlook","Conditional Access grant controls requiring MFA AND requiring the device to be marked as compliant"],"answer":[3],"explanations":["Retention is data lifecycle, not access control.","DLP is about data exfiltration prevention, not access grant decisions based on device state.","App config adjusts app settings; it doesn\u2019t enforce MFA or device compliance.","This option is correct. Grant controls can require both MFA and a compliant device, matching the requirements."],"tip":"Access decisions based on signals \u2192 Conditional Access. Use grant controls for must-have requirements.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E01-023","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 300 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou need to detect and block the sharing of bank account numbers in Exchange Online email, and you want policy tips and audit reporting.\n\nWhat should you configure?","choices":["Data Loss Prevention (DLP) policy","Update ring","Autopilot profile","Device configuration profile"],"answer":[0],"explanations":["This option is correct. DLP is designed to detect sensitive info types and enforce actions (block/warn) with reporting. It maps directly to the Microsoft Purview control designed for this outcome.","Update rings are for Windows updates.","Autopilot is provisioning, not content policy. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","Device configuration profiles configure device settings, not Exchange content scanning."],"tip":"Sensitive info detection + prevention + reporting \u2192 DLP.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E01-004","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are provisioning shared kiosk devices that should set up without user credentials and automatically enroll in Intune.\n\nWhich Autopilot mode is most appropriate?","choices":["Self-deploying mode","User-driven mode","Windows Update ring","Hybrid join only"],"answer":[0],"explanations":["This option is correct. Self-deploying is designed for kiosks/shared devices with minimal user interaction (with prerequisites). It aligns with how Microsoft expects you to implement this in Intune at scale.","User-driven requires user sign-in during OOBE; not ideal for kiosk devices.","Update rings manage updates, not provisioning mode.","Hybrid join is about joining on-prem AD, not kiosk mode."],"tip":"Shared/kiosk devices \u2192 Autopilot self-deploying (if prerequisites are met).  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-031","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are standardising configuration across departments.\n\nA legal investigation requires preserving mailbox content so it cannot be permanently deleted by users.\n\nWhat should you use?","choices":["App protection policy","Update channel change","eDiscovery hold (Litigation hold)","Endpoint analytics"],"answer":[2],"explanations":["APP protects app data, not mailbox preservation.","Update channels are for app servicing.","This option is correct. Holds preserve content for investigation and discovery even if users delete items.","Analytics is device performance."],"tip":"Preserve content for legal reasons \u2192 holds/eDiscovery.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E01-014","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 1200 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are standardising configuration across departments.\n\nYour company has 3500 Windows 10 and Windows 11 devices enrolled in Microsoft Intune. Security requires BitLocker encryption on the operating system drive. You need to enforce this requirement with the least administrative effort and ensure compliance reporting is available.\n\nWhat should you configure?","choices":["A device configuration profile using the Endpoint Protection template","A Windows Autopilot deployment profile with BitLocker pre-provisioning","A PowerShell script deployed via Intune to enable BitLocker","An endpoint security Disk Encryption policy"],"answer":[3],"explanations":["This can configure BitLocker, but it\u2019s a broader profile and not the most focused approach for encryption management and reporting.","Autopilot settings mainly apply at provisioning time and won\u2019t reliably remediate an already enrolled estate. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","A script can enable BitLocker, but you\u2019ll typically lose strong native policy lifecycle and reporting. It fails the 'least administrative effort' requirement. Scripts can work, but they usually weaken native reporting/managed lifecycle compared with policy-based configuration.","This option is correct. Disk Encryption policies in the Endpoint security blade are purpose-built for BitLocker and integrate cleanly with Intune reporting. Least effort + compliance visibility is what this question is testing."],"tip":"If the question is a security control + compliance visibility, Microsoft often expects Endpoint security (Disk encryption/AV/Firewall/ASR).  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-017","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 1200 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are deploying new Windows devices using Windows Autopilot. Users in Procurement report that they reach the desktop before required applications and policies finish installing, leading to inconsistent builds.\n\nYou want to block user access until required setup completes.\n\nWhat should you configure?","choices":["App protection policy","Device compliance policy","Retention label policy","Enrollment Status Page (ESP)"],"answer":[3],"explanations":["APP protects data in apps; it doesn\u2019t control Autopilot setup completion.","Compliance evaluates device posture and can be used with Conditional Access; it doesn\u2019t gate Autopilot completion.","Retention labels are for data lifecycle, not provisioning.","This option is correct. ESP can block device use during enrollment until required apps/profiles finish installing, reducing 'half-configured' devices. It aligns with how Microsoft expects you to implement this in Intune at scale."],"tip":"Autopilot gating during OOBE = Enrollment Status Page.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-011","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 300 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou need to deploy a VPN profile and certificates to devices during enrollment.\n\nWhat is the best approach?","choices":["Change Microsoft 365 Apps update channel","Enable an eDiscovery hold","Deploy certificates using Intune certificate profile and then assign a VPN profile that references those certificates","Use Managed Google Play to deploy a VPN certificate"],"answer":[2],"explanations":["Update channels are unrelated to VPN connectivity.","Holds are for legal preservation.","This option is correct. Certificates + VPN profiles are standard Intune device configuration steps.","Managed Google Play is Android app distribution, not certificate deployment."],"tip":"Device connectivity profiles often depend on certificate deployment first.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-041","domain":"Manage applications","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are standardising configuration across departments.\n\nYou are deploying Android Enterprise apps with Intune.\n\nWhi :"single","stem":"Current environment:\n- Your company has 1200 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nWindows feature updates are saturating your WAN during business hours.\n\nYou want devices to share update content locally and reduce internet bandwidth usage.\n\nWhat should you configure?","choices":["Sensitivity labels","Microsoft Tunnel","Delivery Optimization settings","eDiscovery hold"],"answer":[2],"explanations":["Sensitivity labels protect content, not updates.","Tunnel provides secure access to on-prem resources, not update distribution optimization.","This option is correct. Delivery Optimization enables peer-to-peer content sharing and bandwidth controls for updates. It aligns with how Microsoft expects you to implement this in Intune at scale.","eDiscovery holds are for preservation, not bandwidth."],"tip":"Update bandwidth optimisation \u2192 Delivery Optimization.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-012","domain":"Deploy and manage endpoints","type":"single","stem":"You manage Windows devices with Intune.\n\nRequirement:\n- Keep a pilot group pinned to **Windows 11, version 24H2**\n- Prevent devices from upgrading past that feature version until IT approves\n\nWhat should you configure?","choices":["Update ring for Windows 10 and later only","Compliance policy requiring a minimum OS version","Feature updates policy for Windows 10 and later","Security baseline for Windows 10 and later"],"answer":[2],"explanations":["Update rings manage general servicing behavior/deferrals but are less direct for pinning a specific version.","Compliance evaluates and can block access, but does not manage upgrade targeting.","This option is correct. Feature update policies can target and hold devices at a specific feature version. It aligns with how Microsoft expects you to implement this in Intune at scale.","Baselines configure security settings; they do not control feature version targeting."],"tip":"Pin a feature version \u2192 Feature updates policy. Tune update behavior \u2192 Update ring.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-025","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 800 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou want to investigate historical sign-in events and query security telemetry across your tenant.\n\nWhat should you use?","choices":["Windows Autopilot profile","Microsoft 365 Defender advanced hunting","Apple Business Manager","Enrollment Status Page"],"answer":[1],"explanations":["Autopilot profiles are for provisioning. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","This option is correct. Advanced hunting provides KQL-based investigations across security telemetry.","ABM is Apple device/app management.","ESP is provisioning gating."],"tip":"Investigation + KQL queries \u2192 Advanced hunting.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E01-009","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 800 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are standardising configuration across departments.\n\nYour company is migrating from on\u2011premises Group Policy to Intune. You have 1200 Windows 10 and Windows 11 devices that are hybrid joined. During the transition, some settings are delivered by both Group Policy and MDM.\n\nYou need Intune MDM settings to take precedence when there is a conflict for the same configuration.\n\nWhat should you configure?","choices":["Convert all devices to Entra ID join immediately to eliminate Group Policy","Create a compliance policy that marks devices as compliant","Configure the ControlPolicyConflict policy CSP and set MDMWinsOverGP to enabled","Set the MDM enrollment URL in Group Policy to point to Intune"],"answer":[2],"explanations":["That would remove GP influence, but the question explicitly describes coexistence during migration.","Compliance evaluates device state; it doesn\u2019t resolve config conflicts between policy sources.","This is the Windows mechanism that tells the device to prefer MDM where both sources manage the same setting (when supported). It aligns with how Microsoft expects you to implement this in Intune at scale.","This enables auto-enrollment, but it does not control which policy source wins when both set the same value."],"tip":"Enrollment (URLs) \u2260 conflict resolution. Conflict behavior is controlled by CSP policy (where applicable).  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-022","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 300 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and Android devices.\n\nRequirements:\n- Meet the stat /marking, it\u2019s sensitivity labels (often with auto-labeling).  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E01-016","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are reviewing a change request.\n\nYou need to ensure local administrator passwords are unique per device and can be rotated and retrieved by authorised admins.\n\nWhat should you configure in Intune/Entra?","choices":["App protection policy","Retention label","Windows LAPS policy","Managed Google Play"],"answer":[2],"explanations":["APP is mobile app data protection, not local admin password management.","Retention labels are data lifecycle controls.","This option is correct. Windows LAPS manages local admin passwords with rotation and controlled retrieval. It aligns with how Microsoft expects you to implement this in Intune at scale.","Managed Google Play is Android app distribution."],"tip":"Local admin password rotation/retrieval \u2192 Windows LAPS.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-020","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 300 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are the Microsoft 365 endpoint administrator.\n\nYou want to dates.","This option is correct. VPP/ABM is used for volume-purchased iOS apps assignment.","Managed Google Play is for Android."],"tip":"iOS volume app deployment \u2192 VPP via ABM.  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM)."},{"id":"MS102-E02-036","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 1200 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are the Microsoft 365 endpoint administrator.\n\nYour organisation must retain documents for 7 years for regulatory reasons. Separately, you want to apply encryption and control external sharing for certain files.\n\nWhich statement is correct?","choices":["Sensitivity labels automatically enforce the retention period","Use sensitivity labels for protection and retention policies/labels for retention; they serve different purposes","You must choose either retention or sensitivity labels; they cannot be used together","Retention policies provide encryption and conditional sharing controls"],"answer":[1],"explanations":["Sensitivity labels don\u2019t automatically enforce retention durations.","This option is correct. Sensitivity labels protect content (encryption/marking); retention handles lifecycle and recordkeeping. They complement each other. It maps directly to the Microsoft Purview control designed for this outcome.","You can use both; many orgs do.","Retention is not a content protection control; it won\u2019t encrypt or restrict sharing."],"tip":"Protection \u2260 retention. If the requirement is keep/delete, use retention. If it\u2019s encrypt/mark, use sensitivity.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E02-030","domain":"Implement security and compliance","type":"single","stem":"You are reviewing a change request.\n\nYou need to secure access to SharePoint Online.\n\nRequirements:\n- Require MFA\n- Block access from devices that are not compliant in Intune\n\nWhat should you configure?","choices":["A DLP policy that blocks external sharing","An app configuration policy for Microsoft Outlook","A retention policy applied to user content","Conditional Access grant controls requiring MFA AND requiring the device to be marked as compliant"],"answer":[3],"explanations":["DLP is about data exfiltration prevention, not access grant decisions based on device state.","App config adjusts app settings; it doesn\u2019t enforce MFA or device compliance.","Retention is data lifecycle, not access control.","This option is correct. Grant controls can require both MFA and a compliant device, matching the requirements."],"tip":"Access decisions based on signals \u2192 Conditional Access. Use grant controls for must-have requirements.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E02-035","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are preparing a security remediation plan.\n\nYou want to reduce common attack techniques by blocking risky behaviors such as Office apps creating child processes.\n\nWhat should you configure?","choices":["Autopilot profile","Attack surface reduction (ASR) rules","Managed Google Play","Retention label"],"answer":[1],"explanations":["Autopilot provisions devices. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","This option is correct. ASR rules harden endpoints by blocking behaviors commonly used by malware.","Managed Google Play is Android apps.","Retention labels are lifecycle controls."],"tip":"Behavior hardening against malware \u2192 ASR rules.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E02-040","domain":"Manage applications","type":"single","stem":"Current environment:\n- Your company has 1200 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are reviewing a change request.\n\nYou want to deploy line-of-business apps to Windows devices and ensure the app is available in the Company Portal.\n\nWhat should you do?","choices":["Create a DLP policy","Create a retention label","Add the app in Intune and assign it to a group","Enable MDMWinsOverGP CSP"],"answer":[2],"explanations":["DLP is for data protection, not app deployment.","Retention labels are for lifecycle, not app deployment.","This option is correct. Apps are deployed by adding them to Intune and assigning to user/device groups (required/available).","MDMWinsOverGP is policy conflict behavior, unrelated to app deployment."],"tip":"App deployment in Intune = add app + assign.  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM)."},{"id":"MS102-E02-022","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 800 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are reviewing a change request.\n\nYou want to investigate historical sign-in events and query security telemetry across your tenant.\n\nWhat should you use?","choices":["Windows Autopilot profile","Apple Business Manager","Enrollment Status Page","Microsoft 365 Defender advanced hunting"],"answer":[3],"explanations":["Autopilot profiles are for provisioning. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","ABM is Apple device/app management.","ESP is provisioning gating.","This option is correct. Advanced hunting provides KQL-based investigations across security telemetry."],"tip":"Investigation + KQL queries \u2192 Advanced hunting.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E02-003","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 300 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are the Microsoft 365 endpoint administrator.\n\nYou are provisioning shared kiosk devices that should set up without user credentials and automatically enroll in Intune.\n\nWhich Autopilot mode is most appropriate?","choices":["User-driven mode","Windows Update ring","Hybrid join only","Self-deploying mode"],"answer":[3],"explanations":["User-driven requires user sign-in during OOBE; not ideal for kiosk devices.","Update rings manage updates, not provisioning mode.","Hybrid join is about joining on-prem AD, not kiosk mode.","This option is correct. Self-deploying is designed for kiosks/shared devices with minimal user interaction (with prerequisites). It aligns with how Microsoft expects you to implement this in Intune at scale."],"tip":"Shared/kiosk devices \u2192 Autopilot self-deploying (if prerequisites are met).  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E02-044","domain":"Manage applications","type":"single","stem":"You are preparing a security remediation plan.\n\nEmployees in Legal use personal iOS and Android devices for Microsoft 365 apps.\n\nRequirements:\n- Protect corporate data inside apps (PIN, block copy/paste to personal apps)\n- Do NOT require full device enrollment\n\nWhat should you configure?","choices":["Device configuration profiles (MDM)","Windows Autopilot deployment profile","App protection policies (MAM without enrollment)","Security baselines"],"answer":[2],"explanations":["MDM profiles require enrollment and control device-wide settings.","Autopilot is Windows provisioning. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","This option is correct. MAM-WE protects data in managed apps without enrolling the whole device.","Baselines are device management configurations and generally require management/enrollment."],"tip":"BYOD without enrollment \u2192 MAM without enrollment (APP).  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM)."},{"id":"MS102-E02-026","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 1200 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYour organisation uses Microsoft 365 E5 licences. Users in the Marketing department handle sensitive data containing credit card numbers and health identifiers. You need to prevent accidental sharing via email and Microsoft Teams messages, and you must be able to review policy violations.\n\nWhat should you create?","choices":["A data loss prevention (DLP) policy in Microsoft Purview","A sensitivity label policy in Microsoft Purview","An insider risk management policy in Microsoft Purview","A retention policy in Microsoft Purview"],"answer":[0],"explanations":["This option is correct. DLP policies detect sensitive info types across Exchange and Teams, can block/warn users, and generate alerts/reports for review\u2014exactly what\u2019s required. It maps directly to the Microsoft Purview control designed for this outcome.","Sensitivity labels classify/protect content (marking/encryption) but are not the primary control for scanning and blocking sensitive info in messages.","Insider risk is investigative/behavioral and typically retrospective; the requirement is preventative controls in messaging.","Retention controls how long data is kept/deleted; it doesn\u2019t prevent sharing."],"tip":"Prevent sharing of specific sensitive info types + review violations \u2192 DLP.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E02-037","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are preparing a security remediation plan.\n\nYou need to detect and block the sharing of passport numbers in Exchange Online email  device group containing corporate laptops","Configure a DLP policy in Exchange Online","Use a retention policy in Microsoft Purview","Deploy an app protection policy"],"answer":[0],"explanations":["This option is correct. Wi-Fi settings are delivered via configuration profiles and scoped via assignments. It aligns with how Microsoft expects you to implement this in Intune at scale.","DLP is for sensitive data, not Wi-Fi settings.","Retention is data lifecycle, unrelated to Wi-Fi.","APP is mobile app data protection, not Wi-Fi provisioning."],"tip":"For device settings (Wi\u2011Fi/VPN/certificates), think configuration profiles + correct assignment scoping.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E03-042","domain":"Manage applications","type":"single","stem":"Employees in Operations use personal iOS and Android devices for Microsoft 365 apps.\n\nRequirements:\n- Protect corporate data inside apps (PIN, block copy/paste to personal apps)\n- Do NOT require full device enrollment\n\nWhat should you configure?","choices":["App protection policies (MAM without enrollment)","Device configuration profiles (MDM)","Security baselines","Windows Autopilot deployment profile"],"answer":[0],"explanations":["This option is correct. MAM-WE protects data in managed apps without enrolling the whole device.","MDM profiles require enrollment and control device-wide settings.","Baselines are device management configurations and generally require management/enrollment.","Autopilot is Windows provisioning. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate."],"tip":"BYOD without enrollment \u2192 MAM without enrollment (APP).  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM)."},{"id":"MS102-E03-033","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 1200 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYour organisation uses Microsoft 365 Business Premium licences. Users in the HR department handle sensitive data containing bank account numbers and credit card numbers. You need to prevent accidental sharing via email and Microsoft Teams messages, and you must be able to review policy violations.\n\nWhat should you create?","choices":["A sensitivity label policy in Microsoft Purview","A data loss prevention (DLP) policy in Microsoft Purview","An insider risk management policy in Microsoft Purview","A retention policy in Microsoft Purview"],"answer":[1],"explanations":["Sensitivity labels classify/protect content (marking/encryption) but are not the primary control for scanning and blocking sensitive info in messages.","This option is correct. DLP policies detect sensitive info types across Exchange and Teams, can block/warn users, and generate alerts/reports for review\u2014exactly what\u2019s required. It maps directly to the Microsoft Purview control designed for this outcome.","Insider risk is investigative/behavioral and typically retrospective; the requirement is preventative controls in messaging.","Retention controls how long data is kept/deleted; it doesn\u2019t prevent sharing."],"tip":"Prevent sharing of specific sensitive info types + review violations \u2192 DLP.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E03-023","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 1200 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are preparing a security remediation plan.\n\nYour organisation must retain documents for 7 years for regulatory reasons. Separately, you want to apply encryption and control external sharing for certain files.\n\nWhich statement is correct?","choices":["Use sensitivity labels for protection and retention policies/labels for retention; they serve different purposes","You must choose either retention or sensitivity labels; they cannot be used together","Sensitivity labels automatically enforce the retention period","Retention policies provide encryption and conditional sharing controls"],"answer":[0],"explanations":["This option is correct. Sensitivity labels protect content (encryption/marking); retention handles lifecycle and recordkeeping. They complement each other. It maps directly to the Microsoft Purview control designed for this outcome.","You can use both; many orgs do.","Sensitivity labels don\u2019t automatically enforce retention durations.","Retention is not a content protection control; it won\u2019t encrypt or restrict sharing."],"tip":"Protection \u2260 retention. If the requirement is keep/delete, use retention. If it\u2019s encrypt/mark, use sensitivity.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E03-027","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 1200 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are preparing a security remediation plan.\n\nYour organisation uses Microsoft 365 E3 licences. Users in the Customer Support department handle sensitive data containing passport numbers and national insurance numbers. You need to prevent accidental sharing via email and Microsoft Teams messages, and you must be able to review policy violations.\n\nWhat should you create?","choices":["A sensitivity label policy in Microsoft Purview","A data loss prevention (DLP) policy in Microsoft Purview","A retention policy in Microsoft Purview","An insider risk management policy in Microsoft Purview"],"answer":[1],"explanations":["Sensitivity labels classify/protect content (marking/encryption) but are not the primary control for scanning and blocking sensitive info in messages.","This option is correct. DLP policies detect sensitive info types across Exchange and Teams, can block/warn users, and generate alerts/reports for review\u2014exactly what\u2019s required. It maps directly to the Microsoft Purview control designed for this outcome.","Retention controls how long data is kept/deleted; it doesn\u2019t prevent sharing.","Insider risk is investigative/behavioral and typically retrospective; the requirement is preventative controls in messaging."],"tip":"Prevent sharing of specific sensitive info types + review violations \u2192 DLP.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E03-039","domain":"Manage applications","type":"single","stem":"Current environment:\n- Your company has 300 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou want to deploy line-of-business apps to Windows devices and ensure the app is available in the Company Portal.\n\nWha ating during OOBE = Enrollment Status Page.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E04-042","domain":"Manage applications","type":"multi","stem":"Current environment:\n- Your company has 300 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are preparing a security remediation plan.\n\nYou are preparing iOS/iPadOS devices for automated enrollment and app deployment using Intune.\n\nSelect THREE items that are commonly required for enterprise iOS/iPadOS management.","choices":["Apple Business Manager (ABM) / VPP","Managed Google Play","APNs certificate","Enrollment profile/token for Automated Device Enrollment (ADE)"],"answer":[0,2,3],"explanations":["This option is correct. ABM/VPP supports automated enrollment and volume app purchasing/assignment.","Managed Google Play is for Android Enterprise, not iOS/iPadOS.","This option is correct. APNs certificate is required for MDM communication with Apple devices.","This option is correct. ADE enrollment token/profile defines how devices enroll automatically."],"tip":"iOS enterprise stack: APNs + ABM/VPP + ADE token/profile.  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM).","pick":3},{"id":"MS102-E04-003","domain":"Deploy and manage endpoints","type":"single","stem":"You are standardising configuration across departments.\n\nYou manage Windows devices with Intune.\n\nRequirement:\n- Keep a pilot group pinned to **Windows 11, version 24H2**\n- Prevent devices from upgrading past that feature version until IT approves\n\nWhat should you configure?","choices":["Update ring for Windows 10 and later only","Feature updates policy for Windows 10 and later","Security baseline for Windows 10 and later","Compliance policy requiring a minimum OS version"],"answer":[1],"explanations":["Update rings manage general servicing behavior/deferrals but are less direct for pinning a specific version.","This option is correct. Feature update policies can target and hold devices at a specific feature version. It aligns with how Microsoft expects you to implement this in Intune at scale.","Baselines configure security settings; they do not control feature version targeting.","Compliance evaluates and can block access, but does not manage upgrade targeting."],"tip":"Pin a feature version \u2192 Feature updates policy. Tune update behavior \u2192 Update ring.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E04-037","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYour organisation uses Microsoft 365 Business Premium licences. Users in the Finance department handle sensitive data containing credit card numbers and national insurance numbers. You need to prevent accidental sharing via email and Microsoft Teams messages, and you must be able to review policy violations.\n\nWhat should you create?","choices":["A retention policy in Microsoft Purview","An insider risk management policy in Microsoft Purview","A sensitivity label policy in Microsoft Purview","A data loss prevention (DLP) policy in Microsoft Purview"],"answer":[3],"explanations":["Retention controls how long data is kept/deleted; it doesn\u2019t prevent sharing.","Insider risk is investigative/behavioral and typically retrospective; the requirement is preventative controls in messaging.","Sensitivity labels classify/protect content (marking/encryption) but are not the primary control for scanning and blocking sensitive info in messages.","This option is correct. DLP policies detect sensitive info types across Exchange and Teams, can block/warn users, and generate alerts/reports for review\u2014exactly what\u2019s required. It maps directly to the Microsoft Purview control designed for this outcome."],"tip":"Prevent sharing of specific sensitive info types + review violations \u2192 DLP.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E04-007","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are preparing a security remediation plan.\n\nYou are deploying new Windows devices using Windows Autopilot. Users in Customer Support report that they reach the desktop before required applications and policies finish installing, leading to inconsistent builds.\n\nYou want to block user access until required setup completes.\n\nWhat should you configure?","choices":["App protection policy","Retention label policy","Device compliance policy","Enrollment Status Page (ESP)"],"answer":[3],"explanations":["APP protects data in apps; it doesn\u2019t control Autopilot setup completion.","Retention labels are for data lifecycle, not provisioning.","Compliance evaluates device posture and can be used with Conditional Access; it doesn\u2019t gate Autopilot completion.","This option is correct. ESP can block device use during e
