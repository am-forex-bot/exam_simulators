but are less direct for pinning a specific version."],"tip":"Pin a feature version \u2192 Feature updates policy. Tune update behavior \u2192 Update ring.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E04-044","domain":"Manage applications","type":"single","stem":"You are reviewing a change request.\n\nEmployees in Finance use personal iOS and Android devices for Microsoft 365 apps.\n\nRequirements:\n- Protect corporate data inside apps (PIN, block copy/paste to personal apps)\n- Do NOT require full device enrollment\n\nWhat should you configure?","choices":["App protection policies (MAM without enrollment)","Security baselines","Device configuration profiles (MDM)","Windows Autopilot deployment profile"],"answer":[0],"explanations":["This option is correct. MAM-WE protects data in managed apps without enrolling the whole device.","Baselines are device management configurations and generally require management/enrollment.","MDM profiles require enrollment and control device-wide settings.","Autopilot is Windows provisioning. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate."],"tip":"BYOD without enrollment \u2192 MAM without enrollment (APP).  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM)."},{"id":"MS102-E04-018","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 1200 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are standardising configuration across departments.\n\nYou need to ensure local administrator passwords are unique per device and can be rotated and retrieved by authorised admins.\n\nWhat should you configure in Intune/Entra?","choices":["Retention label","Windows LAPS policy","Managed Google Play","App protection policy"],"answer":[1],"explanations":["Retention labels are data lifecycle controls.","This option is correct. Windows LAPS manages local admin passwords with rotation and controlled retrieval. It aligns with how Microsoft expects you to implement this in Intune at scale.","Managed Google Play is Android app distribution.","APP is mobile app data protection, not local admin password management."],"tip":"Local admin password rotation/retrieval \u2192 Windows LAPS.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E04-013","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 800 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are preparing a security remediation plan.\n\nYour company has 2000 Windows 10 and Windows 11 devices enrolled in Microsoft Intune. Security requires BitLocker encryption on the operating system drive. You need to enforce this requirement with the least administrative effort and ensure compliance reporting is available.\n\nWhat should you configure?","choices":["A PowerShell script deployed via Intune to enable BitLocker","An endpoint security Disk Encryption policy","A device configuration profile using the Endpoint Protection template","A Windows Autopilot deployment profile with BitLocker pre-provisioning"],"answer":[1],"explanations":["A script can enable BitLocker, but you\u2019ll typically lose strong native policy lifecycle and reporting. It fails the 'least administrative effort' requirement. Scripts can work, but they usually weaken native reporting/managed lifecycle compared with policy-based configuration.","This option is correct. Disk Encryption policies in the Endpoint security blade are purpose-built for BitLocker and integrate cleanly with Intune reporting. Least effort + compliance visibility is what this question is testing.","This can configure BitLocker, but it\u2019s a broader profile and not the most focused approach for encryption management and reporting.","Autopilot settings mainly apply at provisioning time and won\u2019t reliably remediate an already enrolled estate. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate."],"tip":"If the question is a security control + compliance visibility, Microsoft often expects Endpoint security (Disk encryption/AV/Firewall/ASR).  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E04-021","domain":"Implement security and compliance","type":"single","stem":"You are the Microsoft 365 endpoint administrator.\n\nYou need to secure access to SharePoint Online.\n\nRequirements:\n- Require MFA\n- Block access from devices that are not compliant in Intune\n\nWhat should you configure?","choices":["An app configuration policy for Microsoft Outlook","A retention policy applied to user content","Conditional Access grant controls requiring MFA AND requiring the device to be marked as compliant","A DLP policy that blocks external sharing"],"answer":[2],"explanations":["App config adjusts app settings; it doesn\u2019t enforce MFA or device compliance.","Retention is data lifecycle, not access control.","This option is correct. Grant controls can require both MFA and a compliant device, matching the requirements.","DLP is about data exfiltration prevention, not access grant decisions based on device state."],"tip":"Access decisions based on signals \u2192 Conditional Access. Use grant controls for must-have requirements.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E04-010","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are the Microsoft 365 endpoint administrator.\n\nYour company has 2000 Windows 10 and Windows 11 devices enrolled in Microsoft Intune. Security requires BitLocker encryption on the operating system drive. You need to enforce this requirement with the least administrative effort and ensure compliance reporting is available.\n\nWhat should you configure?","choices":["A Windows Autopilot deployment profile with BitLocker pre-provisioning","An endpoint security Disk Encryption policy","A device configuration profile using the Endpoint Protection template","A PowerShell script deployed via Intune to enable BitLocker"],"answer":[1],"explanations":["Autopilot settings mainly apply at provisioning time and won\u2019t reliably remediate an already enrolled estate. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","This option is correct. Disk Encryption policies in the Endpoint security blade are purpose-built for BitLocker and integrate cleanly with Intune reporting. Least effort + compliance visibility is what this question is testing.","This can configure BitLocker, but it\u2019s a broader profile and not the most focused approach for encryption management and reporting.","A script can enable BitLocker, but you\u2019ll typically lose strong native policy lifecycle and re evice management** (MDM)."},{"id":"MS102-E04-012","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are standardising configuration across departments.\n\nYou are deploying new Windows devices using Windows Autopilot. Users in Sales report that they reach the desktop before required applications and policies finish installing, leading to inconsistent builds.\n\nYou want to block user access until required setup completes.\n\nWhat should you configure?","choices":["Retention label policy","Device compliance policy","Enrollment Status Page (ESP)","App protection policy"],"answer":[2],"explanations":["Retention labels are for data lifecycle, not provisioning.","Compliance evaluates device posture and can be used with Conditional Access; it doesn\u2019t gate Autopilot completion.","This option is correct. ESP can block device use during enrollment until required apps/profiles finish installing, reducing 'half-configured' devices. It aligns with how Microsoft expects you to implement this in Intune at scale.","APP protects data in apps; it doesn\u2019t control Autopilot setup completion."],"tip":"Autopilot gating during OOBE = Enrollment Status Page.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E04-029","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are standardising configuration across departments.\n\nYour organisation must retain documents for 7 years for regulatory reasons. Separately, you want to apply encryption and control external sharing for certain files.\n\nWhich statement is correct?","choices":["You must choose either retention or sensitivity labels; they cannot be used together","Retention policies provide encryption and conditional sharing controls","Use sensitivity labels for protection and retention policies/labels for retention; they serve different purposes","Sensitivity labels automatically enforce the retention period"],"answer":[2],"explanations":["You can use both; many orgs do.","Retention is not a content protection control; it won\u2019t encrypt or restrict sharing.","This option is correct. Sensitivity labels protect content (encryption/marking); retention handles lifecycle and recordkeeping. They complement each other. It maps directly to the Microsoft Purview control designed for this outcome.","Sensitivity labels don\u2019t automatically enforce retention durations."],"tip":"Protection \u2260 retention. If the requirement is keep/delete, use retention. If it\u2019s encrypt/mark, use sensitivity.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E04-030","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 1200 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYour organisation uses Microsoft 365 E5 licences. Users in the Procurement department handle sensitive data containing health identifiers and bank account numbers. You need to prevent accidental sharing via email and Microsoft Teams messages, and you must be able to review policy violations.\n\nWhat should you create?","choices":["A sensitivity label policy in Microsoft Purview","A retention policy in Microsoft Purview","An insider risk management policy in Microsoft Purview","A data loss prevention (DLP) policy in Microsoft Purview"],"answer":[3],"explanations":["Sensitivity labels classify/protect content (marking/encryption) but are not the primary control for scanning and blocking sensitive info in messages.","Retention controls how long data is kept/deleted; it doesn\u2019t prevent sharing.","Insider risk is investigative/behavioral and typically retrospective; the requirement is preventative controls in messaging.","This option is correct. DLP policies detect sensitive info types across Exchange and Teams, can block/warn users, and generate alerts/reports for review\u2014exactly what\u2019s required. It maps directly to the Microsoft Purview control designed for this outcome."],"tip":"Prevent sharing of specific sensitive info types + review violations \u2192 DLP.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E04-005","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are the Microsoft 365 endpoint administrator.\n\nYour company is migrating from on\u2011premises Group Policy to Intune. You have 120 Windows 10 and Windows 11 devices that are hybrid joined. During the transition, some settings are delivered by both Group Policy and MDM.\n\nYou need Intune MDM settings to take precedence when there is a conflict for the same configuration.\n\nWhat should you configure?","choices":["Create a compliance policy that marks devices as compliant","Convert all devices to Entra ID join immediately to eliminate Group Policy","Configure the ControlPolicyConflict policy CSP and set MDMWinsOverGP to enabled","Set the MDM enrollment URL in Group Policy to point to Intune"],"answer":[2],"explanations":["Compliance evaluates device state; it doesn\u2019t resolve config conflicts between policy sources.","That would remove GP influence, but the question explicitly describes coexistence during migration.","This is the Windows mechanism that tells the device to prefer MDM where both sources manage the same setting (when supported). It aligns with how Microsoft expects you to implement this in Intune at scale.","This enables auto-enrollment, but it does not control which policy source wins when both set the same value."],"tip":"Enrollment (URLs) \u2260 conflict resolution. Conflict behavior is controlled by CSP policy (where applicable).  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E04-032","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYour organisation uses Microsoft 365 Business Premium licences. Users in the HR department handle sensitive data containing credit card numbers and passport numbers. You need to prevent accidental sharing via email and Microsoft Teams messages, and you must be able to review policy violations.\n\nWhat should you create?","choices":["A data loss prevention (DLP) policy in Microsoft Purview","A retention p function $(id) { return document.getElementById(id); }
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
function arrHas(a, v) { for (var i=0;i<a.length;i++) if (a[i]===v) return true; return false; }
function setEq(a,b) {
  if (a.length !== b.length) return false;
  for (var i=0;i<a.length;i++) if (!arrHas(b,a[i])) return false;
  return true;
}
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  var m = Math.floor(sec/60), s = sec % 60;
  return (m<10?'0':'')+m+':' + (s<10?'0':'')+s;
}
function getExamMeta(code) {
  for (var i=0;i<BANK.exams.length;i++) if (BANK.exams[i].code===code) return BANK.exams[i];
  return null;
}
function defaultDuration(code) {
  if (code === 'AZ900') return 60*60;
  if (code === 'MS102') return 120*60;
  return 90*60;
}

var STATE = {
  examCode:null, examName:null, setIndex:null, questions:null,
  idx:0, answers:{}, revealed:{}, startedAt:null, timerId:null,
  durationSec:90*60, finished:false
};

function renderHome() {
  $('viewPicker').style.display='none';
  $('viewExam').style.display='none';
  var h='';
  h+='<div class="card">';
  h+='<h2 style="margin:0 0 8px 0;">Pick an exam</h2>';
  h+='<div class="muted">Original, scenario-based practice questions with Microsoft-style distractors and “why” explanations.</div>';
  h+='<div class="grid">';
  for (var i=0;i<BANK.exams.length;i++) {
    var ex=BANK.exams[i];
    h+='<div class="card">';
    h+='<h3 style="margin:0 0 6px 0;">'+esc(ex.name)+'</h3>';
    h+='<div class="tiny">5 practice exams • 50 questions each • domain-weighted • shuffled answers</div>';
    h+='<div class="kpi">';
    h+='<div class="k"><b>Pass</b> '+ex.pass_scaled+'/'+ex.max_scaled+'</div>';
    h+='<div class="k"><b>Q</b> 50</div>';
    h+='<div class="k"><b>Time</b> '+(defaultDuration(ex.code)/60)+' mins</div>';
    h+='</div>';
    h+='<div class="btnrow"><button class="primary" onclick="pickExam(\''+ex.code+'\')">Choose</button></div>';
    h+='</div>';
  }
  h+='</div>';
  h+='<div class="hr"></div>';
  h+='<div class="tiny">Scoring: revealed questions only → raw% and approximate scaled score (0–1000). Pass at 700.</div>';
  h+='</div>';
  $('viewHome').innerHTML=h;
  $('footerNote').innerHTML=esc(BANK.meta.note)+' • Generated: '+esc(BANK.meta.generated_utc);
}

function pickExam(code) {
  var meta=getExamMeta(code);
  STATE.examCode=code;
  STATE.examName=meta?meta.name:code;
  renderPicker();
}

function renderPicker() {
  $('viewHome').innerHTML='';
  $('viewExam').style.display='none';
  $('viewPicker').style.display='';
  var sets=BANK.practice_sets[STATE.examCode]||[];
  var h='';
  h+='<div class="card">';
  h+='<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;">';
  h+='<div><h2 style="margin:0 0 6px 0;">'+esc(STATE.examName)+'</h2><div class="muted">Choose a practice exam.</div></div>';
  h+='<button class="linkbtn" onclick="goHome()">← Back</button>';
  h+='</div>';
  h+='<div class="grid">';
  for (var i=0;i<sets.length;i++) {
    var s=sets[i];
    h+='<div class="card">';
    h+='<h3 style="margin:0 0 6px 0;">'+esc(s.title)+'</h3>';
    h+='<div class="kpi">';
    h+='<div class="k"><b>Questions</b> 50</div>';
    h+='<div class="k"><b>Time</b> '+(defaultDuration(STATE.examCode)/60)+' mins</div>';
    h+='</div>';
    h+='<div class="btnrow"><button class="primary" onclick="startExam('+s.set+')">Start</button></div>';
    h+='</div>';
  }
  h+='</div></div>';
  $('viewPicker').innerHTML=h;
}

function goHome() {
  resetState();
  $('viewHome').innerHTML='';
  $('viewPicker').innerHTML='';
  $('viewExam').innerHTML='';
  $('viewHome').style.display='';
  renderHome();
}
function resetState() {
  if (STATE.timerId) clearInterval(STATE.timerId);
  STATE={examCode:null, examName:null, setIndex:null, questions:null, idx:0, answers:{}, revealed:{}, startedAt:null, timerId:null, durationSec:90*60, finished:false};
}

function startExam(setIndex) {
  STATE.setIndex=setIndex;
  STATE.durationSec=defaultDuration(STATE.examCode);
  STATE.startedAt=new Date().getTime();
  STATE.answers={}; STATE.revealed={}; STATE.idx=0; STATE.finished=false;

  var sets=BANK.practice_sets[STATE.examCode]||[];
  var picked=null;
  for (var i=0;i<sets.length;i++) if (sets[i].set===setIndex) picked=sets[i];
  STATE.questions=picked?clone(picked.questions):[];

  $('viewPicker').style.display='none';
  $('viewExam').style.display='';
  tickTimer();
  if (STATE.timerId) clearInterval(STATE.timerId);
  STATE.timerId=setInterval(tickTimer,1000);
  renderQuestion();
}

function remainingSec() {
  if (!STATE.startedAt) return STATE.durationSec;
  var elapsed=(new Date().getTime()-STATE.startedAt)/1000;
  return Math.max(0, STATE.durationSec - elapsed);
}
function tickTimer() {
  if (!STATE.startedAt || STATE.finished) return;
  var rem=remainingSec();
  $('metaPill').innerHTML='Offline • '+esc(STATE.examCode)+' • Time left: '+fmtTime(rem);
  if (rem<=0) finishExam(true);
}

function toggleChoice(qid, idx) {
  var q=null;
  for (var i=0;i<STATE.questions.length;i++) if (STATE.questions[i].id===qid) q=STATE.questions[i];
  if (!q) return;
  if (STATE.revealed[qid]===true) return;

  var sel=STATE.answers[qid]||[];
  if (q.type==='single') sel=[idx];
  else {
    if (arrHas(sel, idx)) {
      var n=[]; for (var j=0;j<sel.length;j++) if (sel[j]!==idx) n.push(sel[j]);
      sel=n;
    } else sel.push(idx);
  }
  STATE.answers[qid]=sel;
  renderQuestion();
}

function gradeQuestion(q) {
  var sel=(STATE.answers[q.id]||[]).slice().sort(function(a,b){return a-b;});
  var ans=(q.answer||[]).slice().sort(function(a,b){return a-b;});
  return setEq(sel, ans);
}

function gradeAll() {
  var correct=0, revealed=0, answered=0;
  var perDomain={};
  for (var i=0;i<STATE.questions.length;i++) {
    var q=STATE.questions[i];
    var sel=STATE.answers[q.id]||[];
    if (sel.length>0) answered++;
    if (STATE.revealed[q.id]===true) {
      revealed++;
      if (!perDomain[q.domain]) perDomain[q.domain]={total:0, correct:0};
      perDomain[q.domain].total++;
      if (gradeQuestion(q)) { correct++; perDomain[q.domain].correct++; }
    }
  }
  var denom=Math.max(1, revealed);
  var raw=Math.round((correct/denom)*100);
  var scaled=Math.round((correct/denom)*1000);
  return {correct:correct,revealed:revealed,answered:answered,rawPct:raw,scaled:scaled,perDomain:perDomain};
}

function revealAnswer() {
  var q=STATE.questions[STATE.idx];
  if (!q) return;
  STATE.revealed[q.id]=true;
  renderQuestion();
}

function prevQ() { if (STATE.idx>0) { STATE.idx--; renderQuestion(); } }
function nextQ() { if (STATE.idx<STATE.questions.length-1) { STATE.idx++; renderQuestion(); } }

function confirmExit() {
  var ok=confirm('Exit exam? Your progress in this attempt will be lost.');
  if (ok) renderPicker();
}

function renderQuestion() {
  var q=STATE.questions[STATE.idx];
  if (!q) return;
  var total=STATE.questions.length;
  var selected=STATE.answers[q.id]||[];
  var revealed=STATE.revealed[q.id]===true;

  var h='';
  h+='<div class="card">';
  h+='<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;">';
  h+='<div><div class="qnum">Question '+(STATE.idx+1)+' of '+total+'</div>';
  h+='<div class="domain">'+esc(q.domain)+' • '+(q.type==='multi' ? ('Select '+q.pick) : 'Select 1')+'</div></div>';
  h+='<button class="linkbtn" onclick="confirmExit()">Exit</button>';
  h+='</div>';

  h+='<div class="progress"><div class="bar" style="width:'+Math.round((STATE.idx)/Math.max(1,total-1)*100)+'%"></div></div>';
  h+='<div class="stem">'+esc(q.stem)+'</div>';

  h+='<div class="choices">';
  for (var i=0;i<q.choices.length;i++) {
    var isSel=arrHas(selected,i);
    var inputType=(q.type==='multi')?'checkbox':'radio';
    var disabled=revealed?'disabled':'';
    var checked=isSel?'checked':'';
    var name='q_'+q.id;
    h+='<label class="choice">';
    h+='<input '+disabled+' '+checked+' type="'+inputType+'" name="'+esc(name)+'" onclick="toggleChoice(\''+q.id+'\','+i+')" />';
    h+='<div><b>'+String.fromCharCode(65+i)+'.</b> '+esc(q.choices[i])+'</div>';
    h+='</label>';
  }
  h+='</div>';

  h+='<div class="btnrow">';
  h+='<button onclick="prevQ()" '+(STATE.idx===0?'disabled':'')+'>← Previous</button>';
  h+='<button onclick="nextQ()" '+(STATE.idx===total-1?'disabled':'')+'>Next →</button>';
  h+='<button class="primary" onclick="revealAnswer()">Reveal answer</button>';
  h+='<button class="danger" onclick="finishExam(false)">Finish exam</button>';
  h+='</div>';

  if (revealed) {
    var isCorrect=gradeQuestion(q);
    var sel=(STATE.answers[q.id]||[]);
    var selTxt = sel.length ? sel.map(function(x){return String.fromCharCode(65+x);}).join(', ') : '—';
    var ansTxt = (q.answer||[]).map(function(x){return String.fromCharCode(65+x);}).join(', ');
    h+='<div class="reveal '+(isCorrect?'good':'bad')+'">';
    h+='<div style="font-weight:900;">'+(isCorrect?'✅ Correct.':'❌ Incorrect.')+'</div>';
    h+='<div class="tiny">You chose: <b>'+esc(selTxt)+'</b> • Correct answer: <b>'+esc(ansTxt)+'</b></div>';

    // Why correct
    h+='<div class="sectionTitle">Why '+esc(ansTxt)+' is right</div>';
    h+='<ul class="bullet">';
    for (var j=0;j<q.answer.length;j++) {
      var idx=q.answer[j];
      h+='<li><b>'+String.fromCharCode(65+idx)+'. '+esc(q.choices[idx])+'</b> — '+esc(q.explanations[idx]||'')+'</li>';
    }
    h+='</ul>';

    // Why others wrong
    h+='<div class="sectionTitle">Why the others fall short</div>';
    h+='<ul class="bullet">';
    for (var k=0;k<q.choices.length;k++) {
      if (arrHas(q.answer,k)) continue;
      h+='<li><b>'+String.fromCharCode(65+k)+'. '+esc(q.choices[k])+'</b> — '+esc(q.explanations[k]||'')+'</li>';
    }
    h+='</ul>';

    if (q.tip) h+='<div class="sectionTitle">Key concept to lock in</div><div class="muted">'+esc(q.tip)+'</div>';
    h+='</div>';
  }

  h+='</div>';

  var g=gradeAll();
  h+='<div class="card">';
  h+='<div class="kpi">';
  h+='<div class="k"><b>Answered</b> '+g.answered+'/'+total+'</div>';
  h+='<div class="k"><b>Revealed</b> '+g.revealed+'/'+total+'</div>';
  h+='<div class="k"><b>Raw</b> '+g.rawPct+'%</div>';
  h+='<div class="k"><b>Scaled</b> '+g.scaled+'/1000</div>';
  h+='</div>';
  h+='<div class="tiny">Raw/Scaled are computed from revealed questions only (so you can do full “exam mode” without revealing).</div>';
  h+='</div>';

  $('viewExam').innerHTML=h;
}

function finishExam(auto) {
  if (STATE.finished) return;
  STATE.finished=true;
  if (STATE.timerId) clearInterval(STATE.timerId);
  if (auto) for (var i=0;i<STATE.questions.length;i++) STATE.revealed[STATE.questions[i].id]=true;

  var meta=getExamMeta(STATE.examCode);
  var g=gradeAll();
  var pass=g.scaled >= (meta?meta.pass_scaled:700);

  var h='';
  h+='<div class="card">';
  h+='<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;">';
  h+='<div><h2 style="margin:0 0 6px 0;">Results: '+esc(STATE.examName)+' — Practice Exam '+STATE.setIndex+'</h2>';
  h+='<div class="muted">'+(auto?'Time expired — auto-finished.':'Finished.')+'</div></div>';
  h+='<button class="linkbtn" onclick="renderPicker()">← Back to exams</button>';
  h+='</div>';

  h+='<div class="kpi">';
  h+='<div class="k"><b>Revealed</b> '+g.revealed+'/'+STATE.questions.length+'</div>';
  h+='<div class="k"><b>Correct</b> '+g.correct+'/'+g.revealed+'</div>';
  h+='<div class="k"><b>Raw</b> '+g.rawPct+'%</div>';
  h+='<div class="k"><b>Scaled</b> '+g.scaled+'/1000</div>';
  h+='<div class="k"><b>Verdict</b> <span class="'+(pass?'pass':'fail')+'">'+(pass?'PASS':'FAIL')+'</span></div>';
  h+='</div>';

  h+='<div class="hr"></div>';
  h+='<h3 style="margin:0 0 8px 0;">Domain breakdown (revealed questions)</h3>';
  h+='<div class="grid">';
  for (var d in g.perDomain) {
    if (!g.perDomain.hasOwnProperty(d)) continue;
    var st=g.perDomain[d];
    var pct=st.total?Math.round((st.correct/st.total)*100):0;
    h+='<div class="card"><h3 style="margin:0 0 6px 0;">'+esc(d)+'</h3>';
    h+='<div class="kpi"><div class="k"><b>Correct</b> '+st.correct+'/'+st.total+'</div><div class="k"><b>%</b> '+pct+'%</div></div></div>';
  }
  h+='</div>';

  h+='<div class="hr"></div>';
  h+='<div class="btnrow">';
  h+='<button class="primary" onclick="reviewIncorrect()">Review incorrect</button>';
  h+='<button onclick="restartSame()">Restart this exam</button>';
  h+='<button onclick="goHome()">Home</button>';
  h+='</div>';

  h+='<div class="tiny">Scaled score is an approximation designed to mimic the 700/1000 pass threshold.</div>';
  h+='</div>';

  $('viewExam').innerHTML=h;
  $('metaPill').innerHTML='Offline • '+esc(STATE.examCode)+' • Finished';
}

function reviewIncorrect() {
  for (var i=0;i<STATE.questions.length;i++) {
    var q=STATE.questions[i];
    if (STATE.revealed[q.id]===true && !gradeQuestion(q)) {
      STATE.finished=false;
      STATE.idx=i;
      renderQuestion();
      return;
    }
  }
  alert('No incorrect revealed questions found.');
}
function restartSame() { startExam(STATE.setIndex); }

renderHome();
</script>
