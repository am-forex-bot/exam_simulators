um disks, 99.99% for VMs in Availability Zones). If Azure fails to meet the SLA, customers can claim service credits as compensation. Each Azure service has its own SLA with specific terms.","The Privacy Statement explains how Microsoft collects, uses, and protects personal data. It has nothing to do with service uptime or performance guarantees.","The Service Trust Portal provides access to audit reports, compliance guides, and trust documents. While it relates to trust and compliance, it doesn't define specific uptime SLAs or financial compensation."],"tip":"SLA = uptime guarantee + service credits if breached. Key SLA values to know: single VM (99.9% with premium storage), VMs in Availability Set (99.95%), VMs across Availability Zones (99.99%). No SLA = no guarantee and no credits. The exam tests specific SLA percentages."},{"id":"AZ900-E01-043","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company has a legacy application that requires a Windows Server 2019 environment\n- The application needs direct access to the underlying operating system for driver installation\n- Specific third-party software must be installed on the server\n- The company wants to migrate this to Azure with minimal application changes\n\nQuestion:\nWhich Azure compute service should you use?","choices":["Azure App Service","Azure Functions","Azure Virtual Machines","Azure Container Instances"],"answer":[2],"explanations":["Azure App Service is a PaaS platform for web applications. You don't get access to the underlying OS, can't install drivers, and can't install arbitrary third-party software. Not suitable for legacy applications requiring OS-level access.","Azure Functions is serverless compute for event-driven code execution. You have no access to the OS, can't install drivers or third-party software, and it's designed for small, stateless functions \u2014 not legacy applications.","This option is correct. Azure Virtual Machines (IaaS) provide full control over the operating system, including the ability to install drivers, configure third-party software, and run legacy applications exactly as they run on-premises. This is the classic 'lift and shift' migration \u2014 move the application to a VM in Azure with minimal changes.","Azure Container Instances run containerised applications. The legacy application would need to be containerised first (significant effort), and containers don't typically support driver installation or deep OS-level access."],"tip":"When the exam describes a legacy application that needs OS-level access, specific drivers, or third-party software installation \u2014 Azure VMs (IaaS) is always the answer. VMs = maximum control, minimum application changes for legacy workloads. This is Microsoft's recommended 'lift and shift' approach."},{"id":"AZ900-E01-044","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company operates in the UK and must comply with UK data protection regulations\n- All customer data must be stored within the United Kingdom\n- You need to ensure Azure resources are deployed only in UK Azure regions\n- The solution must also provide paired-region disaster recovery within the UK\n\nQuestion:\nWhich two Azure regions should you use? (The question asks you to identify the correct region pair.)","choices":["UK South and West Europe","UK South and UK West","North Europe and West Europe","UK South and France Central"],"answer":[1],"explanations":["West Europe is located in the Netherlands. Storing data there would violate the UK data residency requirement.","This option is correct. UK South (London) and UK West (Cardiff) are Azure's UK region pair. Microsoft automatically pairs regions within the same geography for disaster recovery. Data stays within the UK for both regions, satisfying data residency requirements. Microsoft staggers updates across paired regions and prioritises recovery of one region in each pair during widespread outages.","Both North Europe (Ireland) and West Europe (Netherlands) are outside the UK. Neither satisfies UK data residency requirements.","France Central is in Paris, France. While geographically close, data stored there is outside the UK and doesn't meet UK data residency regulations."],"tip":"Azure region pairs are within the same geography. UK South \u2194 UK West, East US \u2194 West US, North Europe \u2194 West Europe. Data residency questions always require BOTH regions to be in the correct country/geography. Microsoft uses paired regions for geo-redundant replication and staged updates."},{"id":"AZ900-E01-045","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company has multiple Azure subscriptions\n- Some subscriptions are for production, others for development\n- The governance team wants to organise subscriptions into a hierarchy and apply policies at different levels\n- Production subscriptions need stricter policies than development subscriptions\n\nQuestion:\nWhich Azure feature allows you to organise subscriptions into a hierarchy and apply governance at different levels?","choices":["Resource Groups","Management Groups","Azure Tags","Azure Subscriptions"],"answer":[1],"explanations":["Resource Groups organise resources WITHIN a subscription. They sit below subscriptions in the hierarchy and can't organise subscriptions themselves.","This option is correct. Management Groups provide a hierarchy ABOVE subscriptions. You can create groups like 'Production' and 'Development', place the relevant subscriptions in each, and apply Azure Policy and RBAC at the Management Group level. Policies cascade down to all subscriptions and resources within the group. The hierarchy supports up to 6 levels of depth below the root.","Tags are metadata key-value pairs for categorising resources. They help with cost tracking and organisation but don't provide a hierarchy or governance structure for subscriptions.","Subscriptions are billing and access boundaries, but they're flat \u2014 you can't organise subscriptions into groups using subscriptions alone. Management Groups add the hierarchical layer."],"tip":"Azure hierarchy: Management Groups \u2192 Subscriptions \u2192 Resource Groups \u2192 Resources. Policies and RBAC assigned at higher levels cascade down. If the question mentions 'organise subscriptions' or 'hierarchical governance' \u2014 Management Groups."},{"id":"AZ900-E01-046","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company needs to securely store API keys, database connection strings, and SSL certificates\n- Application developers must be able to retrieve these secrets programmatically\n- Access must be controlled through Azure RBAC and access policies\n- All access to secrets must be logged for auditing\n\nQuestion:\nWhich Azure service should you use?","choices":["Azure Storage Account with encryption","Azure Key Vault","Azure Active Directory (Entra ID)","Azure Information Protection"],"answer":[1],"explanations":["Azure Storage Accounts store data (blobs, files, tables, queues) and encrypt it at rest. But storing secrets in a storage account is a security anti-pattern \u2014 there's no secret management, access auditing, or key lifecycle management built in.","This option is correct. Azure Key Vault is a managed service for securely storing and managing secrets (API keys, connection strings), keys (encryption keys), and certificates (SSL/TLS). Applications retrieve secrets via REST API/SDK. Access is controlled through RBAC and vault access policies. All access is logged in Azure Monitor for auditing. This is Microsoft's recommended approach for secret management.","Azure AD (Entra ID) is an identity and access management service (authentication, SSO, MFA). It manages identities, not secrets. While Managed Identities in Entra ID can authenticate to Key Vault, Entra ID itself doesn't store application secrets.","Azure Information Protection (now part of Microsoft Purview) classifies and protects documents and emails with labels. It's about data classification, not secret storage."],"tip":"Azure Key Vault = secrets, keys, and certificates management. If the question mentions storing API keys, connection strings, passwords, or certificates securely \u2014 Key Vault. It's also the service for customer-managed encryption keys (CMK) used by other Azure services."},{"id":"AZ900-E01-047","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company's Azure environment has grown to 200+ resources across 5 subscriptions\n- The IT manager suspects many virtual machines are over-provisioned (too much CPU and RAM for their actual usage)\n- Network security groups may have overly permissive rules\n- Some resources may not be using the latest security configurations\n\nQuestion:\nWhich Azure service provides a unified security posture assessment and score across all your Azure resources?","choices":["Azure Advisor","Microsoft Defender for Cloud","Azure Monitor","Azure Policy"],"answer":[1],"explanations":["Azure Advisor provides recommendations across five pillars (cost, security, reliability, performance, operational excellence). While it includes some security recommendations, it doesn't provide the comprehensive security posture assessment, Secure Score, or threat protection that the question implies.","This option is correct. Microsoft Defender for Cloud (formerly Azure Security Center) provides a unified security posture management solution. It assesses all your Azure resources, generates a Secure Score (0-100%), identifies security misconfigurations (over-permissive NSGs, missing updates, etc.), and provides prioritised remediation recommendations. The free tier (CSPM) covers posture assessment; the paid tier adds threat protection.","Azure Monitor collects performance telemetry (metrics, logs). It monitors health and performance, not security posture. It can alert on unusual activity, but doesn't assess security configurations or provide a security score.","Azure Policy enforces and audits compliance with organisational rules. It can check if resources meet specific standards, but it's a policy enforcement tool, not a comprehensive security posture assessment service with a unified score."],"tip":"Microsoft Defender for Cloud = security posture + Secure Score + threat protection. Azure Advisor = general best-practice recommendations (including some security). Azure Policy = enforce compliance rules. If the question mentions 'security posture', 'Secure Score', or 'security assessment across all resources' \u2014 Defender for Cloud."},{"id":"AZ900-E01-048","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company needs to deploy a web application that will be accessed by users in Europe and North America\n- The application backend is a REST API\n- You want automatic SSL termination, URL-based routing, and global load balancing with built-in DDoS protection\n- The solution should direct users to the nearest backend for lowest latency\n\nQuestion:\nWhich Azure service should you use?","choices":["Azure Load Balancer","Azure Application Gateway","Azure Front Door","Azure Traffic Manager"],"answer":[2],"explanations":["Azure Load Balancer is Layer 4 (TCP/UDP), regional only, no SSL termination, no URL-based routing. It fails every requirement in the question.","Application Gateway provides Layer 7, SSL termination, and URL-based routing \u2014 but it's a REGIONAL service. It can't provide global load balancing across Europe and North America or route users to the nearest backend globally.","This option is correct. Azure Front Door is a global Layer-7 load balancer that provides: SSL termination, URL-based routing, global load balancing across regions, built-in DDoS protection, and automatic routing to the nearest healthy backend (anycast). It's designed exactly for globally distributed web applications with multi-region backends.","Traffic Manager provides global DNS-based routing, but it's Layer 4 (DNS only). It doesn't provide SSL termination, URL-based routing, or Layer-7 features. It routes at the DNS level, not the HTTP level."],"tip":"Azure Front Door = global Layer-7 load balancing + WAF + CDN + SSL + URL routing. Application Gateway = regional Layer-7 + WAF + SSL + URL routing. Traffic Manager = global DNS-based routing (no Layer-7 features). If the question says 'global' + 'Layer 7 features' (SSL, URL routing) \u2014 Front Door."},{"id":"AZ900-E01-049","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A company currently uses Microsoft Exchange Server on-premises for email\n- They want to move to a cloud-based email solution\n- The IT team should NOT need to manage any email servers, operating systems, or email software updates\n- Users should simply access their email through Outlook and a web browser\n\nQuestion:\nWhich cloud service model does Microsoft 365 Exchange Online represent?","choices":["Infrastructure as a Service (IaaS)","Platform as a Service (PaaS)","Software as a Service (SaaS)","Function as a Service (FaaS)"],"answer":[2],"explanations":["IaaS would mean Microsoft provides the VM and you install and manage Exchange Server yourself. That's essentially what running Exchange on an Azure VM would be \u2014 not the managed experience described.","PaaS provides a platform for building applications. Exchange Online is a finished product, not a platform for building email systems. PaaS would be like Azure App Service where you deploy your own code.","This option is correct. Microsoft 365 Exchange Online is a complete, ready-to-use email service. Microsoft manages everything: servers, operating systems, email software, updates, security patches, and scaling. Users just consume the service \u2014 access email through Outlook or a browser. This is the textbook definition of SaaS.","Function as a Service (FaaS) is serverless computing for running small pieces of code in response to events (like Azure Functions). Email is a complete application, not a function triggered by events."],"tip":"Microsoft 365 (Exchange Online, SharePoint Online, Teams) = SaaS. Azure App Service / Azure SQL Database = PaaS. Azure Virtual Machines = IaaS. Azure Functions = FaaS/Serverless. The exam frequently asks you to classify specific Microsoft services into service models."},{"id":"AZ900-E01-050","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company has adopted the Microsoft Cloud Adoption Framework for Azure\n- The CTO wants to understand Azure's compliance certifications before storing healthcare data\n- They need to verify that Azure meets HIPAA, ISO 27001, and SOC 2 requirements\n- They want access to independent audit reports and compliance documentation\n\nQuestion:\nWhere should the CTO access Azure's compliance certifications and audit reports?","choices":["Azure Advisor","Microsoft Service Trust Portal","Azure Cost Management","Azure Active Directory admin centre"],"answer":[1],"explanations":["Azure Advisor provides operational recommendations (cost, security, reliability, performance). It doesn't host compliance certifications or audit reports.","This option is correct. The Microsoft Service Trust Portal (servicetrust.microsoft.com) is the centralised location for accessing Microsoft's compliance documentation, independent audit reports, penetration test results, and compliance guides. It covers certifications like ISO 27001, SOC 1/2/3, HIPAA, FedRAMP, GDPR, and more. This is where auditors and compliance teams go to verify Microsoft's compliance posture.","Azure Cost Management is for tracking and optimising Azure spending. It has nothing to do with compliance certifications.","Azure AD admin centre manages identities, authentication, and access. It doesn't host compliance audit reports or certification documentation."],"tip":"Service Trust Portal = compliance documentation, audit reports, certifications (ISO, SOC, HIPAA, etc.). Microsoft Compliance Manager = assess YOUR organisation's compliance posture. Defender for Cloud = security posture of your deployed resources. Know which tool addresses which aspect of compliance."}]},{"set":2,"title":"Practice Exam 2","questions":[{"id":"AZ900-E02-001","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A retail company runs an online store on-premises\n- During normal operations, the store handles 1,000 concurrent users\n- The company wants to be able to handle up to 50,000 concurrent users during flash sales without purchasing permanent hardware\n- After the sale ends, they want to release the extra capacity\n\nQuestion:\nWhich cloud computing benefit PRIMARILY enables this capability?","choices":["Predictability","Economies of scale","Elasticity","Security"],"answer":[2],"explanations":["Predictability in cloud computing refers to the ability to forecast costs and performance. While helpful for planning, it doesn't describe the ability to dynamically acquire and release compute capacity.","Economies of scale means cloud providers can offer lower per-unit costs because they operate at massive scale. This reduces costs but doesn't describe the dynamic scaling capability the question asks about.","This option is correct. Elasticity is the ability to dynamically acquire resources when demand increases (scale out to 50,000 users) and release them when demand decreases (back to 1,000 users). The company scales up for flash sales and scales back down afterward \u2014 paying only for what they use during the peak. This is the defining advantage of cloud over on-premises for variable workloads.","Security in the cloud is a shared responsibility benefit, but it doesn't describe the ability to dynamically scale resources up and down based on demand."],"tip":"Elasticity = dynamic, often automatic, scaling to match demand. The key differentiator: you don't pre-purchase capacity for peak demand. If the question describes temporary spikes with release of resources afterward \u2014 elasticity."},{"id":"AZ900-E02-002","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- Your company uses Azure Virtual Machines (IaaS)\n- A critical security vulnerability is discovered in the Windows Server operating system\n- The vulnerability affects all Windows VMs in your Azure environment\n\nQuestion:\nAccording to the shared responsibility model, who is responsible for patching this OS vulnerability on the Azure VMs?","choices":["Microsoft, because the VMs run on Azure infrastructure","The customer, because guest OS management is their responsibility in IaaS","Shared between Microsoft and the customer","The operating system vendor (Microsoft Windows), not Azure"],"answer":[1],"explanations":["Microsoft manages the physical infrastructure and the host operating system (the hypervisor layer). However, the GUEST operating system inside an IaaS VM is entirely the customer's responsibility. Microsoft does not patch your VMs for you.","This option is correct. In the IaaS model, the customer is responsible for the guest OS, including applying security patches, configuring the firewall, and managing updates. Azure provides tools to help (Azure Update Management, Microsoft Defender for Cloud recommendations), but the responsibility to act lies with the customer.","Guest OS patching in IaaS is NOT shared \u2014 it falls entirely on the customer. Shared responsibilities exist (like network controls), but the OS inside a VM is the customer's domain.","While Microsoft produces Windows Server patches, the responsibility to apply those patches to YOUR Azure VMs lies with you as the customer. The vendor provides the patch; the customer deploys it."],"tip":"IaaS shared responsibility: Microsoft manages BELOW the hypervisor (physical security, network, host OS). Customer manages ABOVE it (guest OS, apps, data, patching). PaaS shifts OS responsibility to Microsoft. SaaS shifts nearly everything to Microsoft."},{"id":"AZ900-E02-003","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A startup is building a mobile application\n- They initially need a small database and one application server\n- Over the next two years, they expect to grow from 1,000 users to 1 million users\n- They want their infrastructure to grow with demand without needing to re-architect the application\n\nQuestion:\nWhich cloud benefit ensures the startup can grow their infrastructure capacity as their user base expands?","choices":["Scalability","Disaster recovery","Compliance","Cost management"],"answer":[0],"explanations":["This option is correct. Scalability is the ability of a system to handle increased load by adding resources. The startup can start small and scale their database and compute as they grow from 1,000 to 1 million users. Azure services like Azure SQL Database and App Service can scale their performance tiers upward as demand grows. Scalability in the cloud means growth doesn't require re-architecture.","Disaster recovery ensures systems can recover from failures. It doesn't address the ability to grow capacity with an expanding user base.","Compliance refers to meeting regulatory and industry standards. Important, but not related to infrastructure growth capacity.","Cost management helps optimise spending, but it doesn't describe the ability to increase infrastructure capacity. You could manage costs perfectly and still not have the scalability needed."],"tip":"Scalability = ability to handle growth (long-term capacity increase). Elasticity = ability to handle fluctuating demand (dynamic, often temporary). A startup growing from 1K to 1M users = scalability. A retailer handling Black Friday spikes = elasticity. The exam distinguishes these."},{"id":"AZ900-E02-004","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A government agency manages classified data that must never leave government-controlled facilities\n- They want cloud benefits (self-service provisioning, resource pooling, rapid elasticity)\n- The infrastructure must be exclusively used by government organisations\n- The hardware must be located inside a government-secured building\n\nQuestion:\nWhich cloud deployment model meets these requirements?","choices":["Public cloud","Private cloud","Hybrid cloud","Multi-cloud"],"answer":[1],"explanations":["Public cloud resources (Azure, AWS, GCP) are shared across many tenants and located in the provider's data centres. The government cannot guarantee data stays in government-controlled facilities or that infrastructure is exclusively theirs.","This option is correct. A private cloud is dedicated to a single organisation (or group of related organisations) and can be hosted on-premises in a government-secured building. It still delivers cloud benefits like self-service provisioning, elasticity, and resource pooling \u2014 it's just not shared with the public. Azure Stack HCI or Azure Stack Hub can bring Azure services into a private cloud environment.","Hybrid cloud combines private and public cloud. The question doesn't mention any need for public cloud services \u2014 everything must stay in government facilities.","Multi-cloud uses multiple public cloud providers. This is the opposite of what the agency needs \u2014 they want private, government-exclusive infrastructure."],"tip":"Private cloud = dedicated infrastructure for one organisation (on-premises or hosted). Still has cloud characteristics (elasticity, self-service, pooling). If the question mentions exclusive use, data that can't leave specific facilities, or government/classified requirements \u2014 private cloud."},{"id":"AZ900-E02-005","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A manufacturing company runs production control systems on-premises 24/7\n- They are planning to move their public-facing website and CRM to Azure\n- The production control systems must remain on-premises due to latency requirements (sub-1ms) with factory floor equipment\n- Data from the factory systems needs to be analysed using Azure Machine Learning\n\nQuestion:\nWhich cloud model should the manufacturing company adopt?","choices":["Public cloud only","Private cloud only","Hybrid cloud","Community cloud"],"answer":[2],"explanations":["Moving everything to public cloud is not possible \u2014 the production control systems require sub-1ms latency to factory equipment, which can only be achieved on-premises. Public cloud introduces network latency that exceeds this requirement.","Private cloud only would keep the production systems running fine, but the company explicitly wants to move the website and CRM to Azure (public cloud) and use Azure ML for data analysis. Private cloud alone doesn't provide this.","This option is correct. Hybrid cloud is the perfect fit: production control systems stay on-premises (private) for low-latency factory floor communication, while the website, CRM, and ML workloads run in Azure (public). Data flows between the environments for analysis. This is a textbook hybrid cloud scenario \u2014 combining the best of both worlds.","Community cloud is infrastructure shared among organisations with common concerns (e.g., multiple hospitals sharing a healthcare cloud). This doesn't apply to a single manufacturing company's requirements."],"tip":"Hybrid cloud scenarios nearly always involve: (1) a workload that MUST stay on-premises (latency, regulation, legacy), PLUS (2) a need for public cloud services (analytics, web hosting, ML). Both requirements in one question = hybrid cloud."},{"id":"AZ900-E02-006","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company needs a relational database in Azure for a new application\n- The application requires PostgreSQL compatibility\n- The database team wants a fully managed service \u2014 no VM management, automatic backups, and built-in high availability\n- They need the ability to scale compute and storage independently\n\nQuestion:\nWhich Azure service should you use?","choices":["Azure SQL Database","Azure Database for PostgreSQL (Flexible Server)","PostgreSQL installed on an Azure Virtual Machine","Azure Cosmos DB with PostgreSQL API"],"answer":[1],"explanations":["Azure SQL Database is a managed SQL Server-compatible database. It doesn't support PostgreSQL syntax, extensions, or drivers. The application requires PostgreSQL compatibility specifically.","This option is correct. Azure Database for PostgreSQL (Flexible Server) is a fully managed PostgreSQL service. It handles patching, backups (automatic with point-in-time restore), and high availability (zone-redundant or same-zone). Compute and storage can be scaled independently, and it supports PostgreSQL extensions. Flexible Server is the recommended deployment option (replacing Single Server which is being deprecated).","PostgreSQL on a VM gives full compatibility, but the team explicitly wants no VM management. Running PostgreSQL on a VM means managing the OS, patches, backups, and HA yourself \u2014 this is IaaS, not a managed service.","Azure Cosmos DB with PostgreSQL API (formerly Citus) is designed for distributed, horizontally scaled PostgreSQL. It's overkill for a standard relational database need and follows a different pricing and architecture model. It's meant for multi-node distributed workloads, not a standard managed PostgreSQL database."],"tip":"Azure Database for PostgreSQL Flexible Server = managed PostgreSQL. Azure SQL Database = managed SQL Server. Azure Database for MySQL Flexible Server = managed MySQL. If the question specifies a particular database engine, use the corresponding Azure managed service. Flexible Server is always the recommended deployment option."},{"id":"AZ900-E02-007","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company has 20 Azure subscriptions across different departments\n- All subscriptions need to follow the same naming convention for resources\n- Resources that don't follow the naming convention should be flagged as non-compliant but NOT blocked\n- The compliance team needs a dashboard showing the percentage of compliant resources\n\nQuestion:\nWhat should you configure?","choices":["Azure Policy with an Audit effect","Azure Policy with a Deny effect","Azure RBAC with custom roles","Azure Tags with a naming convention"],"answer":[0],"explanations":["This option is correct. Azure Policy with an Audit effect evaluates resources against your naming convention rules and flags non-compliant resources without blocking their creation. The Azure Policy compliance dashboard shows the percentage of compliant vs non-compliant resources across all subscriptions. This is exactly what the compliance team needs \u2014 visibility without enforcement.","Azure Policy with a Deny effect would BLOCK the creation of non-compliant resources. The question specifically says resources should be 'flagged, NOT blocked.' Deny is too aggressive for this requirement.","RBAC controls who can perform actions (permissions), not naming conventions. You can't use RBAC to evaluate whether a resource name matches a pattern.","Tags are metadata on resources and don't enforce or evaluate naming conventions. Tags are key-value pairs added to resources \u2014 they don't control what the resource itself is named."],"tip":"Azure Policy effects: Deny = block non-compliant creation. Audit = flag non-compliant but allow creation. DeployIfNotExists = auto-remediate. AuditIfNotExists = audit missing related resources. If the question says 'flag but don't block' \u2014 Audit effect. If it says 'prevent' \u2014 Deny effect."},{"id":"AZ900-E02-008","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company wants to deploy pre-built solutions from third-party vendors on Azure\n- They need a certified virtual appliance from a firewall vendor\n- The solution should be deployable directly from within the Azure portal\n- All solutions must be certified by Microsoft to run on Azure\n\nQuestion:\nWhere should you find and deploy these pre-built solutions?","choices":["Azure Resource Manager template gallery","Azure Marketplace","GitHub","Azure Quickstart Templates"],"answer":[1],"explanations":["ARM template gallery is not a specific Azure service. While ARM templates exist in various repositories, they're not a curated marketplace for certified third-party solutions.","This option is correct. Azure Marketplace is a curated online store of thousands of applications and services certified to run on Azure. Third-party vendors publish virtual appliances, SaaS applications, and solution templates. Everything in the Marketplace is tested and certified by Microsoft. You can deploy solutions directly from the Azure portal with a few clicks.","GitHub hosts open-source code and templates, but solutions there aren't necessarily certified for Azure. There's no guarantee of compatibility or Microsoft certification.","Azure Quickstart Templates are Microsoft-provided ARM/Bicep templates for common architectures. They're not a marketplace for third-party vendor solutions like firewall appliances."],"tip":"Azure Marketplace = certified third-party and Microsoft solutions, deployable from the portal. If the question mentions third-party solutions, certified virtual appliances, or 'deploy from the portal' \u2014 Marketplace. It's also where you find BYOL (Bring Your Own License) options."},{"id":"AZ900-E02-009","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company runs a VM Scale Set behind an Azure Load Balancer\n- Currently 4 VM instances handle the load\n- CPU utilisation on all instances drops to 5% every night between 11 PM and 6 AM\n- The company wants to automatically reduce to 2 instances at night and scale back to 4 during the day\n\nQuestion:\nWhat should you configure on the VM Scale Set?","choices":["Scheduled autoscale rules","Manual scaling to 2 instances each night","Azure Advisor recommendations","Availability Zone distribution"],"answer":[0],"explanations":["This option is correct. VM Scale Sets support scheduled autoscale rules that adjust the instance count based on a recurring schedule. You create a rule to scale in to 2 instances at 11 PM and another rule to scale out to 4 instances at 6 AM. This is automated, repeatable, and requires no manual intervention. You can also combine schedule-based rules with metric-based rules (CPU threshold) for maximum flexibility.","Manually scaling to 2 instances every night requires someone to perform the action at 11 PM and again at 6 AM. This defeats the purpose of automation and introduces human error \u2014 someone could forget or be unavailable.","Azure Advisor might recommend rightsizing VMs, but it doesn't configure autoscale rules or manage VM Scale Set instance counts based on time schedules.","Availability Zone distribution determines where instances are placed for resilience. It has nothing to do with adjusting the number of instances based on time of day."],"tip":"VM Scale Set autoscale: metric-based (react to CPU, memory, queue length) or schedule-based (time-of-day patterns). If the question describes a predictable time-based pattern \u2014 scheduled autoscale. If it describes unpredictable demand changes \u2014 metric-based autoscale."},{"id":"AZ900-E02-010","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company stores data in Azure and needs to understand the redundancy options\n- They want data replicated across three copies within a single data centre\n- If the data centre fails, data loss is acceptable because they have backups elsewhere\n- They want the lowest cost storage redundancy option\n\nQuestion:\nWhich storage redundancy option should you select?","choices":["Locally Redundant Storage (LRS)","Zone-Redundant Storage (ZRS)","Geo-Redundant Storage (GRS)","Read-Access Geo-Redundant Storage (RA-GRS)"],"answer":[0],"explanations":["This option is correct. LRS maintains 3 copies of your data within a single data centre (storage scale unit) in one region. It's the lowest-cost redundancy option. It protects against drive and rack failures but NOT against a data centre outage \u2014 which the question says is acceptable since they have backups elsewhere.","ZRS replicates data across 3 availability zones within one region. More resilient than LRS (survives a data centre failure) but more expensive. The question says data centre failure is acceptable, so the extra cost of ZRS is unnecessary.","GRS replicates data to a secondary region hundreds of miles away (LRS in primary + LRS in secondary). This provides regional disaster recovery but is significantly more expensive. Not needed when data centre loss is acceptable.","RA-GRS is like GRS but additionally allows read access from the secondary region. It's the most expensive redundancy option and far exceeds the stated requirements."],"tip":"Storage redundancy cost order (lowest to highest): LRS < ZRS < GRS < RA-GRS < GZRS < RA-GZRS. LRS = 3 copies, 1 data centre. ZRS = 3 copies, 3 zones. GRS = 6 copies, 2 regions. Match the redundancy to the data criticality."},{"id":"AZ900-E02-011","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A multinational company operates in 30 countries\n- Each country has different data protection regulations\n- The company needs to deploy applications in Azure regions closest to their users in each country\n- They also need to comply with local data residency laws that require data to be stored within specific geographic boundaries\n\nQuestion:\nWhich Azure concept helps the company deploy resources near users while respecting data residency requirements?","choices":["Azure Availability Zones","Azure Regions and Geographies","Azure Resource Groups","Azure Subscriptions"],"answer":[1],"explanations":["Availability Zones are separate data centres within a SINGLE region. They provide high availability, not geographic distribution across countries or data residency compliance.","This option is correct. Azure Regions are physical locations around the world (60+ regions in 30+ countries). Azure organises regions into Geographies \u2014 geographic boundaries that respect data residency and compliance requirements (e.g., the UK geography contains UK South and UK West). By selecting regions within the appropriate geography, the company can serve local users with low latency while keeping data within the required geographic boundaries.","Resource Groups are logical containers for managing resources. They don't determine where resources are geographically deployed \u2014 that's determined by the region you select during deployment.","Subscriptions are billing and access management boundaries. They don't control geographic deployment of resources."],"tip":"Azure Geography = compliance boundary (data residency). Azure Region = physical deployment location. Azure Availability Zone = data centre within a region. The hierarchy is Geography \u2192 Region \u2192 Availability Zone. Data residency questions point to Geographies/Regions."},{"id":"AZ900-E02-012","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A company is adopting cloud services and wants to understand the cost implications\n- They currently spend \u00a3500,000 per year on data centre operations including:\n  - Hardware depreciation: \u00a3200,000\n  - Electricity and cooling: \u00a3120,000\n  - Data centre staff: \u00a3100,000\n  - Maintenance contracts: \u00a380,000\n- With Azure, they would pay approximately \u00a3280,000 per year for equivalent services\n\nQuestion:\nWhat is the primary financial benefit of moving to the cloud in this scenario?","choices":["Eliminating all IT-related costs","Converting Capital Expenditure (CapEx) to Operating Expenditure (OpEx) and reducing total cost","Guaranteeing costs will never increase","Avoiding the need for any IT staff"],"answer":[1],"explanations":["Cloud computing doesn't eliminate ALL IT costs. The company still pays \u00a3280,000/year for Azure services. You still need IT staff to manage cloud resources, security, and applications. It reduces and shifts costs, not eliminates them.","This option is correct. The move from on-premises to cloud converts large upfront capital expenditures (hardware purchases, data centre construction) to predictable monthly operational expenditure (Azure subscriptions). Additionally, the total cost drops from \u00a3500,000 to \u00a3280,000 \u2014 a 44% reduction. The company eliminates hardware depreciation, reduces electricity/cooling costs, and shifts from maintenance contracts to a managed service model.","Cloud costs can and do increase \u2014 with more usage comes more spending. Azure pricing changes over time, and there's no guarantee costs remain static. The benefit is flexibility and potential reduction, not a guarantee of fixed costs.","Cloud adoption doesn't eliminate the need for IT staff. You still need people to manage cloud architecture, security, applications, and operations. The staff focus shifts from managing hardware to managing cloud services."],"tip":"The CapEx to OpEx shift is one of the most tested financial concepts on AZ-900. CapEx = buy it upfront, depreciate over years. OpEx = pay monthly for what you use. Cloud converts CapEx to OpEx while often reducing the total amount spent."},{"id":"AZ900-E02-013","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A software development company builds applications for multiple clients\n- Each client application has different scaling requirements\n- Some applications have predictable daily patterns, others have unpredictable traffic spikes\n- The company wants to pay only for the resources each application actually consumes\n\nQuestion:\nWhich cloud pricing model best suits this company's diverse workload requirements?","choices":["Reserved capacity pricing","Consumption-based (pay-as-you-go) pricing","Fixed monthly subscription","Upfront annual payment"],"answer":[1],"explanations":["Reserved capacity provides a discount for committing to 1-3 years of specific resource usage. It's optimal for steady, predictable workloads, but the company has diverse applications with unpredictable patterns \u2014 reserved pricing would risk overpaying for underutilised reservations.","This option is correct. Consumption-based pricing means you pay only for resources actually used. Each client application scales independently \u2014 when demand is low, costs are low; when demand spikes, you pay more but get the capacity needed. This model handles both predictable and unpredictable workloads efficiently without upfront commitments.","A fixed monthly subscription charges the same regardless of usage. Applications with low usage overpay, while applications with high usage may be capped. This doesn't suit diverse, variable workloads.","Upfront annual payment is another form of committed spend. Like reserved pricing, it assumes you can predict your usage \u2014 which the company can't across diverse client applications."],"tip":"Consumption-based pricing is the default cloud model and the answer for 'pay only for what you use' questions. Reserved pricing = committed, predictable workloads (discount for commitment). Pay-as-you-go = variable, unpredictable workloads (flexibility over discount)."},{"id":"AZ900-E02-014","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company has a web application running on Azure VMs\n- The application needs a message queue to decouple the frontend (which accepts orders) from the backend (which processes orders)\n- If the backend goes down, orders must not be lost \u2014 they should remain in the queue until the backend recovers\n- The solution must be serverless with no infrastructure to manage\n\nQuestion:\nWhich Azure service should you use?","choices":["Azure Event Hubs","Azure Queue Storage","Azure Service Bus Queue","Azure Event Grid"],"answer":[2],"explanations":["Azure Event Hubs is designed for massive-scale event streaming (millions of events per second) \u2014 think telemetry ingestion and analytics pipelines. It's not designed for transactional message queuing with delivery guarantees for individual orders.","Azure Queue Storage provides basic message queuing and is serverless. However, it lacks advanced features like guaranteed FIFO ordering, dead-letter queues, duplicate detection, and transactions that enterprise order processing typically requires.","This option is correct. Azure Service Bus Queue is an enterprise-grade message broker that provides guaranteed delivery, FIFO ordering, duplicate detection, dead-letter handling, and transactions. Messages persist in the queue until the consumer processes and acknowledges them \u2014 if the backend is down, orders wait safely. It's fully managed (serverless) with no infrastructure to maintain.","Azure Event Grid is an event routing service that reacts to events from Azure services or custom sources. It's designed for reactive event-driven architectures (pub/sub), not for persistent message queuing where messages must be stored until consumed."],"tip":"Service Bus = enterprise messaging (queues with guaranteed delivery, ordered, transactional). Queue Storage = simple, cheap queuing (basic, no ordering guarantee). Event Hubs = high-throughput event streaming. Event Grid = event-driven reactive routing. For 'orders must not be lost' \u2014 Service Bus."},{"id":"AZ900-E02-015","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company has an Azure subscription with resources across multiple resource groups\n- A new compliance requirement mandates that all resources must be tagged with a CostCenter value\n- Existing resources that are missing the tag should be automatically remediated\n- New resources created without the tag should be blocked\n\nQuestion:\nWhat combination of Azure Policy effects should you use?","choices":["Audit for existing resources and Deny for new resources","DeployIfNotExists for existing resources and Deny for new resources","Append for existing resources and Deny for new resources","Modify for existing resources and Deny for new resources"],"answer":[3],"explanations":["Audit only flags non-compliant existing resources \u2014 it doesn't automatically remediate them by adding the missing tag. The question requires automatic remediation.","DeployIfNotExists is designed for deploying a RELATED resource (e.g., deploy a diagnostic setting on a VM). It's not the right effect for adding a tag to the existing resource itself.","Append can add fields to a resource during creation or update, but it's being superseded by Modify for tag management. Append also has limitations \u2014 it can add but has difficulty modifying existing properties. Microsoft recommends Modify for tag operations.","This option is correct. Modify effect can automatically add, update, or remove tags on existing resources through a remediation task \u2014 satisfying the 'automatically remediated' requirement. Deny effect blocks the creation of new resources that don't include the CostCenter tag. This combination ensures both existing compliance (Modify + remediation) and ongoing compliance (Deny)."],"tip":"Azure Policy effects for tags: Modify = add/change/remove tags (supports remediation tasks for existing resources). Deny = block creation of non-compliant resources. Use Modify + Deny together when you need to fix existing resources AND prevent new non-compliant ones."},{"id":"AZ900-E02-016","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- A data analytics company needs to run Apache Spark and Hadoop workloads on Azure\n- They process terabytes of log data daily from IoT sensors\n- The team needs collaborative notebooks for data scientists\n- They want a unified analytics platform that handles data engineering and data science workloads\n\nQuestion:\nWhich Azure service should you use?","choices":["Azure HDInsight","Azure Databricks","Azure Data Factory","Azure Stream Analytics"],"answer":[1],"explanations":["Azure HDInsight is a managed Hadoop/Spark service that can run these workloads, but it lacks the collaborative notebook experience and unified analytics platform that the question emphasises. It's more of a traditional big data cluster approach.","This option is correct. Azure Databricks is a unified analytics platform built on Apache Spark. It provides collaborative notebooks for data scientists and data engineers, handles both data engineering (ETL/ELT pipelines) and data science (ML training, experimentation) workloads, and processes massive datasets. It's the premium choice for organisations that need a collaborative, unified analytics environment.","Azure Data Factory is a data integration and orchestration service (ETL/ELT pipelines). It moves and transforms data but doesn't provide a Spark processing engine or collaborative notebooks for data scientists.","Azure Stream Analytics is for real-time stream processing of data as it arrives. While the IoT sensors generate streaming data, the question describes batch processing of daily logs, not real-time stream processing. Stream Analytics also doesn't provide collaborative notebooks."],"tip":"Databricks = unified analytics platform (Spark + notebooks + collaboration). HDInsight = managed Hadoop/Spark clusters (traditional big data). Data Factory = data integration/orchestration (move and transform). Synapse Analytics = data warehousing + analytics. If the question mentions 'collaborative notebooks' + 'data science' + 'Spark' \u2014 Databricks."},{"id":"AZ900-E02-017","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company uses Azure and needs to protect against Distributed Denial of Service (DDoS) attacks\n- They host public-facing web applications behind Azure Application Gateway\n- They want DDoS mitigation that is specifically tuned to their Azure resource traffic patterns\n- They also need DDoS attack analytics, alerts, and access to a DDoS Rapid Response team\n\nQuestion:\nWhich Azure DDoS Protection tier should they select?","choices":["DDoS Infrastructure Protection (Basic/default)","DDoS Network Protection (Standard)","Azure Firewall only","Network Security Groups only"],"answer":[1],"explanations":["DDoS Infrastructure Protection (formerly Basic) is enabled for free on all Azure resources. It provides basic protection against common network-layer attacks, but it is NOT tuned to your specific traffic patterns, doesn't provide attack analytics or alerts, and doesn't include access to a DDoS Rapid Response (DRR) team.","This option is correct. DDoS Network Protection (formerly Standard) provides advanced DDoS mitigation tuned to your Azure Virtual Network's specific traffic patterns using adaptive machine learning. It includes real-time attack metrics and diagnostic logs, DDoS attack analytics, configurable alerts, and access to the DDoS Rapid Response (DRR) team during active attacks. It also includes a cost protection guarantee.","Azure Firewall is a network security service that filters traffic based on rules (FQDN, threat intelligence). It can complement DDoS protection but doesn't provide DDoS-specific mitigation, analytics, or the DRR team.","NSGs filter traffic based on IP/port/protocol rules. They don't provide DDoS mitigation, adaptive learning, attack analytics, or rapid response services."],"tip":"DDoS Infrastructure Protection = free, basic, automatic for all Azure resources. DDoS Network Protection = paid, advanced, tuned to your traffic, includes analytics/alerts/DRR team. If the question mentions 'tuned to traffic patterns', 'attack analytics', or 'rapid response team' \u2014 Network Protection (Standard)."},{"id":"AZ900-E02-018","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- A company wants to estimate the monthly cost of running the following Azure resources:\n  - 4 x D4s_v3 virtual machines running Windows Server in UK South\n  - 1 x Azure SQL Database (Standard tier, S3)\n  - 500 GB of Azure Blob Storage (Hot tier)\n  - 1 x Azure Application Gateway (WAF v2)\n\nQuestion:\nWhich tool should you use to estimate these costs BEFORE deployment?","choices":["Azure Cost Management + Billing","Azure Pricing Calculator","Azure TCO Calculator","Azure Monitor"],"answer":[1],"explanations":["Cost Management + Billing analyses spending on resources that are ALREADY deployed and running. It can't estimate costs for resources you haven't created yet.","This option is correct. The Azure Pricing Calculator lets you select specific Azure services, configure their specifications (VM size, tier, region, quantity), and calculate an estimated monthly cost BEFORE you deploy anything. You can build a complete estimate with multiple services, adjust quantities, and compare pricing options. It's the pre-deployment cost estimation tool.","The TCO Calculator compares on-premises costs versus Azure costs for migration planning. It doesn't estimate costs for specific Azure resources \u2014 it takes your on-premises workload description and models the comparative cost.","Azure Monitor collects performance metrics and logs from running resources. It has nothing to do with cost estimation."],"tip":"Pricing Calculator = estimate FUTURE Azure costs (before deployment). Cost Management = analyse CURRENT Azure spending (after deployment). TCO Calculator = compare on-premises vs Azure costs (migration planning). Three different tools, three different purposes."},{"id":"AZ900-E02-019","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company needs to deploy identical Azure environments for Development, Staging, and Production\n- Each environment includes: 2 VMs, a VNet with 3 subnets, an NSG, and a storage account\n- The infrastructure team wants to use Infrastructure as Code (IaC)\n- The code should be human-readable, concise, and natively supported by Azure\n- They prefer a declarative domain-specific language over JSON\n\nQuestion:\nWhich IaC tool should the infrastructure team use?","choices":["Azure Resource Manager (ARM) JSON templates","Bicep","Azure CLI scripts","Terraform"],"answer":[1],"explanations":["ARM JSON templates are declarative IaC natively supported by Azure, but they use JSON which is verbose, hard to read, and painful to write by hand. The team specifically wants something more human-readable and concise than JSON.","This option is correct. Bicep is Azure's domain-specific language for deploying Azure resources declaratively. It compiles to ARM JSON templates but is dramatically more readable and concise. It's natively supported by Azure (first-party), declarative, and designed to be human-friendly. Bicep files are about 50% shorter than equivalent ARM JSON templates.","Azure CLI scripts are imperative (step-by-step commands), not declarative. The question specifically asks for a declarative approach where you define the desired state.","Terraform is a popular multi-cloud IaC tool that uses HCL (declarative). However, it's a third-party tool from HashiCorp, not natively supported by Azure. The question asks for a solution natively supported by Azure \u2014 that's Bicep."],"tip":"Bicep = Azure-native declarative IaC (human-readable, compiles to ARM). ARM templates = Azure-native declarative IaC (JSON, verbose). Terraform = multi-cloud declarative IaC (third-party). If the question says 'Azure-native' + 'human-readable' + 'declarative' \u2014 Bicep."},{"id":"AZ900-E02-020","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company wants to save money on Azure Virtual Machines used for production workloads\n- The workloads run 24/7 and will continue for at least the next 3 years\n- The VM sizes and configurations are stable and unlikely to change\n- Downtime is not acceptable \u2014 the VMs must be continuously available\n\nQuestion:\nWhich pricing option provides the BEST cost savings for these VMs?","choices":["Pay-as-you-go pricing","Azure Spot Virtual Machines","Azure Reserved Virtual Machine Instances (3-year term)","Dev/Test pricing"],"answer":[2],"explanations":["Pay-as-you-go is the most flexible but most expensive option per hour. For workloads that run 24/7 for 3 years, you'd pay full price for every hour \u2014 no discounts. This is the baseline pricing other options discount from.","Spot VMs offer up to 90% discount but can be evicted at any time when Azure needs the capacity back. The question says downtime is not acceptable \u2014 Spot VMs cannot guarantee availability.","This option is correct. Reserved Instances (RIs) offer up to 72% discount over pay-as-you-go for committing to 1 or 3 years. The 3-year term gives the deepest discount. Since the workloads are stable, run 24/7, and will continue for 3+ years, this is the perfect RI scenario. Reservations don't affect VM availability \u2014 they're a billing construct, not a scheduling one.","Dev/Test pricing provides discounts on specific services for development and testing purposes under Visual Studio subscriptions. It's not available for production workloads and requires specific licensing \u2014 the question describes production workloads."],"tip":"Reserved Instances = best for steady, predictable, long-running workloads (up to 72% saving). Spot VMs = best for interruptible workloads (up to 90% saving but evictable). Pay-as-you-go = best for unpredictable or short-term workloads. Match the pricing model to the workload characteristics."},{"id":"AZ900-E02-021","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company runs a web application on Azure App Service\n- The application uses Azure SQL Database for data storage\n- Currently, the application connects to the database using a connection string with a username and password stored in the app settings\n- The security team says credentials in app settings are a security risk\n\nQuestion:\nWhat is the Microsoft-recommended approach to eliminate stored credentials?","choices":["Store the credentials in Azure Key Vault and reference them from App Service","Use Azure Managed Identity for the App Service to authenticate to Azure SQL Database","Encrypt the connection string in the app settings","Use Azure Active Directory admin credentials in the connection string"],"answer":[1],"explanations":["Storing credentials in Key Vault is better than app settings, but there's still a credential (the Key Vault access token or certificate). It adds a layer of security but doesn't eliminate credentials entirely \u2014 it moves them.","This option is correct. Azure Managed Identity provides an automatically managed identity for the App Service in Azure AD (Entra ID). The App Service authenticates to Azure SQL Database using this identity \u2014 no passwords, no connection strings with credentials, no secrets to manage or rotate. Microsoft calls this 'passwordless authentication' and it's the recommended approach for Azure service-to-service communication.","Encrypting the connection string adds protection at rest, but the application still needs to decrypt it to use it. The credentials still exist \u2014 they're just encrypted. This is security through obscurity, not elimination of credentials.","Using Azure AD admin credentials in a connection string is worse than the current situation. Admin credentials have excessive privileges, and they're still stored as a credential in the connection string."],"tip":"Managed Identity = passwordless, credential-free authentication between Azure services. No secrets to manage, rotate, or leak. If the question asks about eliminating credentials or the most secure way for Azure services to communicate \u2014 Managed Identity."},{"id":"AZ900-E02-022","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company has a globally distributed application\n- The application stores user session data that must be read in under 10 milliseconds\n- An in-memory caching layer is needed to reduce database load\n- The cache must support data structures like strings, hashes, lists, and sets\n\nQuestion:\nWhich Azure service should you use for this caching layer?","choices":["Azure Cosmos DB","Azure Cache for Redis","Azure Blob Storage (Hot tier)","Azure SQL Database (In-Memory OLTP)"],"answer":[1],"explanations":["Cosmos DB provides single-digit millisecond reads and is globally distributed, but it's a full database service, not a caching layer. Using Cosmos DB as a cache is over-engineering \u2014 it's far more expensive and complex than a dedicated cache.","This option is correct. Azure Cache for Redis is a fully managed, in-memory data store based on Redis. It delivers sub-millisecond latency, supports rich data structures (strings, hashes, lists, sets, sorted sets), and is purpose-built for caching. It reduces database load by serving frequently accessed data from memory. Premium/Enterprise tiers support clustering for global distribution.","Blob Storage is object storage for files, not an in-memory cache. Even the Hot tier has significantly higher latency than an in-memory store, and it doesn't support data structures like hashes, lists, or sets.","Azure SQL In-Memory OLTP optimises transaction processing within SQL Database. It's a database engine feature, not an external caching layer. It doesn't support Redis-style data structures."],"tip":"Azure Cache for Redis = in-memory caching (sub-millisecond, data structures, session store, message broker). If the question mentions caching, session data, or reducing database load with an in-memory layer \u2014 Redis Cache."},{"id":"AZ900-E02-023","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company is migrating 200 on-premises servers to Azure\n- Before migrating, they need to:\n  - Discover all servers and their dependencies\n  - Assess which servers are suitable for Azure migration\n  - Estimate the cost of running these servers in Azure\n  - Plan the migration strategy (rehost, refactor, rearchitect)\n\nQuestion:\nWhich Azure service provides these pre-migration capabilities?","choices":["Azure Site Recovery","Azure Migrate","Azure Arc","Azure Database Migration Service"],"answer":[1],"explanations":["Azure Site Recovery replicates workloads to Azure for disaster recovery and can be used during the actual migration (executing the lift-and-shift). But it doesn't provide discovery, assessment, dependency mapping, or cost estimation \u2014 it's the execution tool, not the planning tool.","This option is correct. Azure Migrate is the centralised hub for discovering, assessing, and migrating on-premises workloads to Azure. It provides server discovery with dependency mapping, Azure readiness assessment, cost estimation for running in Azure, and migration strategy recommendations. It supports servers, databases, web apps, and virtual desktop infrastructure.","Azure Arc extends Azure management to non-Azure servers. It's for ongoing management of hybrid environments, not for pre-migration assessment and planning.","Azure Database Migration Service specifically handles database migrations (SQL Server to Azure SQL, PostgreSQL, MySQL, etc.). It doesn't assess or migrate entire servers with their OS and applications."],"tip":"Azure Migrate = discover + assess + migrate (the planning and execution hub). Site Recovery = disaster recovery + actual VM migration execution. Arc = ongoing management of hybrid servers. If the question mentions 'discover', 'assess', or 'plan a migration' \u2014 Azure Migrate."},{"id":"AZ900-E02-024","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A company runs a SaaS application (Salesforce) for their CRM\n- They also use Azure Virtual Machines for a custom internal application\n- A security breach occurs in the Salesforce application due to a vulnerability in the Salesforce platform code\n- A separate security breach occurs on one of the Azure VMs due to an unpatched Windows vulnerability\n\nQuestion:\nAccording to the shared responsibility model, which security breach is the CUSTOMER'S responsibility?","choices":["The Salesforce platform code vulnerability (SaaS)","The unpatched Windows vulnerability on the Azure VM (IaaS)","Both are the customer's responsibility","Neither \u2014 Microsoft and Salesforce are responsible for both"],"answer":[1],"explanations":["In SaaS, the provider (Salesforce) is responsible for the application code and platform. A vulnerability in Salesforce's platform code is Salesforce's responsibility to patch and fix \u2014 the customer has no control over Salesforce's codebase.","This option is correct. In IaaS, the customer is responsible for the guest operating system, including applying Windows patches. An unpatched Windows vulnerability on an Azure VM is the customer's failure to maintain their OS. Azure provides the infrastructure; the customer manages everything above the hypervisor.","The Salesforce platform vulnerability is NOT the customer's responsibility. In SaaS, the provider manages the application and platform. Only the IaaS VM patching falls on the customer.","The Azure VM breach IS the customer's responsibility. While Salesforce owns their platform vulnerability, Microsoft (Azure) does not own the guest OS on IaaS VMs \u2014 the customer does."],"tip":"Shared responsibility changes by service model: SaaS = provider owns almost everything (customer owns data and identity). PaaS = customer owns apps and data. IaaS = customer owns OS, apps, and data. The more control you have, the more responsibility you have."},{"id":"AZ900-E02-025","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company uses Azure Virtual Machines in the UK South region\n- The operations team wants to receive alerts when any VM's CPU usage exceeds 90% for more than 5 minutes\n- They also want to collect and query log data from all VMs in a central location\n- They need visualisation dashboards showing VM performance trends\n\nQuestion:\nWhich Azure service provides these monitoring capabilities?","choices":["Azure Service Health","Azure Advisor","Azure Monitor","Microsoft Defender for Cloud"],"answer":[2],"explanations":["Azure Service Health monitors the health of Azure PLATFORM services (outages, maintenance). It doesn't monitor your individual VM metrics like CPU usage or collect VM logs.","Azure Advisor provides best-practice recommendations. While it might notice an underutilised VM, it doesn't provide real-time CPU monitoring, alerting, log collection, or custom dashboards.","This option is correct. Azure Monitor is the comprehensive monitoring platform for Azure. It collects metrics (CPU, memory, disk) and logs from VMs, enables alert rules (e.g., CPU > 90% for 5 minutes \u2192 send notification), stores logs in Log Analytics workspaces for querying with KQL, and provides visualisation through Azure Dashboards and Workbooks. It's the central monitoring solution for all Azure resources.","Defender for Cloud focuses on security posture and threat protection. While it integrates with Monitor data, it's not the tool for performance monitoring, custom metric alerts, or log analytics dashboards."],"tip":"Azure Monitor = metrics + logs + alerts + dashboards (performance and health monitoring). Service Health = Azure platform status. Advisor = best-practice recommendations. Defender for Cloud = security posture. For 'monitor performance and set alerts' \u2014 Azure Monitor."},{"id":"AZ900-E02-026","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company wants to implement network security for their Azure Virtual Network\n- External threats are a concern \u2014 they need threat intelligence-based filtering\n- The solution must support FQDN (fully qualified domain name) filtering rules\n- They also need centralised network logging and analytics\n\nQuestion:\nWhich Azure service should you deploy?","choices":["Network Security Groups (NSGs)","Azure Firewall","Azure DDoS Protection","Azure VPN Gateway"],"answer":[1],"explanations":["NSGs filter traffic using IP addresses, ports, and protocols. They do NOT support FQDN filtering, threat intelligence, or centralised network logging with analytics. NSGs are basic traffic filters, not advanced firewalls.","This option is correct. Azure Firewall is a managed, cloud-based network security service that provides threat intelligence-based filtering (automatically blocks traffic from known malicious IPs and domains), FQDN filtering rules (allow/deny traffic to specific domain names), and centralised logging through Azure Monitor and Log Analytics. It's a stateful firewall with full Layer-3 to Layer-7 filtering capabilities.","DDoS Protection defends against volumetric denial-of-service attacks. It doesn't provide FQDN filtering, threat intelligence-based blocking, or network traffic logging and analytics.","VPN Gateway creates encrypted tunnels between Azure and on-premises or other Azure VNets. It's a connectivity service, not a security filtering service."],"tip":"Azure Firewall = FQDN filtering + threat intelligence + centralised logging + stateful inspection. NSGs = basic IP/port/protocol filtering. If the question mentions FQDN filtering, threat intelligence, or 'advanced network security' \u2014 Azure Firewall."},{"id":"AZ900-E02-027","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company has deployed resources in Azure\n- The IT manager wants to see a personalised list of recommendations to:\n  - Reduce unnecessary spending\n  - Improve the security of their deployment\n  - Increase reliability of critical resources\n  - Optimise performance of applications\n\nQuestion:\nWhich Azure service provides personalised recommendations across ALL of these areas in a single dashboard?","choices":["Azure Monitor","Azure Advisor","Azure Service Health","Azure Cost Management"],"answer":[1],"explanations":["Azure Monitor collects metrics and logs for monitoring and alerting. It provides observability data but doesn't generate personalised best-practice recommendations across multiple pillars.","This option is correct. Azure Advisor analyses your Azure resource configuration and usage, then provides personalised recommendations across five categories: Cost (reduce spending), Security (fix vulnerabilities), Reliability (improve resilience), Operational Excellence (follow best practices), and Performance (optimise speed). All recommendations appear in a single Advisor dashboard in the Azure portal.","Service Health informs you about Azure platform issues (outages, maintenance). It doesn't provide recommendations to improve your resources' cost, security, reliability, or performance.","Cost Management focuses exclusively on cost analysis and budgeting. It doesn't provide security, reliability, or performance recommendations."],"tip":"Azure Advisor covers 5 pillars: Cost, Security, Reliability, Operational Excellence, Performance. It's the only service that gives recommendations across ALL these areas. If the question mentions 'recommendations across multiple areas' or lists multiple pillars \u2014 Advisor."},{"id":"AZ900-E02-028","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company needs to host a static website (HTML, CSS, JavaScript only \u2014 no server-side code)\n- The website must be highly available and globally accessible\n- Cost must be minimised\n- The team does not want to manage any web servers or application platforms\n\nQuestion:\nWhat is the most cost-effective way to host this static website on Azure?","choices":["Azure App Service (Free tier)","Azure Virtual Machine with IIS/Nginx","Azure Blob Storage static website hosting","Azure Kubernetes Service"],"answer":[2],"explanations":["App Service Free tier can host websites, but it has limitations (shared compute, no custom domains with SSL on free tier, limited storage). It's a compute platform designed for dynamic applications \u2014 overkill for static HTML/CSS/JS files.","Running a VM with a web server is the most expensive and management-heavy option. You'd manage the VM, OS, web server software, and security updates \u2014 all for serving static files. Complete overkill.","This option is correct. Azure Blob Storage static website hosting serves HTML, CSS, JS, and image files directly from a storage container. It's extremely cost-effective (you pay only for storage and bandwidth), requires zero server management, and can be paired with Azure CDN for global distribution and custom domains with SSL. It's the Microsoft-recommended approach for static websites.","AKS is a container orchestration platform for complex microservices applications. Using Kubernetes to serve static HTML files is absurdly over-engineered and expensive."],"tip":"Static website hosting: Blob Storage is the cheapest and simplest option. Add Azure CDN for global distribution and custom domains. If the question mentions 'static website' + 'minimise cost' + 'no server management' \u2014 Blob Storage static hosting."},{"id":"AZ900-E02-029","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A company has experienced a fire in their primary data centre\n- All on-premises servers are destroyed\n- Fortunately, they had been replicating critical workloads to Azure using Azure Site Recovery\n- They need to bring their applications online in Azure while the data centre is rebuilt\n\nQuestion:\nWhich cloud concept does this scenario demonstrate?","choices":["High availability","Elasticity","Disaster recovery","Scalability"],"answer":[2],"explanations":["High availability is about maintaining service during component failures (e.g., a single server crash). A complete data centre fire is a disaster, not a routine component failure. HA keeps things running; DR brings things back after catastrophic failure.","Elasticity is the ability to scale resources up and down based on demand. It has nothing to do with recovering from a data centre fire.","This option is correct. Disaster recovery (DR) is the process of recovering IT systems after a catastrophic event (fire, flood, earthquake, power failure). Azure Site Recovery replicating workloads and enabling failover to Azure is a textbook DR scenario. The company fails over to Azure, runs from there while rebuilding, then fails back to on-premises when the data centre is restored.","Scalability is about handling growth. The data centre fire has nothing to do with growing the user base or increasing capacity."],"tip":"Disaster Recovery = recover after catastrophic failure (data centre destroyed, region-wide outage). High Availability = stay running during minor failures (single server, single rack). If the scenario involves a major disaster with recovery to a secondary location \u2014 DR."},{"id":"AZ900-E02-030","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company assigns the Contributor role to a developer at the subscription level\n- The developer can create, modify, and delete ANY resource in the subscription\n- However, the developer should NOT be able to assign roles to other users\n- The security team wants to verify this is the case\n\nQuestion:\nWhich statement about the Contributor built-in role is correct?","choices":["Contributor can manage all resources AND assign roles to other users","Contributor can manage all resources but CANNOT assign roles to other users","Contributor can only read resources, not create or modify them","Contributor can only manage resources in a specific resource group, not the entire subscription"],"answer":[1],"explanations":["This describes the Owner role, not Contributor. Owner has full access including role assignment (Microsoft.Authorization/*). Contributor explicitly excludes role management permissions.","This option is correct. The Contributor built-in role grants full permissions to manage all Azure resources (create, read, update, delete) but does NOT include permissions to assign roles to other users or manage access (no Microsoft.Authorization/roleAssignments/write). Only Owner and User Access Administrator roles can assign RBAC roles.","This describes the Reader role, which only has read access to resources. Contributor can create, modify, and delete resources.","Contributor's scope depends on where it's assigned. When assigned at the subscription level (as stated in the scenario), it applies to ALL resource groups in that subscription. RBAC is inherited downward."],"tip":"Three key built-in roles: Owner = full access + role assignment. Contributor = full access, NO role assignment. Reader = read only. The exam frequently tests the difference between Owner and Contributor \u2014 the distinction is role management (Microsoft.Authorization). Contributor = 'do everything except manage access.'"},{"id":"AZ900-E02-031","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company needs to create an isolated network environment in Azure\n- The network must have its own private IP address space (10.0.0.0/16)\n- Resources in this network need to communicate with each other privately\n- The network must be segmented into separate subnets for web servers, application servers, and database servers\n\nQuestion:\nWhich Azure resource should you create?","choices":["Azure ExpressRoute circuit","Azure Virtual Network (VNet)","Azure Traffic Manager profile","Azure DNS zone"],"answer":[1],"explanations":["ExpressRoute provides a private dedicated connection from on-premises to Azure. It's a connectivity service, not a network environment within Azure. You'd connect an ExpressRoute circuit TO a VNet, not use it instead of one.","This option is correct. An Azure Virtual Network (VNet) is the fundamental building block for private networking in Azure. You define an IP address space (e.g., 10.0.0.0/16), create subnets within it (web, app, database tiers), and resources deployed into those subnets can communicate privately. VNets provide isolation, segmentation, and the ability to control traffic flow using NSGs and route tables.","Traffic Manager routes DNS queries to different endpoints based on routing rules. It doesn't create network environments or private IP address spaces.","Azure DNS zones host DNS records for name resolution. They don't create network environments, define IP address spaces, or provide subnet segmentation."],"tip":"Azure Virtual Network = your private network in Azure (IP address space, subnets, isolation). It's the foundation \u2014 almost every Azure resource that needs networking connects to a VNet. Subnets segment the VNet for security and organisation."},{"id":"AZ900-E02-032","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company operates Azure resources across 50 subscriptions\n- The root management group contains all subscriptions\n- The security team needs to ensure ALL resources across ALL subscriptions have diagnostic logging enabled\n- This requirement must apply to current subscriptions and any future subscriptions automatically\n\nQuestion:\nAt which level should you assign the Azure Policy?","choices":["At each resource group individually","At each subscription individually","At the root management group","At each resource individually"],"answer":[2],"explanations":["Assigning at each resource group would require managing policies across potentially hundreds of resource groups. New resource groups wouldn't automatically get the policy unless manually assigned. This is not scalable.","Assigning at each subscription means managing 50 policy assignments and manually adding the policy to every new subscription. This fails the 'future subscriptions automatically' requirement.","This option is correct. Policies assigned at the root management group cascade down to ALL subscriptions, resource groups, and resources beneath it \u2014 including any new subscriptions created in the future. This is a single policy assignment that governs the entire Azure estate. It's the most efficient and comprehensive approach.","Assigning policies to individual resources is impractical at scale and doesn't apply to future resources. This would require thousands of individual assignments."],"tip":"Management Group hierarchy for policy: Root MG \u2192 Child MGs \u2192 Subscriptions \u2192 Resource Groups \u2192 Resources. Policies cascade downward. For 'all subscriptions including future ones' \u2014 assign at the root management group. One assignment, universal coverage."},{"id":"AZ900-E02-033","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- A healthcare company needs to store patient records in Azure\n- Records must be retained for 7 years to comply with regulations\n- After 7 years, records must be automatically deleted\n- During the 7-year period, records must not be modifiable or deletable by anyone (immutable)\n\nQuestion:\nWhich Azure Blob Storage feature should you configure?","choices":["Soft delete with a 7-year retention period","Immutable storage with a time-based retention policy","Azure Blob Storage lifecycle management rules","Azure Storage access tiers (Archive)"],"answer":[1],"explanations":["Soft delete recovers accidentally deleted blobs within a retention window, but it doesn't prevent modification or intentional deletion. Users with appropriate permissions can still delete blobs \u2014 soft delete just provides a recovery mechanism.","This option is correct. Immutable storage with a time-based retention policy makes blobs WORM (Write Once, Read Many). Once the policy is locked, data cannot be modified or deleted until the retention period expires. After 7 years, the data can be deleted (or auto-managed). This meets regulatory requirements like SEC 17a-4, HIPAA, and others that mandate immutable record keeping.","Lifecycle management automatically moves blobs between tiers (Hot \u2192 Cool \u2192 Archive) or deletes them based on age. I
