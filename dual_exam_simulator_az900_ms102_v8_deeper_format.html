\n\nQuestion:\nWhat should the new administrator use to practice?","choices":["The company's production Azure subscription","Azure free account with free-tier services and credits","Azure documentation (docs.microsoft.com) only","Azure Pricing Calculator simulations"],"answer":[1],"explanations":["Practicing in the production subscription risks accidental changes, deletions, or cost overruns that could impact business operations. Never learn in production.","This option is correct. Azure offers a free account that includes: $200 credit for the first 30 days (to experiment with any Azure service), 12 months of free popular services (VMs, storage, databases), and 55+ always-free services. Microsoft also provides sandboxed learning environments through Microsoft Learn with hands-on labs. The admin can safely experiment without affecting production or incurring unexpected costs.","Documentation is valuable for learning concepts, but it doesn't provide hands-on experience with actually creating and managing Azure resources. The admin needs to practice, not just read.","The Pricing Calculator estimates costs \u2014 it doesn't provide an environment to actually create or manage resources. You can't practice networking configuration in a calculator."],"tip":"Azure free account = $200 credit (30 days) + 12 months free services + always-free services. Microsoft Learn = guided hands-on labs in sandboxed environments. Both are designed for learning without risk to production."},{"id":"AZ900-E03-024","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company builds an e-commerce platform\n- When a customer places an order, the system must:\n  1. Save the order to the database\n  2. Send a confirmation email\n  3. Update inventory\n  4. Notify the warehouse\n- Steps 2-4 should happen asynchronously \u2014 the customer shouldn't wait for all steps to complete\n\nQuestion:\nWhich architecture pattern should you use to decouple the order placement from the subsequent processing steps?","choices":["Synchronous API calls between services","Message queue-based asynchronous processing","Direct database triggers","Polling the database for new orders"],"answer":[1],"explanations":["Synchronous API calls mean the customer waits while the system sequentially calls the email service, inventory service, and warehouse notification. If any service is slow or unavailable, the order response is delayed or fails. This creates tight coupling.","This option is correct. A message queue decouples the order placement from subsequent processing. After saving the order, the system places a message on a queue (Azure Service Bus or Queue Storage). Separate consumer services pick up messages asynchronously to send emails, update inventory, and notify the warehouse. The customer gets an immediate response while processing happens in the background. If a service is temporarily down, messages wait in the queue until it recovers.","Database triggers can fire when data changes, but they create tight coupling to the database, don't handle failures gracefully, and can impact database performance. They also don't provide the reliability guarantees of a message queue.","Polling the database for new orders is inefficient (constant queries even when there are no orders), adds load to the database, and introduces latency (you only detect new orders at the polling interval, not immediately)."],"tip":"Message queues (Service Bus, Queue Storage) decouple producers from consumers. If a question describes a scenario where 'the user shouldn't wait' or 'processing should happen asynchronously' \u2014 message queue pattern. This is a fundamental cloud architecture principle."},{"id":"AZ900-E03-025","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A company uses Azure for infrastructure (IaaS) and platform services (PaaS)\n- They want to understand their security responsibilities\n- The security team creates a matrix showing which security tasks belong to Microsoft and which belong to the company\n\nQuestion:\nWhich security task is ALWAYS the customer's responsibility, regardless of the cloud service model used (IaaS, PaaS, or SaaS)?","choices":["Physical data centre security","Operating system patching","Data classification and accountability","Network infrastructure"],"answer":[2],"explanations":["Physical data centre security is ALWAYS Microsoft's responsibility in all service models. Customers never manage Microsoft's data centres.","OS patching responsibility varies: in IaaS, the customer patches the guest OS. In PaaS and SaaS, Microsoft handles OS patching. It's not always the customer's responsibility.","This option is correct. Data classification and accountability is ALWAYS the customer's responsibility, regardless of the service model. Whether you use IaaS, PaaS, or SaaS, YOU are responsible for knowing what data you have, how sensitive it is, who should access it, and ensuring it's properly classified and governed. Microsoft doesn't know which of your data is confidential \u2014 only you do.","Network infrastructure responsibility varies by model. In IaaS, customers manage virtual network configuration. In SaaS, Microsoft manages the network infrastructure. It shifts across models."],"tip":"Always customer's responsibility (all models): data, endpoints/devices, accounts/identities, data classification. Always Microsoft's responsibility (all models): physical hosts, physical network, physical data centre. Everything in between shifts based on the service model."},{"id":"AZ900-E03-026","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company has two Azure subscriptions: one for Production and one for Development\n- A developer in the Development subscription needs temporary access to view (read-only) a specific storage account in the Production subscription\n- The developer should NOT have access to any other Production resources\n\nQuestion:\nHow should you grant this access?","choices":["Add the developer as a Co-administrator on the Production subscription","Assign the Reader role to the developer on the specific storage account resource","Create a new Azure AD tenant for the developer","Move the storage account to the Development subscription"],"answer":[1],"explanations":["Co-administrator is a legacy role that grants full access to the entire Production subscription. This is massively over-privileged \u2014 the developer only needs read access to one storage account.","This option is correct. Azure RBAC supports assignment at the resource level. You assign the Reader role to the developer specifically on the storage account resource. This grants read-only access to just that storage account \u2014 no access to any other Production resources. This follows the principle of least privilege: minimum permissions for the minimum scope.","Creating a new Azure AD tenant is completely unnecessary. The developer already has an identity in Azure AD. Cross-subscription RBAC works within the same tenant without needing a new one.","Moving the storage account to Development would disrupt Production workloads that depend on it and change network configurations. You should never move production resources to accommodate a temporary access need."],"tip":"RBAC scope levels: Management Group > Subscription > Resource Group > Resource. Always assign at the narrowest scope that satisfies the need. For access to ONE specific resource \u2014 assign at the resource level. This is the principle of least privilege."},{"id":"AZ900-E03-027","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company uses multiple Azure services: VMs, App Service, Azure SQL, and Storage Accounts\n- The operations team wants to create custom dashboards that show:\n  - VM CPU and memory utilisation\n  - App Service response times and error rates\n  - SQL Database DTU consumption\n  - Storage account transaction rates\n- All metrics should be visible in a single shared dashboard\n\nQuestion:\nWhich Azure service provides the unified monitoring platform for all these metrics?","choices":["Azure Advisor","Azure Monitor","Azure Service Health","Azure Cost Management"],"answer":[1],"explanations":["Advisor provides recommendations, not real-time monitoring dashboards. It doesn't show VM CPU, App Service response times, or SQL DTU metrics in a live dashboard.","This option is correct. Azure Monitor is the unified monitoring platform for ALL Azure services. It collects metrics (CPU, memory, DTU, response times, transactions) and logs from every Azure resource. You can create custom Azure Dashboards and Workbooks that combine metrics from VMs, App Service, SQL, and Storage into a single view. It also supports alerts, Log Analytics queries, and integration with tools like Grafana.","Service Health shows Azure platform status and incidents. It doesn't provide resource-level metrics like VM CPU or SQL DTU usage.","Cost Management tracks spending and budgets. It shows cost data, not performance metrics like CPU utilisation or response times."],"tip":"Azure Monitor = central monitoring for ALL Azure resources (metrics, logs, dashboards, alerts). It's the single platform for observability. Every other monitoring/assessment service (Advisor, Service Health, Defender for Cloud) complements Monitor but has a specific focus."},{"id":"AZ900-E03-028","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company runs an application that processes insurance claims\n- Each claim goes through a multi-step workflow: receive claim \u2192 validate documents \u2192 assess damage \u2192 calculate payment \u2192 send payment \u2192 notify customer\n- Each step involves different systems (document management, AI assessment, payment gateway, email)\n- The workflow must be visually designed and easily modifiable by non-developers\n\nQuestion:\nWhich Azure service should you use to orchestrate this workflow?","choices":["Azure Functions","Azure Logic Apps","Azure Batch","Azure DevOps Pipelines"],"answer":[1],"explanations":["Azure Functions executes individual pieces of code triggered by events. While Durable Functions can orchestrate workflows, Functions requires coding and isn't designed for visual workflow design by non-developers.","This option is correct. Azure Logic Apps provides a visual workflow designer where you build multi-step workflows by connecting pre-built connectors to various systems. It supports hundreds of connectors (document management, AI services, payment gateways, email, CRM). Non-developers can modify workflows using the visual designer. It's purpose-built for business process orchestration with complex branching, loops, and error handling.","Azure Batch is for large-scale parallel computing (running thousands of jobs on a pool of VMs). It's not designed for business workflow orchestration connecting different systems.","Azure DevOps Pipelines is for CI/CD (building, testing, deploying code). It's not designed for business process workflows like insurance claim processing."],"tip":"Logic Apps = visual workflow orchestration (connect systems, business processes, non-developer friendly). Functions = code execution (event-driven, developer-focused). If the question mentions 'visual designer', 'non-developers', 'multi-step workflow connecting different systems' \u2014 Logic Apps."},{"id":"AZ900-E03-029","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company is migrating applications to Azure\n- Some applications use Azure AD (Entra ID) for authentication\n- The company also has an on-premises Active Directory Domain Services (AD DS) environment\n- Users need to use the same username and password for both on-premises and Azure resources\n\nQuestion:\nWhat should you implement to synchronise on-premises AD DS identities with Azure AD?","choices":["Azure AD Application Proxy","Azure AD Connect (or Azure AD Connect Cloud Sync)","Azure AD B2B Collaboration","Azure AD Domain Services"],"answer":[1],"explanations":["Application Proxy provides remote access to on-premises web applications through Azure AD. It's a reverse proxy for application access, not an identity synchronisation tool.","This option is correct. Azure AD Connect synchronises user identities (usernames, password hashes or federation) from on-premises AD DS to Azure AD. Users get the same username and password across both environments. Azure AD Connect Cloud Sync is the newer, lighter-weight option for the same purpose. Both enable hybrid identity \u2014 the foundation for hybrid Azure deployments.","B2B Collaboration invites EXTERNAL users (partners, vendors) to access your Azure AD resources using their own identities. It's for cross-organisation collaboration, not synchronising your own on-premises AD to Azure AD.","Azure AD Domain Services provides managed domain services (domain join, group policy, LDAP) in Azure WITHOUT requiring on-premises domain controllers. It consumes identities from Azure AD but doesn't synchronise on-premises AD to Azure AD \u2014 that's Azure AD Connect's job."],"tip":"Azure AD Connect = sync on-premises AD identities to Azure AD (hybrid identity). Azure AD DS = managed domain services in the cloud (LDAP, Kerberos in Azure). Application Proxy = remote access to on-premises web apps. For 'same credentials on-premises and in Azure' \u2014 Azure AD Connect."},{"id":"AZ900-E03-030","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A company signs up for Azure and deploys two Standard_D2s_v3 VMs\n- They run 24/7 for 30 days\n- The company is surprised by the bill because they expected fixed monthly pricing\n- They didn't understand that cloud pricing is based on resource consumption\n\nQuestion:\nWhich cloud concept explains why the bill is based on how long the VMs ran and their size?","choices":["Shared responsibility model","Pay-as-you-go / consumption-based pricing","Service Level Agreement (SLA)","Total Cost of Ownership (TCO)"],"answer":[1],"explanations":["The shared responsibility model defines security responsibilities between the customer and cloud provider. It has nothing to do with billing or pricing models.","This option is correct. Pay-as-you-go (consumption-based) pricing means you're billed based on what you consume \u2014 VM size \u00d7 hours running = cost. Two D2s_v3 VMs running 24/7 for 30 days = 2 \u00d7 720 hours \u00d7 per-hour rate. There's no flat monthly fee for IaaS resources; the bill directly reflects consumption. This is the fundamental cloud pricing model.","An SLA defines uptime guarantees and service credits for breaches. It doesn't explain how billing works.","TCO is a cost comparison methodology (on-premises vs cloud). It's an analysis tool, not a billing model."],"tip":"Cloud pricing is consumption-based by default: you pay for what you use. VMs = per hour/minute. Storage = per GB stored + per transaction. Network = per GB egress. Understanding this model is critical for AZ-900. If the question asks 'why does my bill scale with usage?' \u2014 consumption-based pricing."},{"id":"AZ900-E03-031","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company pays for Azure using pay-as-you-go pricing\n- The finance team is concerned about unexpected cost spikes\n- They want to receive an email notification when monthly Azure spending reaches \u00a35,000\n- They also want a second notification at \u00a38,000\n- No automatic service shutdown is needed \u2014 just notifications\n\nQuestion:\nWhat should you configure?","choices":["Azure Spending Limit","Azure Cost Management Budget with alert thresholds","Azure Reserved Instances","Azure Advisor cost recommendations"],"answer":[1],"explanations":["Azure Spending Limit applies to specific offer types (free accounts, MSDN subscriptions) and completely stops services when the limit is reached. It's not available for pay-as-you-go accounts and doesn't just send notifications \u2014 it shuts things down.","This option is correct. Azure Cost Management allows you to create budgets with multiple alert thresholds. You set the monthly budget amount and configure alerts at specific percentages or amounts (e.g., \u00a35,000 and \u00a38,000). When spending hits each threshold, email notifications are sent to specified recipients. No services are stopped \u2014 it's purely informational. This is exactly what the finance team needs.","Reserved Instances reduce costs by committing to 1-3 years of usage. They don't provide spending alerts or budget tracking.","Advisor provides general cost-saving recommendations (e.g., 'resize this VM to save money'). It doesn't create custom budgets or send threshold-based spending alerts."],"tip":"Budget alerts = notification when spending approaches/exceeds a threshold. Spending Limit = hard cap that stops services (only for certain account types). These are different mechanisms. For 'notify me at \u00a3X' \u2014 Budget alerts. For 'stop everything at \u00a3X' \u2014 Spending Limit (if available)."},{"id":"AZ900-E03-032","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company needs to connect two Azure Virtual Networks that have overlapping IP address ranges\n- VNet-A uses 10.0.0.0/16\n- VNet-B also uses 10.0.0.0/16\n- Resources in both VNets need to communicate with each other\n\nQuestion:\nCan you create VNet Peering between VNet-A and VNet-B?","choices":["Yes \u2014 VNet Peering works regardless of IP address ranges","No \u2014 VNet Peering requires non-overlapping IP address spaces","Yes \u2014 but only if both VNets are in the same region","Yes \u2014 Azure automatically resolves IP conflicts during peering"],"answer":[1],"explanations":["VNet Peering does NOT work with overlapping IP ranges. Azure uses IP addresses for routing between peered VNets. If both VNets use the same addresses, Azure can't determine which VNet a packet should go to.","This option is correct. VNet Peering requires non-overlapping IP address spaces. If VNet-A and VNet-B both use 10.0.0.0/16, peering cannot be established because Azure's routing would be ambiguous. Before peering, one of the VNets would need to be re-addressed to use a different range (e.g., 10.1.0.0/16 for VNet-B). This is a foundational networking constraint in Azure.","The region doesn't matter for peering (global peering works across regions). The IP overlap is the problem, not the region.","Azure does NOT automatically resolve IP conflicts. IP address planning is the customer's responsibility. You must design non-overlapping address spaces before establishing peering or any VNet-to-VNet connectivity."],"tip":"VNet Peering requirements: non-overlapping IP address spaces. This is a hard constraint. The exam tests this frequently. Always plan IP addressing before creating VNets. Use a scheme like 10.1.0.0/16 for VNet-1, 10.2.0.0/16 for VNet-2, etc."},{"id":"AZ900-E03-033","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- A global e-commerce company has Azure deployments in 5 regions\n- They want to optimise their network architecture by creating a hub-and-spoke topology\n- Branch offices worldwide connect via VPN\n- The company also has ExpressRoute connections from two data centres\n- They want a single management point for all this connectivity\n\nQuestion:\nWhich Azure service provides a unified hub for VPN, ExpressRoute, and VNet connectivity at global scale?","choices":["Azure VPN Gateway","Azure ExpressRoute Gateway","Azure Virtual WAN","Azure Traffic Manager"],"answer":[2],"explanations":["VPN Gateway handles VPN connections for a single VNet. It doesn't provide a unified global hub that manages VPN, ExpressRoute, and VNet-to-VNet connectivity together. You'd need to manage multiple gateways across 5 regions separately.","ExpressRoute Gateway handles ExpressRoute connections for a single VNet. Like VPN Gateway, it's a per-VNet resource, not a global connectivity hub.","This option is correct. Azure Virtual WAN provides a unified networking hub that combines VPN (site-to-site and point-to-site), ExpressRoute, and VNet connectivity into a single architecture. It supports multi-region hub-and-spoke topologies with any-to-any connectivity. Virtual WAN hubs in each region automatically mesh with each other over Microsoft's global backbone. One management plane for all connectivity.","Traffic Manager is a DNS-based traffic router for directing users to the nearest endpoint. It doesn't manage network connectivity between sites, branches, or VNets."],"tip":"Azure Virtual WAN = unified global networking hub (VPN + ExpressRoute + VNet peering + SD-WAN). It simplifies complex multi-region, multi-connection topologies. If the question mentions 'unified hub' + 'VPN + ExpressRoute + VNet' at global scale \u2014 Virtual WAN."},{"id":"AZ900-E03-034","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company uses Azure and wants to improve their security posture\n- Microsoft Defender for Cloud shows a Secure Score of 45%\n- The security team wants to understand what actions will have the biggest impact on improving the score\n- They want prioritised, actionable recommendations\n\nQuestion:\nWhat does the Secure Score in Microsoft Defender for Cloud represent?","choices":["The percentage of Azure resources that are encrypted","A measurement of your security posture based on implemented security controls","The percentage of users with MFA enabled","The number of security incidents detected in the last 30 days"],"answer":[1],"explanations":["Secure Score considers encryption as one of many security controls, but it's not limited to encryption. It evaluates dozens of security configurations across compute, networking, data, identity, and applications.","This option is correct. Secure Score is an aggregate measurement (0-100%) of your organisation's security posture in Azure. It evaluates how many recommended security controls you've implemented across your Azure environment. Each recommendation has a point value based on impact. Fixing high-value recommendations increases your score most. The score helps prioritise which security improvements to tackle first.","MFA enablement is one factor that affects Secure Score, but the score encompasses far more: network security, data encryption, access controls, vulnerability management, and more.","Secure Score measures your security configuration posture, not the number of detected incidents. Incidents are tracked separately in Microsoft Sentinel or Defender for Cloud's security alerts."],"tip":"Secure Score = how well have you implemented security best practices? Higher score = better security posture. Defender for Cloud provides prioritised recommendations to improve your score. Focus on recommendations with the highest point value for maximum impact."},{"id":"AZ900-E03-035","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A company's IT director presents a proposal to move to the cloud\n- The board asks: 'What are the guaranteed benefits of using public cloud services?'\n- The IT director needs to accurately describe what cloud computing provides\n\nQuestion:\nWhich of the following is a GUARANTEED characteristic of public cloud computing?","choices":["Lower costs than on-premises in all scenarios","On-demand self-service provisioning of resources","Zero security vulnerabilities","100% uptime with no outages"],"answer":[1],"explanations":["Cloud is NOT guaranteed to be cheaper in all scenarios. Some workloads (steady-state, predictable, fully utilised servers) may cost more in the cloud. Cloud's cost advantage comes from variable workloads, avoiding CapEx, and scaling. The exam tests the nuance that cloud isn't automatically cheaper.","This option is correct. On-demand self-service is a defining characteristic of cloud computing (per NIST definition). Users can provision compute, storage, and networking resources as needed without requiring human intervention from the provider. This is guaranteed by the cloud model itself \u2014 Azure portal, CLI, and APIs enable instant self-service provisioning.","No system is free from security vulnerabilities. Cloud providers invest heavily in security, but vulnerabilities can exist in any software. The shared responsibility model means both Microsoft and the customer share security obligations.","No cloud provider guarantees 100% uptime. Azure SLAs guarantee specific uptime percentages (99.9%, 99.95%, 99.99%), but all include some allowable downtime. Outages, while rare, do occur."],"tip":"NIST defines 5 essential cloud characteristics: on-demand self-service, broad network access, resource pooling, rapid elasticity, measured service. These are guaranteed by the cloud model. Things that are NOT guaranteed: lower costs, zero downtime, absolute security."},{"id":"AZ900-E03-036","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company needs to process real-time data from IoT devices\n- Temperature sensors in a warehouse send readings every second\n- The system must detect if temperature exceeds 30\u00b0C within 5 seconds and trigger an alert\n- Historical data should be stored for trend analysis\n\nQuestion:\nWhich Azure service should you use for the real-time analysis and alerting?","choices":["Azure Data Factory","Azure Stream Analytics","Azure Synapse Analytics","Azure Data Lake Analytics"],"answer":[1],"explanations":["Data Factory is for data integration and ETL/ELT batch pipelines. It moves and transforms data between stores. It's not designed for real-time stream processing with sub-5-second alerting requirements.","This option is correct. Azure Stream Analytics is a real-time analytics service that processes streaming data using SQL-like queries. It can ingest data from IoT Hub or Event Hubs, apply windowing functions to detect temperature thresholds, and trigger alerts within seconds. It can simultaneously output to storage (Blob, Data Lake) for historical trend analysis. It's purpose-built for real-time IoT analytics.","Synapse Analytics is a data warehouse and analytics service for batch processing of large datasets. It's designed for complex analytical queries over stored data, not real-time stream processing with second-level latency requirements.","Azure Data Lake Analytics (now deprecated) was a batch analytics service for processing data stored in Data Lake. It was designed for batch, not real-time, analytics."],"tip":"Stream Analytics = real-time stream processing (SQL queries over streaming data). Data Factory = batch data integration (ETL/ELT). Synapse = data warehousing (batch analytics). If the question mentions 'real-time', 'streaming', or 'detect within seconds' \u2014 Stream Analytics."},{"id":"AZ900-E03-037","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company has resources deployed across Azure and also uses AWS for some workloads\n- The operations team wants to apply Azure Policy to govern the AWS resources as well\n- They also want to use Microsoft Defender for Cloud to assess the security of AWS workloads\n\nQuestion:\nWhich Azure service extends Azure governance capabilities to non-Azure environments?","choices":["Azure Migrate","Azure Arc","Azure ExpressRoute","Azure Virtual WAN"],"answer":[1],"explanations":["Azure Migrate is for discovering, assessing, and migrating workloads TO Azure. It doesn't extend Azure governance to other cloud providers.","This option is correct. Azure Arc extends Azure's control plane to non-Azure environments \u2014 on-premises servers, AWS, GCP, edge locations. Once resources are Arc-enabled, you can apply Azure Policy, use Microsoft Defender for Cloud, deploy Azure Monitor agents, and manage these resources through the Azure portal as if they were native Azure resources. Arc supports servers, Kubernetes clusters, SQL Server, and more.","ExpressRoute provides private network connectivity between on-premises and Azure. It's a network service, not a governance extension tool.","Virtual WAN provides unified networking connectivity. It's a networking hub, not a governance or management extension tool."],"tip":"Azure Arc = extend Azure management to ANY infrastructure (multi-cloud, hybrid, edge). Key capabilities: Azure Policy, Defender for Cloud, Azure Monitor, Azure Automation \u2014 all extended to non-Azure resources. If 'manage non-Azure resources through Azure' \u2014 Arc."},{"id":"AZ900-E03-038","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- A developer needs to quickly build and deploy an API that queries Azure SQL Database\n- The API should support authentication with Azure AD\n- The solution should provide built-in API documentation and testing\n- Minimal custom code should be needed \u2014 the developer wants to focus on business logic only\n\nQuestion:\nWhich combination provides the most developer-productive solution?","choices":["Azure Virtual Machine with custom API code","Azure App Service with Azure API Management","Azure Functions with Azure API Management","Azure Container Instances with Nginx"],"answer":[2],"explanations":["Building a custom API on a VM requires managing the OS, web server, framework, and deployment process. Maximum effort for the developer \u2014 the opposite of what's asked.","App Service with API Management works well, but App Service still requires a full application framework setup. It's good, but Functions offers even less code for simple database query APIs.","This option is correct. Azure Functions lets the developer write minimal code \u2014 just the SQL query logic. Each API endpoint is a separate function with an HTTP trigger. Azure API Management adds a layer in front that provides built-in API documentation (developer portal), authentication (Azure AD integration), rate limiting, and testing tools. Together, they maximise developer productivity: Functions for minimal business logic code, APIM for everything else.","Container Instances with Nginx requires building a container image, configuring a web server, and managing deployment artifacts. No built-in API documentation or AD integration \u2014 you'd have to build all of that."],"tip":"Functions + API Management is a powerful serverless API pattern. Functions = minimal business logic code. API Management = documentation, authentication, rate limiting, monitoring. If the question says 'minimal code' + 'API documentation' + 'authentication' \u2014 Functions + APIM."},{"id":"AZ900-E03-039","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company stores backup data in Azure Blob Storage\n- The data is accessed approximately once per year for audit purposes\n- When accessed, the audit team needs the data available within a few hours\n- The company wants the absolute lowest storage cost possible\n\nQuestion:\nWhich Azure Blob Storage access tier should you use?","choices":["Hot tier","Cool tier","Cold tier","Archive tier"],"answer":[3],"explanations":["Hot tier has the highest storage cost per GB. It's designed for frequently accessed data. Using it for data accessed once per year would waste money on unnecessary availability.","Cool tier is cheaper than Hot but more expensive than Cold and Archive. It's designed for data accessed at least once per month. Once-per-year access is rarer than Cool tier is optimised for.","Cold tier is cheaper than Cool but more expensive than Archive. It's designed for data accessed at least once per quarter. For once-per-year access where hours of retrieval time is acceptable, Archive is cheaper.","This option is correct. Archive tier offers the lowest storage cost per GB in Azure Blob Storage. Data in Archive is offline and takes hours to rehydrate (bring back to an online tier for access). For audit data accessed once per year where a few hours of retrieval time is acceptable, Archive provides the absolute minimum storage cost. The higher per-access cost is offset by the dramatically lower storage cost over the year."],"tip":"Archive tier = lowest storage cost, highest access cost, hours to retrieve. Use for: compliance archives, annual audits, data you almost never access. If 'lowest cost' + 'hours of retrieval acceptable' + 'rarely accessed' \u2014 Archive tier."},{"id":"AZ900-E03-040","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A company evaluates Azure for their workloads\n- The CTO asks: 'Azure operates data centres at a scale far beyond what our company could ever build. Does this benefit us as a customer?'\n\nQuestion:\nWhich cloud computing benefit results from the cloud provider's massive operational scale?","choices":["Agility","Economies of scale","High availability","Elasticity"],"answer":[1],"explanations":["Agility is about speed of deploying resources. While cloud providers can offer faster deployment, it's not directly a result of their massive operational scale.","This option is correct. Economies of scale means the cost per unit decreases as the scale of operation increases. Microsoft operates millions of servers worldwide and purchases hardware, electricity, and cooling at volumes no single customer could match. These savings are passed on as lower per-unit costs for customers. A company could never build a data centre as cost-efficiently as Azure because they lack the scale advantage.","High availability is a design property (redundancy, failover). While scale helps fund HA investments, the question specifically asks about the benefit of massive operational scale \u2014 that's economies of scale.","Elasticity is the ability to dynamically scale resources. It's enabled by cloud architecture, not specifically by the provider's purchasing power at scale."],"tip":"Economies of scale = bulk purchasing power of massive cloud providers reduces per-unit costs for everyone. This is a foundational cloud benefit. If the question mentions 'massive scale' or 'operates at a scale beyond what one company could achieve' \u2014 economies of scale."},{"id":"AZ900-E03-041","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company's Azure subscription has resources created by multiple team members over 18 months\n- Many resources were created for testing but never deleted\n- Some VMs are running but have 0% CPU usage for the past 30 days\n- The finance team asks: 'How can we identify resources that are wasting money?'\n\nQuestion:\nWhich Azure tool can identify idle and underutilised resources with specific cost-saving recommendations?","choices":["Azure Activity Log","Azure Advisor (Cost category)","Azure Monitor Metrics","Azure Resource Graph"],"answer":[1],"explanations":["Activity Log records management operations (who created/deleted what) but doesn't analyse resource utilisation or provide cost-saving recommendations.","This option is correct. Azure Advisor's Cost category analyses resource utilisation patterns and identifies: idle VMs with 0% CPU that should be deallocated, underutilised VMs that should be downsized, unused public IPs, and unattached disks. Each recommendation includes the estimated monthly savings. It's the go-to tool for finding wasted spend.","Azure Monitor Metrics shows CPU, memory, and other performance data, but it doesn't automatically analyse this data to generate cost-saving recommendations. You'd have to manually review metrics for each resource \u2014 Advisor does this automatically.","Resource Graph is a query engine for exploring Azure resources at scale (find all VMs in a subscription, list all resources with a specific tag). It can find resources but doesn't analyse utilisation or calculate potential savings."],"tip":"Azure Advisor Cost recommendations automatically detect: idle VMs, underutilised VMs, orphaned disks, unused public IPs, and RI purchase opportunities. If 'find wasted resources' or 'identify cost savings' \u2014 Advisor Cost category."},{"id":"AZ900-E03-042","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company needs to provide users with access to a full Windows 10/11 desktop environment from any device\n- Users work remotely from personal laptops, tablets, and thin clients\n- The IT team wants to centrally manage the desktop environment, including security policies and installed applications\n- The solution must be cloud-hosted \u2014 no on-premises infrastructure\n\nQuestion:\nWhich Azure service should you use?","choices":["Azure Virtual Machines (individual VMs per user)","Azure Virtual Desktop (AVD)","Azure App Service","Microsoft 365 web apps"],"answer":[1],"explanations":["Individual VMs per user would work technically, but it's extremely expensive and difficult to manage at scale. Each user would need a dedicated VM, separate management, and individual patching. AVD is purpose-built for this scenario with much better economics and management.","This option is correct. Azure Virtual Desktop (AVD) is a cloud-hosted desktop and application virtualisation service. Users connect from any device to a full Windows desktop running in Azure. IT centrally manages the environment through Intune and Azure AD. AVD supports multi-session Windows 10/11 (unique to Azure \u2014 multiple users share one VM), which dramatically reduces costs compared to individual VMs. It's fully cloud-hosted with no on-premises infrastructure needed.","App Service hosts web applications and APIs. It doesn't provide a full Windows desktop environment for end users.","Microsoft 365 web apps provide browser-based access to Office applications (Word, Excel, etc.), not a full Windows desktop environment with locally installed applications, file explorer, and other desktop functionality."],"tip":"Azure Virtual Desktop = cloud-hosted full Windows desktops. Key benefit: Windows 10/11 multi-session (multiple users on one VM \u2014 Azure exclusive). If the question mentions 'virtual desktop', 'remote desktop for users', or 'DaaS (Desktop as a Service)' \u2014 AVD."},{"id":"AZ900-E03-043","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company has an Azure Storage account\n- They need to copy 10 TB of data from an on-premises file server to Azure Blob Storage\n- Their internet connection is 100 Mbps \u2014 transferring 10 TB would take approximately 9 days\n- They need the data in Azure within 2 days\n- They don't want to upgrade their internet connection\n\nQuestion:\nWhich Azure service can transfer this data within the time constraint?","choices":["AzCopy over the existing internet connection","Azure Data Box (physical device)","Azure ExpressRoute","Azure File Sync"],"answer":[1],"explanations":["AzCopy over a 100 Mbps connection would take approximately 9 days \u2014 exceeding the 2-day requirement. The bottleneck is bandwidth, and AzCopy can't solve that.","This option is correct. Azure Data Box is a physical device that Microsoft ships to your location. You copy 10 TB of data to the device locally (via USB 3.0 or network, much faster than internet upload), ship it back to Microsoft, and they upload it to your Azure Storage account. The physical shipping + upload process takes 1-2 days in most regions. It bypasses your internet connection entirely \u2014 perfect when bandwidth is the bottleneck.","ExpressRoute provides a dedicated private connection to Azure, but it requires provisioning through a connectivity provider (takes weeks/months to set up). It also costs significantly more than a Data Box for a one-time transfer. Not practical for a 2-day deadline.","Azure File Sync provides ongoing synchronisation between on-premises file servers and Azure Files. While it could eventually sync the data, it still uses your 100 Mbps connection and would face the same 9-day timeline."],"tip":"Azure Data Box family: Data Box Disk (up to 35 TB), Data Box (up to 80 TB), Data Box Heavy (up to 800 TB). If the question describes a large data transfer where internet bandwidth is insufficient \u2014 Data Box. It's Microsoft's offline data transfer solution."},{"id":"AZ900-E03-044","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A company is reviewing their Azure spending report\n- They notice charges for network data transfer\n- Data transfer INTO Azure is free\n- Data transfer OUT of Azure is charged\n\nQuestion:\nWhat is the term for data transfer OUT of Azure (to the internet or to another region)?","choices":["Ingress","Egress","Peering","Transit"],"answer":[1],"explanations":["Ingress is data transfer INTO Azure. Ingress is free in Azure \u2014 you don't pay to upload data. This is the opposite of what the question asks.","This option is correct. Egress is data transfer OUT of Azure \u2014 to the internet, to another Azure region, or to on-premises. Azure charges for egress data transfer, with costs varying by volume and destination. Ingress (inbound) is free; egress (outbound) is metered. Understanding this distinction is important for cost planning.","Peering is a VNet-to-VNet connectivity mechanism. While peering between VNets in different regions incurs data transfer costs, 'peering' is not the general term for outbound data transfer.","Transit is not a standard Azure billing term for data transfer. It's used in networking contexts (transit VNet, transit gateway) but not as the billing category for outbound data."],"tip":"Azure data transfer pricing: Ingress (inbound) = FREE. Egress (outbound) = CHARGED. The first 5 GB/month of egress is free, then charged per GB in tiered pricing. Intra-region traffic between Azure services is often free or low-cost. Cross-region traffic costs more."},{"id":"AZ900-E03-045","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company has three teams: Platform, Security, and Application Development\n- Platform team needs to manage subscriptions and resource groups\n- Security team needs to manage Azure Policy and security settings but NOT create resources\n- Application Development team needs to create and manage resources in specific resource groups but NOT manage subscriptions\n\nQuestion:\nWhich Azure feature should you use to give each team appropriate permissions following the principle of least privilege?","choices":["Azure Active Directory groups only","Azure Role-Based Access Control (RBAC) with different roles at different scopes","Azure Policy with different effects","Azure Management Groups only"],"answer":[1],"explanations":["Azure AD groups help organise users, but groups alone don't grant permissions. You need to assign RBAC roles to those groups. Groups are a useful complement to RBAC but aren't the permission mechanism themselves.","This option is correct. Azure RBAC enables assigning specific roles at specific scopes: Platform team gets Owner/Contributor at the subscription level. Security team gets Security Admin or a custom role (with policy management permissions) at the subscription level \u2014 without resource creation rights. Application Development team gets Contributor at specific resource group scopes. This gives each team exactly the permissions they need at the narrowest possible scope \u2014 the definition of least privilege.","Azure Policy enforces rules about resource configurations (e.g., allowed regions, required tags). It doesn't manage user permissions or team access levels. Policy says 'what can be done'; RBAC says 'who can do it.'","Management Groups organise subscriptions and enable policy inheritance. They don't directly grant team-specific permissions. RBAC roles assigned at management group scope cascade to all subscriptions \u2014 that's not the granularity needed here."],"tip":"RBAC = who can do what, and where. Three elements: security principal (who), role definition (what permissions), scope (where). Least privilege = minimum role + narrowest scope. If the question describes different teams needing different permissions at different levels \u2014 RBAC."},{"id":"AZ900-E03-046","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- A company wants to build an AI-powered customer support chatbot\n- The chatbot must understand natural language questions and provide relevant answers\n- The development team has no machine learning expertise\n- They need pre-built AI capabilities they can integrate via API calls\n\nQuestion:\nWhich Azure service provides pre-built AI models accessible via APIs?","choices":["Azure Machine Learning","Azure AI Services (formerly Cognitive Services)","Azure Databricks","Azure HDInsight"],"answer":[1],"explanations":["Azure Machine Learning is a platform for building, training, and deploying CUSTOM machine learning models. It requires ML expertise to create models from scratch. The team has no ML expertise \u2014 they need pre-built capabilities.","This option is correct. Azure AI Services (formerly Cognitive Services) provides pre-built AI models accessible via REST APIs. For a chatbot, the team can use: Azure AI Language (natural language understanding), Azure Bot Service (bot framework), and Azure OpenAI Service (GPT models for conversational AI). No ML expertise required \u2014 just make API calls. Services cover vision, speech, language, and decision categories.","Azure Databricks is a data analytics and ML platform based on Apache Spark. It's designed for data engineers and data scientists building custom analytics pipelines, not for integrating pre-built AI via APIs.","HDInsight is a managed Hadoop/Spark cluster service for big data processing. It's not an AI/ML service and doesn't provide pre-built AI capabilities."],"tip":"Azure AI Services = pre-built AI models via APIs (no ML expertise needed). Azure Machine Learning = build CUSTOM ML models (requires expertise). If the team 'has no ML expertise' and needs 'pre-built AI' \u2014 AI Services (Cognitive Services)."},{"id":"AZ900-E03-047","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company's application has grown from 100 users to 100,000 users\n- The Azure SQL Database needs more compute power to handle the increased query load\n- You want to increase the database performance tier from Standard S3 to Premium P4\n- The change should happen without application downtime\n\nQuestion:\nCan you change the Azure SQL Database performance tier without downtime?","choices":["No \u2014 you must create a new database and migrate data","No \u2014 the database must be taken offline during the tier change","Yes \u2014 Azure SQL Database supports online scaling of performance tiers","Yes \u2014 but only if you use Azure Data Migration Service"],"answer":[2],"explanations":["You do NOT need to create a new database. Azure SQL Database supports in-place scaling \u2014 changing the performance tier of the existing database without creating a new one.","The database does NOT need to go offline. Azure SQL Database handles tier changes with minimal impact \u2014 there may be a brief connection interruption (typically under 30 seconds) at the very end when the database switches to the new tier, but applications with retry logic handle this transparently.","This option is correct. Azure SQL Database supports online scaling of compute resources. You can change the performance tier (DTU model: Basic \u2192 Standard \u2192 Premium, or vCore model: adjust cores/memory) through the Azure portal, PowerShell, or CLI. The operation happens while the database remains online and serving queries. This is a key PaaS benefit \u2014 try doing this with a self-managed SQL Server without downtime!","Database Migration Service is for migrating between different database platforms or from on-premises to Azure. Scaling an existing Azure SQL Database's performance tier doesn't require a migration service."],"tip":"Azure SQL Database = online scaling (change tiers without significant downtime). This is a PaaS advantage. Azure VMs would require stopping the VM to resize in some scenarios. If the question asks about scaling database performance \u2014 Azure SQL Database supports it online."},{"id":"AZ900-E03-048","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company needs to ensure that all Azure VMs have a specific antivirus extension installed\n- Any VM without the extension should be automatically remediated \u2014 the extension should be deployed without manual intervention\n- New VMs created without the extension should also be automatically remediated\n\nQuestion:\nWhich Azure Policy effect should you use?","choices":["Deny","Audit","DeployIfNotExists","Disabled"],"answer":[2],"explanations":["Deny prevents the creation of non-compliant resources entirely. It would block VM creation if the extension isn't specified at deployment time. But the question wants remediation (automatically fix), not prevention (block creation).","Audit flags non-compliant resources but takes no action. The extension wouldn't be installed \u2014 it would just appear in the compliance report as non-compliant. The question requires automatic remediation.","This option is correct. DeployIfNotExists evaluates resources and, if a related resource or extension doesn't exist, automatically deploys it through a remediation task. For VMs without the antivirus extension, DeployIfNotExists triggers a deployment that installs the extension. This works for both existing VMs (via remediation tasks) and newly created VMs (evaluated at creation time). It's the auto-remediation effect.","Disabled turns off the policy evaluation entirely. No compliance checking, no remediation, no auditing. The opposite of what's needed."],"tip":"Policy effects for remediation: DeployIfNotExists = auto-deploy a missing related resource/extension. Modify = auto-change properties on the resource itself (e.g., add tags). Both support remediation tasks. Deny = prevent creation. Audit = flag only. Match the effect to the desired outcome."},{"id":"AZ900-E03-049","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company operates an application that requires extremely low-latency access to data\n- The data must be available in multiple Azure regions simultaneously\n- Users in each region should read from their local copy for single-digit millisecond latency\n- The database must support multiple write regions for global applications\n\nQuestion:\nWhich Azure database service supports multi-region writes with guaranteed low latency?","choices":["Azure SQL Database with geo-replication","Azure Cosmos DB with multi-region writes","Azure Database for MySQL with read replicas","Azure Cache for Redis with geo-replication"],"answer":[1],"explanations":["Azure SQL Database geo-replication creates readable secondary replicas in other regions, but writes can only go to the primary region. It supports multi-region READS but not multi-region WRITES. The question requires writes in multiple regions.","This option is correct. Azure Cosmos DB is the only Azure database that supports multi-region writes (also called multi-master). You can configure write regions globally \u2014 applications in each region write to their local Cosmos DB instance with single-digit millisecond latency. Cosmos DB handles conflict resolution automatically. It guarantees <10ms reads and <10ms writes at the 99th percentile worldwide.","Azure Database for MySQL supports read replicas in other regions, but like SQL Database, writes must go to the primary region. It doesn't support multi-region writes.","Azure Cache for Redis supports geo-replication for read caching across regions, but it's a cache, not a database. Writes go to the primary cache. It also doesn't support multi-region writes with the guarantees Cosmos DB provides."],"tip":"Multi-region writes = Azure Cosmos DB (exclusive feature). If the question mentions 'write in multiple regions simultaneously' or 'multi-master' \u2014 Cosmos DB is the only answer. SQL Database, MySQL, and PostgreSQL support multi-region reads (replicas) but NOT multi-region writes."},{"id":"AZ900-E03-050","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A company has decided to use Azure for all new projects\n- The CTO mandates that no new on-premises hardware will be purchased\n- All new applications will be developed using Azure services\n- Existing on-premises systems will be gradually migrated to Azure over 3 years\n\nQuestion:\nWhich term describes the CTO's strategy of fully adopting Azure and eliminating on-premises infrastructure?","choices":["Cloud-first strategy","Hybrid cloud strategy","Multi-cloud strategy","Cloud-native strategy"],"answer":[0],"explanations":["This option is correct. A cloud-first strategy means all new initiatives use cloud services by default, and existing systems are migrated over time. The CTO's mandate (no new on-premises hardware, all new apps in Azure, gradual migration) is the textbook definition of cloud-first. During the 3-year migration, the company is technically hybrid (using both on-premises and cloud), but the STRATEGY is cloud-first because the end goal is full cloud adoption.","A hybrid cloud strategy involves permanently maintaining both on-premises and cloud infrastructure. The CTO's goal is to eliminate on-premises entirely over 3 years \u2014 hybrid is the transition state, not the strategy.","Multi-cloud means using multiple public cloud providers (Azure + AWS + GCP). The CTO specified Azure only \u2014 not a multi-cloud approach.","Cloud-native refers to applications specifically designed for the cloud using microservices, containers, and serverless patterns. The CTO's strategy is broader than application architecture \u2014 it's an organisational IT strategy covering all workloads."],"tip":"Cloud-first = default to cloud for all new projects. Cloud-only = no on-premises at all. Hybrid = permanent mix of cloud and on-premises. Cloud-native = applications designed specifically for cloud patterns (microservices, containers). Know the strategy terminology."}]},{"set":4,"title":"Practice Exam 4","questions":[{"id":"AZ900-E04-001","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A law firm currently stores all client files on a local NAS (Network Attached Storage) device\n- The NAS failed last month, and the firm lost 3 days of work before it was repaired\n- The managing partner wants to move file storage to the cloud\n- They need file storage accessible from any device, anywhere, with automatic redundancy\n\nQuestion:\nWhich cloud benefit directly addresses the law firm's file loss issue?","choices":["Agility","Reliability and redundancy","Cost reduction","Elasticity"],"answer":[1],"explanations":["Agility is about rapid provisioning of resources. While the firm could quickly set up cloud storage, agility doesn't address the data loss problem.","This option is correct. Cloud storage services like Azure Files and OneDrive provide automatic redundancy \u2014 data is replicated across multiple storage nodes (and optionally across regions). If one storage node fails, data is still available from the replicas. This directly addresses the NAS failure scenario: no single point of failure, no data loss, continuous availability.","Cost reduction may be a side benefit, but the firm's primary concern is data loss and availability, not cost. You can't put a price on lost legal work.","Elasticity is about scaling resources based on demand. The firm's problem is data availability, not storage capacity fluctuations."],"tip":"When a scenario describes data loss or service unavailability due to hardware failure \u2014 the cloud benefit is reliability/redundancy. Cloud storage automatically replicates data, eliminating single points of failure."},{"id":"AZ900-E04-002","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A company runs a PaaS application on Azure App Service\n- The application experiences a data breach because a developer hardcoded an API key in the source code\n- The API key was committed to a public GitHub repository\n\nQuestion:\nAccording to the shared responsibility model, who is responsible for this security breach?","choices":["Microsoft, because the application runs on Azure infrastructure","GitHub, because the API key was exposed through their platform","The customer, because application security and data protection are the customer's responsibility","Shared between Microsoft and the customer"],"answer":[2],"explanations":["Microsoft is responsible for the platform infrastructure (OS, runtime, physical security), but not for how customers write their application code or manage secrets. A hardcoded API key is an application-level security failure.","GitHub provides a code hosting platform. While GitHub offers secret scanning features, the responsibility for not hardcoding secrets in source code lies with the development team, not the hosting platform.","This option is correct. In all cloud models (IaaS, PaaS, SaaS), the customer is always responsible for their data, application code, identity management, and credentials. Hardcoding an API key in source code and committing it to a public repository is an application security failure \u2014 entirely the customer's responsibility. Microsoft provides tools (Key Vault, Managed Identities) to avoid this, but the customer must use them.","This is not a shared responsibility. Application code security is exclusively the customer's domain. Microsoft has no visibility into or control over what developers put in their source code."],"tip":"Application code, data, credentials, and identity management are ALWAYS the customer's responsibility \u2014 in every cloud model. If a breach occurs because of how the customer built their application, it's the customer's responsibility. Microsoft provides security tools; customers must use them."},{"id":"AZ900-E04-003","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- A company needs to deploy 500 identical virtual machines for a load testing exercise\n- All VMs must have the same configuration: Ubuntu 22.04, 4 vCPUs, 16 GB RAM\n- The VMs are needed for 4 hours and then must be deleted\n- The deployment must be automated \u2014 manually creating 500 VMs is not acceptable\n\nQuestion:\nWhich Azure feature is BEST suited for deploying and managing these identical VMs as a single unit?","choices":["Azure Virtual Machine Scale Sets","Individual Azure Virtual Machines created via ARM template","Azure Container Instances","Azure App Service Plan"],"answer":[0],"explanations":["This option is correct. Virtual Machine Scale Sets (VMSS) deploy and manage a group of identical, auto-scaling VMs as a single resource. You specify the VM configuration once and set the instance count to 500. VMSS handles deployment, load balancing, and when finished, you scale to 0 or delete the scale set. It's purpose-built for scenarios requiring many identical VMs.","An ARM template could deploy 500 VMs, but each VM would be a separate resource to manage. Deleting 500 individual VMs is cumbersome compared to deleting a single VMSS. ARM templates are the deployment mechanism, but VMSS is the better management abstraction for identical VMs.","Container Instances run containers, not full VMs. The scenario requires Ubuntu VMs with specific vCPU and RAM specifications \u2014 a VM workload, not a container workload.","App Service Plan hosts web applications, not arbitrary VM workloads for load testing. It doesn't provide the VM-level control needed."],"tip":"VM Scale Sets = deploy and manage identical VMs as a group. Key benefits: uniform configuration, automatic scaling, single-unit management, integrated load balancing. If 'many identical VMs' or 'auto-scaling group of VMs' \u2014 VMSS."},{"id":"AZ900-E04-004","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company uses Azure Storage Accounts for various purposes\n- They need to understand the difference between storage account types\n- The team is confused about when to use Standard vs Premium storage\n\nQuestion:\nWhat is the PRIMARY difference between Standard and Premium Azure Storage accounts?","choices":["Standard uses HDDs; Premium uses SSDs \u2014 resulting in different performance characteristics","Standard is for production; Premium is for development","Standard supports Blob storage; Premium supports only File storage","Standard is available in all regions; Premium is only in select regions"],"answer":[0],"explanations":["This option is correct. Standard storage uses Hard Disk Drives (HDDs) \u2014 good for bulk storage, backups, and infrequently accessed data with lower cost. Premium storage uses Solid State Drives (SSDs) \u2014 providing significantly higher IOPS, lower latency, and better throughput for performance-sensitive workloads like databases and transaction processing. The price reflects the performance difference.","Both Standard and Premium are suitable for production workloads. Premium is for performance-demanding production workloads; Standard is for cost-conscious production workloads. Neither is specifically for development.","Both Standard and Premium support Blob storage. Premium also offers premium file shares (Azure Files), premium block blobs, and premium page blobs. The difference is performance backing, not storage type availability.","Both Standard and Premium storage are widely available across Azure regions. Availability is not the primary differentiator."],"tip":"Standard = HDD-backed (lower cost, higher latency). Premium = SSD-backed (higher cost, lower latency, higher IOPS). Choose based on workload requirements: databases and transactional apps \u2192 Premium. Backups and archives \u2192 Standard."},{"id":"AZ900-E04-005","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A company signs a contract with Microsoft for Azure services\n- The contract specifies that Azure Virtual Machines in Availability Zones will have 99.99% uptime\n- During a quarter, the company experiences 1 hour of unplanned downtime\n- The total hours in the quarter are approximately 2,190\n\nQuestion:\nDid Microsoft meet the SLA, and what recourse does the company have?","choices":["Yes, the SLA was met \u2014 1 hour is acceptable","No, the SLA was breached \u2014 the company can claim service credits","No, the SLA was breached \u2014 Microsoft must refund the full subscription cost","SLAs are non-binding guidelines, so no recourse is available"],"answer":[1],"explanations":["99.99% uptime over 2,190 hours allows only about 13 minutes of downtime per quarter (0.01% \u00d7 2,190 hours \u2248 0.219 hours \u2248 13 minutes). One hour (60 minutes) significantly exceeds the allowed downtime. The SLA was NOT met.","This option is correct. The SLA was breached \u2014 1 hour of downtime far exceeds the 13-minute allowance for 99.99% uptime. When Azure fails to meet an SLA, customers can claim service credits (typically 10-100% of the monthly bill for the affected service, depending on the actual uptime percentage achieved). The company should file a support ticket to claim credits.","Microsoft does not refund the full subscription cost. SLA remedies are service credits (a percentage discount on the affected service's monthly bill), not full refunds. The credit amount depends on how far below the SLA the actual uptime was.","Azure SLAs are contractual commitments, not non-binding guidelines. They are legally enforceable, and Microsoft provides service credits when they fail to meet committed uptime percentages."],"tip":"SLA breach \u2192 service credits (not refunds). 99.99% = ~4.3 min downtime/month. 99.95% = ~21.6 min/month. 99.9% = ~43.8 min/month. The exam tests both SLA percentages and the remediation mechanism (service credits)."},{"id":"AZ900-E04-006","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company uses Azure AD (Entra ID) for identity management\n- A security audit reveals that 15 user accounts haven't been used in over 90 days\n- Some of these accounts still have privileged roles assigned\n- The security team wants to regularly review and remove unnecessary access\n\nQuestion:\nWhich Azure AD feature automates the periodic review of user access?","choices":["Azure AD Conditional Access","Azure AD Access Reviews","Azure AD Privileged Identity Management (PIM)","Azure AD Identity Protection"],"answer":[1],"explanations":["Conditional Access defines rules for HOW users access resources (require MFA, block locations). It doesn't review WHO has access or remove stale access.","This option is correct. Azure AD Access Reviews automate periodic reviews of user access to groups, applications, and roles. You configure a review schedule (e.g., quarterly), assign reviewers (managers, resource owners, or users themselves), and the system automatically sends review requests. Reviewers approve or deny continued access. Denied access is automatically revoked. This catches stale accounts and excessive privileges systematically.","PIM provides just-in-time role activation and time-bound role assignments. While PIM helps reduce standing privileged access, it doesn't perform periodic reviews of all user access \u2014 that's Access Reviews' job. However, PIM and Access Reviews work well together.","Identity Protection detects risky sign-ins and compromised accounts using machine learning. It's about real-time risk detection, not periodic access certification."],"tip":"Access Reviews = periodic certification of who has access (should this user still have this role?). PIM = time-bound privileged access (activate admin role for 4 hours). These complement each other. If 'review and remove unnecessary access periodically' \u2014 Access Reviews."},{"id":"AZ900-E04-007","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company's developers need to build, test, and deploy applications using a CI/CD pipeline\n- The pipeline must support: source control (Git), automated builds, automated testing, and deployment to Azure App Service\n- The team wants a fully integrated platform from Microsoft\n\nQuestion:\nWhich Microsoft service provides an integrated CI/CD platform?","choices":["Azure Monitor","Azure DevOps Services","Azure Automation","Azure Resource Manager"],"answer":[1],"explanations":["Azure Monitor provides monitoring, logging, and alerting for Azure resources. It doesn't provide CI/CD pipeline capabilities, source control, or automated builds/deployments.","This option is correct. Azure DevOps Services is Microsoft's integrated DevOps platform providing: Azure Repos (Git source control), Azure Pipelines (CI/CD build and release), Azure Test Plans (automated and manual testing), Azure Boards (work tracking), and Azure Artifacts (package management). It supports deployment to Azure App Service and virtually any other target. It's the all-in-one DevOps solution from Microsoft.","Azure Automation runs PowerShell/Python runbooks for IT process automation (start/stop VMs, resource cleanup). It's not a CI/CD platform for building and deploying applications.","Azure Resource Manager is the deployment and management layer for Azure resources. While ARM templates are deployed as part of CI/CD, ARM itself is not a CI/CD pipeline platform."],"tip":"Azure DevOps = full CI/CD platform (repos, pipelines, testing, boards, artifacts). GitHub Actions is another Microsoft CI/CD option. Azure Automation = IT operations automation. If the question mentions 'CI/CD', 'build pipeline', or 'source control + automated deployment' \u2014 Azure DevOps."},{"id":"AZ900-E04-008","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company wants to ensure all Azure resources follow a consistent tagging strategy\n- The strategy requires every resource to have: Department, CostCenter, and Environment tags\n- Resources missing any of these tags should be denied creation\n- Existing non-compliant resources should have tags added automatically\n\nQuestion:\nWhich combination of Azure Policy effects achieves both requirements?","choices":["Audit for both new and existing resources","Deny for new resources + Modify with remediation for existing resources","DeployIfNotExists for both new and existing resources","Append for new resources + Audit for existing resources"],"answer":[1],"explanations":["Audit only flags non-compliance \u2014 it doesn't deny creation or add tags. Both requirements need active enforcement, not just reporting.","This option is correct. Deny effect blocks the creation of new resources that are missing required tags \u2014 meeting the first requirement. Modify effect with a remediation task automatically adds the missing tags to existing non-compliant resources \u2014 meeting the second requirement. This combination provides both prevention (Deny) and remediation (Modify) in a comprehensive tagging enforcement strategy.","DeployIfNotExists deploys a RELATED resource when a condition isn't met (e.g., deploy a diagnostic extension on a VM). It's not the right effect for adding tags to the resource itself \u2014 Modify is designed for that.","Append can add fields but has limitations and is being superseded by Modify for tag management. Audit doesn't add tags automatically \u2014 it just reports non-compliance."],"tip":"Tag enforcement combo: Deny (block non-compliant new resources) + Modify (auto-fix existing resources). These two effects together provide a complete tagging governance strategy. Microsoft's recommended approach for mandatory tags."},{"id":"AZ900-E04-009","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company wants to use artificial intelligence to extract text from scanned documents (invoices, receipts, contracts)\n- The documents are uploaded as images and PDFs\n- The development team needs a pre-built service \u2014 they don't want to train custom models\n- Extracted text should be structured and searchable\n\nQuestion:\nWhich Azure AI service should you use?","choices":["Azure Machine Learning","Azure AI Document Intelligence (formerly Form Recognizer)","Azure Cognitive Search","Azure Computer Vision (OCR only)"],"answer":[1],"explanations":["Azure Machine Learning requires building and training custom models. The team explicitly wants a pre-built service without custom model training.","This option is correct. Azure AI Document Intelligence (formerly Form Recognizer) is a pre-built AI service that extracts text, key-value pairs, tables, and structured data from documents (invoices, receipts, contracts, IDs). It uses pre-built models that understand document layouts without any custom training. It goes beyond simple OCR by understanding the structure of common document types.","Azure Cognitive Search (AI Search) is a search service that indexes and makes content searchable. While it can integrate with AI enrichment, it's not the extraction service itself \u2014 it's the search layer that would sit on top of extracted data.","Azure Computer Vision provides basic OCR (optical character recognition) that extracts raw text from images. However, it doesn't understand document structure (tables, key-value pairs, field extraction). For structured document processing, Document Intelligence is more capable and appropriate."],"tip":"Document Intelligence = extract structured data from documents (invoices, receipts, forms). Computer Vision OCR = extract raw text from images. Cognitive Search = make content searchable. If the question mentions 'invoices', 'receipts', or 'structured document extraction' \u2014 Document Intelligence."},{"id":"AZ900-E04-010","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- A startup founder is evaluating cloud options\n- They ask: 'I've heard that with cloud computing, I can deploy my application and have it accessible to users worldwide within minutes. Is this true?'\n\nQuestion:\nWhich cloud benefit enables rapid global deployment of applications?","choices":["Economies of scale","Global reach and agility","Shared responsibility","Consumption-based pricing"],"answer":[1],"explanations":["Economies of scale is about cost reduction through the provider's massive purchasing power. It doesn't specifically enable rapid global deployment.","This option is correct. Azure has 60+ regions worldwide. Global reach means your application can be deployed to data centres on every continent. Agility means you can provision resources in these regions within minutes. Combined, global reach + agility enables a startup to go from 'no infrastructure' to 'live in 10 regions worldwide' in under an hour. This would take months with physical data centres.","Shared responsibility defines who manages security \u2014 the provider or the customer. It doesn't enable rapid deployment.","Consumption-based pricing means pay-for-what-you-use. While it enables cost-effective global deployment, it's not the specific benefit that describes rapid worldwide availability."],"tip":"Global reach = Azure's 60+ regions worldwide. Agility = speed of deployment. Together they enable 'deploy globally in minutes.' If the question combines worldwide availability with rapid deployment \u2014 global reach + agility."},{"id":"AZ900-E04-011","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company needs to connect 20 branch offices to Azure\n- Each branch has its own local network and internet connection\n- Employees at branches need secure access to Azure-hosted applications\n- The solution must encrypt traffic between branches and Azure\n\nQuestion:\nWhich Azure service provides encrypted connectivity from branch offices to Azure over the internet?","choices":["Azure ExpressRoute","Azure VPN Gateway (Point-to-Site VPN)","Azure VPN Gateway (Site-to-Site VPN)","Azure Private Link"],"answer":[2],"explanations":["ExpressRoute provides a private dedicated connection that bypasses the internet. It's more expensive and typically connects data centres, not 20 individual branch offices. Branches use their internet connections \u2014 ExpressRoute would require each branch to have a connectivity provider relationship.","Point-to-Site VPN connects individual client devices (laptops) to Azure \u2014 not entire branch office networks. You'd need S2S for connecting branch network infrastructure.","This option is correct. Site-to-Site VPN creates encrypted IPsec/IKE tunnels between each branch office's local network device (router/firewall) and Azure VPN Gateway. Traffic flows over each branch's existing internet connection but is encrypted end-to-end. You can connect up to 30 sites to a single VPN Gateway (Standard SKU) or more with a higher SKU. This is the standard solution for branch office connectivity to Azure.","Private Link provides private connectivity from a VNet to Azure PaaS services. It doesn't connect branch office networks to Azure \u2014 it connects Azure services to VNets."],"tip":"Site-to-Site VPN = connect entire networks (branch offices, data centres) to Azure over encrypted internet tunnels. Point-to-Site VPN = connect individual devices (remote workers). ExpressRoute = private dedicated connection (no internet). Match the connectivity type to the scenario."},{"id":"AZ900-E04-012","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- Your company stores files in Azure Blob Storage\n- The security team requires that all data at rest must be encrypted\n- They ask: 'Do we need to enable encryption on our storage accounts, or is it already encrypted?'\n\nQuestion:\nWhat is the default encryption behaviour for Azure Storage?","choices":["Encryption must be manually enabled for each storage account","All Azure Storage data is encrypted at rest by default using Microsoft-managed keys","Only Premium storage accounts are encrypted by default","Encryption is optional and costs extra"],"answer":[1],"explanations":["Azure Storage encryption at rest is NOT something you need to manually enable. It's automatic and cannot be disabled.","This option is correct. Azure Storage Service Encryption (SSE) automatically encrypts all data at rest using 256-bit AES encryption with Microsoft-managed keys. This is enabled by default for all storage accounts (Standard and Premium), cannot be disabled, and has no additional cost. If you want to use your own keys (customer-managed keys), you can configure that optionally, but the default encryption is always on.","Both Standard and Premium storage accounts are encrypted by default. There's no distinction between tiers for encryption.","Encryption is not optional and does not cost extra. It's mandatory, automatic, and included at no additional charge. This is a fundamental Azure security feature."],"tip":"Azure Storage encryption: ALWAYS on, ALWAYS free, uses AES-256. Microsoft-managed keys by default. Optional upgrade to customer-managed keys (CMK) via Key Vault. You CANNOT turn off encryption. The exam loves testing that encryption is default and mandatory."},{"id":"AZ900-E04-013","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- Your company runs VMs in Azure that require specific software configurations\n- The operations team uses Azure Automation Desired State Configuration (DSC)\n- They want to define the desired state of each VM and have Azure automatically maintain that configuration\n- If a VM drifts from the desired state (e.g., someone manually changes a setting), it should be automatically corrected\n\nQuestion:\nWhat does Desired State Configuration (DSC) ensure?","choices":["That VMs are always the cheapest possible SKU","That VM configurations match a defined desired state and drift is automatically corrected","That VMs are automatically patched with the latest OS updates","That VMs are distributed across Availability Zones"],"answer":[1],"explanations":["DSC has nothing to do with VM sizing or cost. It manages software configurations, not infrastructure sizing.","This option is correct. Desired State Configuration (DSC) is a configuration management framework. You define a configuration (desired state) \u2014 for example: IIS must be installed, specific registry keys must be set, certain services must be running. Azure Automation DSC continuously monitors the VM and if it drifts from the desired state (someone stops a service or uninstalls a feature), DSC automatically corrects it back to the defined configuration.","OS patching is handled by Azure Update Management, not DSC. DSC manages application and software configurations, not Windows/Linux updates.","VM distribution across Availability Zones is an infrastructure decision made during deployment. DSC manages what's INSIDE the VM (software configuration), not where the VM is placed."],"tip":"DSC = ensure VMs maintain a defined configuration (drift detection + auto-correction). Update Management = OS patching. Azure Policy = resource governance. If the question mentions 'maintain configuration state' or 'prevent configuration drift' \u2014 DSC."},{"id":"AZ900-E04-014","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- A healthcare company needs to deploy an application that complies with HIPAA regulations\n- They want to know if Azure meets HIPAA requirements\n- They also need Microsoft to sign a Business Associate Agreement (BAA)\n\nQuestion:\nWhich statement about Azure compliance with HIPAA is correct?","choices":["Azure is not compliant with HIPAA","Azure offers HIPAA compliance coverage and Microsoft provides a BAA as part of the Microsoft Online Services Terms","Azure is HIPAA compliant, so the customer has no additional compliance responsibilities","HIPAA compliance is only available on Azure Government"],"answer":[1],"explanations":["Azure IS compliant with HIPAA. Microsoft has undergone independent audits that verify Azure services meet HIPAA security and privacy requirements.","This option is correct. Microsoft offers HIPAA/HITECH coverage for Azure and provides a Business Associate Agreemen
