ncy.","Management groups are governance scope.","DNS is name resolution.","This option is correct. Tags support organization and cost reporting."],"tip":"Cost allocation \u2192 tags.  Exam habit: RBAC = permissions; Policy = standards; Locks = prevent delete/change; Tags = reporting."},{"id":"AZ900-E05-012","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- You manage Azure resources in **East US**\n- Multiple teams deploy resources into shared subscriptions\n\nRequirements:\n- Follow Azure best practice\n- Use the most appropriate Azure service for the requirement\n\nQuestion:\nYou are advising Sales on cloud adoption.\n\nIn general, what does a higher Azure SLA percentage indicate?","choices":["Lower cost","Faster deployment","More storage included","More guaranteed uptime"],"answer":[3],"explanations":["SLA doesn't imply lower cost.","Deployment speed isn't SLA.","Storage isn't SLA.","This option is correct. Higher SLA is higher availability commitment."],"tip":"SLA = availability commitment.  Exam habit: match the *definition* (OpEx/CapEx, elasticity, SLA) to the scenario; don\u2019t overthink."},{"id":"AZ900-E05-007","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- You manage Azure resources in **East US**\n- Multiple teams deploy resources into shared subscriptions\n\nRequirements:\n- Follow Azure best practice\n- Use the most appropriate Azure service for the requirement\n\nQuestion:\nYou are standardising configuration across departments.\n\nYou are advising Finance on cloud adoption.\n\nYou need full control of the operating system to install custom drivers.\n\nWhich cloud service model is the best fit?","choices":["IaaS","PaaS","FaaS only","SaaS"],"answer":[0],"explanations":["This option is correct. IaaS provides VM-level OS control.","PaaS typically does not allow driver installation.","Serverless does not provide OS control.","SaaS is a finished application."],"tip":"Need OS control \u2192 IaaS.  Exam habit: match the *definition* (OpEx/CapEx, elasticity, SLA) to the scenario; don\u2019t overthink."},{"id":"AZ900-E05-039","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- You manage Azure resources in **East US**\n- Multiple teams deploy resources into shared subscriptions\n\nRequirements:\n- Follow Azure best practice\n- Use the most appropriate Azure service for the requirement\n\nQuestion:\nYou are reviewing a change request.\n\nYou're standardising Azure governance for Finance-Data.\n\nYou need to allocate and report costs by department.\n\nWhat should you use?","choices":["Tags","Azure DNS","Availability Zones","Management groups"],"answer":[0],"explanations":["This option is correct. Tags support organization and cost reporting.","DNS is name resolution.","Zones are resiliency.","Management groups are governance scope."],"tip":"Cost allocation \u2192 tags.  Exam habit: RBAC = permissions; Policy = standards; Locks = prevent delete/change; Tags = reporting."},{"id":"AZ900-E05-004","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- You manage Azure resources in **North Europe**\n- Multiple teams deploy resources into shared subscriptions\n\nRequirements:\n- Follow Azure best practice\n- Use the most appropriate Azure service for the requirement\n\nQuestion:\nYou are preparing a security remediation plan.\n\nWhich statement best describes pay\u2011as\u2011you\u2011go pricing in Azure?","choices":["You pay for what you use, as you use it","You can only pay annually","You must reserve capacity for 5 years","You must buy hardware upfront"],"answer":[0],"explanations":["This option is correct. Pay-as-you-go is consumption based.","Annual payment is a billing option, not the definition.","Reservations are optional.","Hardware upfront is CapEx."],"tip":"Pay-as-you-go = consumption.  Exam habit: match the *definition* (OpEx/CapEx, elasticity, SLA) to the scenario; don\u2019t overthink."},{"id":"AZ900-E05-044","domain":"Azure Management and Governance", nk."},{"id":"AZ900-E05-034","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- You manage Azure resources in **East US**\n- Multiple teams deploy resources into shared subscriptions\n\nRequirements:\n- Follow Azure best practice\n- Use the most appropriate Azure service for the requirement\n\nQuestion:\nYou are preparing a security remediation plan.\n\nYou have multiple subscriptions and want to apply policy assignments at scale.\n\nWhat should you use?","choices":["Resource groups","Management groups","VNets","Availability Sets"],"answer":[1],"explanations":["Resource groups are within subscriptions.","This option is correct. Management groups group subscriptions for governance.","VNets are networking.","Availability Sets are VM resiliency."],"tip":"Governance across subscriptions \u2192 management groups.  Exam habit: RBAC = permissions; Policy = standards; Locks = prevent delete/change; Tags = reporting."},{"id":"AZ900-E05-008","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- You manage Azure resources in **West Europe**\n- Multiple teams deploy resources into shared subscriptions\n\nRequirements:\n- Follow Azure best practice\n- Use the most appropriate Azure service for the requirement\n\nQuestion:\nYou are standardising configuration across departments.\n\nYou are advising HR on cloud adoption.\n\nYou need to ensure data remains intact even if hardware fails.\n\nWhich term most closely matches?","choices":["Chargeback","Durability","Latency","Elasticity"],"answer":[1],"explanations":["Chargeback is cost allocation.","This option is correct. Durability refers to keeping data intact over time despite failures.","Latency is delay.","Elasticity is scaling with demand."],"tip":"Durability = data intact.  Exam habit: match the *definition* (OpEx/CapEx, elasticity, SLA) to the scenario; don\u2019t overthink."},{"id":"AZ900-E05-029","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- You manage Azure resources ultiple teams deploy resources into shared subscriptions\n\nRequirements:\n- Follow Azure best practice\n- Use the most appropriate Azure service for the requirement\n\nQuestion:\nScenario: A service owner in Legal is designing a solution.\n\nYou deploy workloads to North Europe and need to isolate from a datacenter-level outage within the same region.\n\nWhat should you use?","choices":["Tags","Management groups","Resource locks","Availability Zones"],"answer":[3],"explanations":["Tags are metadata.","Management groups are governance scope.","Locks prevent deletes/changes.","This option is correct. Zones are separate datacenters in a region."],"tip":"Within-region datacenter isolation \u2192 Availability Zones.  Exam habit: identify the layer (L4 vs L7), scope (regional vs global), and service intent (networking vs security vs identity)."},{"id":"AZ900-E05-014","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- You manage Azure resources in **West Europe**\n- Multiple teams deploy resources into shared subscriptions\n\nRequirements:\n- Follow Azure best practice\n- Use the most appropriate Azure service for the requirement\n\nQuestion:\nYou are standardising configuration across departments.\n\nYou are advising Customer Support on cloud adoption.\n\nYou are reviewing shared responsibility for Azure services.\n\nWhich responsibility typically remains with the customer?","choices":["Replacing failed disks in the datacenter","Maintaining physical security","Classifying data and defining retention requirements","Patching the hypervisor"],"answer":[2],"explanations":["Hardware replacement is provider.","Physical security is provider.","This option is correct. Data governance remains with the customer.","Hypervisor patching is provider."],"tip":"Even in SaaS, you still own data governance decisions.  Exam habit: match the *definition* (OpEx/CapEx, elasticity, SLA) to the scenario; don\u2019t overthink."},{"id":"AZ900-E05-036","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- You manage Azure resources in **North Europe**\n- Multiple teams deploy resources into shared subscriptions\n\nRequirements:\n- Follow Azure best practice\n- Use the most appropriate Azure service for the requirement\n\nQuestion:\nYou are standardising configuration across departments.\n\nYou want to ensure only approved VM sizes can be deployed.\n\nWhat should you use?","choices":["Azure Advisor","Azure RBAC","Azure Policy","Azure Monitor"],"answer":[2],"explanations":["Advisor recommends.","RBAC controls who can deploy, not which SKUs are allowed.","This option is correct. Policy can deny/audit based on SKU/size.","Monitor observes."],"tip":"Standards enforcement \u2192 Policy.  Exam habit: RBAC = permissions; Policy = standards; Locks = prevent delete/change; Tags = reporting."},{"id":"AZ900-E05-028","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- You manage Azure resources in **West Europe**\n- Multiple teams deploy resources into shared subscriptions\n\nRequirements:\n- Follow Azure best practice\n- Use the most appropriate Azure service for the requirement\n\nQuestion:\nYou are reviewing a change request.\n\nScenario: A service owner in Engineering is designing a solution.\n\nAdmins must RDP/SSH to VMs without public IP addresses.\n\nWhich service should you implement?","choices":["Traffic Manager","Azure Monitor","Azure Bastion","Azure DNS"],"answer":[2],"explanations":["Traffic Manager is DNS routing.","Monitor is telemetry.","This option is correct. Bastion provides secure portal-based RDP/SSH without public IPs.","DNS is name resolution."],"tip":"Secure admin without public IPs \u2192 Bastion.  Exam habit: identify the layer (L4 vs L7), scope (regional vs global), and service intent (networking vs security vs identity)."},{"id":"AZ900-E05-003","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- You manage Azure resources in **East US**\n- Multiple teams deploy resources into shared subscriptions\n\nRequirements:\n- Follow Azure best practice\n- Use the most appropriate Azure service for the requirement\n\nQuestion:\nYou are reviewing a change request.\n\nYou are advising Engineering on cloud adoption.\n\nYou need to ensure data remains intact even if hardware fails.\n\nWhich term most closely matches?","choices":["Chargeback","Durability","Elasticity","Latency"],"answer":[1],"explanations":["Chargeback is cost allocation.","This option is correct. Durability refers to keeping data intact over time despite failures.","Elasticity is scaling with demand.","Latency is delay."],"tip":"Durability = data intact.  Exam habit: match the *definition* (OpEx/CapEx, elasticity, SLA) to the scenario; don\u2019t overthink."},{"id":"AZ900-E05-024","domain":"Azure Architecture","type":"single","stem":"Scenario:\n- You manage Azure resources in **Central US**\n- Multiple teams deploy resources into shared subscriptions\n\nRequirements:\n- Follow Azure best practice\n- Use the most appropriate Azure service for the requirement\n\nQuestion:\nYou are the Microsoft 365 endpoint administrator.\n\nScenario: A service owner in Sales is designing a solution.\n\nYou need centralized, stateful network filtering and logging for multiple VNets.\n\nWhich service is most appropriate?","choices":["Azure Firewall","Azure Key Vault","Azure DNS","Network Security Groups (NSGs) only"],"answer":[0],"explanations":["This option is correct. Firewall provides centralized, stateful filtering and logging.","Key Vault is secrets.","DNS is name resolution.","NSGs are distributed L3/4 rules per subnet/NIC and are less centralized."],"tip":"Centralized stateful filtering \u2192 Azure Firewall.  Exam habit: identify the layer (L4 vs L7), scope (regional vs global), and service intent (networking vs security vs identity)."},{"id":"AZ900-E05-005","domain":"Cloud Concepts","type":"single","stem":"Scenario:\n- You manage Azure resources in **Central US**\n- Multiple teams deploy resources into shared subscriptions\n\nRequirements:\n- Follow Azure best practice\n- Use the most appropriate Azure service for the requirement\n\nQuestion:\nYou are reviewing a change request.\n\nYou are advising Sales on cloud adoption.\n\nYou need to run code in response to an HTTP request and pay only when it runs.\n\nWhich compute option is best?","choices":["Azure Virtual Desktop","Azure Virtual Machines","Azure Kubernetes Service (AKS)","Azure Functions"],"answer":[3],"explanations":["AVD is desktop virtualization.","VMs require OS management and bill while running.","AKS requires cluster management.","This option is correct. Functions is serverless with triggers and consumption billing."],"tip":"HTTP-triggered serverless \u2192 Functions.  Exam habit: match the *definition* (OpEx/CapEx, elasticity, SLA) to the scenario; don\u2019t overthink."},{"id":"AZ900-E05-040","domain":"Azure Management and Governance","type":"single","stem":"Scenario:\n- You manage Azure resources in **West Europe**\n- Multiple teams deploy resources into shared subscriptions\n\nRequirements:\n- Follow Azure best practice\n- Use the most appropriate Azure service for the requirement\n\nQuestion:\nYou're standardising Azure governance for Ops-Tools.\n\nYou need to allocate and report costs by department.\n\nWhat should you use?","choices":["Availability Zones","Management groups","Tags","Azure DNS"],"answer":[2],"explanations":["Zones are resiliency.","Management groups are governance scope.","This option is correct. Tags support organization and cost reporting.","DNS is name resolution."],"tip":"Cost allocation \u2192 tags.  Exam habit: RBAC = permissions; Policy = standards; Locks = prevent delete/change; Tags = reporting."}]}],"MS102":[{"set":1,"title":"Practice Exam 1","questions":[{"id":"MS102-E01-037","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou want to reduce common attack techniques by blocking risky behaviors such as Office apps creating child processes.\n\nWhat should you configure?","choices":["Managed Google Play","Retention label","Autopilot profile","Attack surface reduction (ASR) rules"],"answer":[3],"explanations":["Managed Google Play is Android apps.","Retention labels are lifecycle controls.","Autopilot provisions devices. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","This option is correct. ASR rules harden endpoints by blocking behaviors commonly used by malware."],"tip":"Behavior hardening against malware \u2192 ASR rules.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E01-036","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are the Microsoft 365 endpoint administrator.\n\nYour organisation uses Microsoft 365 Business Premium licences. Users in the Finance department handle sensitive data containing passport numbers and health identifiers. You need to prevent accidental sharing via email and Microsoft Teams messages, and you must be able to review policy violations.\n\nWhat should you create?","choices":["A data loss prevention (DLP) policy in Microsoft Purview","A sensitivity label policy in Microsoft Purview","A retention policy in Microsoft Purview","An insider risk management policy in Microsoft Purview"],"answer":[0],"explanations":["This option is correct. DLP policies detect sensitive info types across Exchange and Teams, can block/warn users, and generate alerts/reports for review\u2014exactly what\u2019s required. It maps directly to the Microsoft Purview control designed for this outcome.","Sensitivity labels classify/protect content (marking/encryption) but are not the primary control for scanning and blocking sensitive info in messages.","Retention controls how long data is kept/deleted; it doesn\u2019t prevent sharing.","Insider risk is investigative/behavioral and typically retrospective; the requirement is preventative controls in messaging."],"tip":"Prevent sharing of specific sensitive info types + review violations \u2192 DLP.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E01-049","domain":"Manage applications","type":"single","stem":"Current environment:\n- Your company has 1200 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are the Microsoft 365 endpoint administrator.\n\nYou need to control Microsoft 365 Apps updates to reduce feature change frequency while still receiving security fixes.\n\nWhich update channel is generally the best fit for controlled enterprise rollouts?","choices":["Current Channel","Updates cannot be managed for Microsoft 365 Apps","Insider Beta Channel","Monthly Enterprise Channel"],"answer":[3],"explanations":["Current Channel receives features faster and changes more frequently.","Update channels are configurable and manageable.","Insider Beta is for early testing and is higher risk.","This option is correct. Monthly Enterprise Channel provides a more predictable cadence and is commonly used in managed enterprise environments."],"tip":"Choose channel based on change tolerance and testing capacity.  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM)."},{"id":"MS102-E01-026","domain":"Implement security and compliance","type":"single","stem":"You need to secure access to SharePoint Online.\n\nRequirements:\n- Require MFA\n- Block access from devices that are not compliant in Intune\n\nWhat should you configure?","choices":["A DLP policy that blocks external sharing","An app configuration policy for Microsoft Outlook","A retention policy applied to user content","Conditional Access grant controls requiring MFA AND requiring the device to be marked as compliant"],"answer":[3],"explanations":["DLP is about data exfiltration prevention, not access grant decisions based on device state.","App config adjusts app settings; it doesn\u2019t enforce MFA or device compliance.","Retention is data lifecycle, not access control.","This option is correct. Grant controls can require both MFA and a compliant device, matching the requirements."],"tip":"Access decisions based on signals \u2192 Conditional Access. Use grant controls for must-have requirements.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E01-050","domain":"Manage applications","type":"single","stem":"Employees in Finance use personal iOS and Android devices for Microsoft 365 apps.\n\nRequirements:\n- Protect corporate data inside apps (PIN, block copy/paste to personal apps)\n- Do NOT require full device enrollment\n\nWhat should you configure?","choices":["Security baselines","App protection policies (MAM without enrollment)","Windows Autopilot deployment profile","Device configuration profiles (MDM)"],"answer":[1],"explanations":["Baselines are device management config Apple device/app management."],"tip":"Investigation + KQL queries \u2192 Advanced hunting.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E01-046","domain":"Manage applications","type":"single","stem":"Current environment:\n- Your company has 800 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are reviewing a change request.\n\nYou need to control Microsoft 365 Apps updates to reduce feature change frequency while still receiving security fixes.\n\nWhich update channel is generally the best fit for controlled enterprise rollouts?","choices":["Updates cannot be managed for Microsoft 365 Apps","Insider Beta Channel","Current Channel","Monthly Enterprise Channel"],"answer":[3],"explanations":["Update channels are configurable and manageable.","Insider Beta is for early testing and is higher risk.","Current Channel receives features faster and changes more frequently.","This option is correct. Monthly Enterprise Channel provides a more predictable cadence and is commonly used in managed enterprise environments."],"tip":"Choose channel based on change tolerance and testing capacity.  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM)."},{"id":"MS102-E01-005","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 300 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou want to identify devices with slow boot times and app performance issues and get remediation insights.\n\nWhich Intune feature should you use?","choices":["Disk Encryption policy","Enrollment Status Page","Managed Google Play","Endpoint analytics"],"answer":[3],"explanations":["Disk Encryption manages BitLocker settings.","ESP gates enrollment steps; it doesn\u2019t provide ongoing performance analytics.","Managed Google Play is for Android apps.","This option is correct. Endpoint analytics provides performance insights and recommendations (startup, app reliability, etc.). It aligns with how Microsoft expects you to implement this in Intune at scale."],"tip":"Performance insights/remediation \u2192 Endpoint analytics.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-013","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are the Microsoft 365 endpoint administrator.\n\nYou are deploying new Windows devices using Windows Autopilot. Users in Sales report that they reach the desktop before required applications and policies finish installing, leading to inconsistent builds.\n\nYou want to block user access until required setup completes.\n\nWhat should you configure?","choices":["App protection policy","Retention label policy","Device compliance policy","Enrollment Status Page (ESP)"],"answer":[3],"explanations":["APP protects data in apps; it doesn\u2019t control Autopilot setup completion.","Retention labels are for data lifecycle, not provisioning.","Compliance evaluates device posture and can be used with Conditional Access; it doesn\u2019t gate Autopilot completion.","This option is correct. ESP can block device use during enrollment until required apps/profiles finish installing, reducing 'half-configured' devices. It aligns with how Microsoft expects you to implement this in Intune at scale."],"tip":"Autopilot gating during OOBE = Enrollment Status Page.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-027","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are reviewing a change request.\n\nYou need to detect and block the sharing of passport numbers in Exchange Online email, and you want policy tips and audit reporting.\n\nWhat should you configure?","choices":["Data Loss Prevention (DLP) policy","Device configuration profile","Autopilot profile","Update ring"],"answer":[0],"explanations":["This option is correct. DLP is designed to detect sensitive info types and enforce actions (block/warn) with reporting. It maps directly to the Microsoft Purview control designed for this outcome.","Device configuration profiles configure device settings, not Exchange content scanning.","Autopilot is provisioning, not content policy. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","Update rings are for Windows updates."],"tip":"Sensitive info detection + prevention + reporting \u2192 DLP.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E01-042","domain":"Manage applications","type":"single","stem":"Current environment:\n- Your company has 300 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are deploying Android Enterprise apps with Intune.\n\nWhich integration is used to approve and distribute public Android apps?","choices":["Windows Autopilot","Apple Business Manager","Managed Google Play","Microsoft Store (new)"],"answer":[2],"explanations":["Autopilot provisions Windows devices. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","Apple Business Manager is for Apple devices and apps.","This option is correct. Managed Google Play integrates with Intune for Android Enterprise app distribution.","Microsoft Store is for Windows apps."],"tip":"Android Enterprise apps \u2192 Managed Google Play.  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM)."},{"id":"MS102-E01-044","domain":"Manage applications","type":"single","stem":"Employees in Procurement use personal iOS and Android devices for Microsoft 365 apps.\n\nRequirements:\n- Protect corporate data inside apps (PIN, block copy/paste to personal apps)\n- Do NOT require full device enrollment\n\nWhat should you configure?","choices":["App protection policies (MAM without enrollment)","Windows Autopilot deployment profile","Device configuration profiles (MDM)","Security baselines"],"answer":[0],"explanations":["This option is correct. MAM-WE protects data in managed apps without enrolling the whole device.","Autopilot is Windows provisioning. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","MDM profiles require enrollment and control device-wide settings.","Baselines are device management configurations and generally require management/enrollment."],"tip":"BYOD without enrollment \u2192 MAM without enrollment (APP).  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM)."},{"id":"MS102-E01-015","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 1200 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYour company has 1200 Windows 11 devices enrolled in Microsoft Intune. Security requires BitLocker encryption on the operating system drive. You need to enforce this requirement with the least administrative effort and ensure compliance reporting is available.\n\nWhat should you configure?","choices":["A device configuration profile using the Endpoint Protection template","A PowerShell script deployed via Intune to enable BitLocker","An endpoint security Disk Encryption policy","A Windows Autopilot deployment profile with BitLocker pre-provisioning"],"answer":[2],"explanations":["This can configure BitLocker, but it\u2019s a broader profile and not the most focused approach for encryption management and reporting.","A script can enable BitLocker, but you\u2019ll typically lose strong native policy lifecycle and reporting. It fails the 'least administrative effort' requirement. Scripts can work, but they usually weaken native reporting/managed lifecycle compared with policy-based configuration.","This option is correct. Disk Encryption policies in the Endpoint security blade are purpose-built for BitLocker and integrate cleanly with Intune reporting. Least effort + compliance visibility is what this question is testing.","Autopilot settings mainly apply at provisioning time and won\u2019t reliably remediate an already enrolled estate. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate."],"tip":"If the question is a security control + compliance visibility, Microsoft often expects Endpoint security (Disk encryption/AV/Firewall/ASR).  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-002","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 300 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are the Microsoft 365 endpoint administrator.\n\nYou need to deploy a VPN profile and certificates to devices during enrollment.\n\nWhat is the best approach?","choices":["Enable an eDiscovery hold","Deploy certificates using Intune certificate profile and then assign a VPN profile that references those certificates","Change Microsoft 365 Apps update channel","Use Managed Google Play to deploy a VPN certificate"],"answer":[1],"explanations":["Holds are for legal preservation.","This option is correct. Certificates + VPN profiles are standard Intune device configuration steps.","Update channels are unrelated to VPN connectivity.","Managed Google Play is Android app distribution, not certificate deployment."],"tip":"Device connectivity profiles often depend on certificate deployment first.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-019","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 300 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are preparing a security remediation plan.\n\nYou want to deploy a Wi-Fi profile to managed Windows devices and ensure it applies only to corporate laptops.\n\nWhat should you do?","choices":["Use a retention policy in Microsoft Purview","Create a device configuration profile and assign it to a device group containing corporate laptops","Configure a DLP policy in Exchange Online","Deploy an app protection policy"],"answer":[1],"explanations":["Retention is data lifecycle, unrelated to Wi-Fi.","This option is correct. Wi-Fi settings are delivered via configuration profiles and scoped via assignments. It aligns with how Microsoft expects you to implement this in Intune at scale.","DLP is for sensitive data, not Wi-Fi settings.","APP is mobile app data protection, not Wi-Fi provisioning."],"tip":"For device settings (Wi\u2011Fi/VPN/certificates), think configuration profiles + correct assignment scoping.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-006","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou need to ensure local administrator passwords are unique per device and can be rotated and retrieved by authorised admins.\n\nWhat should you configure in Intune/Entra?","choices":["Windows LAPS policy","App protection policy","Retention label","Managed Google Play"],"answer":[0],"explanations":["This option is correct. Windows LAPS manages local admin passwords with rotation and controlled retrieval. It aligns with how Microsoft expects you to implement this in Intune at scale.","APP is mobile app data protection, not local admin password management.","Retention labels are data lifecycle controls.","Managed Google Play is Android app distribution."],"tip":"Local admin password rotation/retrieval \u2192 Windows LAPS.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-003","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 1200 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYour company is migrating from on\u2011premises Group Policy to Intune. You have 800 Windows 10 devices that are hybrid joined. During the transition, some settings are delivered by both Group Policy and MDM.\n\nYou need Intune MDM settings to take precedence when there is a conflict for the same configuration.\n\nWhat should you configure?","choices":["Create a compliance policy that marks devices as compliant","Configure the ControlPolicyConflict policy CSP and set MDMWinsOverGP to enabled","Set the MDM enrollment URL in Group Policy to point to Intune","Convert all devices to Entra ID join immediately to eliminate Group Policy"],"answer":[1],"explanations":["Compliance evaluates device state; it doesn\u2019t resolve config conflicts between policy sources.","This is the Windows mechanism that tells the device to prefer MDM where both sources manage the same setting (when supported). It aligns with how Microsoft expects you to implement this in Intune at scale.","This enables auto-enrollment, but it does not control which policy source wins when both set the same value.","That would remove GP influence, but the question explicitly describes coexistence during migration."],"tip":"Enrollment (URLs) \u2260 conflict resolution. Conflict behavior is controlled by CSP policy (where applicable).  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E01-021","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are reviewing a change request.\n\nYou need to classify documents and apply encryption automatically based on sensitive content.\n\nWhat should you implement?","choices":["Update rings","Sensitivity labels with auto-labeling","Retention labels only","Delivery Optimization"],"answer":[1],"explanations":["Update rings manage Windows updates.","This option is correct. Sensitivity labels can apply protection and can be auto-applied based on conditions. It maps directly to the Microsoft Purview control designed for this outcome.","Retention labels handle lifecycle; they don\u2019t encrypt.","Delivery Optimization manages content distribution."],"tip":"If the question is classification + encryption/marking, it\u2019s sensitivity labels (often with auto-labeling).  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E01-034","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 1200 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are standardising configuration across departments.\n\nYou need to classify documents and apply encryption automatically based on sensitive content.\n\nWhat should you implement?","choices":["Sensitivity labels with auto-labeling","Update rings","Retention labels only","Delivery Optimization"],"answer":[0],"explanations":["This option is correct. Sensitivity labels can apply protection and can be auto-applied based on conditions. It maps directly to the Microsoft Purview control designed for this outcome.","Update rings manage Windows updates.","Retention labels handle lifecycle; they don\u2019t encrypt.","Delivery Optimization manages content distribution."],"tip":"If the question is classification + encryption/marking, it\u2019s sensitivity labels (often with auto-labeling).  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E01-030","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are standardising configuration across departments.\n\nYou want to reduce common attack techniques by blocking risky behaviors such as Office apps creating child processes.\n\nWhat should you configure?","choices":["Attack surface reduction (ASR) rules","Autopilot profile","Managed Google Play","Retention label"],"answer":[0],"explanations":["This option is correct. ASR rules harden endpoints by blocking behaviors commonly used by malware.","Autopilot provisions devices. Classic exam trap: Autopilot is provisioning-time; it ompliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are standardising configuration across departments.\n\nYou need to control Microsoft 365 Apps updates to reduce feature change frequency while still receiving security fixes.\n\nWhich update channel is generally the best fit for controlled enterprise rollouts?","choices":["Insider Beta Channel","Monthly Enterprise Channel","Updates cannot be managed for Microsoft 365 Apps","Current Channel"],"answer":[1],"explanations":["Insider Beta is for early testing and is higher risk.","This option is correct. Monthly Enterprise Channel provides a more predictable cadence and is commonly used in managed enterprise environments.","Update channels are configurable and manageable.","Current Channel receives features faster and changes more frequently."],"tip":"Choose channel based on change tolerance and testing capacity.  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM)."},{"id":"MS102-E02-048","domain":"Manage applications","type":"multi","stem":"Current environment:\n- Your company has 500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are preparing iOS/iPadOS devices for automated enrollment and app deployment using Intune.\n\nSelect THREE items that are commonly required for enterprise iOS/iPadOS management.\n\nWhat should you do first?","choices":["Managed Google Play","Apple Business Manager (ABM) / VPP","APNs certificate","Enrollment profile/token for Automated Device Enrollment (ADE)"],"answer":[1,2,3],"explanations":["Managed Google Play is for Android Enterprise, not iOS/iPadOS.","This option is correct. ABM/VPP supports automated enrollment and volume app pu  enterprise stack: APNs + ABM/VPP + ADE token/profile.  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM).","pick":3},{"id":"MS102-E03-008","domain":"Deploy and manage endpoints","type":"single","stem":"You are preparing a security remediation plan.\n\nYou manage Windows devices with Intune.\n\nRequirement:\n- Keep a pilot group pinned to **Windows 11, version 24H2**\n- Prevent devices from upgrading past that feature version until IT approves\n\nWhat should you configure?","choices":["Compliance policy requiring a minimum OS version","Update ring for Windows 10 and later only","Security baseline for Windows 10 and later","Feature updates policy for Windows 10 and later"],"answer":[3],"explanations":["Compliance evaluates and can block access, but does not manage upgrade targeting.","Update rings manage general servicing behavior/deferrals but are less direct for pinning a specific version.","Baselines configure security settings; they do not control feature version targeting.","This option is correct. Feature update policies can target and hold devices at a specific feature version. It aligns with how Microsoft expects you to implement this in Intune at scale."],"tip":"Pin a feature version \u2192 Feature updates policy. Tune update behavior \u2192 Update ring.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E03-044","domain":"Manage applications","type":"multi","stem":"Current environment:\n- Your company has 800 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are standardising configuration across departments.\n\nYou are preparing iOS/iPadOS devices for automated enrollment and app deployment using Intune.\n\nSelect THREE items that are commonly required for enterprise iOS/iPadOS management.","choices":["Managed Google Play","APNs certificate","Apple Business Manager (ABM) / VPP","Enrollment profile/token for Automated Device Enrollment (ADE)"],"answer":[1,2,3],"explanations":["Managed Google Play is for Android Enterprise, not iOS/iPadOS.","This option is correct. APNs certificate is required for MDM communication with Apple devices.","This option is correct. ABM/VPP supports automated enrollment and volume app purchasing/assignment.","This option is correct. ADE enrollment token/profile defines how devices enroll automatically."],"tip":"iOS enterprise stack: APNs + ABM/VPP + ADE token/profile.  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM).","pick":3},{"id":"MS102-E03-046","domain":"Manage applications","type":"single","stem":"You are standardising configuration across departments.\n\nEmployees in Finance use personal iOS and Android devices for Microsoft 365 apps.\n\nRequirements:\n- Protect corporate data inside apps (PIN, block copy/paste to personal apps)\n- Do NOT require full device enrollment\n\nWhat should you configure?","choices":["Windows Autopilot deployment profile","Security baselines","Device configuration profiles (MDM)","App protection policies (MAM without enrollment)"],"answer":[3],"explanations":["Autopilot is Windows provisioning. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","Baselines are device management configurations and generally require management/enrollment.","MDM profiles require enrollment and control device-wide settings.","This option is correct. MAM-WE protects data in managed apps without enrolling the whole device."],"tip":"BYOD without enrollment \u2192 MAM without enrollment (APP).  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM)."},{"id":"MS102-E03-011","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 300 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are standardising configuration across departments.\n\nWindows feature updates are saturating your WAN during business hours.\n\nYou want devices to share update content locally and reduce internet bandwidth usage.\n\nWhat should you configure?","choices":["Sensitivity labels","eDiscovery hold","Delivery Optimization settings","Microsoft Tunnel"],"answer":[2],"explanations":["Sensitivity labels protect content, not updates.","eDiscovery holds are for preservation, not bandwidth.","This option is correct. Delivery Optimization enables peer-to-peer content sharing and bandwidth controls for updates. It aligns with how Microsoft expects you to implement this in Intune at scale.","Tunnel provides secure access to on-prem resources, not update distribution optimization."],"tip":"Update bandwidth optimisation \u2192 Delivery Optimization.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E03-035","domain":"Implement security and compliance","type":"single","stem":"You are standardising configuration across departments.\n\nYou need to secure access to Power BI.\n\nRequirements:\n- Require MFA\n- Block access from devices that are not compliant in Intune\n\nWhat should you configure?","choices":["A DLP policy that blocks external sharing","A retention policy applied to user content","An app configuration policy for Microsoft Outlook","Conditional Access grant controls requiring MFA AND requi ers primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are preparing a security remediation plan.\n\nYour organisation uses Microsoft 365 E5 licences. Users in the Marketing department handle sensitive data containing national insurance numbers and credit card numbers. You need to prevent accidental sharing via email and Microsoft Teams messages, and you must be able to review policy violations.\n\nWhat should you create?","choices":["An insider risk management policy in Microsoft Purview","A retention policy in Microsoft Purview","A sensitivity label policy in Microsoft Purview","A data loss prevention (DLP) policy in Microsoft Purview"],"answer":[3],"explanations":["Insider risk is investigative/behavioral and typically retrospective; the requirement is preventative controls in messaging.","Retention controls how long data is kept/deleted; it doesn\u2019t prevent sharing.","Sensitivity labels classify/protect content (marking/encryption) but are not the primary control for scanning and blocking sensitive info in messages.","This option is correct. DLP policies detect sensitive info types across Exchange and Teams, can block/warn users, and generate alerts/reports for review\u2014exactly what\u2019s required. It maps directly to the Microsoft Purview control designed for this outcome."],"tip":"Prevent sharing of specific sensitive info types + review violations \u2192 DLP.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E04-015","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are the Microsoft 365 endpoint administrator.\n\nYour company has 500 Windows 10 devices enrolled in Microsoft Intune. Security requires BitLocker encryption on the operating system drive. You need to enforce this requirement with the least administrative effort and ensure compliance reporting is available.\n\nWhat should you configure?","choices":["A Windows Autopilot deployment profile with BitLocker pre-provisioning","An endpoint security Disk Encryption policy","A PowerShell script deployed via Intune to enable BitLocker","A device configuration profile using the Endpoint Protection template"],"answer":[1],"explanations":["Autopilot settings mainly apply at provisioning time and won\u2019t reliably remediate an already enrolled estate. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","This option is correct. Disk Encryption policies in the Endpoint security blade are purpose-built for BitLocker and integrate cleanly with Intune reporting. Least effort + compliance visibility is what this question is testing.","A script can enable BitLocker, but you\u2019ll typically lose strong native policy lifecycle and reporting. It fails the 'least administrative effort' requirement. Scripts can work, but they usually weaken native reporting/managed lifecycle compared with policy-based configuration.","This can configure BitLocker, but it\u2019s a broader profile and not the most focused approach for encryption management and reporting."],"tip":"If the question is a security control + compliance visibility, Microsoft often expects Endpoint security (Disk encryption/AV/Firewall/ASR).  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E04-045","domain":"Manage ap encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E04-005","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are the Microsoft 365 endpoint administrator.\n\nYour company is migrating from on\u2011premises Group Policy to Intune. You have 120 Windows 10 and Windows 11 devices that are hybrid joined. During the transition, some settings are delivered by both Group Policy and MDM.\n\nYou need Intune MDM settings to take precedence when there is a conflict for the same configuration.\n\nWhat should you configure?","choices":["Create a compliance policy that marks devices as compliant","Convert all devices to Entra ID join immediately to eliminate Group Policy","Configure the ControlPolicyConflict policy CSP and set MDMWinsOverGP to enabled","Set the MDM enrollment URL in Group Policy to point to Intune"],"answer":[2],"explanations":["Compliance evaluates device state; it doesn\u2019t resolve config conflicts between policy sources.","That would remove GP influence, but the question explicitly describes coexistence during migration.","This is the Windows mechanism that tells the device to prefer MDM where both sources manage the same setting (when supported). It aligns with how Microsoft expects you to implement this in Intune at scale.","This enables auto-enrollment, but it does not control which policy source wins when both set the same value."],"tip":"Enrollment (URLs) \u2260 conflict resolution. Conflict behavior is controlled by CSP policy (where applicable).  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts. nrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are preparing a security remediation plan.\n\nYou need to classify documents and apply encryption automatically based on sensitive content.\n\nWhat should you implement?","choices":["Update rings","Delivery Optimization","Retention labels only","Sensitivity labels with auto-labeling"],"answer":[3],"explanations":["Update rings manage Windows updates.","Delivery Optimization manages content distribution.","Retention labels handle lifecycle; they don\u2019t encrypt.","This option is correct. Sensitivity labels can apply protection and can be auto-applied based on conditions. It maps directly to the Microsoft Purview control designed for this outcome."],"tip":"If the question is classification + encryption/marking, it\u2019s sensitivity labels (often with auto-labeling).  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E04-025","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are preparing a security remediation plan.\n\nYou need to detect and block the sharing of bank account numbers in Exchange Online email, and you want policy tips and audit reporting.\n\nWhat should you configure?","choices":["Device configuration profile","Autopilot profile","Data Loss Prevention (DLP) policy","Update ring"],"answer":[2],"explanations":["Device configuration profiles configure device settings, not Exchange content scanning.","Autopilot is provisioning, not content policy. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","This option is correct. DLP is designed to detect sensitive info types and enforce actions (block/warn) with reporting. It maps directly to the Microsoft Purview control designed for this outcome.","Update rings are for Windows updates."],"tip":"Sensitive info detection + prevention + reporting \u2192 DLP.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E04-014","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are reviewing a change request.\n\nYour company has 2000 Windows 10 devices enrolled in Microsoft Intune. Security requires BitLocker encryption on the operating system drive. You need to enforce this requirement with the least administrative effort and ensure compliance reporting is available.\n\nWhat should you configure?","choices":["An endpoint security Disk Encryption policy","A Windows Autopilot deployment profile with BitLocker pre-provisioning","A device configuration profile using the Endpoint Protection template","A PowerShell script deployed via Intune to enable BitLocker"],"answer":[0],"explanations":["This option is correct. Disk Encryption policies in the Endpoint security blade are purpose-built for BitLocker and integrate cleanly with Intune reporting. Least effort + compliance visibility is what this question is testing.","Autopilot settings mainly apply at provisioning time and won\u2019t reliably remediate an already enrolled estate. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","This can configure BitLocker, but it\u2019s a broader profile and not the most focused approach for encryption management and reporting.","A script can enable BitLocker, but you\u2019ll typically lose strong native policy lifecycle and reporting. It fails the 'least administrative effort' requirement. Scripts can work, but they usually weaken native reporting/managed lifecycle compared with policy-based configuration."],"tip":"If the question is a security control + compliance visibility, Microsoft often expects Endpoint security (Disk encryption/AV/Firewall/ASR).  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."}]},{"set":5,"title":"Practice Exam 5","questions":[{"id":"MS102-E05-050","domain":"Manage applications","type":"single","stem":"You are preparing a security remediation plan.\n\nEmployees in Marketing use personal iOS and Android devices for Microsoft 365 apps.\n\nRequirements:\n- Protect corporate data inside apps (PIN, block copy/paste to personal apps)\n- Do NOT require full device enrollment\n\nWhat should you configure?","choices":["Device configuration profiles (MDM)","App protection policies (MAM without enrollment)","Windows Autopilot deployment profile","Security baselines"],"answer":[1],"explanations":["MDM profiles require enrollment and control device-wide settings.","This option is correct. MAM-WE protects data in managed apps without enrolling the whole device.","Autopilot is Windows provisioning. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","Baselines are device management configurations and generally require management/enrollment."],"tip":"BYOD without enrollment \u2192 MAM without enrollment (APP).  Exam habit: separate **deployment** (Intune app assignments) from **data protection** (APP/MAM) and **device management** (MDM)."},{"id":"MS102-E05-032","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows, iOS, and Android devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYour organisation uses Microsoft 365 E3 licences. Users in the HR department handle sensitive data containing health identifiers and bank account numbers. You need to prevent accidental sharing via email and Microsoft Teams messages, and you must be able to review policy violations.\n\nWhat should you create?","choices":["A retention policy in Microsoft Purview","A sensitivity label policy in Microsoft Purview","A data loss prevention (DLP) policy in Microsoft Purview","An insider risk management policy in Microsoft Purview"],"answer":[2],"explanations":["Retention controls how long data is kept/deleted; it doesn\u2019t prevent sharing.","Sensitivity labels classify/protect content (marking/encryption) but are not the primary control for scanning and blocking sensitive info in messages.","This option is correct. DLP policies detect sensitive info types across Exchange and Teams, can block/warn users, and generate alerts/reports for review\u2014exactly what\u2019s required. It maps directly to the Microsoft Purview control designed for this outcome.","Insider risk is investigative/behavioral and typically retrospective; the requirement is preventative controls in messaging."],"tip":"Prevent sharing of specific sensitive info types + review violations \u2192 DLP.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E05-030","domain":"Implement security and compliance","type":"single","stem":"Current environment:\n- Your company has 2500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are preparing a security remediation plan.\n\nYou need to detect and block the sharing of health identifiers in Exchange Online email, and you want policy tips and audit reporting.\n\nWhat should you configure?","choices":["Update ring","Autopilot profile","Data Loss Prevention (DLP) policy","Device configuration profile"],"answer":[2],"explanations":["Update rings are for Windows updates.","Autopilot is provisioning, not content policy. Classic exam trap: Autopilot is provisioning-time; it won\u2019t remediate an already-managed estate.","This option is correct. DLP is designed to detect sensitive info types and enforce actions (block/warn) with reporting. It maps directly to the Microsoft Purview control designed for this outcome.","Device configuration profiles configure device settings, not Exchange content scanning."],"tip":"Sensitive info detection + prevention + reporting \u2192 DLP.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E05-012","domain":"Deploy and manage endpoints","type":"single","stem":"You are the Microsoft 365 endpoint administrator.\n\nYou manage Windows devices with Intune.\n\nRequirement:\n- Keep a pilot group pinned to **Windows 11, version 23H2**\n- Prevent devices from upgrading past that feature version until IT approves\n\nWhat should you configure?","choices":["Compliance policy requiring a minimum OS version","Feature updates policy for Windows 10 and later","Security baseline for Windows 10 and later","Update ring for Windows 10 and later only"],"answer":[1],"explanations":["Compliance evaluates and can block access, but does not manage upgrade targeting.","This option is correct. Feature update policies can target and hold devices at a specific feature version. It aligns with how Microsoft expects you to implement this in Intune at scale.","Baselines configure security settings; they do not control feature version targeting.","Update rings manage general servicing behavior/deferrals but are less direct for pinning a specific version."],"tip":"Pin a feature version \u2192 Feature updates policy. Tune update behavior \u2192 Update ring.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E05-014","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 800 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows and iOS devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are preparing a security remediation plan.\n\nYou are deploying new Windows devices using Windows Autopilot. Users in Sales report that they reach the desktop before required applications and policies finish installing, leading to inconsistent builds.\n\nYou want to block user access until required setup completes.\n\nWhat should you configure?","choices":["Device compliance policy","Retention label policy","Enrollment Status Page (ESP)","App protection policy"],"answer":[2],"explanations":["Compliance evaluates device posture and can be used with Conditional Access; it doesn\u2019t gate Autopilot completion.","Retention labels are for data lifecycle, not provisioning.","This option is correct. ESP can block device use during enrollment until required apps/profiles finish installing, reducing 'half-configured' devices. It aligns with how Microsoft expects you to implement this in Intune at scale.","APP protects data in apps; it doesn\u2019t control Autopilot setup completion."],"tip":"Autopilot gating during OOBE = Enrollment Status Page.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E05-023","domain":"Implement security and compliance","type":"single","stem":"You are preparing a security remediation plan.\n\nYou need to secure access to Microsoft 365.\n\nRequirements:\n- Require MFA\n- Block access from devices that are not compliant in Intune\n\nWhat should you configure?","choices":["A DLP policy that blocks external sharing","An app configuration policy for Microsoft Outlook","Conditional Access grant controls requiring MFA AND requiring the device to be marked as compliant","A retention policy applied to user content"],"answer":[2],"explanations":["DLP is about data exfiltration prevention, not access grant decisions based on device state.","App config adjusts app settings; it doesn\u2019t enforce MFA or device compliance.","This option is correct. Grant controls can require both MFA and a compliant device, matching the requirements.","Retention is data lifecycle, not access control."],"tip":"Access decisions based on signals \u2192 Conditional Access. Use grant controls for must-have requirements.  Exam habit: 'prevent sharing' + specific sensitive info types \u2192 **DLP**. 'classify/protect/encrypt' \u2192 **Sensitivity labels**. 'keep/delete' \u2192 **Retention**."},{"id":"MS102-E05-006","domain":"Deploy and manage endpoints","type":"single","stem":"Current environment:\n- Your company has 500 devices enrolled in Intune.\n- Users primarily access Microsoft 365 from Windows devices.\n\nRequirements:\n- Meet the stated security/compliance requirement\n- Minimize administrative effort\n- Ensure reporting/auditing is available\n\nQuestion:\nYou are standardising configuration across departments.\n\nYour company is migrating from on\u2011premises Group Policy to Intune. You have 250 Windows 11 devices that are hybrid joined. During the transition, some settings are delivered by both Group Policy and MDM.\n\nYou need Intune MDM settings to take precedence when there is a conflict for the same configuration.\n\nWhat should you configure?","choices":["Set the MDM enrollment URL in Group Policy to point to Intune","Convert all devices to Entra ID join immediately to eliminate Group Policy","Configure the ControlPolicyConflict policy CSP and set MDMWinsOverGP to enabled","Create a compliance policy that marks devices as compliant"],"answer":[2],"explanations":["This enables auto-enrollment, but it does not control which policy source wins when both set the same value.","That would remove GP influence, but the question explicitly describes coexistence during migration.","This is the Windows mechanism that tells the device to prefer MDM where both sources manage the same setting (when supported). It aligns with how Microsoft expects you to implement this in Intune at scale.","Compliance evaluates device state; it doesn\u2019t resolve config conflicts between policy sources."],"tip":"Enrollment (URLs) \u2260 conflict resolution. Conflict behavior is controlled by CSP policy (where applicable).  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E05-048","domain":"Manage applications","type":"single","stem":"You are standardising configuration across departments.\n\nEmployees in Customer Support use personal iOS and Android devices for Microsoft 365 apps.\n\nRequirements:\n- Protect corporate data inside apps (PIN, block copy/paste to personal apps)\n- Do NOT require full device enrollment\n\nWhat should you configure?","choices":["Device configuration profiles (MDM)","Security baselines","Windows Autopilot dep .  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E05-004","domain":"Deploy and manage endpoints","type":"single","stem":"You are reviewing a change request.\n\nYou manage Windows devices with Intune.\n\nRequirement:\n- Keep a pilot group pinned to **Windows 10, version 22H2**\n- Prevent devices from upgrading past that feature version until IT approves\n\nWhat should you configure?","choices":["Feature updates policy for Windows 10 and later","Compliance policy requiring a minimum OS version","Security baseline for Windows 10 and later","Update ring for Windows 10 and later only"],"answer":[0],"explanations":["This option is correct. Feature update policies can target and hold devices at a specific feature version. It aligns with how Microsoft expects you to implement this in Intune at scale.","Compliance evaluates and can block access, but does not manage upgrade targeting.","Baselines configure security settings; they do not control feature version targeting.","Update rings manage general servicing behavior/deferrals but are less direct for pinning a specific version."],"tip":"Pin a feature version \u2192 Feature updates policy. Tune update behavior \u2192 Update ring.  Exam habit: if the requirement is *device security configuration with reporting*, look first in **Endpoint security** or **Settings catalog**, not scripts."},{"id":"MS102-E05-041","domain":"Manage applications","type":"single","stem":"Employees in Sales use personal iOS and Android devices for Microsoft 365 apps.\n\nRequirements:\n- Protect corporate data inside apps (PIN, block copy/paste to personal apps)\n- Do NOT require full device enrollment\n\nWhat should you configure?","choices":["App protection policies (MAM without enrollment)","Device configuration profiles (MDM)","Windows Autopilot deployment profile","Security baselines"],"answer":[0],"explanations":["This optio
